<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#1E8A4C;--gm:#22A05A;--gl:#E8F5EE;--gp:#F0FAF4;--gmt:#5A8A6A;--gb:#C0DECA;
  --w:#FFF;--bg:#F2F5F3;--t:#1A2A22;--tm:#3A5245;--bdr:#DDE8E2;
  --red:#E04040;--blue:#3A90C0;--purple:#9060C0;--orange:#C07030;--amber:#D89A00;
  --r:8px;--rm:12px;--rl:18px;--rxl:24px;
  --sh:0 2px 12px rgba(30,138,76,.07);--shm:0 6px 24px rgba(30,138,76,.13)
}
html,body{height:100%;overflow:hidden;font-family:'Manrope',sans-serif;background:var(--bg);color:var(--t);font-size:14px}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}

/* ═══ LOGO / TOPBAR / NAV ═══ */
.logo-cell{grid-area:logo;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:flex;align-items:center;padding:0 16px;gap:10px;text-decoration:none;box-shadow:var(--sh);transition:box-shadow .2s}
.logo-cell:hover{box-shadow:var(--shm)}
.logo-cell img{height:32px;width:auto;object-fit:contain;flex-shrink:0}
.logo-text .lt1{font-size:14px;font-weight:800;color:var(--g);letter-spacing:.03em;display:block}
.logo-text .lt2{font-size:9px;font-weight:600;color:var(--gmt);letter-spacing:.12em;text-transform:uppercase;display:block}

.topbar{background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:var(--sh)}
.search-wrap{flex:1;position:relative;display:flex;align-items:center}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;display:grid;place-items:center;pointer-events:none}
.search-icon svg{width:14px;height:14px;stroke:var(--g);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.search-wrap input{width:100%;height:36px;padding:0 14px 0 30px;border:1.5px solid var(--bdr);border-radius:99px;background:#fff;font-family:inherit;font-size:13px;color:var(--t);outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--gm)}
.search-wrap input::placeholder{color:var(--gmt)}

.topbar-profile{display:flex;align-items:center;gap:10px;padding:6px 22px 6px 12px;border-radius:var(--rm);border:1.5px solid var(--bdr);background:var(--gp);cursor:pointer;transition:all .15s;flex-shrink:0;user-select:none}
.topbar-profile:hover{border-color:var(--gb);background:var(--gl)}
.topbar-profile.open{border-color:var(--gb);background:var(--gl)}
.topbar-profile.open .tp-arrow{transform:rotate(180deg)}
.tp-av{width:30px;height:30px;border-radius:8px;background:var(--g);display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.tp-info{display:flex;flex-direction:column;line-height:1.25}
.tp-name{font-size:12px;font-weight:700;color:var(--t)}
.tp-role{font-size:10px;color:var(--gmt)}
.tp-arrow{width:14px;height:14px;stroke:var(--gmt);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;transition:transform .2s}

.profile-dd-wrap{position:relative;flex:1;display:flex;justify-content:flex-end}
.profile-dd{position:absolute;top:calc(100% + 8px);right:0;width:280px;background:var(--w);border:1px solid var(--bdr);border-radius:var(--rl);box-shadow:0 12px 36px rgba(30,138,76,.15);opacity:0;pointer-events:none;transform:translateY(-6px);transition:opacity .2s,transform .2s;z-index:200;overflow:hidden}
.profile-dd.open{opacity:1;pointer-events:all;transform:translateY(0)}
.pdd-head{padding:14px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px;background:var(--gp)}
.pdd-av{width:38px;height:38px;border-radius:9px;background:var(--g);display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0}
.pdd-info{display:flex;flex-direction:column;line-height:1.3}
.pdd-name{font-size:13px;font-weight:700;color:var(--t)}
.pdd-role{font-size:11px;color:var(--gmt)}
.pdd-view{display:block;text-align:center;padding:11px;font-size:12px;font-weight:700;color:var(--g);text-decoration:none;border-bottom:1px solid var(--bdr);transition:background .15s}
.pdd-view:hover{background:var(--gp)}
.pdd-body{padding:6px 0}
.pdd-item{display:flex;align-items:center;gap:10px;padding:9px 14px;color:var(--t);text-decoration:none;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s}
.pdd-item:hover{background:var(--gp)}
.pdd-item svg{width:15px;height:15px;stroke:var(--gmt);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.pdd-item-label{flex:1}
.pdd-div{height:1px;background:var(--bdr);margin:6px 0}
.pdd-item.logout{color:var(--red)}
.pdd-item.logout svg{stroke:var(--red)}
.pdd-item.logout:hover{background:#FFE8E8}

.nav{background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);padding:14px 10px 10px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--sh);overflow-y:auto;overflow-x:hidden;min-height:0}
.nav-group{font-size:9px;font-weight:700;color:var(--gmt);text-transform:uppercase;letter-spacing:.12em;padding:10px 12px 5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--rm);color:var(--tm);text-decoration:none;font-size:12px;font-weight:600;transition:all .15s;cursor:pointer}
.nav-item:hover{background:var(--gp);color:var(--g)}
.nav-item.active{background:var(--gl);color:var(--g);font-weight:700}
.nav-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav-bottom{margin-top:auto;padding-top:8px;border-top:1px solid var(--bdr);position:sticky;bottom:0;background:var(--w);z-index:2}

/* ═══ MAIN ═══ */
.main{grid-area:main;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0;padding-right:2px}
.main::-webkit-scrollbar{display:none}

/* Шапка раздела */
.n-head{
  background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);
  padding:18px 22px;box-shadow:var(--sh);flex-shrink:0;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap
}
.n-head-icon{
  width:46px;height:46px;border-radius:var(--rm);background:var(--gl);display:grid;place-items:center;flex-shrink:0
}
.n-head-icon svg{width:22px;height:22px;stroke:var(--g);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.n-head-titles{display:flex;flex-direction:column;line-height:1.25}
.n-head-title{font-size:20px;font-weight:900;color:var(--t);letter-spacing:-.01em}
.n-head-sub{font-size:12px;color:var(--gmt)}
.n-head-actions{margin-left:auto;display:flex;gap:8px;flex-shrink:0}
.btn-mark-all{
  padding:10px 18px;border-radius:99px;background:var(--g);border:none;
  color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
  transition:all .15s;display:inline-flex;align-items:center;gap:7px;
  box-shadow:0 2px 8px rgba(30,138,76,.22);white-space:nowrap
}
.btn-mark-all:hover{background:var(--gm);box-shadow:0 4px 12px rgba(30,138,76,.3)}
.btn-mark-all:disabled{opacity:.5;cursor:default}

/* Табы */
.n-tabs{
  background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);
  padding:10px 14px;box-shadow:var(--sh);flex-shrink:0;
  display:flex;align-items:center;gap:6px
}
.ntab{
  padding:8px 16px;border-radius:99px;background:transparent;border:1.5px solid var(--bdr);
  font-size:12px;font-weight:600;color:var(--tm);cursor:pointer;
  font-family:inherit;transition:all .15s
}
.ntab:hover{background:var(--gp);color:var(--g);border-color:var(--gb)}
.ntab.active{background:var(--g);color:#fff;border-color:var(--g)}

/* Список уведомлений */
.n-list{
  background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);
  box-shadow:var(--sh);overflow:hidden;flex-shrink:0
}
.n-item{
  display:flex;gap:12px;
  padding:14px 18px 14px 24px;
  border-bottom:1px solid var(--bdr);
  cursor:pointer;
  transition:background .12s;
  position:relative;
  text-decoration:none;color:inherit
}
.n-item:hover{background:var(--gp)}
.n-item:last-child{border-bottom:none}
.n-item.unread{background:rgba(30,138,76,.04)}
.n-item.unread::before{
  content:'';
  position:absolute;left:9px;top:50%;
  width:6px;height:6px;
  border-radius:50%;
  background:var(--g);
  transform:translateY(-50%)
}
.n-av{
  width:38px;height:38px;
  border-radius:10px;
  flex-shrink:0;
  display:grid;place-items:center;
  font-size:13px;font-weight:800;
  color:#fff
}
.n-av-system{
  background:var(--gl);
  color:var(--g);
  border:1px solid var(--gb)
}
.n-body{flex:1;min-width:0}
.n-title{
  font-size:13px;font-weight:600;
  color:var(--t);
  line-height:1.4;
  margin-bottom:3px
}
.n-preview{
  font-size:12px;
  color:var(--gmt);
  line-height:1.45;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  margin-bottom:4px
}
.n-time{
  font-size:11px;
  color:var(--gmt);
  font-weight:500
}
.n-empty{
  padding:60px 24px;
  text-align:center
}
.n-empty .nei{
  font-size:48px;
  margin-bottom:12px;
  display:block;
  opacity:.5
}
.n-empty .net{
  font-size:14px;font-weight:700;
  color:var(--t);
  margin-bottom:6px
}
.n-empty .nes{
  font-size:12px;
  color:var(--gmt);
  max-width:340px;
  margin:0 auto
}
.load-more-wrap{
  padding:14px;text-align:center;flex-shrink:0
}
.load-more{
  padding:8px 18px;border-radius:var(--rm);
  background:transparent;border:1.5px solid var(--bdr);
  color:var(--t);font-size:12px;font-weight:600;
  cursor:pointer;font-family:inherit;
  transition:all .15s
}
.load-more:hover{border-color:var(--gb);background:var(--gl);color:var(--g)}
.load-more:disabled{opacity:.5;cursor:default}

/* Toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--t);color:#fff;
  padding:10px 20px;border-radius:var(--rm);
  font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:400
}
.toast.show{opacity:1}
</style>
</head>

<script>
const API = '/api';
function tk(){ try { return localStorage.getItem('token') || ''; } catch { return ''; } }
function escHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);}
function showToast(msg){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(()=>{t.classList.remove('show')},2500);}

let currentFilter='all';
let lastLoadedID=0;
let allLoadedItems=[];
let isLoading=false;

if(!tk()){ location.href='/login.html'; }

// Profile dropdown stub
function toggleProfileDD(e){
  if(e)e.stopPropagation();
  const dd=document.getElementById('profileDD');
  const tp=document.getElementById('topbarProfile');
  if(!dd||!tp)return;
  dd.classList.toggle('open');
  tp.classList.toggle('open');
}
document.addEventListener('click',()=>{
  const dd=document.getElementById('profileDD');
  const tp=document.getElementById('topbarProfile');
  if(dd){dd.classList.remove('open');}
  if(tp){tp.classList.remove('open');}
});

function logout(){
  try{localStorage.removeItem('token');}catch{}
  location.href='/login.html';
}

// Загрузить инфу о юзере для топбара
async function loadMe(){
  try{
    const r=await fetch(API+'/me',{headers:{Authorization:'Bearer '+tk()}});
    if(!r.ok)return;
    const d=await r.json();
    if(d.user){
      const name=d.user.full_name||d.user.handle||'Юзер';
      const initial=name.charAt(0).toUpperCase();
      ['topbarAv','pddAv'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=initial;});
      const tn=document.getElementById('topbarName');if(tn)tn.textContent=name;
      const pn=document.getElementById('pddName');if(pn)pn.textContent=name;
    }
  }catch{}
}

function setFilter(filter,btn){
  if(filter===currentFilter)return;
  currentFilter=filter;
  document.querySelectorAll('.ntab').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  resetAndLoad();
}

function resetAndLoad(){
  lastLoadedID=0;
  allLoadedItems=[];
  loadFirstPage();
}

async function loadFirstPage(){
  const list=document.getElementById('nList');
  list.innerHTML='<div class="n-empty"><span class="nei">⏳</span><div class="net">Загрузка…</div></div>';
  const items=await fetchNotifications();
  allLoadedItems=items;
  renderList();
  updateHeadSub();
}

async function loadMoreNotifs(){
  if(isLoading)return;
  isLoading=true;
  const btn=document.getElementById('btnLoadMore');
  if(btn){btn.disabled=true;btn.textContent='Загрузка…';}
  const items=await fetchNotifications();
  allLoadedItems=allLoadedItems.concat(items);
  renderList();
  if(btn){btn.disabled=false;btn.textContent='Загрузить ещё';}
  isLoading=false;
}

async function fetchNotifications(){
  const params=new URLSearchParams();
  params.set('limit','20');
  if(lastLoadedID>0)params.set('before_id',lastLoadedID);
  if(currentFilter==='unread')params.set('unread','1');
  try{
    const r=await fetch(API+'/notifications?'+params.toString(),{headers:{Authorization:'Bearer '+tk()}});
    if(!r.ok)throw 0;
    const d=await r.json();
    const items=d.notifications||[];
    if(items.length)lastLoadedID=items[items.length-1].id;
    return items;
  }catch{return [];}
}

function updateHeadSub(){
  const sub=document.getElementById('nHeadSub');
  if(!sub)return;
  const total=allLoadedItems.length;
  const unread=allLoadedItems.filter(n=>!n.is_read).length;
  if(total===0){sub.textContent='Уведомлений пока нет';return;}
  sub.textContent=total+' '+pluralRu(total,['уведомление','уведомления','уведомлений'])+' · '+unread+' непрочитанных';
}

function pluralRu(n,forms){
  const mod10=n%10,mod100=n%100;
  if(mod10===1&&mod100!==11)return forms[0];
  if(mod10>=2&&mod10<=4&&(mod100<10||mod100>=20))return forms[1];
  return forms[2];
}

function renderList(){
  const list=document.getElementById('nList');
  const moreWrap=document.getElementById('loadMoreWrap');
  if(!allLoadedItems.length){
    list.innerHTML=currentFilter==='unread'
      ? '<div class="n-empty"><span class="nei">✓</span><div class="net">Все прочитано</div><div class="nes">Нет непрочитанных уведомлений.</div></div>'
      : '<div class="n-empty"><span class="nei">📭</span><div class="net">Уведомлений пока нет</div><div class="nes">Здесь будут появляться отклики, лайки, комментарии и приглашения в проекты.</div></div>';
    moreWrap.style.display='none';
    return;
  }
  list.innerHTML=allLoadedItems.map(itemHTML).join('');
  moreWrap.style.display=allLoadedItems.length>=20?'':'none';

  list.querySelectorAll('.n-item').forEach(el=>{
    el.addEventListener('click',async()=>{
      const id=el.getAttribute('data-id');
      const href=el.getAttribute('data-href');
      if(el.classList.contains('unread')&&id){
        el.classList.remove('unread');
        // Обновляем модель локально чтобы счётчик в шапке был корректен
        const item=allLoadedItems.find(n=>String(n.id)===String(id));
        if(item){item.is_read=true;updateHeadSub();}
        try{
          await fetch(API+'/notifications/'+id+'/read',{method:'POST',headers:{Authorization:'Bearer '+tk()}});
        }catch{}
      }
      if(href&&href!=='#')location.href=href;
    });
  });
}

function itemHTML(n){
  const isUnread=!n.is_read;
  const isSystem=!n.actor_name||!n.actor_public_id;
  const initial=(n.actor_name||'С').charAt(0).toUpperCase();
  const avClass=isSystem?'n-av n-av-system':'n-av';
  const avStyle=isSystem?'':'background:'+escHtml(n.actor_color||'#1E8A4C');
  const avContent=isSystem
    ? '<svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>'
    : escHtml(initial);
  const href=buildHref(n);
  const time=formatTime(n.created_at);
  return `<div class="n-item ${isUnread?'unread':''}" data-id="${escHtml(String(n.id))}" data-href="${escHtml(href)}">
    <div class="${avClass}" style="${avStyle}">${avContent}</div>
    <div class="n-body">
      <div class="n-title">${escHtml(n.title||'')}</div>
      ${n.preview?`<div class="n-preview">${escHtml(n.preview)}</div>`:''}
      <div class="n-time">${escHtml(time)}</div>
    </div>
  </div>`;
}

function buildHref(n){
  switch(n.source_type){
    case 'post':
    case 'comment':
      return n.source_public_id?'/news-detail.html?id='+encodeURIComponent(n.source_public_id):'/dashboard.html';
    case 'project':
    case 'need':
      return n.source_public_id?'/project-detail.html?id='+encodeURIComponent(n.source_public_id):'/projects.html';
    case 'forum_topic':
      return n.source_public_id?'/forum.html?topic='+encodeURIComponent(n.source_public_id):'/forum.html';
    case 'chat': return '/chat.html';
    default: return '#';
  }
}

function formatTime(iso){
  if(!iso)return '';
  try{
    const d=new Date(iso);
    const now=new Date();
    const diff=(now-d)/1000;
    if(diff<60)return 'сейчас';
    if(diff<3600)return Math.floor(diff/60)+' мин назад';
    if(diff<86400)return Math.floor(diff/3600)+' ч назад';
    if(diff<86400*7)return Math.floor(diff/86400)+' д назад';
    return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'});
  }catch{return '';}
}

async function pageMarkAll(){
  const btn=document.getElementById('btnMarkAll');
  if(!btn)return;
  btn.disabled=true;
  btn.textContent='...';
  try{
    await fetch(API+'/notifications/read_all',{method:'POST',headers:{Authorization:'Bearer '+tk()}});
    showToast('Все уведомления прочитаны');
    document.querySelectorAll('.n-item.unread').forEach(el=>el.classList.remove('unread'));
    allLoadedItems.forEach(n=>{n.is_read=true;});
    updateHeadSub();
    if(currentFilter==='unread')resetAndLoad();
  }catch{
    showToast('Ошибка');
  }finally{
    btn.disabled=false;
    btn.textContent='Прочитать всё';
  }
}

// Init
loadMe();
loadFirstPage();
</script>
