<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LASTOP GROUP — Уведомления</title>
<link rel="stylesheet" href="/assets/shell-layout.css">
<link rel="stylesheet" href="/assets/dark-theme.css">
<script src="/assets/dark-theme-init.js"></script>
<script src="/assets/global-settings.js" defer></script>
<style>
.page-head{padding:18px 22px;display:flex;align-items:center;justify-content:space-between;background:var(--w);border-radius:var(--rxl);border:1px solid var(--bdr);box-shadow:var(--sh);margin-bottom:12px}
.page-title{font-size:18px;font-weight:900;color:var(--t)}
.page-actions{display:flex;gap:8px;align-items:center}
.notif-tabs{display:flex;gap:6px;background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);box-shadow:var(--sh);padding:8px;margin-bottom:12px}
.ntab{padding:8px 16px;border-radius:99px;background:transparent;border:1.5px solid var(--bdr);font-size:12px;font-weight:600;color:var(--tm);cursor:pointer;font-family:inherit;transition:all .15s}
.ntab:hover{background:var(--gp);color:var(--g);border-color:var(--gb)}
.ntab.active{background:var(--g);color:#fff;border-color:var(--g)}
.notif-page-list{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);box-shadow:var(--sh);overflow:hidden}
.notif-page-list .notif-item{padding:14px 18px 14px 24px}
.notif-page-list .notif-item:last-child{border-bottom:none}
.btn-mark-all{padding:8px 14px;border-radius:var(--rm);background:var(--g);color:#fff;border:none;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:opacity .15s}
.btn-mark-all:hover{opacity:.88}
.btn-mark-all:disabled{opacity:.5;cursor:default}
.empty-state{padding:60px 24px;text-align:center}
.empty-state .ei{font-size:48px;display:block;margin-bottom:12px;opacity:.5}
.empty-state .et{font-size:14px;font-weight:700;color:var(--t);margin-bottom:6px}
.empty-state .es{font-size:12px;color:var(--gmt);max-width:340px;margin:0 auto}
.load-more-wrap{padding:14px;text-align:center}
.load-more{padding:8px 18px;border-radius:var(--rm);background:transparent;border:1.5px solid var(--bdr);color:var(--t);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.load-more:hover{border-color:var(--gb);background:var(--gl);color:var(--g)}
</style>
</head>
<body class="lt-shell">

<!-- shell-layout.css сам строит сетку через .lt-shell, отдельная разметка не нужна.
     Но левый nav и топбар требуют HTML из других страниц.
     Чтобы не дублировать тут шапку — на этой странице используем такую же структуру, как на других. -->

<div class="shell">
  <a class="logo-cell" href="/">
    <img src="/assets/lastop-group-logo.svg" alt="LASTOP GROUP" onerror="this.style.display='none'">
  </a>

  <header class="topbar">
    <div class="search-wrap">
      <span class="search-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></span>
      <input type="search" id="searchInput" placeholder="Поиск…" autocomplete="off">
    </div>
    <div class="profile-dd-wrap">
      <div class="topbar-profile" id="topbarProfile" onclick="toggleProfileDD(event)">
        <div class="tp-av" id="topbarAv">?</div>
        <div class="tp-info">
          <span class="tp-name" id="topbarName">Загрузка…</span>
          <span class="tp-role" id="topbarRole">Участник LASTOP</span>
        </div>
        <svg class="tp-arrow" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>
  </header>

  <nav class="nav">
    <a class="nav-item" href="/"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Главная</span></a>
    <a class="nav-item" href="/dashboard.html"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>Новости</span></a>
    <a class="nav-item" href="/projects.html"><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span>Проекты</span></a>
    <a class="nav-item" href="/events.html"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Мероприятия</span></a>
    <a class="nav-item" href="/exhibitions.html"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7"/><rect x="5" y="9" width="14" height="12" rx="1"/><path d="M9 21V13h6v8"/></svg><span>Выставки</span></a>
    <a class="nav-item" href="/jobs.html"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg><span>Резюме</span></a>
    <a class="nav-item" href="/catalog.html"><svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span>Товары и услуги</span></a>
    <div class="nav-group">Общение</div>
    <a class="nav-item" href="/forum.html"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Форум</span></a>
    <a class="nav-item" href="/companies.html"><svg viewBox="0 0 24 24"><path d="M3 21V7l9-4 9 4v14"/><line x1="3" y1="21" x2="21" y2="21"/></svg><span>Компании</span></a>
    <a class="nav-item" href="/communities.html"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg><span>Сообщества</span></a>
    <a class="nav-item" href="/chat.html"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Чат</span></a>
    <div class="nav-group">Профиль</div>
    <a class="nav-item" href="/profile.html"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Профиль</span></a>
    <a class="nav-item active" href="/notifications.html"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span>Уведомления</span></a>
    <a class="nav-item" href="/settings.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Настройки</span></a>
  </nav>

  <main class="main">
    <div class="page-head">
      <div class="page-title">Уведомления</div>
      <div class="page-actions">
        <button class="btn-mark-all" id="btnMarkAll" onclick="pageMarkAll()">Прочитать всё</button>
      </div>
    </div>

    <div class="notif-tabs">
      <button class="ntab active" data-filter="all" onclick="setFilter('all', this)">Все</button>
      <button class="ntab" data-filter="unread" onclick="setFilter('unread', this)">Непрочитанные</button>
    </div>

    <div class="notif-page-list" id="notifPageList">
      <div class="empty-state"><span class="ei">⏳</span><div class="et">Загрузка…</div></div>
    </div>

    <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
      <button class="load-more" id="btnLoadMore" onclick="loadMoreNotifs()">Загрузить ещё</button>
    </div>
  </main>

  <aside class="right">
    <!-- Реклама и др. виджеты будут инжектиться через global-settings.js -->
  </aside>
</div>

<div class="toast" id="toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--t);color:#fff;padding:10px 20px;border-radius:var(--rm);font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:400"></div>

<script>
const API = '/api';
function tk() { try { return localStorage.getItem('token') || ''; } catch { return ''; } }
function escHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);}
function showToast(msg){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.style.opacity='1';setTimeout(()=>{t.style.opacity='0'},2500);}

let currentFilter = 'all';
let lastLoadedID = 0;
let allLoadedItems = [];
let isLoading = false;

// Auth check
if (!tk()) {
  location.href = '/login.html';
}

// Topbar profile
async function loadMe() {
  try {
    const r = await fetch(API + '/me', { headers: { Authorization: 'Bearer ' + tk() } });
    if (!r.ok) return;
    const d = await r.json();
    if (d.user) {
      const name = d.user.full_name || d.user.handle || 'Юзер';
      const initial = name.charAt(0).toUpperCase();
      const els = ['topbarAv', 'pddAv'];
      els.forEach(id => { const el = document.getElementById(id); if (el) el.textContent = initial; });
      const tn = document.getElementById('topbarName'); if (tn) tn.textContent = name;
      const pn = document.getElementById('pddName'); if (pn) pn.textContent = name;
    }
  } catch {}
}

function toggleProfileDD(e) {
  // Простой stub — можно расширить, если нужно полное меню
  if (e) e.stopPropagation();
}

function setFilter(filter, btn) {
  if (filter === currentFilter) return;
  currentFilter = filter;
  document.querySelectorAll('.ntab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  resetAndLoad();
}

function resetAndLoad() {
  lastLoadedID = 0;
  allLoadedItems = [];
  loadFirstPage();
}

async function loadFirstPage() {
  const list = document.getElementById('notifPageList');
  list.innerHTML = '<div class="empty-state"><span class="ei">⏳</span><div class="et">Загрузка…</div></div>';
  const items = await fetchNotifications();
  allLoadedItems = items;
  renderList();
}

async function loadMoreNotifs() {
  if (isLoading) return;
  isLoading = true;
  const btn = document.getElementById('btnLoadMore');
  if (btn) { btn.disabled = true; btn.textContent = 'Загрузка…'; }
  const items = await fetchNotifications();
  allLoadedItems = allLoadedItems.concat(items);
  renderList();
  if (btn) { btn.disabled = false; btn.textContent = 'Загрузить ещё'; }
  isLoading = false;
}

async function fetchNotifications() {
  const params = new URLSearchParams();
  params.set('limit', '20');
  if (lastLoadedID > 0) params.set('before_id', lastLoadedID);
  if (currentFilter === 'unread') params.set('unread', '1');
  try {
    const r = await fetch(API + '/notifications?' + params.toString(), {
      headers: { Authorization: 'Bearer ' + tk() }
    });
    if (!r.ok) throw 0;
    const d = await r.json();
    const items = d.notifications || [];
    if (items.length) lastLoadedID = items[items.length - 1].id;
    return items;
  } catch {
    return [];
  }
}

function renderList() {
  const list = document.getElementById('notifPageList');
  const moreWrap = document.getElementById('loadMoreWrap');
  if (!allLoadedItems.length) {
    list.innerHTML = currentFilter === 'unread'
      ? '<div class="empty-state"><span class="ei">✓</span><div class="et">Все прочитано</div><div class="es">Нет непрочитанных уведомлений.</div></div>'
      : '<div class="empty-state"><span class="ei">📭</span><div class="et">Уведомлений пока нет</div><div class="es">Здесь будут появляться отклики, лайки, комментарии и приглашения в проекты.</div></div>';
    moreWrap.style.display = 'none';
    return;
  }
  list.innerHTML = allLoadedItems.map(itemHTML).join('');
  // Если последняя порция была >= 20, скорее всего ещё есть
  moreWrap.style.display = allLoadedItems.length >= 20 ? '' : 'none';

  list.querySelectorAll('.notif-item').forEach(el => {
    el.addEventListener('click', async () => {
      const id = el.getAttribute('data-id');
      const href = el.getAttribute('data-href');
      if (el.classList.contains('unread') && id) {
        el.classList.remove('unread');
        try {
          await fetch(API + '/notifications/' + id + '/read', {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + tk() }
          });
        } catch {}
      }
      if (href && href !== '#') location.href = href;
    });
  });
}

function itemHTML(n) {
  const isUnread = !n.is_read;
  const isSystem = !n.actor_name || !n.actor_public_id;
  const initial = (n.actor_name || 'С').charAt(0).toUpperCase();
  const avClass = isSystem ? 'notif-av notif-av-system' : 'notif-av';
  const avStyle = isSystem ? '' : 'background:' + escHtml(n.actor_color || '#1E8A4C');
  const avContent = isSystem
    ? '<svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>'
    : escHtml(initial);
  const href = buildHref(n);
  const time = formatTime(n.created_at);
  return `<div class="notif-item ${isUnread ? 'unread' : ''}" data-id="${escHtml(String(n.id))}" data-href="${escHtml(href)}">
    <div class="${avClass}" style="${avStyle}">${avContent}</div>
    <div class="notif-body">
      <div class="notif-title">${escHtml(n.title || '')}</div>
      ${n.preview ? `<div class="notif-preview">${escHtml(n.preview)}</div>` : ''}
      <div class="notif-time">${escHtml(time)}</div>
    </div>
  </div>`;
}

function buildHref(n) {
  switch (n.source_type) {
    case 'post':
    case 'comment':
      return n.source_public_id ? '/news-detail.html?id=' + encodeURIComponent(n.source_public_id) : '/dashboard.html';
    case 'project':
    case 'need':
      return n.source_public_id ? '/project-detail.html?id=' + encodeURIComponent(n.source_public_id) : '/projects.html';
    case 'forum_topic':
      return n.source_public_id ? '/forum.html?topic=' + encodeURIComponent(n.source_public_id) : '/forum.html';
    case 'chat': return '/chat.html';
    default: return '#';
  }
}

function formatTime(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) return 'сейчас';
    if (diff < 3600) return Math.floor(diff / 60) + ' мин';
    if (diff < 86400) return Math.floor(diff / 3600) + ' ч';
    if (diff < 86400 * 7) return Math.floor(diff / 86400) + ' д';
    return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
  } catch { return ''; }
}

async function pageMarkAll() {
  const btn = document.getElementById('btnMarkAll');
  if (!btn) return;
  btn.disabled = true;
  btn.textContent = '...';
  try {
    await fetch(API + '/notifications/read_all', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + tk() }
    });
    showToast('Все уведомления прочитаны');
    document.querySelectorAll('.notif-item.unread').forEach(el => el.classList.remove('unread'));
    if (currentFilter === 'unread') resetAndLoad();
  } catch {
    showToast('Ошибка');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Прочитать всё';
  }
}

// Init
loadMe();
loadFirstPage();
</script>

</body>
</html>
