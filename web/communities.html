<!DOCTYPE html>
<html lang="ru">
<head>
<script src="/assets/utils.js"></script>
<script src="/assets/dark-theme-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LASTOP GROUP — Сообщества</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/shell-layout.css">
<script>document.documentElement.classList.add('lt-shell');</script>
<link rel="stylesheet" href="/assets/hover-lift.css">
<script>document.documentElement.classList.add('hl-on');</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#1E8A4C;--gm:#22A05A;--gl:#E8F5EE;--gp:#F0FAF4;--gmt:#5A8A6A;--gb:#C0DECA;
  --w:#FFF;--bg:#F2F5F3;--t:#1A2A22;--tm:#3A5245;--bdr:#DDE8E2;
  --red:#E04040;--r:8px;--rm:12px;--rl:18px;--rxl:24px;
  --sh:0 2px 12px rgba(30,138,76,.07);--shm:0 6px 24px rgba(30,138,76,.13)
}
html,body{height:100%;overflow:hidden;font-family:'Manrope',sans-serif;background:var(--bg);color:var(--t);font-size:14px}

/* SHELL */
.shell{display:grid;grid-template-columns:240px 1fr 300px;grid-template-rows:56px 1fr;grid-template-areas:"logo topbar topbar""nav main right";height:100vh;gap:10px;padding:10px}

.logo-cell{grid-area:logo;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;padding:0 14px;text-decoration:none;box-shadow:var(--sh);transition:box-shadow .2s}
.logo-cell img{height:38px;width:auto;max-width:100%;object-fit:contain;display:block}

/* TOPBAR */
.topbar{grid-area:topbar;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:grid;grid-template-columns:1fr 300px;align-items:center;gap:10px;padding:0 16px;box-shadow:var(--sh);min-width:0}
.search-wrap{position:relative;display:flex;align-items:center;min-width:0}
.search-dot{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--g);pointer-events:none}
.search-wrap input{width:100%;height:36px;padding:0 14px 0 30px;border:1.5px solid var(--bdr);border-radius:99px;background:var(--gp);font-family:inherit;font-size:13px;color:var(--t);outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--gm)}
.search-wrap input::placeholder{color:var(--gmt)}

/* NAV */
.nav{grid-area:nav;background:var(--w);border-radius:var(--rxl);border:1px solid var(--bdr);box-shadow:var(--sh);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;padding:12px 10px 10px;gap:1px}
.nav::-webkit-scrollbar{display:none}

/* MAIN */
.main{grid-area:main;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.main::-webkit-scrollbar{width:4px}
.main::-webkit-scrollbar-thumb{background:var(--gb);border-radius:99px}

/* ── ТУЛБАР ── */
.comm-toolbar{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:12px 14px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;min-height:58px}
.comm-title{font-size:16px;font-weight:900;color:var(--t);white-space:nowrap}
.mode-switch{display:flex;background:var(--gp);border:1.5px solid var(--bdr);border-radius:99px;padding:3px;gap:2px;flex-shrink:0}
.mode-btn{padding:5px 14px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit;color:var(--gmt);background:transparent;transition:all .15s;white-space:nowrap}
.mode-btn.active{background:var(--g);color:#fff;box-shadow:0 2px 6px rgba(30,138,76,.2)}
.comm-tabs{display:flex;gap:4px;flex:1;overflow-x:auto;overflow-y:visible;scrollbar-width:none;padding:3px 0;margin:-3px 0}
.comm-tabs::-webkit-scrollbar{display:none}
.ctab{padding:6px 13px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--bdr);background:transparent;color:var(--tm);font-family:inherit;transition:all .15s;white-space:nowrap;flex-shrink:0}
.ctab:hover{background:var(--gp);color:var(--g);border-color:var(--gb);transform:translateY(-1px)}
.ctab.active{background:var(--g);color:#fff;border-color:var(--g)}
.btn-create{padding:8px 18px;border-radius:99px;background:var(--g);border:none;color:#fff;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(30,138,76,.22);white-space:nowrap;flex-shrink:0}
.btn-create:hover{background:var(--gm)}
.btn-create svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round}

/* ── ФИЛЬТРЫ ── */
/* filter row removed */

/* ── HERO-БАННЕР (featured community) ── */
.comm-hero{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);overflow:hidden;box-shadow:var(--sh);flex-shrink:0;cursor:pointer;transition:box-shadow .18s,transform .12s}
.comm-hero:hover{box-shadow:var(--shm);transform:translateY(-1px)}
.ch-cover{height:120px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:14px 18px;
  background:linear-gradient(135deg,#1E8A4C 0%,#146A38 60%,#0E5128 100%)}
.ch-cover::before{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.ch-cover::after{content:'';position:absolute;bottom:-50px;left:10%;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.05)}
.ch-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);font-size:10px;font-weight:700;color:#fff;position:relative;z-index:1}
.ch-body{padding:16px 18px}
.ch-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:10px}
.ch-av{width:52px;height:52px;border-radius:13px;display:grid;place-items:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0;border:3px solid var(--w);margin-top:-34px;position:relative;z-index:1;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.ch-info{flex:1;min-width:0;padding-top:4px}
.ch-name{font-size:17px;font-weight:900;color:var(--t);letter-spacing:-.01em;margin-bottom:3px}
.ch-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ch-meta-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--gmt)}
.ch-meta-item svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.ch-desc{font-size:12px;color:var(--tm);line-height:1.6;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.ch-tag{padding:3px 9px;border-radius:99px;background:var(--gp);border:1px solid var(--bdr);font-size:10px;font-weight:600;color:var(--gmt)}
.ch-foot{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--bdr)}
.ch-stats{display:flex;align-items:center;gap:14px}
.ch-stat{display:flex;flex-direction:column;align-items:center}
.ch-stat-n{font-size:16px;font-weight:900;color:var(--t);line-height:1}
.ch-stat-l{font-size:9px;color:var(--gmt);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}
.ch-stat-div{width:1px;height:28px;background:var(--bdr)}
.btn-join{padding:9px 20px;border-radius:var(--rm);background:var(--g);border:none;color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;box-shadow:0 2px 8px rgba(30,138,76,.22);display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.btn-join:hover{background:var(--gm)}
.btn-join.joined{background:var(--gp);color:var(--g);border:1.5px solid var(--gb);box-shadow:none}
.btn-join.joined:hover{background:var(--gl)}
.btn-join svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.btn-share{padding:9px 13px;border-radius:var(--rm);border:1.5px solid var(--bdr);background:var(--gp);color:var(--tm);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn-share:hover{border-color:var(--gb);color:var(--g);background:var(--gl)}
.btn-share svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}

/* ── КАРТОЧКА СООБЩЕСТВА (grid) ── */
.comm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.comm-section-label{font-size:12px;font-weight:800;color:var(--tm);letter-spacing:.02em;padding:4px 0;display:flex;align-items:center;gap:10px;grid-column:1/-1}
.comm-section-label::after{content:'';flex:1;height:1px;background:var(--bdr)}
.comm-card{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);overflow:hidden;box-shadow:var(--sh);cursor:pointer;transition:box-shadow .18s,transform .14s,border-color .15s;animation:fadeUp .3s ease both;display:flex;flex-direction:column}
.comm-card:hover{
  box-shadow:0 6px 20px rgba(30,138,76,.12);
  transform:translateY(-2px);
  border-color:var(--gb)
}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
/* Cover — % от ширины карточки, всегда пропорционально */
.cc-cover{position:relative;padding-top:45%;flex-shrink:0;overflow:hidden}
.cc-cover-bg{position:absolute;inset:0}
.cc-priv{position:absolute;top:6px;right:6px;padding:2px 6px;border-radius:99px;background:rgba(0,0,0,.3);font-size:9px;font-weight:700;color:#fff;display:flex;align-items:center;gap:2px}
.cc-priv svg{width:8px;height:8px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}
.cc-body{
  padding:clamp(8px,5%,14px);
  flex:1;display:flex;flex-direction:column;gap:4px;min-height:0
}
.cc-name-row{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.cc-av{
  width:clamp(28px,15%,40px);height:clamp(28px,15%,40px);
  border-radius:clamp(6px,25%,10px);display:grid;place-items:center;
  font-size:clamp(11px,3cqw,15px);
  box-shadow:0 1px 4px rgba(0,0,0,.1);
  flex-shrink:0;overflow:hidden
}
.cc-av img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.cc-name{font-size:clamp(11px,1.1vw,13px);font-weight:800;color:var(--t);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1;min-width:0}
.cc-cat{font-size:clamp(9px,0.85vw,10px);color:var(--gmt)}
.cc-desc{font-size:clamp(10px,0.9vw,11px);color:var(--gmt);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.cc-tags-row{display:flex;flex-wrap:wrap;gap:3px}
.cc-tag{padding:1px 6px;border-radius:99px;background:var(--gp);border:1px solid var(--bdr);font-size:clamp(8px,0.75vw,10px);font-weight:600;color:var(--gmt)}
.cc-foot{display:flex;align-items:center;gap:4px;padding:clamp(6px,3%,10px) clamp(8px,5%,14px);border-top:1px solid var(--bdr);flex-shrink:0}
.cc-stat{display:flex;align-items:center;gap:2px;font-size:clamp(9px,0.85vw,11px);color:var(--gmt)}
.cc-stat svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;flex-shrink:0}
.cc-join-btn{margin-left:auto;padding:4px clamp(6px,3%,12px);border-radius:var(--rm);background:var(--gl);border:1px solid var(--gb);color:var(--g);font-family:inherit;font-size:clamp(9px,0.8vw,11px);font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
.cc-join-btn:hover{background:var(--g);color:#fff}
.cc-join-btn.joined{background:var(--gp);color:var(--gmt);border-color:var(--bdr)}
/* cc-* styles defined above in comm-card section */

/* ── КАРТОЧКА (список) ── */
.comm-row{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:12px 16px;box-shadow:var(--sh);cursor:pointer;transition:box-shadow .15s,border-color .15s;display:flex;align-items:center;gap:12px;animation:fadeUp .25s ease both}
.comm-row:hover{box-shadow:var(--shm);border-color:var(--gb)}
.cr-av{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:15px;font-weight:800;color:#fff;flex-shrink:0}
.cr-body{flex:1;min-width:0}
.cr-name{font-size:13px;font-weight:800;color:var(--t);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cr-meta-item{font-size:11px;color:var(--gmt);display:flex;align-items:center;gap:3px}
.cr-meta-item svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.cr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.cr-join{padding:6px 14px;border-radius:var(--rm);background:var(--gl);border:1px solid var(--gb);color:var(--g);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.cr-join:hover{background:var(--g);color:#fff}
.cr-join.joined{background:var(--gp);color:var(--gmt);border-color:var(--bdr)}

/* ── МОДАЛКА ── */
.modal-bg{position:fixed;inset:0;background:rgba(15,25,18,.42);backdrop-filter:blur(4px);z-index:var(--z-dropdown);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{background:var(--w);border-radius:var(--rxl);border:1px solid var(--bdr);box-shadow:0 24px 60px rgba(30,138,76,.15);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;transform:translateY(14px);transition:transform .25s}
.modal-bg.open .modal{transform:translateY(0)}
.modal::-webkit-scrollbar{display:none}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--w);z-index:1}
.modal-title{font-size:15px;font-weight:800;color:var(--t)}
.modal-close{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--bdr);background:var(--gp);display:grid;place-items:center;cursor:pointer;color:var(--gmt);transition:all .15s}
.modal-close:hover{border-color:var(--gb);color:var(--g);background:var(--gl)}
.modal-close svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:12px}
.mf-label{font-size:11px;font-weight:700;color:var(--gmt);margin-bottom:5px;display:block}
.mf-input{width:100%;height:38px;padding:0 12px;border:1.5px solid var(--bdr);border-radius:var(--rm);background:var(--gp);font-family:inherit;font-size:13px;color:var(--t);outline:none;transition:border-color .2s}
.mf-input:focus{border-color:var(--gm);background:var(--w)}
.mf-input::placeholder{color:var(--gmt)}
.mf-textarea{width:100%;padding:10px 12px;border:1.5px solid var(--bdr);border-radius:var(--rm);background:var(--gp);font-family:inherit;font-size:13px;color:var(--t);outline:none;resize:none;line-height:1.55;transition:border-color .2s}
.mf-textarea:focus{border-color:var(--gm);background:var(--w)}
.mf-textarea::placeholder{color:var(--gmt)}
.mf-select{width:100%;height:38px;padding:0 12px;border:1.5px solid var(--bdr);border-radius:var(--rm);background:var(--gp);font-family:inherit;font-size:13px;color:var(--tm);outline:none;cursor:pointer}
.mf-select:focus{border-color:var(--gm)}
.mf-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Выбор приватности */
.priv-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.priv-card{padding:12px 10px;border-radius:var(--rm);border:1.5px solid var(--bdr);background:var(--gp);cursor:pointer;text-align:center;transition:all .15s}
.priv-card:hover{border-color:var(--gb)}
.priv-card.sel{border-color:var(--g);background:var(--gl)}
.priv-card svg{width:20px;height:20px;stroke:var(--gmt);fill:none;stroke-width:1.6;stroke-linecap:round;margin:0 auto 6px;display:block}
.priv-card.sel svg{stroke:var(--g)}
.priv-card-t{font-size:12px;font-weight:700;color:var(--tm)}
.priv-card.sel .priv-card-t{color:var(--g)}
.priv-card-s{font-size:10px;color:var(--gmt);margin-top:2px}
/* Выбор цвета */
.color-pick{display:flex;flex-wrap:wrap;gap:8px}
.color-dot{width:28px;height:28px;border-radius:8px;cursor:pointer;border:2.5px solid transparent;transition:all .15s}
.color-dot:hover,.color-dot.sel{border-color:var(--t);transform:scale(1.1)}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bdr);display:flex;justify-content:flex-end;gap:8px}
.btn-cancel{padding:9px 18px;border-radius:var(--rm);border:1.5px solid var(--bdr);background:var(--gp);color:var(--tm);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-cancel:hover{border-color:var(--gb);color:var(--g);background:var(--gl)}
.btn-submit{padding:9px 22px;border-radius:var(--rm);border:none;background:var(--g);color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s;box-shadow:0 2px 8px rgba(30,138,76,.22)}
.btn-submit:hover{background:var(--gm)}

/* RIGHT */
.right{grid-area:right;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.right::-webkit-scrollbar{display:none}
.card{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:14px;box-shadow:var(--sh);transition:box-shadow .2s ease,transform .2s ease}
.card:hover{box-shadow:var(--shm);transform:translateY(-3px)}
.block-title{font-size:10px;font-weight:700;color:var(--gmt);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.stat-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bdr)}
.stat-row:last-child{border-bottom:none;padding-bottom:0}
.stat-lbl{font-size:12px;color:var(--gmt);display:flex;align-items:center;gap:6px}
.stat-lbl svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.stat-val{font-size:13px;font-weight:800;color:var(--t)}
/* Мои сообщества */
.my-comm{display:flex;align-items:center;gap:9px;padding:7px 6px;border-radius:var(--rm);cursor:pointer;transition:background .12s}
.my-comm:hover{background:var(--gp)}
.mc-av{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.mc-name{font-size:12px;font-weight:700;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.mc-cnt{font-size:10px;color:var(--gmt);flex-shrink:0}
/* Рекомендации */
.rec-comm{display:flex;align-items:center;gap:9px;padding:7px 6px;border-radius:var(--rm);cursor:pointer;transition:background .12s}
.rec-comm:hover{background:var(--gp)}
.rc-av{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0}
.rc-body{flex:1;min-width:0}
.rc-name{font-size:12px;font-weight:700;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-meta{font-size:10px;color:var(--gmt);margin-top:1px}
.rc-btn{padding:4px 10px;border-radius:var(--rm);background:var(--gl);border:1px solid var(--gb);color:var(--g);font-family:inherit;font-size:10px;font-weight:700;cursor:pointer;transition:all .15s;flex-shrink:0}
.rc-btn:hover{background:var(--g);color:#fff}
/* Популярные теги */
.tag-cloud{display:flex;flex-wrap:wrap;gap:5px}
.tag-chip{padding:4px 10px;border-radius:99px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--bdr);background:var(--gp);color:var(--tm);transition:all .15s}
.tag-chip:hover{border-color:var(--gb);color:var(--g);background:var(--gl)}
.tag-chip.active{background:var(--g);color:#fff;border-color:var(--g)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#1A2A22;color:#fff;padding:10px 18px;border-radius:var(--rm);font-size:13px;font-weight:600;z-index:var(--z-panel);opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--g)}

@media(max-width:1200px){.shell{grid-template-columns:220px 1fr 260px}.comm-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1000px){.shell{grid-template-columns:220px 1fr;grid-template-areas:"logo topbar""nav main"}.right{display:none}.comm-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:740px){.shell{grid-template-columns:52px 1fr}.nav-item span,.nav-group{display:none}.nav-item{justify-content:center;padding:10px}.comm-grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1921px) and (min-height:1081px){
  html,body{font-size:15px}
  .shell{grid-template-columns:280px 1fr 360px !important;gap:12px;padding:12px}
  .topbar{grid-template-columns:1fr 360px !important}
  .nav{padding:14px 12px 12px}
}

/* Unified hover effect for all card-like classes */
[class*="card"]{transition:box-shadow .2s ease,transform .2s ease}
[class*="card"]:hover{box-shadow:var(--shm);transform:translateY(-3px)}
</style>
<link rel="stylesheet" href="/assets/dark-theme.css">
</head>
<body>
<div class="shell">

<!-- LOGO -->
<a class="logo-cell" href="/"><img src="/assets/lastop-group-logo.svg" alt="" onerror="this.style.display='none'"></a>

<!-- TOPBAR -->
<header class="topbar"></header>

<!-- NAV -->
<nav class="nav"></nav>

<!-- MAIN -->
<div class="main">

  <!-- Тулбар -->
  <div class="comm-toolbar">
    <span class="comm-title">Сообщества</span>
    <div class="mode-switch">
      <button type="button" class="mode-btn active" id="modeAll" onclick="setMode('all',this)">Все</button>
      <button type="button" class="mode-btn" id="modeMy" onclick="setMode('my',this)">Мои</button>
    </div>
    <div class="mode-switch">
      <button type="button" class="mode-btn active" id="modeUser" onclick="setType('user',this)">Пользовательские</button>
      <button type="button" class="mode-btn" id="modeCorp" onclick="setType('corp',this)">Корпоративные</button>
    </div>
    <div class="comm-tabs" id="commTabs">
      <button type="button" class="ctab active" onclick="setTab('',this)">Все</button>
      <button type="button" class="ctab" id="myRegionBtn" onclick="filterMyRegion(this)">Мой регион</button>
      <button type="button" class="ctab" onclick="setTab('Логистика',this)">Логистика</button>
      <button type="button" class="ctab" onclick="setTab('ВЭД',this)">ВЭД</button>
      <button type="button" class="ctab" onclick="setTab('IT',this)">IT</button>
      <button type="button" class="ctab" onclick="setTab('Регионы',this)">Региональные</button>
      <button type="button" class="ctab" onclick="setTab('Карьера',this)">Карьера</button>
    </div>
    <div style="display:flex;gap:6px;flex-shrink:0">
      <button type="button" class="btn-create" onclick="openModal()">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Создать сообщество
      </button>
    </div>
  </div>

  <!-- Лента -->
  <div id="commFeed"></div>

</div><!-- /main -->

<!-- RIGHT -->
<aside class="right">

  <!-- Статистика -->
  <div class="card">
    <div class="block-title">Статистика</div>
    <div class="stat-row"><span class="stat-lbl"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Всего сообществ</span><span class="stat-val" id="statTotal">0</span></div>
    <div class="stat-row"><span class="stat-lbl"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Открытых</span><span class="stat-val" style="color:var(--g)" id="statOpen">0</span></div>
    <div class="stat-row"><span class="stat-lbl"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Закрытых</span><span class="stat-val" id="statClosed">0</span></div>
    <div class="stat-row"><span class="stat-lbl"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Я в сообществах</span><span class="stat-val" id="statMy">0</span></div>
  </div>

  <!-- Мои сообщества -->
  <div class="card">
    <div class="block-title">Мои сообщества</div>
    <div id="myCommunities"></div>
    <div style="padding:8px 6px 0;text-align:center">
      <button type="button" onclick="setMode('my',document.getElementById('modeMy'))" style="font-size:11px;font-weight:700;color:var(--g);background:none;border:none;cursor:pointer;font-family:inherit">Все мои сообщества →</button>
    </div>
  </div>

  <!-- Рекомендации -->
  <div class="card">
    <div class="block-title">Рекомендуем вам</div>
    <div id="recommendedCommunities"></div>
  </div>


</aside>

<!-- МОДАЛКА СОЗДАНИЯ -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title">Создать сообщество</span>
      <button type="button" class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div><label class="mf-label">Название сообщества *</label><input class="mf-input" id="mName" placeholder="Например: Логисты Екатеринбурга"></div>
      <div><label class="mf-label">Описание</label><textarea class="mf-textarea" id="mDesc" style="height:80px" placeholder="Расскажите о чём ваше сообщество и кому оно будет полезно…"></textarea></div>
      <div class="mf-row2">
        <div><label class="mf-label">Категория</label>
          <select class="mf-select" id="mCat">
            <option value="">Выбрать…</option>
            <option>Логистика</option><option>ВЭД</option><option>IT</option>
            <option>Регионы</option><option>Карьера</option><option>Другое</option>
          </select>
        </div>
        <div><label class="mf-label">Регион / город</label><input class="mf-input" id="mRegion" placeholder="Москва"></div>
      </div>
      <div><label class="mf-label">Теги через запятую</label><input class="mf-input" id="mTags" placeholder="логистика, снг, маршруты…"></div>
      <div><label class="mf-label">Цвет сообщества</label>
        <div class="color-pick" id="colorPick">
          <div class="color-dot sel" style="background:#1E8A4C" onclick="selectColor('#1E8A4C',this)"></div>
          <div class="color-dot" style="background:#185FA5" onclick="selectColor('#185FA5',this)"></div>
          <div class="color-dot" style="background:#6040A0" onclick="selectColor('#6040A0',this)"></div>
          <div class="color-dot" style="background:#B45309" onclick="selectColor('#B45309',this)"></div>
          <div class="color-dot" style="background:#B05090" onclick="selectColor('#B05090',this)"></div>
          <div class="color-dot" style="background:#208090" onclick="selectColor('#208090',this)"></div>
          <div class="color-dot" style="background:#633806" onclick="selectColor('#633806',this)"></div>
          <div class="color-dot" style="background:#3B6D11" onclick="selectColor('#3B6D11',this)"></div>
          <input type="color" id="mColor" value="#1E8A4C" style="width:28px;height:28px;border:none;border-radius:8px;cursor:pointer;padding:0" title="Свой цвет">
        </div>
      </div>
      <div><label class="mf-label">Приватность</label>
        <div class="priv-pick">
          <div class="priv-card sel" id="pcOpen" onclick="selectPriv('open',this)">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <div class="priv-card-t">Открытое</div>
            <div class="priv-card-s">Вступить может любой</div>
          </div>
          <div class="priv-card" id="pcClosed" onclick="selectPriv('closed',this)">
            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <div class="priv-card-t">Закрытое</div>
            <div class="priv-card-s">Только по заявке</div>
          </div>
        </div>
      </div>
      <div><label class="mf-label">Сайт сообщества (опционально)</label><input class="mf-input" id="mWebsite" placeholder="https://…"></div>
      <div class="mf-row2">
        <div><label class="mf-label">Email сообщества</label><input class="mf-input" id="mEmail" placeholder="team@example.com"></div>
        <div><label class="mf-label">Телефон</label><input class="mf-input" id="mPhone" placeholder="+7 ..."></div>
      </div>
      <div>
        <label class="mf-label">Аватар сообщества (опционально)</label>
        <div id="mAvatarPreview" style="display:none;position:relative;margin-bottom:8px;width:80px;height:80px;border-radius:14px;overflow:hidden;border:1px solid var(--bdr)">
          <img id="mAvatarImg" alt="" style="width:100%;height:100%;object-fit:cover;display:block">
          <button type="button" onclick="removeCommunityAvatar()" title="Удалить" style="position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);border:none;color:#fff;display:grid;place-items:center;cursor:pointer">
            <svg viewBox="0 0 24 24" style="width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
          <div id="mAvatarUploading" style="display:none;position:absolute;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700">Загрузка…</div>
        </div>
        <button type="button" class="btn-cancel" onclick="document.getElementById('mAvatarInput').click()" style="display:inline-flex;align-items:center;gap:6px">
          <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Загрузить аватарку
        </button>
        <input type="file" id="mAvatarInput" accept="image/*" style="display:none" onchange="onCommunityAvatarSelected(event)">
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn-cancel" onclick="closeModal()">Отмена</button>
      <button type="button" class="btn-submit" onclick="submitCommunity()">Создать сообщество</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="joinReqBg" onclick="if(event.target===this)closeJoinRequestModal()">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title">Заявка на вступление</span>
      <button type="button" class="modal-close" onclick="closeJoinRequestModal()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div><label class="mf-label">Сообщение (опционально)</label><textarea class="mf-textarea" id="joinReqMsg" style="height:100px" placeholder="Коротко расскажите зачем хотите вступить"></textarea></div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn-cancel" onclick="closeJoinRequestModal()">Отмена</button>
      <button type="button" class="btn-submit" onclick="submitJoinRequest()">Отправить</button>
    </div>
  </div>
</div>

</div><!-- /shell -->
<div class="toast" id="toast"></div>

<script>
const API='/api', tk=()=>localStorage.getItem('token');
function isUnauthorizedResponse(r){return r&&r.status===401}
function forceRelogin(message){
  if(message)toast(message);
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  setTimeout(()=>{location.href='/login.html'},400);
}
const esc = window.lastopEsc;
function ltr(s){const p=String(s||'').trim().split(/\s+/).filter(Boolean);if(!p.length)return '?';if(p.length>=2)return (p[0][0]+p[1][0]).toUpperCase();return p[0][0].toUpperCase();}
function avc(s){const C=['#5AB080','#3A90C0','#9060C0','#C07030','#1A8A6A','#B05090','#208090','#3B6D11'];return C[(s||'').charCodeAt(0)%C.length]||C[0]}
function num(n){return n>=1000?(n/1000).toFixed(1).replace(/\.0$/,'')+'к':String(n||0)}
function membersLabel(n,{compact=false}={}){
  const count=Math.max(0,Number(n)||0);
  const formatted=compact?num(count):count.toLocaleString('ru-RU');
  const mod100=count%100;
  const mod10=count%10;
  let noun='участников';
  if(mod100<11||mod100>14){
    if(mod10===1)noun='участник';
    else if(mod10>=2&&mod10<=4)noun='участника';
  }
  return `${formatted} ${noun}`;
}
function ago(ts){if(!ts)return'';const m=Math.max(1,Math.floor((Date.now()-new Date(ts))/60000));if(m<60)return m+' мин назад';if(m<1440)return Math.floor(m/60)+' ч назад';if(m<10080)return Math.floor(m/1440)+' д назад';return new Date(ts).toLocaleDateString('ru-RU',{day:'2-digit',month:'short'})}
function toast(msg,ok){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(ok?' ok':'');setTimeout(()=>t.classList.remove('show'),2400)}

/* DROPDOWN */
function toggleDD(e){e.stopPropagation();document.getElementById('topbarProfile').classList.toggle('open');document.getElementById('profileDD').classList.toggle('open')}
document.addEventListener('click',e=>{const d=document.getElementById('profileDD'),b=document.getElementById('topbarProfile');if(d&&!d.contains(e.target)&&!b.contains(e.target)){d.classList.remove('open');b.classList.remove('open')}})
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.getElementById('profileDD').classList.remove('open');document.getElementById('topbarProfile').classList.remove('open')}})
function logout(){localStorage.removeItem('token');localStorage.removeItem('user');location.href='/home-guest.html'}

/* ── ДАННЫЕ ── */
const GRADIENTS=['linear-gradient(135deg,#1E8A4C,#22A05A)','linear-gradient(135deg,#185FA5,#3A90C0)','linear-gradient(135deg,#6040A0,#9060C0)','linear-gradient(135deg,#B45309,#C07030)','linear-gradient(135deg,#B05090,#9060C0)','linear-gradient(135deg,#208090,#3A90C0)','linear-gradient(135deg,#633806,#C07030)','linear-gradient(135deg,#3B6D11,#5AB080)'];

const COMMUNITIES=[];
const joinedSet=new Set();
let currentMode = (new URLSearchParams(location.search).get('filter') === 'my') ? 'my' : 'all';
let currentTab='';
let currentType='all'; /* second toggle: all | user | corp */
let currentView='grid';
let activeTag='';
let selectedPriv='open';
let selectedColor='#1E8A4C';
let isCreatingCommunity=false;
let myRegion='';
let joinReqCommunityID=0;

/* ── РЕНДЕР КАРТОЧКИ (grid) ── */
function renderCard(c,i){
  const isJoined=joinedSet.has(c.id);
  const joinText=isJoined?'Участник':(c.privacy==='closed'?'Подать заявку':'Вступить');
  const roleBadge=c.myRole?`<span class="cc-tag">${c.myRole==='owner'?'👑 Владелец':c.myRole==='admin'?'⭐ Админ':c.myRole==='moderator'?'🛡 Модератор':'Участник'}</span>`:'';
  const gi=c.id%GRADIENTS.length;
  return`<div class="comm-card" style="animation-delay:${i*.05}s" onclick="openCommunity(COMMUNITIES.find(x=>x.id===${c.id}))">
    <div class="cc-cover">
      <div class="cc-cover-bg" style="${(c.cover_url&&(c.cover_url.startsWith('http://')||c.cover_url.startsWith('https://')||c.cover_url.startsWith('/uploads/')))?`background:url('${esc(c.cover_url)}') center/cover no-repeat`:`background:${GRADIENTS[gi]}`}"></div>
      ${c.privacy==='closed'?`<div class="cc-priv"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Закрытое</div>`:''}
    </div>
    <div class="cc-body">
      <div class="cc-name-row">
        <div class="cc-av" style="background:${c.color}">${avHTML(c)}</div>
        <div class="cc-name">${esc(c.name)}</div>
      </div>
      <div class="cc-cat">${esc(c.cat)}</div>
      <div class="cc-desc">${esc(c.desc)}</div>
      <div class="cc-tags-row">${roleBadge}${c.tags.slice(0,2).map(t=>`<span class="cc-tag">${esc(t)}</span>`).join('')}</div>
    </div>
    <div class="cc-foot">
      <span class="cc-stat"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>${membersLabel(c.members)}</span>
      <button type="button" class="cc-join-btn${isJoined?' joined':''}" onclick="event.stopPropagation();joinCommunity(${c.id})" id="cjb-${c.id}">${joinText}</button>
    </div>
  </div>`;
}

/* ── РЕНДЕР СТРОКИ (list) ── */
function renderRow(c,i){
  const isJoined=joinedSet.has(c.id);
  const joinText=isJoined?'Участник':(c.privacy==='closed'?'Подать заявку':'Вступить');
  return`<div class="comm-row" style="animation-delay:${i*.04}s" onclick="openCommunity(COMMUNITIES.find(x=>x.id===${c.id}))">
    <div class="cr-av" style="background:${c.color}">${avHTML(c)}</div>
    <div class="cr-body">
      <div class="cr-name">${esc(c.name)}</div>
      <div class="cr-meta">
        <span class="cr-meta-item"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>${num(c.members)} участников</span>
        <span class="cr-meta-item"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>${c.posts} постов</span>
        <span class="cr-meta-item">${c.cat}</span>
        ${c.privacy==='closed'?'<span class="cr-meta-item">🔒 Закрытое</span>':''}
      </div>
    </div>
    <div class="cr-right">
      <button type="button" class="cr-join${isJoined?' joined':''}" onclick="event.stopPropagation();joinCommunity(${c.id})" id="crb-${c.id}">${joinText}</button>
    </div>
  </div>`;
}

function renderFeed(items){
  const feed=document.getElementById('commFeed');
  if(!items.length){
    feed.innerHTML='<div style="background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:40px;text-align:center;box-shadow:var(--sh)"><div style="font-size:14px;font-weight:700;color:var(--t);margin-bottom:6px">Сообщества не найдены</div><div style="font-size:12px;color:var(--gmt)">Попробуйте другой фильтр или <button type="button" onclick="openModal()" style="color:var(--g);font-weight:700;background:none;border:none;cursor:pointer;font-size:12px;font-family:inherit">создайте своё</button></div></div>';
    return;
  }
  let html='<div class="comm-grid">';
  if(currentType==='all'){
    const user=items.filter(c=>!c.corporate);
    const corp=items.filter(c=>c.corporate);
    if(user.length){
      html+=`<div class="comm-section-label">👥 Пользовательские <span style="font-size:11px;font-weight:600;color:var(--gmt)">${user.length}</span></div>`;
      html+=user.map((c,i)=>renderCard(c,i)).join('');
    }
    if(corp.length){
      html+=`<div class="comm-section-label" style="margin-top:4px">🏢 Корпоративные <span style="font-size:11px;font-weight:600;color:var(--gmt)">${corp.length}</span></div>`;
      html+=corp.map((c,i)=>renderCard(c,i)).join('');
    }
  } else {
    html+=items.map((c,i)=>renderCard(c,i)).join('');
  }
  html+='</div>';
  feed.innerHTML=html;
}

/* ── ФИЛЬТРЫ ── */
function applyFilters(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  let items=[...COMMUNITIES];
  if(currentMode==='my') items=items.filter(c=>joinedSet.has(c.id));
  if(currentType==='user') items=items.filter(c=>!c.corporate);
  else if(currentType==='corp') items=items.filter(c=>c.corporate);
  if(currentTab) items=items.filter(c=>c.cat===currentTab);
  if(activeTag) items=items.filter(c=>c.tags.some(t=>t.toLowerCase().includes(activeTag)));
  if(q) items=items.filter(c=>c.name.toLowerCase().includes(q)||c.desc.toLowerCase().includes(q)||c.tags.some(t=>t.toLowerCase().includes(q)));
  items.sort((a,b)=>b.members-a.members);
  renderFeed(items);
}


function applyInitialMode(){
  if (currentMode === 'my'){
    var myBtn = document.getElementById('modeMy');
    var allBtn = document.getElementById('modeAll');
    if (myBtn && allBtn){
      allBtn.classList.remove('active');
      myBtn.classList.add('active');
    }
  }
}

function setMode(mode,btn){
  currentMode=mode;
  document.querySelectorAll('#modeAll,#modeMy').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function setType(type,btn){
  currentType=type;
  document.querySelectorAll('#modeUser,#modeCorp').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}
function setTab(tab,btn){
  currentTab=tab;
  document.querySelectorAll('.ctab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}
function filterByTag(chip,tag){
  if(activeTag===tag){activeTag='';chip.classList.remove('active')}
  else{activeTag=tag;document.querySelectorAll('.tag-chip').forEach(c=>c.classList.remove('active'));chip.classList.add('active')}
  applyFilters();
}

/* ── ВСТУПЛЕНИЕ ── */
function updateJoinButtons(id){
  const isJoined=joinedSet.has(id);
  const c=COMMUNITIES.find(x=>x.id===id);
  const joinText=isJoined?'Участник':((c&&c.privacy==='closed')?'Подать заявку':'Вступить');
  document.querySelectorAll(`[id="cjb-${id}"],[id="crb-${id}"]`).forEach(b=>{
    b.classList.toggle('joined',isJoined);
    b.textContent=joinText;
  });
}
function joinCommunity(id){
  const c=COMMUNITIES.find(x=>x.id===id);
  if(!c)return Promise.resolve();
  if(joinedSet.has(id))return Promise.resolve();
  if(c.privacy==='closed'){
    joinReqCommunityID=id;
    document.getElementById('joinReqMsg').value='';
    document.getElementById('joinReqBg').classList.add('open');
    return Promise.resolve();
  }
  return (async()=>{
    try{
      const r=await fetch(API+'/communities/'+id+'/join',{method:'POST',headers:{Authorization:'Bearer '+tk()}});
      if(isUnauthorizedResponse(r)){
        forceRelogin('Сессия истекла. Войдите снова');
        return;
      }
      if(!r.ok){
        let msg='Не удалось вступить в сообщество';
        try{const data=await r.json();if(data?.error)msg=data.error}catch{}
        toast(msg);
        return;
      }
      joinedSet.add(id);
      const community=COMMUNITIES.find(c=>c.id===id);
      if(community){
        community.isMy=true;
        community.members=(Number(community.members)||0)+1;
        syncCommunityStateCache(community);
      }
      updateJoinButtons(id);
      syncSidebar();
      applyFilters();
      toast('Вы вступили в сообщество ✓',true);
    }catch{
      toast('Не удалось вступить в сообщество. Проверьте подключение к серверу.');
    }
  })();
}

function toggleHeroJoin(){
  const btn=document.getElementById('heroJoin');
  const featured=COMMUNITIES[0];
  if(!featured)return;
  joinCommunity(featured.id).then(()=>{
    if(joinedSet.has(featured.id)){
      btn.textContent='Участник';
      btn.classList.add('joined');
    }
  });
}
function joinRec(id){
  joinCommunity(id);
}
function openCommunity(c){if(!c)return;location.href='/community-detail.html?id='+encodeURIComponent(c.id)}

/* ── МОДАЛКА СОЗДАНИЯ ── */
function openModal(){document.getElementById('modalBg').classList.add('open')}
function closeModal(){document.getElementById('modalBg').classList.remove('open');removeCommunityAvatar();}
function closeJoinRequestModal(){document.getElementById('joinReqBg').classList.remove('open')}
function selectPriv(type,card){
  selectedPriv=type;
  document.querySelectorAll('.priv-card').forEach(c=>c.classList.remove('sel'));
  card.classList.add('sel');
}
function selectColor(color,dot){
  selectedColor=color;
  document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('sel'));
  dot.classList.add('sel');
  document.getElementById('mColor').value=color;
}
function readCachedCommunityState(id){
  if(!id)return null;
  try{
    const raw=sessionStorage.getItem('lastop_community_cache_'+String(id));
    if(!raw)return null;
    const cached=JSON.parse(raw);
    if(Number(cached?.id)!==Number(id))return null;
    return cached;
  }catch{
    return null;
  }
}
function mapAPICommunityToUI(c){
  const cat=(c?.category||'Другое').trim()||'Другое';
  const icons={Логистика:'🚛',ВЭД:'🛃',IT:'💻',Регионы:'🌍',Карьера:'💼',Другое:'💬'};
  const id=Number(c?.id||Date.now());
  const cached=readCachedCommunityState(id);
  const apiMembers=Number.isFinite(Number(c?.members_count))?Math.max(0,Number(c.members_count)):0;
  const cachedMembers=Number.isFinite(Number(cached?.members_count))?Math.max(0,Number(cached.members_count)):null;
  const membersCount=cachedMembers===null?apiMembers:cachedMembers;
  const isMember=typeof cached?.is_member==='boolean'?cached.is_member:Boolean(c?.is_member);
  return {
    id,
    name:c?.name||'Без названия',
    cat,
    desc:c?.description||'',
    tags:Array.isArray(c?.tags)?c.tags:[],
    color:c?.color||avc(c?.name||cat),
    icon:icons[cat]||'💬',
    avatar_url:c?.avatar_url||'',
    cover_url:c?.cover_url||'',
    privacy:c?.privacy_level==='closed'?'closed':'open',
    members:membersCount,
    posts:0,
    activity:0,
    isMy:isMember,
    myRole:c?.my_role||'',
    region:c?.region||'',
    corporate:Boolean(c?.is_corporate),
    createdAt:c?.created_at||new Date().toISOString()
  };
}
function cacheCommunityDraft(c){
  if(!c?.id)return;
  try{
    const payload={
      id:Number(c.id),
      name:c.name||'',
      category:c.category||'Другое',
      description:c.description||'',
      tags:Array.isArray(c.tags)?c.tags:[],
      privacy_level:c.privacy_level==='closed'?'closed':'open',
      members_count:Number.isFinite(Number(c.members_count))?Number(c.members_count):0,
      created_at:c.created_at||new Date().toISOString()
    };
    sessionStorage.setItem('lastop_community_cache_'+String(payload.id),JSON.stringify(payload));
  }catch{}
}
function syncCommunityStateCache(c){
  if(!c?.id)return;
  try{
    const key='lastop_community_cache_'+String(c.id);
    const raw=sessionStorage.getItem(key);
    const prev=raw?JSON.parse(raw):{};
    const payload={
      ...prev,
      id:Number(c.id),
      members_count:Number.isFinite(Number(c.members))?Math.max(0,Number(c.members)):0,
      is_member:Boolean(c.isMy)
    };
    sessionStorage.setItem(key,JSON.stringify(payload));
  }catch{}
}
function syncSidebar(){
  const total=COMMUNITIES.length;
  const openCount=COMMUNITIES.filter(c=>c.privacy==='open').length;
  const myItems=COMMUNITIES.filter(c=>joinedSet.has(c.id));
  const recItems=COMMUNITIES.filter(c=>!joinedSet.has(c.id)).slice(0,4);
  document.getElementById('statTotal').textContent=String(total);
  document.getElementById('statOpen').textContent=String(openCount);
  document.getElementById('statClosed').textContent=String(Math.max(0,total-openCount));
  document.getElementById('statMy').textContent=String(myItems.length);

  const myWrap=document.getElementById('myCommunities');
  myWrap.innerHTML=myItems.length?myItems.slice(0,3).map(c=>`<div class="my-comm" onclick="openCommunity(COMMUNITIES.find(x=>x.id===${c.id}))">
      <div class="mc-av" style="background:${c.color}">${avHTML(c)}</div>
      <span class="mc-name">${esc(c.name)}</span>
      <span class="mc-cnt">${num(c.members)} уч.</span>
    </div>`).join(''):'<div style="font-size:12px;color:var(--gmt);padding:6px 4px">Вы пока не состоите ни в одном сообществе.</div>';

  const recWrap=document.getElementById('recommendedCommunities');
  recWrap.innerHTML=recItems.length?recItems.map(c=>`<div class="rec-comm">
      <div class="rc-av" style="background:${c.color}">${avHTML(c)}</div>
      <div class="rc-body"><div class="rc-name">${esc(c.name)}</div><div class="rc-meta">${num(c.members)} участников</div></div>
      <button type="button" class="rc-btn" onclick="joinRec(${c.id})">Вступить</button>
    </div>`).join(''):'<div style="font-size:12px;color:var(--gmt);padding:6px 4px">Нет рекомендаций.</div>';
}
function avHTML(c){
  const u=c?.avatar_url||'';
  if(u && (u.startsWith('http://')||u.startsWith('https://')||u.startsWith('/uploads/'))){
    return `<img src="${esc(u)}" alt="" style="width:100%;height:100%;border-radius:inherit;object-fit:cover">`;
  }
  return c?.icon||'💬';
}

let communityAvatarUrl = '';
async function onCommunityAvatarSelected(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Только изображения'); e.target.value=''; return; }
  if(file.size > 10*1024*1024){ toast('Макс. 10 МБ'); e.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('mAvatarImg').src = ev.target.result;
    document.getElementById('mAvatarPreview').style.display = 'block';
    document.getElementById('mAvatarUploading').style.display = 'flex';
  };
  reader.readAsDataURL(file);
  try{
    const fd = new FormData(); fd.append('file', file);
    const r = await fetch(API+'/upload',{method:'POST',headers:{Authorization:'Bearer '+tk()},body:fd});
    const d = await r.json().catch(()=>({}));
    if(!r.ok || !d.url){ toast(d.error||'Не удалось загрузить'); removeCommunityAvatar(); return; }
    communityAvatarUrl = d.url;
    document.getElementById('mAvatarUploading').style.display = 'none';
  }catch{
    toast('Ошибка сети');
    removeCommunityAvatar();
  }finally{ e.target.value=''; }
}
function removeCommunityAvatar(){
  communityAvatarUrl = '';
  const p=document.getElementById('mAvatarPreview'); if(p) p.style.display='none';
  const i=document.getElementById('mAvatarImg'); if(i) i.src='';
  const u=document.getElementById('mAvatarUploading'); if(u) u.style.display='none';
  const f=document.getElementById('mAvatarInput'); if(f) f.value='';
}

async function submitCommunity(){
  if(isCreatingCommunity)return;
  const name=(document.getElementById('mName')?.value||'').trim();
  if(name.length<3){toast('Название должно быть не короче 3 символов');return}
  const cat=document.getElementById('mCat')?.value||'Другое';
  const desc=document.getElementById('mDesc')?.value||'';
  const region=(document.getElementById('mRegion')?.value||'').trim();
  const website=(document.getElementById('mWebsite')?.value||'').trim();
  const email=(document.getElementById('mEmail')?.value||'').trim();
  const phone=(document.getElementById('mPhone')?.value||'').trim();
  const avatar_url=communityAvatarUrl||'';
  const tags=(document.getElementById('mTags')?.value||'').split(',').map(t=>t.trim()).filter(Boolean);
  const color=document.getElementById('mColor')?.value||selectedColor;
  const icons={Логистика:'🚛',ВЭД:'🛃',IT:'💻',Регионы:'🌍',Карьера:'💼',Другое:'💬'};
  isCreatingCommunity=true;
  const submitBtn=document.querySelector('.btn-submit');
  if(submitBtn){submitBtn.disabled=true;submitBtn.textContent='Создаём…'}
  try{
    const r=await fetch(API+'/communities',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tk()},body:JSON.stringify({name,category:cat,description:desc,region,website,email,phone,avatar_url,color,tags,privacy_level:selectedPriv})});
    if(isUnauthorizedResponse(r)){
      forceRelogin('Сессия истекла. Войдите снова');
      return;
    }
    if(!r.ok){
      let msg='Не удалось создать сообщество';
      try{const data=await r.json();if(data?.error)msg=data.error}catch{}
      toast(msg);
      return;
    }
    const data=await r.json();
    cacheCommunityDraft(data?.community);
    const created=mapAPICommunityToUI(data?.community);
    created.isMy=true;
    created.color=color||created.color;
    syncCommunityStateCache(created);
    COMMUNITIES.unshift(created);
    joinedSet.add(created.id);
    closeModal();
    toast('Сообщество «'+name+'» создано ✓',true);
    location.href='/community-detail.html?id='+encodeURIComponent(created.id);
  }catch{
    toast('Не удалось создать сообщество. Проверьте подключение к серверу.');
  }finally{
    isCreatingCommunity=false;
    if(submitBtn){submitBtn.disabled=false;submitBtn.textContent='Создать сообщество'}
  }
}
async function submitJoinRequest(){
  if(!joinReqCommunityID)return;
  const message=(document.getElementById('joinReqMsg')?.value||'').trim();
  try{
    const r=await fetch(API+'/communities/'+joinReqCommunityID+'/join-requests',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tk()},body:JSON.stringify({message})});
    if(!r.ok){
      const d=await r.json().catch(()=>null);
      toast(d?.error||'Не удалось отправить заявку');
      return;
    }
    closeJoinRequestModal();
    toast('Заявка отправлена',true);
  }catch{
    toast('Ошибка отправки заявки');
  }
}
function filterMyRegion(btn){
  if(!myRegion){toast('В профиле не указан город');return}
  currentTab='';
  document.querySelectorAll('.ctab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('searchInput').value='';
  fetchCommunitiesByRegion(myRegion);
}
async function fetchCommunitiesByRegion(region){
  const grid = document.getElementById('communitiesGrid') || document.getElementById('feed') || document.getElementById('communityList');
  if (grid && window.lastopSkel) grid.innerHTML = window.lastopSkel.cards(6);
  try{
    const r=await fetch(API+'/communities?region='+encodeURIComponent(region),{headers:{Authorization:'Bearer '+tk()}});
    if(!r.ok)return;
    const data=await r.json();
    const fromAPI=(data?.communities||[]).map(mapAPICommunityToUI);
    COMMUNITIES.splice(0,COMMUNITIES.length,...fromAPI);
    joinedSet.clear();fromAPI.forEach(c=>{if(c.isMy)joinedSet.add(c.id)});
    syncSidebar();applyFilters();
  }catch{}
}

/* ── АВТОРИЗАЦИЯ ── */
(async()=>{
  if(tk()){try{
    const r=await fetch(API+'/me',{headers:{Authorization:'Bearer '+tk()}});
    if(isUnauthorizedResponse(r)){forceRelogin('Сессия истекла. Войдите снова');return}
    if(!r.ok)throw 0;
    const{user={}}=await r.json();
    const name=user.full_name||user.name||'Пользователь';
    const C=['#5AB080','#3A90C0','#9060C0','#C07030','#1A8A6A'];
    const color=C[name.charCodeAt(0)%C.length];const L=ltr(name);
    ["topbarAv","pddAv"].forEach(id=>{if(window.LASTOP_SET_AV)window.LASTOP_SET_AV(id,L,color,((typeof u!=="undefined"&&u&&u.avatar_url)||(typeof currentUser!=="undefined"&&currentUser&&currentUser.avatar_url)||(typeof user!=="undefined"&&user&&user.avatar_url)||"")); else{const el=document.getElementById(id);if(el){el.textContent=L;el.style.background=color;}}});
    ['topbarName','pddName'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=name});
    const role=user.role||user.position||'Участник LASTOP';
    myRegion=(user.city||'').trim();
    ['topbarRole','pddRole'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=role});
  }catch{}}
  try{
    const r=await fetch(API+'/communities',{headers:tk()?{Authorization:'Bearer '+tk()}:{}});
    if(r.ok){
      const data=await r.json();
      const fromAPI=(data?.communities||[]).map(mapAPICommunityToUI);
      COMMUNITIES.splice(0,COMMUNITIES.length,...fromAPI);
      joinedSet.clear();
      fromAPI.forEach(c=>{if(c.isMy)joinedSet.add(c.id)});
    }
  }catch{}
  syncSidebar();
  applyInitialMode();
  applyFilters();
})();
