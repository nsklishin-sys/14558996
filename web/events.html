<!DOCTYPE html>
<html lang="ru">
<head>
<script src="/assets/utils.js"></script>
<script src="/assets/dark-theme-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LASTOP GROUP — Мероприятия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/shell-layout.css">
<script>document.documentElement.classList.add('lt-shell');</script>
<link rel="stylesheet" href="/assets/hover-lift.css">
<script>document.documentElement.classList.add('hl-on');</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#1E8A4C;--gm:#22A05A;--gl:#E8F5EE;--gp:#F0FAF4;--gmt:#5A8A6A;--gb:#C0DECA;
  --w:#FFF;--bg:#F2F5F3;--t:#1A2A22;--tm:#3A5245;--bdr:#DDE8E2;
  --red:#E04040;--r:8px;--rm:12px;--rl:18px;--rxl:24px;
  --sh:0 2px 12px rgba(30,138,76,.07);--shm:0 6px 24px rgba(30,138,76,.13)
}
html,body{height:100%;overflow:hidden;font-family:'Manrope',sans-serif;background:var(--bg);color:var(--t);font-size:14px}

/* ═══ SHELL ═══ */
.shell{display:grid;grid-template-columns:240px 1fr 300px;grid-template-rows:56px 1fr;grid-template-areas:"logo topbar topbar""nav main right";height:100vh;gap:10px;padding:10px}

.logo-cell{grid-area:logo;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;padding:0 14px;text-decoration:none;box-shadow:var(--sh);transition:box-shadow .2s}
.logo-cell img{height:38px;width:auto;max-width:100%;object-fit:contain;display:block}
.topbar{grid-area:topbar;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:grid;grid-template-columns:1fr 300px;align-items:center;gap:10px;padding:0 16px;box-shadow:var(--sh);min-width:0}
.search-wrap{position:relative;display:flex;align-items:center;min-width:0}
.search-dot{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--g);pointer-events:none}
.search-wrap input{width:100%;height:36px;padding:0 14px 0 30px;border:1.5px solid var(--bdr);border-radius:99px;background:var(--gp);font-family:inherit;font-size:13px;color:var(--t);outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--gm)}
.search-wrap input::placeholder{color:var(--gmt)}

/* NAV */
.nav{grid-area:nav;background:var(--w);border-radius:var(--rxl);border:1px solid var(--bdr);box-shadow:var(--sh);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;padding:12px 10px 10px;gap:1px}
.nav::-webkit-scrollbar{display:none}

/* MAIN */
.main{grid-area:main;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.main::-webkit-scrollbar{width:4px}
.main::-webkit-scrollbar-thumb{background:var(--gb);border-radius:99px}

/* ─── ТУЛБАР ─── */
.ev-toolbar{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:12px 14px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap}
.ev-toolbar .ev-tabs{flex:1 1 auto;min-width:0;flex-wrap:wrap}
.ev-toolbar .btn-create{margin-left:auto;order:99}
.ev-title{font-size:16px;font-weight:900;color:var(--t);white-space:nowrap}
.mode-switch{display:flex;background:var(--gp);border:1.5px solid var(--bdr);border-radius:99px;padding:3px;gap:2px;flex-shrink:0}
.mode-btn{padding:5px 13px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit;color:var(--gmt);background:transparent;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.mode-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.mode-btn.active{background:var(--g);color:#fff;box-shadow:0 2px 6px rgba(30,138,76,.2)}
.ev-tabs{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.ev-tabs::-webkit-scrollbar{display:none}
.etab{padding:6px 13px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--bdr);background:transparent;color:var(--tm);font-family:inherit;transition:all .15s;white-space:nowrap;flex-shrink:0}
.etab:hover{background:var(--gp);color:var(--g);border-color:var(--gb)}
.etab.active{background:var(--g);color:#fff;border-color:var(--g)}
.btn-create{padding:8px 18px;border-radius:99px;background:var(--g);border:none;color:#fff;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(30,138,76,.22);white-space:nowrap;flex-shrink:0}
.btn-create:hover{background:var(--gm)}
.btn-create svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round}
.btn-news{padding:8px 14px;border-radius:99px;border:1.5px solid var(--bdr);background:var(--gp);color:var(--tm);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;flex-shrink:0}
.btn-news:hover{border-color:var(--gb);background:var(--gl);color:var(--g)}
.btn-news svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ─── КАЛЕНДАРЬ ─── */
.cal-card{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:14px;box-shadow:var(--sh);flex-shrink:0;overflow:hidden}
/* Popup событий дня */
.cal-popup{
  overflow:hidden;
  max-height:0;
  opacity:0;
  margin-top:0;
  border-top:0px solid var(--bdr);
  transition:max-height .25s ease, opacity .2s ease, margin-top .25s ease, border-top-width .25s ease;
  pointer-events:none;
}
.cal-popup::-webkit-scrollbar{display:none}
.cal-popup.open{
  max-height:400px;
  opacity:1;
  margin-top:10px;
  border-top:1px solid var(--bdr);
  pointer-events:all;
}
.cal-popup-head{
  padding:10px 12px 8px;border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:var(--w);z-index:1
}
.cal-popup-date{font-size:12px;font-weight:800;color:var(--t)}
.cal-popup-close{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--bdr);background:var(--gp);display:grid;place-items:center;cursor:pointer;color:var(--gmt);transition:all .15s;flex-shrink:0}
.cal-popup-close:hover{border-color:var(--gb);color:var(--g)}
.cal-popup-close svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.cal-popup-list{padding:6px}
.cal-nav{display:grid;grid-template-columns:28px minmax(0,1fr) auto 28px;align-items:center;gap:6px;margin-bottom:12px}
.cal-month-label{font-size:14px;font-weight:800;color:var(--t);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-nav-btn{width:28px;height:28px;border-radius:var(--rm);border:1.5px solid var(--bdr);background:var(--gp);display:grid;place-items:center;cursor:pointer;color:var(--gmt);transition:all .15s;flex-shrink:0}
.cal-nav-btn:hover{border-color:var(--gb);color:var(--g);background:var(--gl)}
.cal-nav-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cal-today-btn{padding:4px 12px;border-radius:99px;border:1.5px solid var(--bdr);background:var(--gp);font-family:inherit;font-size:11px;font-weight:700;color:var(--gmt);cursor:pointer;transition:all .15s}
.cal-today-btn:hover{border-color:var(--gb);color:var(--g)}
.cal-dows{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.cal-dow{text-align:center;font-size:10px;font-weight:700;color:var(--gmt);padding:4px 0;text-transform:uppercase;letter-spacing:.04em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;color:var(--tm);
  border-radius:var(--r);cursor:pointer;transition:background .15s,color .15s;
  position:relative;user-select:none;border:none;background:transparent;padding:0;font-family:inherit
}
.cal-day:hover{background:var(--gp);color:var(--g)}
.cal-day.other{color:var(--bdr);pointer-events:none}
.cal-day.today{background:var(--g);color:#fff;font-weight:800}
.cal-day.today:hover{background:var(--gm)}
.cal-day.has-event:not(.today){background:var(--gl);color:var(--g);font-weight:700}
.cal-day.has-event:not(.today):hover{background:var(--gb)}
.cal-day.selected:not(.today){background:var(--gb);color:var(--t)}
.cal-day.has-event::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--g)}
.cal-day.today.has-event::after{background:#fff}

.cal-events-list{margin-top:12px;padding-top:12px;border-top:1px solid var(--bdr);display:flex;flex-direction:column;gap:5px}
.cal-ev-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--rm);cursor:pointer;transition:background .12s}
.cal-ev-row:hover{background:var(--gp)}
.cal-ev-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cal-ev-title{font-size:11px;font-weight:700;color:var(--t);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-ev-time{font-size:10px;color:var(--gmt);flex-shrink:0}

#evContent{display:flex;flex-direction:column;gap:12px}
.ev-card{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);overflow:hidden;box-shadow:var(--sh);cursor:pointer;transition:box-shadow .2s,transform .2s,border-color .2s;animation:fadeUp .3s ease both}
.ev-card:hover{box-shadow:0 6px 20px rgba(30,138,76,.12);transform:translateY(-2px);border-color:var(--gb)}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.ev-banner{height:6px;flex-shrink:0}
.ev-body{padding:14px 16px}
.ev-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.ev-date-box{width:44px;flex-shrink:0;border-radius:var(--rm);overflow:hidden;border:1.5px solid var(--bdr);text-align:center}
.ev-date-day{font-size:18px;font-weight:900;color:var(--t);line-height:1;padding:5px 0 2px;background:var(--w)}
.ev-date-month{font-size:9px;font-weight:700;color:var(--w);text-transform:uppercase;letter-spacing:.08em;padding:3px 0;background:var(--g)}
.ev-meta{flex:1;min-width:0}
.ev-badges{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:5px}
.ev-badge{padding:2px 8px;border-radius:99px;font-size:9px;font-weight:700}
.b-webinar{background:#E6F1FB;color:#185FA5;border:1px solid #C9DDEF}
.b-conference{background:#EDE8FA;color:#6040A0;border:1px solid #C8B8EF}
.b-workshop{background:#FEF3C7;color:#B45309;border:1px solid #FCD34D}
.b-networking{background:var(--gl);color:var(--g);border:1px solid var(--gb)}
.b-roundtable{background:#F0EBF8;color:#B05090;border:1px solid #C8B8EF}
.b-online{background:var(--gl);color:var(--g);border:1px solid var(--gb)}
.b-offline{background:#FEE2E2;color:var(--red);border:1px solid #FBCFB0}
.b-hybrid{background:#FEF3C7;color:#B45309;border:1px solid #FCD34D}
.ev-card .ev-title{font-size:14px;font-weight:800;color:var(--t);line-height:1.3;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;word-break:break-word}
.ev-info-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ev-info-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--gmt)}
.ev-info-item svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;flex-shrink:0}
.ev-desc{font-size:12px;color:var(--gmt);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
.ev-speakers{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ev-speaker{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tm)}
.ev-sp-av{width:20px;height:20px;border-radius:50%;font-size:8px;font-weight:800;color:#fff;display:grid;place-items:center;flex-shrink:0}
.ev-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.ev-tag{padding:2px 8px;border-radius:99px;background:var(--gp);border:1px solid var(--bdr);font-size:10px;font-weight:600;color:var(--gmt)}
.ev-foot{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--bdr)}
.ev-stat{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--gmt)}
.ev-stat svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.ev-price{font-size:12px;font-weight:800;color:var(--t);margin-left:auto}
.ev-price.free{color:var(--g)}
.btn-reg{padding:7px 16px;border-radius:var(--rm);background:var(--g);border:none;color:#fff;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;box-shadow:0 2px 6px rgba(30,138,76,.18);white-space:nowrap}
.btn-reg:hover{background:var(--gm)}
.btn-reg.registered{background:var(--gp);color:var(--g);border:1.5px solid var(--gb);box-shadow:none}
.btn-save{width:32px;height:32px;border-radius:var(--rm);border:1.5px solid var(--bdr);background:var(--gp);display:grid;place-items:center;cursor:pointer;color:var(--gmt);transition:all .15s;flex-shrink:0}
.btn-save:hover{border-color:var(--gb);color:var(--g);background:var(--gl)}
.btn-save.saved{color:var(--red);border-color:#FABCBC;background:#FFF5F5}
.btn-save svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}

.modal-bg{position:fixed;inset:0;background:rgba(15,25,18,.42);backdrop-filter:blur(4px);z-index:var(--z-dropdown);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{background:var(--w);border-radius:var(--rxl);border:1px solid var(--bdr);box-shadow:0 24px 60px rgba(30,138,76,.15);width:100%;max-width:540px;max-height:90vh;overflow-y:auto;transform:translateY(14px);transition:transform .25s}
.modal-bg.open .modal{transform:translateY(0)}
.modal::-webkit-scrollbar{display:none}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--w);z-index:1}
.modal-title{font-size:15px;font-weight:800;color:var(--t)}
.modal-close{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--bdr);background:var(--gp);display:grid;place-items:center;cursor:pointer;color:var(--gmt);transition:all .15s}
.modal-close:hover{border-color:var(--gb);color:var(--g)}
.modal-close svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:12px}
.mf-label{font-size:11px;font-weight:700;color:var(--gmt);margin-bottom:5px;display:block}
.mf-input{width:100%;height:38px;padding:0 12px;border:1.5px solid var(--bdr);border-radius:var(--rm);background:var(--gp);font-family:inherit;font-size:13px;color:var(--t);outline:none;transition:border-color .2s}
.mf-input:focus{border-color:var(--gm);background:var(--w)}
.mf-input::placeholder{color:var(--gmt)}
.mf-textarea{width:100%;padding:10px 12px;border:1.5px solid var(--bdr);border-radius:var(--rm);background:var(--gp);font-family:inherit;font-size:13px;color:var(--t);outline:none;resize:none;line-height:1.55;transition:border-color .2s}
.mf-textarea:focus{border-color:var(--gm);background:var(--w)}
.mf-textarea::placeholder{color:var(--gmt)}
.mf-select{width:100%;height:38px;padding:0 12px;border:1.5px solid var(--bdr);border-radius:var(--rm);background:var(--gp);font-family:inherit;font-size:13px;color:var(--tm);outline:none;cursor:pointer}
.mf-select:focus{border-color:var(--gm)}
.mf-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mf-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.mf-section{font-size:11px;font-weight:800;color:var(--gmt);text-transform:uppercase;letter-spacing:.06em;margin-top:6px;padding-top:10px;border-top:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;gap:8px}
.mf-section-add{font-size:11px;font-weight:700;color:var(--g);background:var(--gp);border:1px solid var(--gb);border-radius:99px;padding:4px 12px;cursor:pointer;font-family:inherit;text-transform:none;letter-spacing:0;display:inline-flex;align-items:center;gap:5px;transition:all .12s}
.mf-section-add:hover{background:var(--g);color:#fff;border-color:var(--g)}
.mf-section-add svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2}
.mf-list{display:flex;flex-direction:column;gap:10px}
.mf-list-item{position:relative;background:var(--gp);border:1px solid var(--bdr);border-radius:var(--rm);padding:12px 12px 12px 12px;display:flex;flex-direction:column;gap:8px}
.mf-list-item.featured{border-color:var(--g);background:var(--gl)}
.mf-list-remove{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:6px;background:transparent;border:none;color:var(--gmt);cursor:pointer;display:grid;place-items:center;font-family:inherit;transition:all .15s}
.mf-list-remove:hover{background:#FFF1F0;color:var(--red)}
.mf-list-remove svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.mf-list-empty{font-size:12px;color:var(--gmt);font-style:italic;padding:14px 12px;text-align:center;background:var(--gp);border:1px dashed var(--bdr);border-radius:var(--rm)}
.mf-list-item-header{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--gmt);text-transform:uppercase;letter-spacing:.04em}
.mf-list-item-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:var(--g);color:#fff;font-size:11px;font-weight:800}
.mf-checkbox-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t);cursor:pointer;user-select:none}
.mf-checkbox-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--g);cursor:pointer}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bdr);display:flex;justify-content:flex-end;gap:8px}
.btn-cancel{padding:9px 18px;border-radius:var(--rm);border:1.5px solid var(--bdr);background:var(--gp);color:var(--tm);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-cancel:hover{border-color:var(--gb);color:var(--g);background:var(--gl)}
.btn-submit{padding:9px 22px;border-radius:var(--rm);border:none;background:var(--g);color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(30,138,76,.22)}
.btn-submit:hover{background:var(--gm)}

.right{grid-area:right;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.right::-webkit-scrollbar{display:none}
.card{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:14px;box-shadow:var(--sh);transition:box-shadow .2s ease,transform .2s ease}
.card:hover{box-shadow:var(--shm);transform:translateY(-3px)}
.block-title{font-size:10px;font-weight:700;color:var(--gmt);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.stat-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bdr)}
.stat-row:last-child{border-bottom:none;padding-bottom:0}
.stat-lbl{font-size:12px;color:var(--gmt);display:flex;align-items:center;gap:6px}
.stat-lbl svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.stat-val{font-size:13px;font-weight:800;color:var(--t)}
.soon-item{display:flex;align-items:center;gap:9px;padding:7px 6px;border-radius:var(--rm);cursor:pointer;transition:background .12s}
.soon-item:hover{background:var(--gp)}
.soon-box{width:36px;height:36px;border-radius:var(--rm);background:var(--gl);border:1px solid var(--gb);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.soon-d{font-size:14px;font-weight:900;color:var(--g);line-height:1}
.soon-m{font-size:8px;font-weight:700;color:var(--gmt);text-transform:uppercase;letter-spacing:.04em}
.soon-body{flex:1;min-width:0}
.soon-title{font-size:12px;font-weight:700;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.soon-meta{font-size:10px;color:var(--gmt);margin-top:1px;display:flex;align-items:center;gap:4px}
.soon-format{font-size:9px;font-weight:700;padding:1px 6px;border-radius:99px}
.sf-online{background:var(--gl);color:var(--g);border:1px solid var(--gb)}
.sf-offline{background:#FEE2E2;color:var(--red);border:1px solid #FBCFB0}
.sf-hybrid{background:#FEF3C7;color:#B45309;border:1px solid #FCD34D}
.my-reg-item{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:var(--rm);cursor:pointer;transition:background .12s}
.my-reg-item:hover{background:var(--gp)}
.my-reg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.my-reg-body{flex:1;min-width:0}
.my-reg-title{font-size:12px;font-weight:700;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.my-reg-date{font-size:10px;color:var(--gmt)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#1A2A22;color:#fff;padding:10px 18px;border-radius:var(--rm);font-size:13px;font-weight:600;z-index:var(--z-panel);opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--g)}

@media(max-width:1400px){.shell{grid-template-columns:220px 1fr 280px}}
@media(max-width:1200px){.shell{grid-template-columns:200px 1fr 260px}}
@media(max-width:1000px){
  .shell{grid-template-columns:200px 1fr;grid-template-areas:"logo topbar""nav main"}
  .right{display:none}
}
@media(max-width:840px){
  .shell{grid-template-columns:180px 1fr}
  .ev-toolbar{flex-wrap:wrap}
  .ev-tabs{order:3;flex-basis:100%}
  .btn-create{order:2;flex-shrink:0}
  .mode-switch{flex-shrink:0}
}
@media(max-width:740px){
  .shell{grid-template-columns:52px 1fr}
  .nav-item span,.nav-group{display:none}
  .nav-item{justify-content:center;padding:10px}
  .mode-btn{padding:5px 8px;font-size:11px}
  .mode-btn svg{display:none}
  .etab{padding:5px 10px;font-size:11px}
  .btn-create span{display:none}
  .btn-create{padding:8px 12px}
}
@media(max-width:520px){
  .shell{grid-template-columns:1fr;grid-template-rows:56px auto 1fr;grid-template-areas:"topbar""nav""main";padding:8px;gap:8px}
  .logo-cell{grid-area:logo;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;padding:0 14px;text-decoration:none;box-shadow:var(--sh);transition:box-shadow .2s}
  .nav{grid-area:nav;flex-direction:row;border-radius:var(--rl);padding:6px 8px;height:auto;overflow-x:auto;overflow-y:hidden;gap:2px}
  .nav-group,.nav-bottom{display:none}
  .nav-item{flex-direction:column;gap:2px;padding:6px 8px;min-width:46px;text-align:center}
  .nav-item span{display:block;font-size:9px}
  .nav-item svg{width:16px;height:16px}
  .ev-toolbar{gap:7px}
  .mode-switch{overflow-x:auto;scrollbar-width:none}
  .mode-switch::-webkit-scrollbar{display:none}
}
@media (min-width:1921px) and (min-height:1081px){
  html,body{font-size:15px}
  .shell{grid-template-columns:280px 1fr 360px !important;gap:12px;padding:12px}
  .topbar{grid-template-columns:1fr 360px !important}
  .nav{padding:14px 12px 12px}
}

[class*="card"]{transition:box-shadow .2s ease,transform .2s ease}
[class*="card"]:hover{box-shadow:var(--shm);transform:translateY(-3px)}

<script>
const esc = window.lastopEsc;
function ltr(s){const p=String(s||'').trim().split(/\s+/).filter(Boolean);if(!p.length)return '?';if(p.length>=2)return (p[0][0]+p[1][0]).toUpperCase();return p[0][0].toUpperCase();}
const avc = window.lastopAvc;
function num(n){return n>=1000?(n/1000).toFixed(1).replace(/\.0$/,'')+'к':String(n||0)}
function price(n){return n>0?new Intl.NumberFormat('ru-RU').format(n)+' ₽':'Бесплатно'}
function toast(msg,ok){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(ok?' ok':'');setTimeout(()=>t.classList.remove('show'),2400)}
function toggleDD(e){e.stopPropagation();document.getElementById('topbarProfile').classList.toggle('open');document.getElementById('profileDD').classList.toggle('open')}
document.addEventListener('click',e=>{const d=document.getElementById('profileDD'),b=document.getElementById('topbarProfile');if(d&&!d.contains(e.target)&&!b.contains(e.target)){d.classList.remove('open');b.classList.remove('open')}})
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.getElementById('profileDD').classList.remove('open');document.getElementById('topbarProfile').classList.remove('open')}})
function logout(){try{lastopFetch('/api/auth/logout',{method:'POST',keepalive:true});}catch{}try{localStorage.removeItem('user');}catch{}location.replace('/home-guest.html');}
const TYPE_LABEL={webinar:'Вебинар',conference:'Конференция',workshop:'Воркшоп',networking:'Нетворкинг',roundtable:'Круглый стол'};
const TYPE_BADGE={webinar:'b-webinar',conference:'b-conference',workshop:'b-workshop',networking:'b-networking',roundtable:'b-roundtable'};
const TYPE_COLOR={webinar:'#185FA5',conference:'#6040A0',workshop:'#B45309',networking:'#1E8A4C',roundtable:'#B05090'};
const FORMAT_BADGE={online:'b-online',offline:'b-offline',hybrid:'b-hybrid'};
const FORMAT_LABEL={online:'Онлайн',offline:'Офлайн',hybrid:'Гибрид'};
const BANNER={webinar:'linear-gradient(90deg,#185FA5,#3A90C0)',conference:'linear-gradient(90deg,#6040A0,#9060C0)',workshop:'linear-gradient(90deg,#B45309,#E09030)',networking:'linear-gradient(90deg,#1E8A4C,#22A05A)',roundtable:'linear-gradient(90deg,#B05090,#9060C0)',default:'linear-gradient(90deg,var(--g),var(--gm))'};
const NOW=new Date();
const API='/api';
// Phase 4 (L-7): локальный tk() удалён, используется window.tk из utils.js.
let EVENTS=[];
let CAL_EVENTS=[];
const registeredSet=new Set();
const savedSet=new Set();

// Маппинг API-объекта в формат renderCard
function mapApiEvent(e){
  const startDate = e.starts_at ? new Date(e.starts_at) : new Date();
  const endDate = e.ends_at ? new Date(e.ends_at) : startDate;
  const pad = n => String(n).padStart(2,'0');
  return {
    id: e.id,
    public_id: e.public_id,
    title: e.title || '',
    type: e.type || 'webinar',
    format: e.format || 'online',
    category: e.category || '',
    city: e.city || '',
    address: e.address || '',
    date: startDate,
    timeStart: pad(startDate.getHours())+':'+pad(startDate.getMinutes()),
    timeEnd: pad(endDate.getHours())+':'+pad(endDate.getMinutes()),
    fee: Math.round((e.fee_cents||0)/100),
    seats: e.seats_total||0,
    registered: e.registered_count||0,
    views: e.views_count||0,
    desc: e.description || '',
    speakers: [],
    tags: e.tags || [],
    isRegistered: !!e.is_registered,
    isSaved: !!e.is_saved,
    is_mine: !!e.is_mine,
    cover_url: e.cover_url || '',
    latitude: e.latitude||0,
    longitude: e.longitude||0,
    organizer_name: e.organizer_name || '',
    community_id: e.community_id || null,
    community_name: e.community_name || '',
    community_avatar: e.community_avatar || '',
    community_color: e.community_color || '',
    author_company_id: e.author_company_id || 0,
    author_company_name: e.author_company_name || '',
    author_company_slug: e.author_company_slug || '',
    author_company_logo: e.author_company_logo || ''
  };
}

async function loadEvents(){
  const feedEl = document.getElementById('evFeed') || document.getElementById('feed') || document.getElementById('eventsList');
  if (feedEl && window.lastopSkel) feedEl.innerHTML = window.lastopSkel.cards(6);
  try{
    const url = API+'/events?limit=200';
    const r = await lastopFetch(url, { headers: {} });
    if(!r.ok){
      console.error('loadEvents HTTP', r.status, url);
      return;
    }
    const d = await r.json();
    const arr = Array.isArray(d) ? d : (d.events || d.items || d.data || []);
    EVENTS = arr.map(mapApiEvent);
    EVENTS.forEach(e=>{ if(e.isRegistered&&e.public_id)registeredSet.add(e.public_id); if(e.isSaved&&e.public_id)savedSet.add(e.public_id); });
    applyFilters();
    loadCalendarEvents();
  }catch(err){console.error('loadEvents',err)}
}
async function loadCalendarEvents(){
  try{
    const from=new Date(); from.setMonth(from.getMonth()-6); from.setHours(0,0,0,0);
    const r=await lastopFetch(API+'/events?limit=500&from='+encodeURIComponent(from.toISOString()),{headers:{}});
    if(!r.ok)return;
    const d=await r.json();
    CAL_EVENTS=(d.events||[]).map(mapApiEvent);
    renderSidebarCalendar();
  }catch(err){console.error('loadCalendarEvents',err)}
}
let currentType=''; let currentMode='all'; let calYear=NOW.getFullYear(); let calMonth=NOW.getMonth(); let selectedDay=null;
function renderCard(ev,i){
  const d=ev.date instanceof Date?ev.date:new Date(ev.date); const day=d.getDate();
  const mon=d.toLocaleDateString('ru-RU',{month:'short'}).replace('.',''); const pid=ev.public_id||''; const isReg=registeredSet.has(pid); const isSav=savedSet.has(pid);

function renderSidebarCalendar(){
  const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const DOWS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const now=new Date();
  const isCurrentMonth=calYear===now.getFullYear()&&calMonth===now.getMonth();
  document.getElementById('calMonthLabel').textContent=MONTHS[calMonth]+' '+calYear;
  document.getElementById('calDows').innerHTML=DOWS.map(d=>'<div class="cal-dow">'+d+'</div>').join('');
  const firstDow=(new Date(calYear,calMonth,1).getDay()+6)%7;
  const totalDays=new Date(calYear,calMonth+1,0).getDate();
  const prevLast=new Date(calYear,calMonth,0).getDate();
  const eventDays=new Set(calendarEventsForMonth(calYear,calMonth).map(e=>(e.date instanceof Date?e.date:new Date(e.date)).getDate()));
  let html='';
  for(let i=firstDow-1;i>=0;i--)html+=`<div class="cal-day other">${prevLast-i}</div>`;
  for(let d=1;d<=totalDays;d++){
    const cls=['cal-day'];
    if(isCurrentMonth&&d===now.getDate())cls.push('today');
    if(eventDays.has(d))cls.push('has-event');
    if(selectedDay===d)cls.push('selected');
    html+=`<button type="button" class="${cls.join(' ')}" onclick="openDayPopup(${calYear},${calMonth},${d})">${d}</button>`;
  }
  const cells=Math.ceil((firstDow+totalDays)/7)*7;
  for(let i=1;i<=cells-firstDow-totalDays;i++)html+=`<div class="cal-day other">${i}</div>`;
  document.getElementById('calGrid').innerHTML=html;
}

    const r=await lastopFetch(`${API}/events/${encodeURIComponent(publicID)}/register`,{

// Сборка данных из всех элементов списка
function collectListData(listId){
  const wrap=document.getElementById(listId);
  if(!wrap)return [];
  const items=Array.from(wrap.querySelectorAll('.mf-list-item'));
  return items.map(function(item){
    const obj={};
    item.querySelectorAll('[data-field]').forEach(function(input){
      const field=input.dataset.field;
      if(input.type==='checkbox'){
        obj[field]=input.checked;
      }else if(input.type==='number'){
        const v=parseInt(input.value||'0',10);
        obj[field]=isNaN(v)?0:v;
      }else{
        obj[field]=(input.value||'').trim();
      }
    });
    // Преимущества — массив строк
    if(typeof obj.perks==='string'){
      obj.perks=obj.perks.split(/\n+/).map(function(s){return s.trim()}).filter(Boolean);
    }
    return obj;
  }).filter(function(obj){
    // Фильтр пустых: для спикера обязателен name; для программы — title; для билета — name
    if(obj.name!==undefined && !obj.name && obj.title===undefined && obj.time===undefined)return false;
    if(obj.title!==undefined && !obj.title)return false;
    if(obj.name!==undefined && obj.title===undefined && obj.time===undefined && !obj.name)return false;
    return true;
  });
}

async function onEvCoverSelected(e){

  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Только изображения'); e.target.value=''; return; }
  if(file.size > 25*1024*1024){ toast('Макс. 25 МБ'); e.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('evCoverImg').src = ev.target.result;
    document.getElementById('evCoverPreview').style.display = 'block';
    document.getElementById('evCoverUploading').style.display = 'flex';
  };
  reader.readAsDataURL(file);
  try{
    const fd = new FormData(); fd.append('file', file);
    const r = await lastopFetch(API+'/upload',{method:'POST',body:fd});
    const d = await r.json().catch(()=>({}));
    if(!r.ok || !d.url){ toast(d.error||'Не удалось'); removeEvCover(); return; }
    evCoverUrl = d.url;
    document.getElementById('evCoverUploading').style.display = 'none';
  }catch{ toast('Ошибка сети'); removeEvCover(); }
  finally{ e.target.value=''; }
}

async function submitEvent(){
  const format=document.getElementById('mFormat').value;
  const address=(document.getElementById('mAddress')?.value||'').trim();
  // Сбрасываем все предыдущие подсветки ошибок
  if(window.lastopClearAllErrors)window.lastopClearAllErrors(document.getElementById('modalBg'));
  // Валидация обязательных полей: подсветка + скролл к первому невалидному
  if(window.lastopValidate){
    const ok=window.lastopValidate([
      {id:'mTitle',required:true,message:'Введите название мероприятия'},
      {id:'mDate',required:true,message:'Укажите дату проведения'},
      {id:'mCat',required:true,message:'Выберите категорию'},
      {id:'mAddress',required:format!=='online',message:'Адрес обязателен для офлайн/гибрид мероприятий'},
    ]);
    if(!ok)return;
  } else {
    // Fallback на случай если confirm-modal.js ещё не загружен
    const t=(document.getElementById('mTitle').value||'').trim();
    if(!t){toast('Введите название');return}
    if(!document.getElementById('mDate').value){toast('Укажите дату');return}
  }
  const title=(document.getElementById('mTitle').value||'').trim();
  const date=document.getElementById('mDate').value;
  const timeStart=document.getElementById('mTimeStart').value||'10:00';
  const timeEnd=document.getElementById('mTimeEnd').value||'12:00';
  const city=(document.getElementById('mCity').value||'').trim();
  const fee=parseInt(document.getElementById('mFee').value||'0',10);
  const seats=parseInt(document.getElementById('mSeats').value||'0',10);
  const tagsRaw=(document.getElementById('mTags').value||'').trim();
  const tags=tagsRaw?tagsRaw.split(',').map(t=>t.trim()).filter(Boolean):[];

  const startsAt=new Date(date+'T'+timeStart+':00').toISOString();
  const endsAt=new Date(date+'T'+timeEnd+':00').toISOString();

  const speakers=collectListData('speakersList');
  const program=collectListData('programList');
  const tickets=collectListData('ticketsList');

  const body={
    title,
    description: (document.getElementById('mDesc').value||'').trim(),
    type: document.getElementById('mType').value,
    format,
    category: document.getElementById('mCat').value||'',
    city,
    address,
    venue: '',
    online_url: (document.getElementById('mOnlineURL').value||'').trim(),
    starts_at: startsAt,
    ends_at: endsAt,
    timezone: 'Europe/Moscow',
    fee_cents: fee*100,
    currency: 'RUB',
    seats_total: seats,
    cover_url: evCoverUrl,
    tags,
    speakers: speakers,
    program: program,
    tickets: tickets
  };

  // Заголовки с активным контекстом (компания/сообщество)
  const baseH={'Content-Type':'application/json'};
  const headers=(typeof window.withActiveContextHeaders==='function')?window.withActiveContextHeaders(baseH):baseH;

  try{
    const isEditMode=!!window.__editEventID;
    const url=isEditMode?`${API}/events/${encodeURIComponent(window.__editEventID)}`:API+'/events';
    const method=isEditMode?'PATCH':'POST';
    // PATCH не принимает speakers/program/tickets/latitude/longitude
    const payload=isEditMode
      ?(({speakers,program,tickets,latitude,longitude,...rest})=>rest)(body)
      :body;
    const r=await lastopFetch(url,{method,headers,body:JSON.stringify(payload)});
    if(!r.ok){
      const d=await r.json().catch(()=>({}));
      if(r.status===429 && window.lastopAlert){
        await window.lastopAlert({
          title:'Слишком много попыток',
          message:d.error||'Превышен лимит создания мероприятий. Попробуйте через час.',
          type:'warn'
        });
      } else {
        toast(d.error||'Не удалось создать мероприятие');
      }
      return;
    }
    window.__editEventID=null;
    const submitBtn = document.getElementById('submitEventBtn');
    if (submitBtn) submitBtn.textContent = 'Создать мероприятие';
    closeModal();
    toast(isEditMode?'Мероприятие обновлено ✓':'Мероприятие создано ✓',true);
    await loadEvents();
  }catch(err){
    toast('Сеть: '+err.message);
  }
}
function applyCurrentUser(user){
  const name=user.full_name||user.name||'Пользователь';
  const role=user.role||user.position||'Участник LASTOP';
  const C=['#5AB080','#3A90C0','#9060C0','#C07030','#1A8A6A'];
  const color=C[name.charCodeAt(0)%C.length];
  const L=ltr(name);
  ["topbarAv","pddAv"].forEach(id=>{if(window.LASTOP_SET_AV)window.LASTOP_SET_AV(id,L,color,((typeof u!=="undefined"&&u&&u.avatar_url)||(typeof currentUser!=="undefined"&&currentUser&&currentUser.avatar_url)||(typeof user!=="undefined"&&user&&user.avatar_url)||"")); else{const el=document.getElementById(id);if(el){el.textContent=L;el.style.background=color;}}});
  ['topbarName','pddName'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=name});
  ['topbarRole','pddRole'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=role});
}
(async()=>{
  // гость может смотреть мероприятия
  try{
    const cached=JSON.parse(localStorage.getItem('user')||'{}');
    if(cached&&(cached.id||cached.full_name||cached.name)){applyCurrentUser(cached);}
  }catch{}
  try{
    const r=await lastopFetch(API+'/me',{headers:{}});
    if(r.ok){
      const{user={}}=await r.json();
      localStorage.setItem('user',JSON.stringify(user));
      applyCurrentUser(user);
    }
  }catch{}
  await loadEvents();
  const editId=new URLSearchParams(location.search).get('edit');
  if(editId){
    lastopFetch(`${API}/events/${encodeURIComponent(editId)}`,{
      headers:{}
    })
      .then(r=>r.json())
      .then(data=>{
        const ev=data.event;
        if(!ev)return;
        openModal();
        const setVal=(id,v)=>{const el=document.getElementById(id);if(el)el.value=v||'';};
        setVal('mTitle',ev.title);
        setVal('mDesc',ev.description);
        setVal('mCity',ev.city);
        setVal('mAddress',ev.address);
        setVal('mOnlineURL',ev.online_url);
        setVal('mDate',ev.starts_at?String(ev.starts_at).slice(0,10):'');
        setVal('mTimeStart',ev.starts_at?new Date(ev.starts_at).toISOString().slice(11,16):'');
        setVal('mTimeEnd',ev.ends_at?new Date(ev.ends_at).toISOString().slice(11,16):'');
        setVal('mType',ev.type);
        setVal('mFormat',ev.format);
        setVal('mCat',ev.category);
        setVal('mFee',ev.fee_cents?Math.round(ev.fee_cents/100):0);
        setVal('mSeats',ev.seats_total);
        setVal('mTags',Array.isArray(ev.tags)?ev.tags.join(', '):'');
        window.__editEventID=editId;
        const submitBtn = document.getElementById('submitEventBtn');
        if (submitBtn) submitBtn.textContent = 'Сохранить изменения';
        // Заголовок модалки тоже меняем
        const modalTitle = document.querySelector('.modal-bg.open .modal-head h3, #eventModalTitle');
        if (modalTitle) modalTitle.textContent = 'Редактировать мероприятие';
      });
  }
  renderSidebarCalendar();
})();
</script>
