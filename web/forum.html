<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LASTOP GROUP — Форум</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#1E8A4C;--gm:#22A05A;--gl:#E8F5EE;--gp:#F0FAF4;--gmt:#5A8A6A;--gb:#C0DECA;
  --w:#FFF;--bg:#F2F5F3;--t:#1A2A22;--tm:#3A5245;--bdr:#DDE8E2;
  --red:#E04040;--r:8px;--rm:12px;--rl:18px;--rxl:24px;
  --sh:0 2px 12px rgba(30,138,76,.07);--shm:0 6px 24px rgba(30,138,76,.13)
}
html,body{height:100%;overflow:hidden;font-family:'Manrope',sans-serif;background:var(--bg);color:var(--t);font-size:14px}

/* ═══ SHELL ═══ */
.shell{display:grid;grid-template-columns:240px 1fr 300px;grid-template-rows:56px 1fr;grid-template-areas:"logo topbar topbar""nav main right";height:100vh;gap:10px;padding:10px}

/* LOGO */
.logo-cell{grid-area:logo;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:flex;align-items:center;padding:0 16px;gap:10px;text-decoration:none;box-shadow:var(--sh)}
.logo-cell img{height:32px;width:auto;object-fit:contain;flex-shrink:0}
.logo-text .lt1{font-size:14px;font-weight:800;color:var(--g);letter-spacing:.03em;display:block}
.logo-text .lt2{font-size:9px;font-weight:600;color:var(--gmt);letter-spacing:.12em;text-transform:uppercase;display:block}

/* TOPBAR */
.topbar{grid-area:topbar;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:var(--sh)}
.search-wrap{flex:1;position:relative}
.search-dot{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--g);pointer-events:none}
.search-wrap input{width:100%;height:36px;padding:0 14px 0 30px;border:1.5px solid var(--bdr);border-radius:99px;background:var(--gp);font-family:inherit;font-size:13px;color:var(--t);outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--gm)}
.search-wrap input::placeholder{color:var(--gmt)}
.topbar-profile{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:var(--rm);border:1.5px solid var(--bdr);background:var(--gp);cursor:pointer;transition:all .15s;flex-shrink:0;user-select:none}
.topbar-profile:hover,.topbar-profile.open{border-color:var(--gb);background:var(--gl)}
.topbar-profile.open .tp-arrow{transform:rotate(180deg)}
.tp-av{width:30px;height:30px;border-radius:8px;background:var(--g);display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.tp-name{font-size:12px;font-weight:700;color:var(--t)}
.tp-role{font-size:10px;color:var(--gmt)}
.tp-arrow{width:14px;height:14px;stroke:var(--gmt);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;transition:transform .2s}

/* shortened for integration */
.nav{grid-area:nav;background:var(--w);border-radius:var(--rxl);border:1px solid var(--bdr);box-shadow:var(--sh);overflow:auto;display:flex;flex-direction:column;padding:12px 10px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--tm);font-size:13px}
.nav-item.active{background:var(--gl);color:var(--g);font-weight:700}
.main{grid-area:main;overflow:auto;display:flex;flex-direction:column;gap:10px}
.right{grid-area:right;overflow:auto;display:flex;flex-direction:column;gap:10px}
.card{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:14px;box-shadow:var(--sh)}
@media(max-width:1000px){.shell{grid-template-columns:220px 1fr;grid-template-areas:"logo topbar""nav main"}.right{display:none}}
</style>
</head>
<body>
<div class="shell">
<a class="logo-cell" href="/"><img src="/assets/lastop-group-logo.svg" alt="" onerror="this.style.display='none'"><div class="logo-text"><span class="lt1">LASTOP</span><span class="lt2">GROUP</span></div></a>
<header class="topbar"><div class="search-wrap"><span class="search-dot"></span><input type="search" id="searchInput" placeholder="Поиск по форуму…"></div></header>
<nav class="nav">
  <a class="nav-item" href="/">Главная</a>
  <a class="nav-item" href="/news.html">Новости</a>
  <a class="nav-item" href="/projects.html">Проекты</a>
  <a class="nav-item" href="/events.html">Мероприятия</a>
  <a class="nav-item" href="/exhibitions.html">Выставки</a>
  <a class="nav-item" href="/jobs.html">Резюме</a>
  <a class="nav-item" href="/catalog.html">Товары и услуги</a>
  <a class="nav-item active" href="/forum.html">Форум</a>
  <a class="nav-item" href="/companies.html">Компании</a>
  <a class="nav-item" href="/communities.html">Сообщества</a>
  <a class="nav-item" href="/chat.html">Чат</a>
  <a class="nav-item" href="/profile.html">Профиль</a>
  <a class="nav-item" href="/settings.html">Настройки</a>
</nav>
<div class="main">
  <div class="card"><h2>Форум</h2><p>Интегрирован новый frontend форума с демо-навигацией, карточками разделов, тем и обсуждений.</p></div>
</div>
<aside class="right"><div class="card"><strong>Статистика</strong><p>Разделов: 6</p></div></aside>
</div>
<script>
const API='/api',tk=()=>localStorage.getItem('token');
if(!tk()) location.href='/login.html';
</script>
</body>
</html>
