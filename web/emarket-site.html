<!DOCTYPE html>
<html lang="ru">
<head>
<script src="/assets/utils.js"></script>
<script src="/assets/confirm-modal.js"></script>
<script src="/assets/dark-theme-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LASTOP GROUP — Магазин</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/shell-layout.css">
<script>document.documentElement.classList.add('lt-shell');</script>
<link rel="stylesheet" href="/assets/hover-lift.css">
<script>document.documentElement.classList.add('hl-on');</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#1E8A4C;--gm:#22A05A;--gl:#E8F5EE;--gp:#F0FAF4;--gmt:#5A8A6A;--gb:#C0DECA;
  --w:#FFF;--bg:#F2F5F3;--t:#1A2A22;--tm:#3A5245;--bdr:#DDE8E2;
  --red:#E04040;--r:8px;--rm:12px;--rl:18px;--rxl:24px;
  --sh:0 2px 12px rgba(30,138,76,.07);--shm:0 6px 24px rgba(30,138,76,.13);
  --acc:#1E8A4C;--acc-d:#176c3b;--acc-l:rgba(30,138,76,.12)
}
html,body{height:100%;overflow:hidden;font-family:'Manrope',sans-serif;background:var(--bg);color:var(--t);font-size:14px}
.logo-cell{grid-area:logo;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;padding:0 14px;text-decoration:none;box-shadow:var(--sh);transition:box-shadow .2s}
.logo-cell img{height:38px;width:auto;max-width:100%;object-fit:contain;display:block}
.main{grid-area:main;overflow-y:auto;display:flex;flex-direction:column;gap:14px;min-height:0;padding-bottom:16px;scrollbar-width:none;-ms-overflow-style:none}
.main > *{flex-shrink:0}
.main::-webkit-scrollbar{display:none}
.right{grid-area:right;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:0}
@media(min-width:1921px) and (min-height:1081px){html.lt-shell .topbar{grid-template-columns:1fr 340px}}
.right::-webkit-scrollbar{width:4px}.right::-webkit-scrollbar-thumb{background:var(--gb);border-radius:99px}
img{max-width:100%}

.ms-sec{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:24px;box-shadow:var(--sh)}
.ms-sec-soft{background:var(--gp)}
.ms-title{font-size:21px;font-weight:800;margin-bottom:18px;letter-spacing:-.01em}
@media(max-width:600px){.ms-sec{padding:16px}.ms-title{font-size:18px;margin-bottom:14px}}

.ms-hero{position:relative;border-radius:var(--rxl);overflow:hidden;padding:56px 32px;text-align:center;color:#fff;background:var(--acc);box-shadow:var(--sh)}
.ms-hero.has-bg{background-size:cover;background-position:center}
.ms-hero::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,18,30,.3),rgba(10,18,30,.55));z-index:0}
.ms-hero.no-bg::before{display:none}
.ms-hero-in{position:relative;z-index:1;max-width:640px;margin:0 auto}
.ms-hero h1{font-size:34px;font-weight:900;line-height:1.15;letter-spacing:-.02em;margin-bottom:14px}
.ms-hero p{font-size:17px;opacity:.95;margin-bottom:22px;font-weight:500}
.ms-hero-cta{display:inline-block;background:#fff;color:var(--acc);padding:13px 30px;border-radius:var(--rm);font-weight:800;font-size:15px;transition:transform .15s;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.ms-hero-cta:hover{transform:translateY(-2px)}
@media(max-width:600px){.ms-hero{padding:40px 20px}.ms-hero h1{font-size:26px}.ms-hero p{font-size:15px}}

.ms-about{display:grid;grid-template-columns:1.4fr 1fr;gap:32px;align-items:center}
.ms-about.no-img{grid-template-columns:1fr}
.ms-about-text{font-size:15px;color:var(--tm);line-height:1.75;white-space:pre-wrap}
.ms-about-img img{border-radius:var(--rl);width:100%;object-fit:cover}
.ms-stats{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap}
.ms-stat .sn{font-size:30px;font-weight:900;color:var(--acc);line-height:1}
.ms-stat .sl{font-size:13px;color:var(--tm);margin-top:3px}
@media(max-width:760px){.ms-about{grid-template-columns:1fr;gap:18px}}

.ms-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.ms-cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.ms-cards{grid-template-columns:1fr}}
.ms-card{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rl);padding:22px;transition:transform .18s,box-shadow .18s}
.ms-card:hover{transform:translateY(-3px);box-shadow:var(--shm)}
.ms-card-ico{width:46px;height:46px;border-radius:12px;background:var(--acc-l);color:var(--acc);display:grid;place-items:center;margin-bottom:13px}
.ms-card-ico svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ms-card h3{font-size:16px;font-weight:700;margin-bottom:6px}
.ms-card p{font-size:14px;color:var(--tm)}

.ms-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.ms-gallery{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.ms-gallery{grid-template-columns:1fr}}
.ms-gitem{border-radius:var(--rl);overflow:hidden;border:1px solid var(--bdr);background:var(--w)}
.ms-gitem-img{aspect-ratio:4/3;background:var(--gp);overflow:hidden}
.ms-gitem-img img{width:100%;height:100%;object-fit:cover}
.ms-gitem-body{padding:15px}
.ms-gitem h3{font-size:15px;font-weight:700;margin-bottom:5px}
.ms-gitem p{font-size:13px;color:var(--tm)}

.ms-prods{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1000px){.ms-prods{grid-template-columns:repeat(3,1fr)}}
@media(max-width:680px){.ms-prods{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.ms-prods{grid-template-columns:1fr}}
.ms-prod{border:1px solid var(--bdr);border-radius:var(--rl);overflow:hidden;background:var(--w);cursor:pointer;transition:transform .15s,box-shadow .15s}
.ms-prod:hover{transform:translateY(-3px);box-shadow:var(--shm)}
.ms-prod-img{aspect-ratio:1;background:var(--gp);overflow:hidden;display:grid;place-items:center}
.ms-prod-img img{width:100%;height:100%;object-fit:cover}
.ms-prod-img .ph{color:var(--gb)}.ms-prod-img .ph svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.3}
.ms-prod-body{padding:12px}
.ms-prod-title{font-size:13px;font-weight:600;line-height:1.35;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ms-prod-price{font-size:15px;font-weight:800;color:var(--acc)}

.ms-revs{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:680px){.ms-revs{grid-template-columns:1fr}}
.ms-rev{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rl);padding:20px}
.ms-rev-stars{color:#E8A52A;margin-bottom:9px;font-size:14px;letter-spacing:2px}
.ms-rev-text{font-size:14px;color:var(--t);line-height:1.65;margin-bottom:12px}
.ms-rev-author{font-size:13px;font-weight:700;color:var(--tm)}
.ms-rev-form{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rl);padding:18px;margin-bottom:16px}
.ms-rev-form-t{font-size:15px;font-weight:700;margin-bottom:10px}
.rev-stars-input{display:flex;gap:4px;margin-bottom:11px}
.rev-star{font-size:26px;color:var(--bdr);cursor:pointer;transition:color .12s,transform .1s;line-height:1}
.rev-star:hover{transform:scale(1.15)}
.rev-star.on{color:#E8A52A}
.ms-rev-ta{width:100%;border:1.5px solid var(--bdr);border-radius:var(--rm);padding:11px 13px;font-family:inherit;font-size:14px;background:var(--gp);color:var(--t);outline:none;resize:vertical;min-height:70px;transition:border-color .15s;margin-bottom:11px}
.ms-rev-ta:focus{border-color:var(--acc)}
.ms-rev-send{background:var(--acc);color:#fff;border:none;padding:11px 22px;border-radius:var(--rm);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s}
.ms-rev-send:hover{background:var(--acc-d)}
.ms-rev-del{float:right;background:none;border:none;color:var(--gmt);cursor:pointer;font-size:13px;padding:0 4px;transition:color .12s}
.ms-rev-del:hover{color:var(--red)}

.ms-cont{display:grid;grid-template-columns:1fr 1.2fr;gap:28px;align-items:start}
@media(max-width:760px){.ms-cont{grid-template-columns:1fr}}
.ms-cont-item{display:flex;gap:12px;margin-bottom:16px;align-items:flex-start}
.ms-cont-item svg{width:19px;height:19px;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;flex-shrink:0;margin-top:2px}
.ms-cont-item .cl{font-size:12px;color:var(--tm);margin-bottom:2px}
.ms-cont-item .cv{font-size:15px;font-weight:600}
.ms-map{border-radius:var(--rl);overflow:hidden;border:1px solid var(--bdr);min-height:260px;background:var(--gp)}
.ms-map iframe{width:100%;height:100%;min-height:260px;border:0;display:block}

.ms-lead{max-width:520px;margin:0 auto}
.ms-lead .sub{font-size:14px;color:var(--tm);margin-bottom:18px;text-align:center}
.ms-lead-form{display:flex;flex-direction:column;gap:11px}
.ms-lead-form input,.ms-lead-form textarea{width:100%;border:1.5px solid var(--bdr);border-radius:var(--rm);padding:12px 14px;font-family:inherit;font-size:14px;background:var(--w);color:var(--t);outline:none;transition:border-color .15s}
.ms-lead-form input:focus,.ms-lead-form textarea:focus{border-color:var(--acc)}
.ms-lead-form textarea{resize:vertical;min-height:90px}
.ms-lead-btn{background:var(--acc);color:#fff;border:none;padding:13px;border-radius:var(--rm);font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;transition:background .15s}
.ms-lead-btn:hover{background:var(--acc-d)}
.ms-lead-consent{font-size:11px;color:var(--tm);display:flex;gap:7px;align-items:flex-start}
.ms-lead-consent input{width:auto;margin-top:2px}
.ms-lead-ok{display:none;background:var(--acc-l);color:var(--acc-d);padding:14px;border-radius:var(--rm);font-weight:700;text-align:center}

.ms-news{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.ms-news{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.ms-news{grid-template-columns:1fr}}
.ms-nitem{border:1px solid var(--bdr);border-radius:var(--rl);overflow:hidden;background:var(--w)}
.ms-nitem-img{aspect-ratio:16/9;background:var(--gp);overflow:hidden}
.ms-nitem-img img{width:100%;height:100%;object-fit:cover}
.ms-nitem-body{padding:16px}
.ms-nitem-date{font-size:11px;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.ms-nitem h3{font-size:15px;font-weight:700;margin-bottom:6px;line-height:1.35}
.ms-nitem p{font-size:13px;color:var(--tm);line-height:1.55}

.ms-headwrap{display:flex;flex-direction:column;border-radius:var(--rxl);overflow:hidden;box-shadow:var(--sh)}
.ms-header{display:flex;align-items:center;gap:14px;padding:16px 20px;background:var(--w);border:1px solid var(--bdr);border-bottom:3px solid var(--acc)}
.ms-headwrap .ms-header{border-radius:0;border:none;border-bottom:3px solid var(--acc)}
.ms-headwrap.sticky .ms-header{border-bottom:none}
.ms-header.dark{background:var(--acc);border-color:var(--acc)}
.ms-header-logo{width:48px;height:48px;border-radius:var(--rm);background:var(--gp);display:grid;place-items:center;overflow:hidden;flex-shrink:0;border:1px solid var(--bdr)}
.ms-header.dark .ms-header-logo{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.25)}
.ms-header-logo img{width:100%;height:100%;object-fit:cover}
.ms-header-logo span{font-size:20px;font-weight:800;color:var(--acc)}
.ms-header.dark .ms-header-logo span{color:#fff}
.ms-header-name{font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--t);display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.ms-verify-badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#1E8AE6;color:#fff;flex-shrink:0}
.ms-verify-badge svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ms-header.dark .ms-header-name{color:#fff}
.ms-header-tag{font-size:13px;color:var(--gmt);margin-top:2px}
.ms-header.dark .ms-header-tag{color:rgba(255,255,255,.85)}
.ms-header-rating{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:14px;font-weight:800;color:var(--t);cursor:pointer;transition:opacity .15s}
.ms-header-rating:hover{opacity:.7}
.ms-header.dark .ms-header-rating{color:#fff}
.ms-hr-star{color:#E8A52A;font-size:15px}
.ms-hr-cnt{font-weight:600;font-size:12px;color:var(--gmt)}
.ms-header.dark .ms-hr-cnt{color:rgba(255,255,255,.8)}
.ms-navbar{display:flex;gap:4px;flex-wrap:wrap;background:var(--w);border:1px solid var(--bdr);border-top:none;padding:8px}
.ms-headwrap .ms-navbar{border-radius:0;border-top:1px solid var(--bdr)}
.ms-navtab{padding:9px 18px;border-radius:var(--rm);font-size:14px;font-weight:700;color:var(--tm);background:transparent;border:none;font-family:inherit;cursor:pointer;transition:all .15s}
.ms-navtab:hover{background:var(--acc-l);color:var(--acc)}
.ms-navtab.active{background:var(--acc);color:#fff}
#msPage{display:flex;flex-direction:column;gap:14px;margin-top:14px}
@media(max-width:600px){.ms-header{padding:13px 15px}.ms-header-name{font-size:16px}.ms-header-logo{width:40px;height:40px}}

.rcard{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:14px;box-shadow:var(--sh)}
.rcard-h{font-size:11px;font-weight:700;color:var(--gmt);letter-spacing:.06em;text-transform:uppercase;margin-bottom:11px}
.r-shop-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.r-shop-logo{width:48px;height:48px;border-radius:var(--rm);background:var(--acc);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:800;flex-shrink:0;overflow:hidden}
.r-shop-logo img{width:100%;height:100%;object-fit:cover}
.r-shop-name{font-size:15px;font-weight:800}
.r-shop-tag{font-size:12px;color:var(--gmt);margin-top:2px}
.rstat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bdr);font-size:12px}
.rstat:last-child{border-bottom:none}
.rstat .l{color:var(--gmt)}.rstat .v{font-weight:700}
.r-btn{display:block;width:100%;text-align:center;padding:10px;border-radius:var(--rm);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;border:none;margin-top:10px;transition:all .15s;text-decoration:none}
.r-btn-pri{background:var(--acc);color:#fff}.r-btn-pri:hover{background:var(--acc-d)}
.r-btn-sec{background:var(--gp);color:var(--tm);border:1.5px solid var(--bdr)}.r-btn-sec:hover{background:var(--gl);color:var(--g)}

.state{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);box-shadow:var(--sh);min-height:50vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;color:var(--gmt)}
.state svg{width:46px;height:46px;fill:none;stroke:var(--gb);stroke-width:1.3;margin-bottom:16px}
.state h2{font-size:19px;font-weight:800;color:var(--t);margin-bottom:8px}
.state p{font-size:14px}
.sk{background:var(--bg);border-radius:var(--r);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
/* EM-TOAST-UNIFY: локальный .toast удалён */
</style>
<link rel="stylesheet" href="/assets/dark-theme.css">
</head>
<body>
<div class="shell">
<a class="logo-cell" href="/"><img src="/assets/lastop-group-logo.svg" alt="LASTOP GROUP" onerror="this.style.display='none'"></a>
<header class="topbar"></header>
<nav class="nav"></nav>
<main class="main" id="msMain"></main>
<aside class="right" id="msRight"></aside>
</div>

<script>
const API='/api';
const ACCENTS={green:'#1E8A4C',blue:'#2479C8',navy:'#1E3A5F',teal:'#0E8A8A',purple:'#7C5CC4',orange:'#D8741E',red:'#C8392E',graphite:'#3A4654'};
function darken(hex,f){f=f||.78;const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=Math.round(r*f);g=Math.round(g*f);b=Math.round(b*f);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function letter(s){return((s||'?').trim()[0]||'?').toUpperCase();}
/* EM-TOAST-UNIFY: глобальная window.showToast */

const ICONS={
  truck:'<path d="M1 3h15v13H1zM16 8h4l3 3v5h-7"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>',
  warehouse:'<path d="M3 21V8l9-5 9 5v13"/><path d="M3 21h18M7 21v-7h10v7"/>',
  shield:'<path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20a15 15 0 0 1 0-20"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>',
  team:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  check:'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/>',
  star:'<path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/>',
  phone:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
  ship:'<path d="M2 20a6 6 0 0 0 10 0 6 6 0 0 0 10 0M4 18l-2-7h20l-2 7M12 11V4M8 7h8"/>',
  plane:'<path d="M17.8 19.2L16 11l3.5-3.5a2.12 2.12 0 0 0-3-3L13 8 4.8 6.2a1 1 0 0 0-.9 1.7L9 11l-2 3H4l-1 2 4 1 1 4 2-1v-3l3-2 3.1 5.1a1 1 0 0 0 1.7-.9z"/>',
  box:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/>',
  handshake:'<path d="M11 17l2 2a1 1 0 0 0 3-3M2 9l4-4 6 6M7 11l4 4M16 12l3-3 3 3-6 6-2-2"/>',
  bolt:'<path d="M13 2L3 14h9l-1 8 10-12h-9z"/>',
  pin:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>'
};
function icon(key){return ICONS[key]||ICONS.check;}

let SITE=null,ACC='#1E8A4C',MY_PID=null;

function getSlug(){
  const m=location.pathname.match(/\/shop\/([^\/]+)/);
  if(m)return decodeURIComponent(m[1]);
  return new URLSearchParams(location.search).get('slug')||'';
}

window.addEventListener('DOMContentLoaded',()=>{
  try{const me=JSON.parse(localStorage.getItem('user')||'{}');MY_PID=me.public_id||null;}catch(e){}
  load();
});

async function load(){
  const slug=getSlug();
  if(!slug){renderState('Магазин не найден','Не указан адрес магазина');return;}
  try{
    const r=await fetch(API+'/emarket/site/'+encodeURIComponent(slug),{headers:{Authorization:'Bearer '+(localStorage.getItem('token')||'')}});
    if(!r.ok)throw new Error('not found');
    const d=await r.json();
    SITE=d;
    render(d);
  }catch(e){
    renderState('Магазин недоступен','Возможно, он ещё не опубликован или был снят с публикации');
  }
}

function renderState(title,text){
  document.getElementById('msMain').innerHTML='<div class="state"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><h2>'+esc(title)+'</h2><p>'+esc(text)+'</p><a class="r-btn r-btn-sec" href="/emarket" style="max-width:240px;margin-top:18px">← Вернуться в E-market</a></div>';
  document.getElementById('msRight').innerHTML='';
}

function blockTitle(b){
  const c=b.content||{};
  const NAMES={hero:'Главная',about:'О компании',services:'Услуги',portfolio:'Портфолио',products:'Товары',reviews:'Отзывы',contacts:'Контакты',lead_form:'Заявка',news:'Новости'};
  return c.title||NAMES[b.type]||'Раздел';
}

let PAGES=[], CUR_SHOP=null;

function shopHeader(shop){
  const logo=shop.site_logo_url?'<img src="'+esc(shop.site_logo_url)+'" alt="">':(shop.logo_url?'<img src="'+esc(shop.logo_url)+'" alt="">':'<span>'+esc(letter(shop.name))+'</span>');
  const dark=shop.header_theme==='dark';
  let rating='';
  if(shop.rating>0){
    const rc=shop.reviews_count||0;
    rating='<div class="ms-header-rating" onclick="goToReviews()" title="К отзывам"><span class="ms-hr-star">★</span> '+Number(shop.rating).toFixed(1)+(rc?' <span class="ms-hr-cnt">· '+rc+' '+plural(rc,'отзыв','отзыва','отзывов')+'</span>':'')+'</div>';
  }
  const verify=shop.is_verified?'<span class="ms-verify-badge" title="Проверенный продавец"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>':'';
  return '<div class="ms-header'+(dark?' dark':'')+'"><div class="ms-header-logo">'+logo+'</div><div class="ms-header-info"><div class="ms-header-name">'+esc(shop.name)+verify+'</div>'+(shop.tagline?'<div class="ms-header-tag">'+esc(shop.tagline)+'</div>':'')+rating+'</div></div>';
}
function plural(n,one,few,many){const v=n%10,h=n%100;if(h>=11&&h<=19)return many;if(v===1)return one;if(v>=2&&v<=4)return few;return many;}
function goToReviews(){
  const el=document.querySelector('[data-reviews-block]');
  if(el){el.scrollIntoView({behavior:'smooth',block:'start'});return;}
  // если отзывы на вкладке — переключить на неё
  const idx=PAGES.findIndex(p=>p.blocks.some(b=>b.type==='reviews'));
  if(idx>=0)switchTab(idx);
}

function blockHasContent(b){
  const c=b.content||{};
  switch(b.type){
    case 'hero':return !!(c.title||c.subtitle||c.bg_image||c.cta_text);
    case 'about':return !!(c.text||c.image||(c.stats&&c.stats.length));
    case 'services':return !!(c.items&&c.items.some(x=>x&&(x.title||x.text)));
    case 'portfolio':return !!(c.items&&c.items.some(x=>x&&(x.title||x.text||x.image)));
    case 'reviews':return true; // реальные отзывы из API + форма — всегда
    case 'news':return !!(c.items&&c.items.some(x=>x&&(x.title||x.text||x.image)));
    case 'contacts':return !!(c.address||c.phone||c.email||c.hours||(c.map_lat&&c.map_lng));
    case 'products':return true; // подтягивает товары живьём
    case 'lead_form':return true; // форма всегда осмысленна
    default:return true;
  }
}

function render(d){
  const shop=d.shop||{};
  CUR_SHOP=shop;
  const blocks=(d.config||[]).filter(b=>b&&b.enabled!==false&&blockHasContent(b));
  ACC=ACCENTS[shop.accent_color]||ACCENTS.green;
  document.documentElement.style.setProperty('--acc',ACC);
  document.documentElement.style.setProperty('--acc-d',darken(ACC,.78));
  document.documentElement.style.setProperty('--acc-l',hexA(ACC,.12));
  document.title=shop.name+' — LASTOP GROUP';

  const header=shopHeader(shop);

  if(!blocks.length){
    document.getElementById('msMain').innerHTML=header+'<div class="state"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg><h2>'+esc(shop.name)+'</h2><p>Магазин ещё наполняется</p></div>';
    renderRight(shop);
    return;
  }

  const navBlocks=blocks.filter(b=>b.in_nav);

  // Нет вынесенных блоков → шапка + одностраничный скролл (шапка НЕ липкая)
  if(!navBlocks.length){
    let html='<div class="ms-headwrap">'+header+'</div>';
    blocks.forEach((b,i)=>{html+=renderBlock(b,shop,i);});
    document.getElementById('msMain').innerHTML=html;
    renderRight(shop);
    blocks.forEach((b,i)=>{if(b.type==='products')loadProducts(shop.id,i,(b.content&&b.content.limit)||8);if(b.type==='reviews')loadReviews(shop.id,i);});
    return;
  }

  // Есть вынесенные блоки → шапка + бар навигации под ней + страницы.
  // «Главная» = hero + все невынесенные блоки. Каждый вынесенный = отдельная страница.
  const homeBlocks=blocks.filter(b=>!b.in_nav);
  PAGES=[];
  PAGES.push({label:'Главная',blocks:homeBlocks});
  navBlocks.forEach(b=>PAGES.push({label:blockTitle(b),blocks:[b]}));

  const bar='<div class="ms-navbar">'+PAGES.map((p,pi)=>'<button class="ms-navtab'+(pi===0?' active':'')+'" onclick="switchTab('+pi+')">'+esc(p.label)+'</button>').join('')+'</div>';
  document.getElementById('msMain').innerHTML='<div class="ms-headwrap sticky">'+header+bar+'</div><div id="msPage"></div>';
  switchTab(0);
  renderRight(shop);
}

function switchTab(pi){
  document.querySelectorAll('.ms-navtab').forEach((t,i)=>t.classList.toggle('active',i===pi));
  const page=PAGES[pi];if(!page)return;
  let html='';
  // индекс блока нужен уникальный для products-контейнеров — используем pi*100+j
  page.blocks.forEach((b,j)=>{html+=renderBlock(b,CUR_SHOP,pi*100+j);});
  if(!html)html='<div class="state" style="min-height:30vh"><p>Раздел пуст</p></div>';
  document.getElementById('msPage').innerHTML=html;
  page.blocks.forEach((b,j)=>{if(b.type==='products')loadProducts(CUR_SHOP.id,pi*100+j,(b.content&&b.content.limit)||8);if(b.type==='reviews')loadReviews(CUR_SHOP.id,pi*100+j);});
  document.getElementById('msMain').scrollTop=0;
}

function sec(id,title,inner,soft){
  return '<section class="ms-sec'+(soft?' ms-sec-soft':'')+'"'+(id?' id="'+esc(id)+'"':'')+'>'+(title?'<h2 class="ms-title">'+esc(title)+'</h2>':'')+inner+'</section>';
}

function renderBlock(b,shop,i){
  const c=b.content||{};
  const id=b.anchor||('block-'+i);
  switch(b.type){
    case 'hero':{
      const style=c.bg_image?' style="background-image:url('+encodeURI(c.bg_image)+')"':'';
      const cta=c.cta_text?'<a class="ms-hero-cta" href="'+esc(c.cta_link||'#')+'">'+esc(c.cta_text)+'</a>':'';
      return '<section class="ms-hero'+(c.bg_image?' has-bg':' no-bg')+'"'+style+' id="'+esc(id)+'"><div class="ms-hero-in"><h1>'+esc(c.title||shop.name)+'</h1>'+(c.subtitle?'<p>'+esc(c.subtitle)+'</p>':'')+cta+'</div></section>';
    }
    case 'about':{
      const stats=(c.stats||[]).slice(0,4).map(s=>'<div class="ms-stat"><div class="sn">'+esc(s.value)+'</div><div class="sl">'+esc(s.label)+'</div></div>').join('');
      const inner='<div class="ms-about'+(c.image?'':' no-img')+'"><div><div class="ms-about-text">'+esc(c.text)+'</div>'+(stats?'<div class="ms-stats">'+stats+'</div>':'')+'</div>'+(c.image?'<div class="ms-about-img"><img src="'+esc(c.image)+'" alt=""></div>':'')+'</div>';
      return sec(id,c.title||'О компании',inner);
    }
    case 'services':{
      const items=(c.items||[]).slice(0,12).map(s=>'<div class="ms-card"><div class="ms-card-ico"><svg viewBox="0 0 24 24">'+icon(s.icon)+'</svg></div><h3>'+esc(s.title)+'</h3><p>'+esc(s.text)+'</p></div>').join('');
      return sec(id,c.title||'Услуги','<div class="ms-cards">'+items+'</div>',true);
    }
    case 'portfolio':{
      const items=(c.items||[]).slice(0,30).map(s=>'<div class="ms-gitem">'+(s.image?'<div class="ms-gitem-img"><img src="'+esc(s.image)+'" alt=""></div>':'')+'<div class="ms-gitem-body"><h3>'+esc(s.title)+'</h3>'+(s.text?'<p>'+esc(s.text)+'</p>':'')+'</div></div>').join('');
      return sec(id,c.title||'Портфолио','<div class="ms-gallery">'+items+'</div>');
    }
    case 'products':
      return sec(id,c.title||'Товары и услуги','<div class="ms-prods" id="msprods-'+i+'"><div class="sk" style="height:200px"></div><div class="sk" style="height:200px"></div><div class="sk" style="height:200px"></div><div class="sk" style="height:200px"></div></div>',true);
    case 'reviews':{
      return sec(id,c.title||'Отзывы','<div data-reviews-block id="msrev-'+i+'"><div class="sk" style="height:80px"></div></div>',false);
    }
    case 'contacts':{
      const items=[
        c.address?'<div class="ms-cont-item"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><div><div class="cl">Адрес</div><div class="cv">'+esc(c.address)+'</div></div></div>':'',
        c.phone?'<div class="ms-cont-item"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg><div><div class="cl">Телефон</div><div class="cv"><a href="tel:'+esc(c.phone)+'" style="color:inherit;text-decoration:none">'+esc(c.phone)+'</a></div></div></div>':'',
        c.email?'<div class="ms-cont-item"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg><div><div class="cl">Email</div><div class="cv"><a href="mailto:'+esc(c.email)+'" style="color:inherit;text-decoration:none">'+esc(c.email)+'</a></div></div></div>':'',
        c.hours?'<div class="ms-cont-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><div><div class="cl">Часы работы</div><div class="cv">'+esc(c.hours)+'</div></div></div>':''
      ].filter(Boolean).join('');
      const map=(c.map_lat&&c.map_lng)?'<div class="ms-map"><iframe loading="lazy" src="https://yandex.ru/map-widget/v1/?ll='+encodeURIComponent(c.map_lng+','+c.map_lat)+'&z=16&pt='+encodeURIComponent(c.map_lng+','+c.map_lat)+'"></iframe></div>':'';
      return sec(id,c.title||'Контакты','<div class="ms-cont"><div>'+items+'</div>'+map+'</div>');
    }
    case 'lead_form':
      return sec(id,c.title||'Свяжитесь с нами','<div class="ms-lead">'+(c.subtitle?'<p class="sub">'+esc(c.subtitle)+'</p>':'')+'<form class="ms-lead-form" onsubmit="return submitLead(event)"><input required name="name" placeholder="Ваше имя"><input required name="contact" placeholder="Телефон или email"><textarea name="message" placeholder="Сообщение"></textarea><label class="ms-lead-consent"><input type="checkbox" required>Согласен на обработку персональных данных</label><button class="ms-lead-btn" type="submit">'+esc(c.button_text||'Отправить')+'</button></form><div class="ms-lead-ok" id="leadOk">Спасибо! Ваше сообщение отправлено.</div></div>',true);
    case 'news':{
      const items=(c.items||[]).slice(0,20).map(s=>'<div class="ms-nitem">'+(s.image?'<div class="ms-nitem-img"><img src="'+esc(s.image)+'" alt=""></div>':'')+'<div class="ms-nitem-body">'+(s.date?'<div class="ms-nitem-date">'+esc(s.date)+'</div>':'')+'<h3>'+esc(s.title)+'</h3>'+(s.text?'<p>'+esc(s.text)+'</p>':'')+'</div></div>').join('');
      return sec(id,c.title||'Новости','<div class="ms-news">'+items+'</div>');
    }
    default:return '';
  }
}

function renderRight(shop){
  const box=document.getElementById('msRight');
  const logo=shop.site_logo_url?'<img src="'+esc(shop.site_logo_url)+'" alt="">':(shop.logo_url?'<img src="'+esc(shop.logo_url)+'" alt="">':esc(letter(shop.name)));
  const isOwner=MY_PID&&shop.owner_public_id&&MY_PID===shop.owner_public_id;
  box.innerHTML=
    '<div class="rcard"><div class="r-shop-head"><div class="r-shop-logo">'+logo+'</div><div><div class="r-shop-name">'+esc(shop.name)+'</div>'+(shop.tagline?'<div class="r-shop-tag">'+esc(shop.tagline)+'</div>':'')+'</div></div>'
      +(shop.rating>0?'<div class="rstat"><span class="l">Рейтинг</span><span class="v">★ '+Number(shop.rating).toFixed(1)+'</span></div>':'')
      +(shop.region?'<div class="rstat"><span class="l">Регион</span><span class="v">'+esc(shop.region)+'</span></div>':'')
      +(shop.direction?'<div class="rstat"><span class="l">Направление</span><span class="v">'+esc(shop.direction)+'</span></div>':'')
      +(shop.contact_phone?'<a class="r-btn r-btn-pri" href="tel:'+esc(shop.contact_phone)+'">Позвонить</a>':'')
      +'<a class="r-btn r-btn-sec" href="/emarket">← В E-market</a>'
    +'</div>'
    +(isOwner?'<div class="rcard"><div class="rcard-h">Управление</div><a class="r-btn r-btn-pri" href="/emarket-cabinet?id='+shop.id+'">Кабинет продавца</a><a class="r-btn" href="/emarket-builder?id='+shop.id+'" style="margin-top:8px">Редактировать магазин</a></div>':'');
}

async function loadProducts(shopId,blockIdx,limit){
  try{
    const r=await fetch(API+'/emarket/shop-listings?shop_id='+shopId);
    if(!r.ok)throw 0;
    const d=await r.json();
    const items=(d.listings||[]).slice(0,limit||8);
    const box=document.getElementById('msprods-'+blockIdx);
    if(!box)return;
    if(!items.length){box.innerHTML='<div style="color:var(--tm);font-size:14px">Пока нет товаров</div>';return;}
    box.innerHTML=items.map(x=>{
      const img=(Array.isArray(x.photos)&&x.photos.length)?'<img src="'+esc(x.photos[0])+'" alt="">':'<div class="ph"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>';
      const price=(x.price==null||x.price===0)?'Договорная':(Number(x.price).toLocaleString('ru-RU')+' '+(x.currency==='USD'?'$':x.currency==='EUR'?'€':'₽'));
      return '<div class="ms-prod" onclick="location.href=\'/emarket-listing?id='+x.id+'\'"><div class="ms-prod-img">'+img+'</div><div class="ms-prod-body"><div class="ms-prod-title">'+esc(x.title)+'</div><div class="ms-prod-price">'+price+'</div></div></div>';
    }).join('');
  }catch(e){
    const box=document.getElementById('msprods-'+blockIdx);
    if(box)box.innerHTML='<div style="color:var(--tm);font-size:14px">Не удалось загрузить товары</div>';
  }
}

let REV_BLOCK_IDX=null;
async function loadReviews(shopId,blockIdx){
  REV_BLOCK_IDX=blockIdx;
  const box=document.getElementById('msrev-'+blockIdx);
  if(!box)return;
  let reviews=[];
  try{
    const r=await fetch(API+'/emarket/reviews?shop_id='+shopId);
    if(r.ok){const d=await r.json();reviews=d.reviews||[];}
  }catch(e){}
  const isOwner=CUR_SHOP&&MY_PID&&CUR_SHOP.owner_public_id&&MY_PID===CUR_SHOP.owner_public_id;
  const myReview=reviews.find(rv=>rv.author_public_id&&rv.author_public_id===MY_PID);
  let html='';
  // Форма (если залогинен, не владелец)
  if(!isOwner){
    const stars=[1,2,3,4,5].map(n=>'<span class="rev-star" data-n="'+n+'" onclick="setRevStars('+n+')">★</span>').join('');
    html+='<div class="ms-rev-form"><div class="ms-rev-form-t">'+(myReview?'Ваш отзыв':'Оставить отзыв')+'</div>'
      +'<div class="rev-stars-input" id="revStars">'+stars+'</div>'
      +'<textarea class="ms-rev-ta" id="revText" placeholder="Поделитесь впечатлением о магазине…">'+(myReview?esc(myReview.text):'')+'</textarea>'
      +'<button class="ms-rev-send" onclick="submitReview('+shopId+')">'+(myReview?'Обновить отзыв':'Отправить отзыв')+'</button></div>';
  }
  // Список
  if(reviews.length){
    html+='<div class="ms-revs">'+reviews.map(rv=>{
      const st='★'.repeat(Math.max(0,Math.min(5,rv.rating||5)))+'☆'.repeat(5-Math.max(0,Math.min(5,rv.rating||5)));
      const canDel=isOwner||(rv.author_public_id&&rv.author_public_id===MY_PID);
      const del=canDel?'<button class="ms-rev-del" onclick="deleteReview('+rv.id+','+shopId+')" title="Удалить">✕</button>':'';
      return '<div class="ms-rev"><div class="ms-rev-stars">'+st+del+'</div><div class="ms-rev-text">'+esc(rv.text)+'</div><div class="ms-rev-author">'+esc(rv.author_name||'Пользователь')+'</div></div>';
    }).join('')+'</div>';
  }else if(isOwner){
    html+='<div style="color:var(--tm);font-size:14px">Пока нет отзывов. Они появятся, когда покупатели их оставят.</div>';
  }
  box.innerHTML=html;
  if(myReview)setRevStars(myReview.rating);
}
let REV_RATING=0;
function setRevStars(n){
  REV_RATING=n;
  document.querySelectorAll('#revStars .rev-star').forEach(s=>{s.classList.toggle('on',parseInt(s.dataset.n)<=n);});
}
async function submitReview(shopId){
  if(!REV_RATING){showToast('Поставьте оценку','warn');return;}
  const text=(document.getElementById('revText')||{}).value||'';
  try{
    const r=await lastopFetch(API+'/emarket/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({shop_id:shopId,rating:REV_RATING,text:text.trim()})});
    if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'Ошибка');}
    showToast('Спасибо за отзыв!','success');
    loadReviews(shopId,REV_BLOCK_IDX);
  }catch(e){showToast(e.message||'Не удалось отправить отзыв','error');}
}
async function deleteReview(reviewId,shopId){
  const ok=await lastopConfirm({title:'Удалить отзыв?',danger:true,confirmText:'Удалить'});
  if(!ok)return;
  try{
    const r=await lastopFetch(API+'/emarket/reviews?id='+reviewId,{method:'DELETE'});
    if(!r.ok)throw 0;
    showToast('Отзыв удалён','success');
    loadReviews(shopId,REV_BLOCK_IDX);
  }catch(e){showToast('Не удалось удалить','error');}
}

async function submitLead(e){
  e.preventDefault();
  const form=e.target;
  const btn=form.querySelector('.ms-lead-btn');
  const name=(form.querySelector('[name=name]')||{}).value||'';
  const contact=(form.querySelector('[name=contact]')||{}).value||'';
  const message=(form.querySelector('[name=message]')||{}).value||'';
  if(btn){btn.disabled=true;btn.textContent='Отправка…';}
  try{
    const r=await lastopFetch(API+'/emarket/site/'+encodeURIComponent(getSlug())+'/lead',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:name.trim(),contact:contact.trim(),message:message.trim()})
    });
    if(!r.ok)throw 0;
    form.style.display='none';
    document.getElementById('leadOk').style.display='block';
  }catch(err){
    if(btn){btn.disabled=false;btn.textContent='Отправить';}
    showToast('Не удалось отправить заявку, попробуйте позже','error');
  }
  return false;
}
