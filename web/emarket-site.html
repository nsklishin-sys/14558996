<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Загрузка…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --acc:#1E8A4C;--acc-d:#176c3b;--acc-l:#E8F5EE;
  --t:#1A2230;--tm:#5A6675;--bg:#fff;--soft:#F5F7FA;--bdr:#E4E9EF;
  --r:10px;--rm:14px;--rl:20px;--rxl:28px;
  --max:1140px
}
html{scroll-behavior:smooth}
body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--t);font-size:16px;line-height:1.6}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
.sec{padding:64px 0}
.sec-soft{background:var(--soft)}
.sec-title{font-size:30px;font-weight:800;margin-bottom:32px;letter-spacing:-.02em}
@media(max-width:600px){.sec{padding:44px 0}.sec-title{font-size:24px;margin-bottom:22px}.wrap{padding:0 16px}}

/* HEADER */
.site-head{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--bdr)}
.site-head.theme-dark{background:rgba(20,28,40,.92);border-bottom-color:rgba(255,255,255,.1)}
.site-head.theme-dark .sh-name{color:#fff}
.site-head.theme-dark .sh-nav a{color:rgba(255,255,255,.8)}
.site-head.theme-dark .sh-nav a:hover{color:#fff}
.sh-inner{max-width:var(--max);margin:0 auto;padding:0 24px;height:66px;display:flex;align-items:center;gap:20px}
.sh-brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
.sh-logo{height:40px;width:auto;object-fit:contain}
.sh-logo-fallback{width:40px;height:40px;border-radius:11px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:800;flex-shrink:0}
.sh-name{font-size:18px;font-weight:800;letter-spacing:-.01em}
.sh-nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.sh-nav a{padding:8px 14px;border-radius:var(--r);font-size:14px;font-weight:600;color:var(--tm);transition:all .15s}
.sh-nav a:hover{background:var(--acc-l);color:var(--acc)}
.sh-burger{display:none;margin-left:auto;width:42px;height:42px;border-radius:var(--r);border:1px solid var(--bdr);background:none;cursor:pointer;align-items:center;justify-content:center}
.sh-burger svg{width:22px;height:22px;stroke:var(--t);fill:none;stroke-width:2;stroke-linecap:round}
@media(max-width:820px){.sh-nav{display:none;position:absolute;top:66px;left:0;right:0;background:var(--bg);flex-direction:column;padding:8px;border-bottom:1px solid var(--bdr);gap:2px}.sh-nav.open{display:flex}.sh-burger{display:flex}.sh-nav a{padding:12px 14px}}

/* HERO */
.hero{position:relative;padding:96px 0;text-align:center;color:#fff;overflow:hidden;background:var(--acc)}
.hero.has-bg{background-size:cover;background-position:center}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,18,30,.35),rgba(10,18,30,.55));z-index:0}
.hero.no-overlay::before{display:none}
.hero-inner{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 24px}
.hero h1{font-size:46px;font-weight:900;line-height:1.1;letter-spacing:-.03em;margin-bottom:18px}
.hero p{font-size:19px;opacity:.94;margin-bottom:30px;font-weight:500}
.hero-cta{display:inline-block;background:#fff;color:var(--acc);padding:15px 36px;border-radius:var(--rm);font-weight:800;font-size:16px;transition:transform .15s,box-shadow .15s;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.hero-cta:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.24)}
@media(max-width:600px){.hero{padding:64px 0}.hero h1{font-size:32px}.hero p{font-size:16px}}

/* ABOUT */
.about-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:44px;align-items:center}
.about-grid.no-img{grid-template-columns:1fr}
.about-text{font-size:17px;color:var(--tm);line-height:1.8;white-space:pre-wrap}
.about-img img{border-radius:var(--rl);width:100%;object-fit:cover}
.stats{display:flex;gap:36px;margin-top:30px;flex-wrap:wrap}
.stat .sn{font-size:38px;font-weight:900;color:var(--acc);line-height:1}
.stat .sl{font-size:14px;color:var(--tm);margin-top:4px}
@media(max-width:800px){.about-grid{grid-template-columns:1fr;gap:24px}}

/* SERVICES */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.cards{grid-template-columns:1fr}}
.card{background:var(--bg);border:1px solid var(--bdr);border-radius:var(--rl);padding:28px;transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(20,30,50,.09)}
.card-ico{width:52px;height:52px;border-radius:14px;background:var(--acc-l);color:var(--acc);display:grid;place-items:center;margin-bottom:16px}
.card-ico svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:18px;font-weight:700;margin-bottom:8px}
.card p{font-size:15px;color:var(--tm)}

/* PORTFOLIO */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media(max-width:900px){.gallery{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.gallery{grid-template-columns:1fr}}
.gitem{border-radius:var(--rl);overflow:hidden;border:1px solid var(--bdr);background:var(--bg)}
.gitem-img{aspect-ratio:4/3;background:var(--soft);overflow:hidden}
.gitem-img img{width:100%;height:100%;object-fit:cover}
.gitem-body{padding:18px}
.gitem h3{font-size:17px;font-weight:700;margin-bottom:6px}
.gitem p{font-size:14px;color:var(--tm)}

/* PRODUCTS */
.prods{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media(max-width:1000px){.prods{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.prods{grid-template-columns:repeat(2,1fr)}}
@media(max-width:460px){.prods{grid-template-columns:1fr}}
.prod{border:1px solid var(--bdr);border-radius:var(--rl);overflow:hidden;background:var(--bg);cursor:pointer;transition:transform .15s,box-shadow .15s}
.prod:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(20,30,50,.1)}
.prod-img{aspect-ratio:1;background:var(--soft);overflow:hidden;display:grid;place-items:center}
.prod-img img{width:100%;height:100%;object-fit:cover}
.prod-img .ph{color:var(--bdr)}.prod-img .ph svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:1.3}
.prod-body{padding:14px}
.prod-title{font-size:14px;font-weight:600;line-height:1.35;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod-price{font-size:16px;font-weight:800;color:var(--acc)}

/* REVIEWS */
.revs{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
@media(max-width:700px){.revs{grid-template-columns:1fr}}
.rev{background:var(--bg);border:1px solid var(--bdr);border-radius:var(--rl);padding:24px}
.rev-stars{color:#E8A52A;margin-bottom:10px;font-size:15px;letter-spacing:2px}
.rev-text{font-size:15px;color:var(--t);line-height:1.7;margin-bottom:14px}
.rev-author{font-size:14px;font-weight:700;color:var(--tm)}

/* CONTACTS */
.cont-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:36px;align-items:start}
@media(max-width:800px){.cont-grid{grid-template-columns:1fr}}
.cont-item{display:flex;gap:13px;margin-bottom:20px;align-items:flex-start}
.cont-item svg{width:21px;height:21px;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;flex-shrink:0;margin-top:2px}
.cont-item .cl{font-size:13px;color:var(--tm);margin-bottom:2px}
.cont-item .cv{font-size:16px;font-weight:600}
.cont-map{border-radius:var(--rl);overflow:hidden;border:1px solid var(--bdr);min-height:300px;background:var(--soft)}
.cont-map iframe{width:100%;height:100%;min-height:300px;border:0;display:block}

/* LEAD FORM */
.lead{max-width:560px;margin:0 auto;text-align:center}
.lead p.sub{font-size:16px;color:var(--tm);margin-bottom:26px;margin-top:-18px}
.lead-form{display:flex;flex-direction:column;gap:13px;text-align:left}
.lead-form input,.lead-form textarea{width:100%;border:1.5px solid var(--bdr);border-radius:var(--rm);padding:14px 16px;font-family:inherit;font-size:15px;background:var(--bg);color:var(--t);outline:none;transition:border-color .15s}
.lead-form input:focus,.lead-form textarea:focus{border-color:var(--acc)}
.lead-form textarea{resize:vertical;min-height:110px}
.lead-btn{background:var(--acc);color:#fff;border:none;padding:15px;border-radius:var(--rm);font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;transition:background .15s}
.lead-btn:hover{background:var(--acc-d)}
.lead-ok{display:none;background:var(--acc-l);color:var(--acc-d);padding:16px;border-radius:var(--rm);font-weight:700;text-align:center}
.lead-consent{font-size:12px;color:var(--tm);margin-top:4px;display:flex;gap:8px;align-items:flex-start}
.lead-consent input{width:auto;margin-top:3px}

/* NEWS */
.news{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media(max-width:900px){.news{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.news{grid-template-columns:1fr}}
.nitem{border:1px solid var(--bdr);border-radius:var(--rl);overflow:hidden;background:var(--bg)}
.nitem-img{aspect-ratio:16/9;background:var(--soft);overflow:hidden}
.nitem-img img{width:100%;height:100%;object-fit:cover}
.nitem-body{padding:20px}
.nitem-date{font-size:12px;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.nitem h3{font-size:17px;font-weight:700;margin-bottom:8px;line-height:1.35}
.nitem p{font-size:14px;color:var(--tm);line-height:1.6}

/* FOOTER (white-label, без LASTOP) */
.site-foot{background:#0F1722;color:rgba(255,255,255,.6);padding:40px 0;text-align:center}
.site-foot .fname{font-size:18px;font-weight:800;color:#fff;margin-bottom:8px}
.site-foot .fcontacts{font-size:14px;margin-bottom:14px}
.site-foot .fcontacts a{color:rgba(255,255,255,.8)}
.site-foot .fcopy{font-size:12px;opacity:.6}

/* STATES */
.state{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;color:var(--tm)}
.state svg{width:54px;height:54px;fill:none;stroke:var(--bdr);stroke-width:1.3;margin-bottom:18px}
.state h2{font-size:22px;font-weight:800;color:var(--t);margin-bottom:8px}
.state p{font-size:15px}
.sk{background:var(--soft);border-radius:var(--r);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--t);color:#fff;padding:13px 24px;border-radius:var(--rm);font-size:14px;font-weight:600;z-index:300;opacity:0;transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app"><div class="state"><div class="sk" style="width:200px;height:24px;margin-bottom:14px"></div><div class="sk" style="width:300px;height:16px"></div></div></div>
<div class="toast" id="toast"></div>

<script>
const API='/api';
const ACCENTS={green:'#1E8A4C',blue:'#2479C8',navy:'#1E3A5F',teal:'#0E8A8A',purple:'#7C5CC4',orange:'#D8741E',red:'#C8392E',graphite:'#3A4654'};
function darken(hex,f){f=f||.78;const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=Math.round(r*f);g=Math.round(g*f);b=Math.round(b*f);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function letter(s){return((s||'?').trim()[0]||'?').toUpperCase();}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}

/* набор иконок для services (key → svg path) */
const ICONS={
  truck:'<path d="M1 3h15v13H1zM16 8h4l3 3v5h-7"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>',
  warehouse:'<path d="M3 21V8l9-5 9 5v13"/><path d="M3 21h18M7 21v-7h10v7"/>',
  shield:'<path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20a15 15 0 0 1 0-20"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>',
  team:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  check:'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/>',
  star:'<path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/>',
  phone:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
  ship:'<path d="M2 20a6 6 0 0 0 10 0 6 6 0 0 0 10 0M4 18l-2-7h20l-2 7M12 11V4M8 7h8"/>',
  plane:'<path d="M17.8 19.2L16 11l3.5-3.5a2.12 2.12 0 0 0-3-3L13 8 4.8 6.2a1 1 0 0 0-.9 1.7L9 11l-2 3H4l-1 2 4 1 1 4 2-1v-3l3-2 3.1 5.1a1 1 0 0 0 1.7-.9z"/>',
  box:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/>',
  handshake:'<path d="M11 17l2 2a1 1 0 0 0 3-3M2 9l4-4 6 6M7 11l4 4M16 12l3-3 3 3-6 6-2-2"/>',
  bolt:'<path d="M13 2L3 14h9l-1 8 10-12h-9z"/>',
  pin:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>'
};
function icon(key){return ICONS[key]||ICONS.check;}

let SITE=null,ACC='#1E8A4C';

function getSlug(){
  // путь /c/{slug}  ИЛИ  ?slug=
  const m=location.pathname.match(/\/c\/([^\/]+)/);
  if(m)return decodeURIComponent(m[1]);
  return new URLSearchParams(location.search).get('slug')||'';
}

window.addEventListener('DOMContentLoaded',load);

async function load(){
  const slug=getSlug();
  if(!slug){renderState('Сайт не найден','Не указан адрес магазина');return;}
  try{
    const r=await fetch(API+'/emarket/site/'+encodeURIComponent(slug));
    if(!r.ok)throw new Error('not found');
    const d=await r.json();
    SITE=d;
    render(d);
  }catch(e){
    renderState('Сайт недоступен','Возможно, он ещё не опубликован или был снят с публикации');
  }
}

function renderState(title,text){
  document.getElementById('app').innerHTML='<div class="state"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><h2>'+esc(title)+'</h2><p>'+esc(text)+'</p></div>';
}

function render(d){
  const shop=d.shop||{};
  const blocks=(d.config||[]).filter(b=>b&&b.enabled!==false);
  ACC=ACCENTS[shop.accent_color]||ACCENTS.green;
  document.documentElement.style.setProperty('--acc',ACC);
  document.documentElement.style.setProperty('--acc-d',darken(ACC,.78));
  document.documentElement.style.setProperty('--acc-l',darken(ACC,1)+'18');
  // acc-l как полупрозрачный акцент
  document.documentElement.style.setProperty('--acc-l',hexA(ACC,.12));
  document.title=shop.name+(shop.tagline?' — '+shop.tagline:'');

  // anchors для навигации
  const navItems=blocks.filter(b=>b.anchor&&b.section_title).map(b=>({a:b.anchor,t:b.section_title}));
  const navHTML=navItems.length?'<nav class="sh-nav" id="shNav">'+navItems.map(n=>'<a href="#'+esc(n.a)+'" onclick="closeNav()">'+esc(n.t)+'</a>').join('')+'</nav><button class="sh-burger" onclick="toggleNav()"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>':'';

  const logoHTML=shop.site_logo_url?'<img class="sh-logo" src="'+esc(shop.site_logo_url)+'" alt="'+esc(shop.name)+'">':(shop.logo_url?'<img class="sh-logo" src="'+esc(shop.logo_url)+'" alt="'+esc(shop.name)+'">':'<div class="sh-logo-fallback">'+esc(letter(shop.name))+'</div>');

  let html='<header class="site-head'+(shop.header_theme==='dark'?' theme-dark':'')+'"><div class="sh-inner"><a class="sh-brand" href="#top"><span class="sh-logo-box">'+logoHTML+'</span><span class="sh-name">'+esc(shop.name)+'</span></a>'+navHTML+'</div></header><div id="top"></div>';

  blocks.forEach((b,i)=>{html+=renderBlock(b,shop,i);});

  // футер white-label
  html+='<footer class="site-foot"><div class="wrap"><div class="fname">'+esc(shop.name)+'</div>'+
    ((shop.contact_phone||shop.contact_email)?'<div class="fcontacts">'+[shop.contact_phone?'<a href="tel:'+esc(shop.contact_phone)+'">'+esc(shop.contact_phone)+'</a>':'',shop.contact_email?'<a href="mailto:'+esc(shop.contact_email)+'">'+esc(shop.contact_email)+'</a>':''].filter(Boolean).join(' · ')+'</div>':'')+
    '<div class="fcopy">© '+new Date().getFullYear()+' '+esc(shop.name)+'</div></div></footer>';

  document.getElementById('app').innerHTML=html;

  // дозагрузка товаров для products-блоков
  blocks.forEach((b,i)=>{if(b.type==='products'){loadProducts(shop.id,i,(b.content&&b.content.limit)||8);}});
}

function hexA(hex,a){const n=parseInt(hex.slice(1),16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';}

function sec(id,title,inner,soft){
  return '<section class="sec'+(soft?' sec-soft':'')+'"'+(id?' id="'+esc(id)+'"':'')+'><div class="wrap">'+(title?'<h2 class="sec-title">'+esc(title)+'</h2>':'')+inner+'</div></section>';
}

function renderBlock(b,shop,i){
  const c=b.content||{};
  const id=b.anchor||('block-'+i);
  switch(b.type){
    case 'hero':{
      const style=c.bg_image?' style="background-image:url('+encodeURI(c.bg_image)+')"':'';
      const cta=c.cta_text?'<a class="hero-cta" href="'+esc(c.cta_link||'#')+'">'+esc(c.cta_text)+'</a>':'';
      return '<section class="hero'+(c.bg_image?' has-bg':'')+'"'+style+' id="'+esc(id)+'"><div class="hero-inner"><h1>'+esc(c.title||shop.name)+'</h1>'+(c.subtitle?'<p>'+esc(c.subtitle)+'</p>':'')+cta+'</div></section>';
    }
    case 'about':{
      const stats=(c.stats||[]).slice(0,4).map(s=>'<div class="stat"><div class="sn">'+esc(s.value)+'</div><div class="sl">'+esc(s.label)+'</div></div>').join('');
      const inner='<div class="about-grid'+(c.image?'':' no-img')+'"><div><div class="about-text">'+esc(c.text)+'</div>'+(stats?'<div class="stats">'+stats+'</div>':'')+'</div>'+(c.image?'<div class="about-img"><img src="'+esc(c.image)+'" alt=""></div>':'')+'</div>';
      return sec(id,c.title||'О компании',inner);
    }
    case 'services':{
      const items=(c.items||[]).slice(0,12).map(s=>'<div class="card"><div class="card-ico"><svg viewBox="0 0 24 24">'+icon(s.icon)+'</svg></div><h3>'+esc(s.title)+'</h3><p>'+esc(s.text)+'</p></div>').join('');
      return sec(id,c.title||'Услуги','<div class="cards">'+items+'</div>',true);
    }
    case 'portfolio':{
      const items=(c.items||[]).slice(0,30).map(s=>'<div class="gitem">'+(s.image?'<div class="gitem-img"><img src="'+esc(s.image)+'" alt=""></div>':'')+'<div class="gitem-body"><h3>'+esc(s.title)+'</h3>'+(s.text?'<p>'+esc(s.text)+'</p>':'')+'</div></div>').join('');
      return sec(id,c.title||'Портфолио','<div class="gallery">'+items+'</div>');
    }
    case 'products':
      return sec(id,c.title||'Товары и услуги','<div class="prods" id="prods-'+i+'"><div class="sk" style="height:240px"></div><div class="sk" style="height:240px"></div><div class="sk" style="height:240px"></div><div class="sk" style="height:240px"></div></div>',true);
    case 'reviews':{
      const items=(c.items||[]).slice(0,20).map(s=>{const st='★'.repeat(Math.max(0,Math.min(5,s.rating||5)));return '<div class="rev"><div class="rev-stars">'+st+'</div><div class="rev-text">'+esc(s.text)+'</div><div class="rev-author">'+esc(s.author)+'</div></div>';}).join('');
      return sec(id,c.title||'Отзывы','<div class="revs">'+items+'</div>');
    }
    case 'contacts':{
      const items=[
        c.address?'<div class="cont-item"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><div><div class="cl">Адрес</div><div class="cv">'+esc(c.address)+'</div></div></div>':'',
        c.phone?'<div class="cont-item"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg><div><div class="cl">Телефон</div><div class="cv"><a href="tel:'+esc(c.phone)+'">'+esc(c.phone)+'</a></div></div></div>':'',
        c.email?'<div class="cont-item"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg><div><div class="cl">Email</div><div class="cv"><a href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a></div></div></div>':'',
        c.hours?'<div class="cont-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><div><div class="cl">Часы работы</div><div class="cv">'+esc(c.hours)+'</div></div></div>':''
      ].filter(Boolean).join('');
      const map=(c.map_lat&&c.map_lng)?'<div class="cont-map"><iframe loading="lazy" src="https://yandex.ru/map-widget/v1/?ll='+encodeURIComponent(c.map_lng+','+c.map_lat)+'&z=16&pt='+encodeURIComponent(c.map_lng+','+c.map_lat)+'"></iframe></div>':'';
      return sec(id,c.title||'Контакты','<div class="cont-grid"><div>'+items+'</div>'+map+'</div>');
    }
    case 'lead_form':
      return sec(id,c.title||'Свяжитесь с нами','<div class="lead">'+(c.subtitle?'<p class="sub">'+esc(c.subtitle)+'</p>':'')+'<form class="lead-form" onsubmit="return submitLead(event)"><input required name="name" placeholder="Ваше имя"><input required name="contact" placeholder="Телефон или email"><textarea name="message" placeholder="Сообщение"></textarea><label class="lead-consent"><input type="checkbox" required>Согласен на обработку персональных данных</label><button class="lead-btn" type="submit">'+esc(c.button_text||'Отправить')+'</button></form><div class="lead-ok" id="leadOk">Спасибо! Ваше сообщение отправлено.</div></div>',true);
    case 'news':{
      const items=(c.items||[]).slice(0,20).map(s=>'<div class="nitem">'+(s.image?'<div class="nitem-img"><img src="'+esc(s.image)+'" alt=""></div>':'')+'<div class="nitem-body">'+(s.date?'<div class="nitem-date">'+esc(s.date)+'</div>':'')+'<h3>'+esc(s.title)+'</h3>'+(s.text?'<p>'+esc(s.text)+'</p>':'')+'</div></div>').join('');
      return sec(id,c.title||'Новости','<div class="news">'+items+'</div>');
    }
    default:return '';
  }
}

async function loadProducts(shopId,blockIdx,limit){
  try{
    const r=await fetch(API+'/emarket/shop-listings?shop_id='+shopId);
    if(!r.ok)throw 0;
    const d=await r.json();
    const items=(d.listings||[]).slice(0,limit||8);
    const box=document.getElementById('prods-'+blockIdx);
    if(!box)return;
    if(!items.length){box.innerHTML='<div style="color:var(--tm);font-size:15px">Пока нет товаров</div>';return;}
    box.innerHTML=items.map(x=>{
      const img=(Array.isArray(x.photos)&&x.photos.length)?'<img src="'+esc(x.photos[0])+'" alt="">':'<div class="ph"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>';
      const price=(x.price==null||x.price===0)?'Договорная':(Number(x.price).toLocaleString('ru-RU')+' '+(x.currency==='USD'?'$':x.currency==='EUR'?'€':'₽'));
      return '<div class="prod" onclick="location.href=\'/emarket-listing.html?id='+x.id+'\'"><div class="prod-img">'+img+'</div><div class="prod-body"><div class="prod-title">'+esc(x.title)+'</div><div class="prod-price">'+price+'</div></div></div>';
    }).join('');
  }catch(e){
    const box=document.getElementById('prods-'+blockIdx);
    if(box)box.innerHTML='<div style="color:var(--tm);font-size:15px">Не удалось загрузить товары</div>';
  }
}

function submitLead(e){
  e.preventDefault();
  // лид-эндпоинт появится в 5.5; пока показываем подтверждение
  e.target.style.display='none';
  document.getElementById('leadOk').style.display='block';
  return false;
}

function toggleNav(){document.getElementById('shNav').classList.toggle('open');}
function closeNav(){const n=document.getElementById('shNav');if(n)n.classList.remove('open');}
</script>
