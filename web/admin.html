<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель — LASTOP GROUP</title>
<script src="/assets/utils.js"></script>
<script src="/assets/dark-theme-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/shell-layout.css">
<script>document.documentElement.classList.add('lt-shell');</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--g:#1E8A4C;--gm:#22A05A;--gl:#E8F5EE;--gp:#F0FAF4;--gmt:#5A8A6A;--gb:#C0DECA;--w:#FFF;--bg:#F2F5F3;--t:#1A2A22;--tm:#3A5245;--bdr:#DDE8E2;--red:#E04040;--r:8px;--rm:12px;--rl:18px;--rxl:24px;--sh:0 2px 12px rgba(30,138,76,.07)}
html,body{height:100%;overflow:hidden;font-family:'Manrope',sans-serif;background:var(--bg);color:var(--t);font-size:14px}
.shell{display:grid;grid-template-columns:220px 1fr 264px;grid-template-rows:56px 1fr;grid-template-areas:"logo topbar topbar" "nav main right";height:100vh;gap:10px;padding:10px}
.logo-cell{grid-area:logo;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;padding:0 14px;text-decoration:none;box-shadow:var(--sh);overflow:hidden}
.logo-cell img{height:38px;width:auto;max-width:100%;object-fit:contain;display:block}
.main{grid-area:main;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.right{grid-area:right;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.admin-banner{background:linear-gradient(135deg,#1A2A22,#2E4A3A);border-radius:var(--rxl);padding:16px 22px;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-shrink:0}
.admin-banner h1{font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
.admin-banner h1 svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.admin-banner p{font-size:12px;opacity:.75;margin-top:2px}
.admin-tabs{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:6px;display:flex;gap:4px;box-shadow:var(--sh);flex-shrink:0}
.admin-tab{flex:1;padding:9px 14px;border-radius:var(--rm);font-size:13px;font-weight:600;color:var(--gmt);cursor:pointer;border:none;background:transparent;font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:7px}
.admin-tab:hover:not(.active){background:var(--gp);color:var(--g)}
.admin-tab.active{background:var(--g);color:#fff}
.admin-tab svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.panel{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:16px;box-shadow:var(--sh)}
.panel-title{font-size:11px;font-weight:700;color:var(--gmt);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
.ov-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex-shrink:0}
.ov-card{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:14px 16px;box-shadow:var(--sh)}
.ov-card-label{font-size:11px;color:var(--gmt);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.ov-card-num{font-size:26px;font-weight:800;color:var(--t);margin-top:6px;line-height:1}
.ov-card-sub{font-size:11px;color:var(--g);margin-top:6px;font-weight:600}
.ov-card-sub.warn{color:#C07030}
.ov-card-sub.danger{color:var(--red)}
.ov-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px}
.ov-body::-webkit-scrollbar{width:4px}.ov-body::-webkit-scrollbar-thumb{background:var(--gb);border-radius:99px}
.users-toolbar{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;box-shadow:var(--sh)}
.users-toolbar input[type=search]{flex:1;min-width:200px;height:34px;padding:0 12px;border:1.5px solid var(--bdr);border-radius:var(--rm);background:var(--gp);font-family:inherit;font-size:13px;outline:none}
.users-toolbar input[type=search]:focus{border-color:var(--gm)}
.uf-filter{padding:7px 14px;border-radius:var(--rm);font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--bdr);background:transparent;color:var(--tm);font-family:inherit;transition:all .15s}
.uf-filter:hover{background:var(--gp);color:var(--g);border-color:var(--gb)}
.uf-filter.active{background:var(--g);color:#fff;border-color:var(--g)}
.users-table{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);overflow:hidden;box-shadow:var(--sh);flex:1;display:flex;flex-direction:column;min-height:0}
.users-thead{display:grid;grid-template-columns:36px 2fr 1.5fr 1fr 110px 30px;gap:10px;padding:11px 16px;font-size:10px;font-weight:700;color:var(--gmt);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--bdr);background:var(--gp);flex-shrink:0}
.users-tbody{overflow-y:auto;flex:1;min-height:0}
.users-tbody::-webkit-scrollbar{width:4px}.users-tbody::-webkit-scrollbar-thumb{background:var(--gb);border-radius:99px}
.users-row{display:grid;grid-template-columns:36px 2fr 1.5fr 1fr 110px 30px;gap:10px;padding:10px 16px;border-bottom:1px solid var(--bdr);align-items:center;font-size:13px;cursor:pointer;transition:background .12s}
.users-row:hover{background:var(--gp)}
.u-av{width:30px;height:30px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;overflow:hidden;position:relative}
.u-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.u-name{font-weight:700;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-pos{font-size:11px;color:var(--gmt);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-email{font-size:12px;color:var(--tm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-date{font-size:12px;color:var(--gmt);white-space:nowrap}
.u-badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:99px;font-size:10px;font-weight:700;white-space:nowrap}
.u-badge.active{background:var(--gl);color:var(--g);border:1px solid var(--gb)}
.u-badge.banned{background:#F8E5E5;color:var(--red);border:1px solid #F0C0C0}
.u-badge.admin{background:#EBE5F8;color:#5040A0;border:1px solid #D0C5F0}
.detail-panel{position:fixed;top:0;right:-460px;width:460px;height:100vh;background:var(--w);border-left:1px solid var(--bdr);box-shadow:-4px 0 30px rgba(0,0,0,.08);z-index:150;transition:right .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;display:flex;flex-direction:column}
.detail-panel.open{right:0}
.detail-panel::-webkit-scrollbar{width:4px}.detail-panel::-webkit-scrollbar-thumb{background:var(--gb);border-radius:99px}
.dp-head{position:sticky;top:0;background:var(--w);padding:14px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px;z-index:1}
.dp-close-btn{width:30px;height:30px;border-radius:var(--r);background:var(--gp);border:none;cursor:pointer;display:grid;place-items:center;color:var(--gmt);flex-shrink:0}
.dp-close-btn:hover{background:var(--gl);color:var(--g)}
.dp-close-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.dp-head h3{font-size:14px;font-weight:700;color:var(--t)}
.dp-body{padding:16px;flex:1}
.dp-av-big{width:64px;height:64px;border-radius:50%;color:#fff;font-size:22px;font-weight:800;display:grid;place-items:center;margin-bottom:10px;overflow:hidden;position:relative}
.dp-av-big img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.dp-name{font-size:18px;font-weight:800;color:var(--t);margin-bottom:2px}
.dp-email{font-size:13px;color:var(--gmt);margin-bottom:10px}
.dp-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.dp-section{font-size:11px;font-weight:700;color:var(--gmt);letter-spacing:.06em;text-transform:uppercase;margin:14px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--bdr)}
.dp-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bdr);font-size:13px}
.dp-row:last-of-type{border-bottom:none}
.dp-row .lbl{color:var(--gmt)}
.dp-row .val{color:var(--t);font-weight:600}
.dp-actions{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-top:1px solid var(--bdr);background:var(--gp)}
.dp-btn{padding:9px;border-radius:var(--rm);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--bdr);background:var(--w);color:var(--tm);transition:all .15s;text-align:center}
.dp-btn:hover{background:var(--gp);border-color:var(--gb);color:var(--g)}
.dp-btn.danger{color:var(--red);border-color:#F0C0C0}
.dp-btn.danger:hover{background:#FBEEEE;color:var(--red)}
.dp-btn.primary{background:var(--g);color:#fff;border-color:var(--g)}
.dp-btn.primary:hover{background:var(--gm);color:#fff}
.panel-overlay{position:fixed;inset:0;z-index:140;display:none;background:rgba(0,0,0,.12)}
.panel-overlay.show{display:block}
.audit-row{display:grid;grid-template-columns:1.5fr 2fr 1fr 100px;gap:10px;padding:10px 16px;border-bottom:1px solid var(--bdr);align-items:center;font-size:12px}
.audit-row:hover{background:var(--gp)}
.audit-action{font-family:'SF Mono',monospace;font-size:11px;color:var(--t);background:var(--gp);padding:3px 8px;border-radius:6px;display:inline-block}
.audit-admin{font-weight:600;color:var(--t)}
.audit-admin-email{font-size:11px;color:var(--gmt);margin-top:1px}
.audit-meta{font-size:11px;color:var(--gmt)}
.audit-time{font-size:11px;color:var(--gmt);white-space:nowrap}
.audit-thead{display:grid;grid-template-columns:1.5fr 2fr 1fr 100px;gap:10px;padding:11px 16px;font-size:10px;font-weight:700;color:var(--gmt);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--bdr);background:var(--gp);flex-shrink:0}
.empty{padding:40px 20px;text-align:center;color:var(--gmt);font-size:13px}
@media(max-width:1200px){.ov-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1000px){.shell{grid-template-columns:220px 1fr;grid-template-areas:"logo topbar" "nav main"}.right{display:none}.ov-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="shell">
  <a class="logo-cell" href="/" style="grid-area:logo"><img src="/assets/lastop-group-logo.svg" alt="LASTOP GROUP" onerror="this.style.display='none'"></a>
  <header class="topbar"></header>
  <nav class="nav"></nav>
  <div class="main">
    <div class="admin-banner">
      <div>
        <h1><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>Админ-панель</h1>
        <p>Управление платформой и пользователями</p>
      </div>
      <div style="font-size:12px;opacity:.75" id="adminGreeting"></div>
    </div>
    <div class="admin-tabs" id="adminTabs">
      <button class="admin-tab active" data-tab="overview"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Обзор</button>
      <button class="admin-tab" data-tab="users"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Пользователи</button>
      <button class="admin-tab" data-tab="companies"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>Компании</button>
      <button class="admin-tab" data-tab="audit"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Журнал</button>
    </div>
    <div class="ov-body" id="paneOverview">
      <div class="ov-grid" id="overviewGrid"></div>
      <div class="panel">
        <div class="panel-title">Последние действия администраторов</div>
        <div id="overviewRecent" style="display:flex;flex-direction:column;gap:4px"></div>
      </div>
    </div>
    <div style="display:none;flex-direction:column;gap:10px;flex:1;min-height:0" id="paneUsers">
      <div class="users-toolbar">
        <input type="search" id="usersSearch" placeholder="Поиск по имени или email">
        <button class="uf-filter active" data-status="">Все</button>
        <button class="uf-filter" data-status="active">Активные</button>
        <button class="uf-filter" data-status="admin">Админы</button>
        <button class="uf-filter" data-status="banned">Заблокированные</button>
      </div>
      <div class="users-table">
        <div class="users-thead"><div></div><div>Имя</div><div>Email</div><div>Регистрация</div><div>Статус</div><div></div></div>
        <div class="users-tbody" id="usersTbody"></div>
      </div>
    </div>
    <div style="display:none;flex-direction:column;gap:10px;flex:1;min-height:0" id="paneCompanies">
      <div class="users-toolbar">
        <input type="search" id="companiesSearch" placeholder="Поиск по названию или ИНН">
        <button class="uf-filter active" data-cstatus="">Все</button>
        <button class="uf-filter" data-cstatus="unverified">Не проверены</button>
        <button class="uf-filter" data-cstatus="verified">Подтверждены</button>
        <button class="uf-filter" data-cstatus="rejected">Отклонены</button>
        <button class="uf-filter" data-cstatus="blocked">Заблокированы</button>
      </div>
      <div class="users-table">
        <div class="users-thead" style="grid-template-columns:36px 2fr 1fr 1fr 110px 30px">
          <div></div><div>Компания</div><div>Владелец</div><div>Создана</div><div>Статус</div><div></div>
        </div>
        <div class="users-tbody" id="companiesTbody"></div>
      </div>
    </div>
    <div style="display:none;flex-direction:column;gap:10px;flex:1;min-height:0" id="paneAudit">
      <div class="users-table">
        <div class="audit-thead"><div>Действие</div><div>Администратор</div><div>Сущность</div><div>Время</div></div>
        <div class="users-tbody" id="auditTbody"></div>
      </div>
    </div>
  </div>
  <aside class="right">
    <div class="panel">
      <div class="panel-title">Статус системы</div>
      <div id="sysStatus" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>
    <div class="panel">
      <div class="panel-title">Быстрые ссылки</div>
      <a href="/settings.html" style="display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;text-decoration:none;color:var(--t);font-size:13px;font-weight:600">Настройки</a>
      <a href="/updates.html" style="display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;text-decoration:none;color:var(--t);font-size:13px;font-weight:600">Обновления платформы</a>
      <a href="/" style="display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;text-decoration:none;color:var(--t);font-size:13px;font-weight:600">Вернуться на главную</a>
    </div>
  </aside>
</div>
<div class="panel-overlay" id="panelOverlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detailPanel">
  <div class="dp-head">
    <button class="dp-close-btn" onclick="closeDetail()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
    <h3>Карточка пользователя</h3>
  </div>
  <div class="dp-body" id="dpBody"></div>
  <div class="dp-actions" id="dpActions"></div>
</div>
<script>
(function(){var u={};try{u=JSON.parse(localStorage.getItem('user')||'{}');}catch(e){}if(!u||!u.is_admin){location.replace('/');return;}document.getElementById('adminGreeting').textContent='Вы вошли как '+(u.full_name||u.email);})();
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function letter(s){return((s||'?')[0]||'?').toUpperCase();}
var C=['#5AB080','#3A90C0','#9060C0','#C07030','#1A8A6A','#B05090','#208090','#3B6D11'];
function avc(s){return C[(s||'').charCodeAt(0)%C.length]||C[0];}
function fmtDate(ts){if(!ts)return'—';var d=new Date(ts);return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'short',year:'numeric'});}
function fmtDateTime(ts){if(!ts)return'—';var d=new Date(ts);return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}
function num(n){if(typeof n==='string')return n;return n>=1000?(n/1000).toFixed(1).replace(/\.0$/,'')+'к':String(n||0);}
var currentTab='overview';
var usersFilter={q:'',status:''};
document.getElementById('adminTabs').addEventListener('click',function(e){var btn=e.target.closest('.admin-tab');if(!btn)return;switchTab(btn.dataset.tab);});
function switchTab(name){currentTab=name;document.querySelectorAll('.admin-tab').forEach(function(b){b.classList.toggle('active',b.dataset.tab===name);});document.getElementById('paneOverview').style.display=name==='overview'?'flex':'none';document.getElementById('paneUsers').style.display=name==='users'?'flex':'none';document.getElementById('paneCompanies').style.display=name==='companies'?'flex':'none';document.getElementById('paneAudit').style.display=name==='audit'?'flex':'none';if(name==='overview')loadOverview();if(name==='users')loadUsers();if(name==='companies')loadCompanies();if(name==='audit')loadAudit();}
// COMPANIES TAB
var companiesFilter={q:'',status:''};
var companiesSearchTimer;
document.getElementById('companiesSearch').addEventListener('input',function(e){clearTimeout(companiesSearchTimer);companiesSearchTimer=setTimeout(function(){companiesFilter.q=e.target.value.trim();loadCompanies();},300);});
document.querySelectorAll('[data-cstatus]').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('[data-cstatus]').forEach(function(x){x.classList.remove('active');});b.classList.add('active');companiesFilter.status=b.dataset.cstatus;loadCompanies();});});
async function loadCompanies(){var tb=document.getElementById('companiesTbody');tb.innerHTML='<div class="empty">Загрузка…</div>';try{var url='/api/admin/companies?limit=100';if(companiesFilter.q)url+='&q='+encodeURIComponent(companiesFilter.q);if(companiesFilter.status)url+='&status='+encodeURIComponent(companiesFilter.status);var r=await lastopFetch(url);if(!r.ok)throw 0;var d=await r.json();renderCompanies(d.companies||[]);}catch(e){tb.innerHTML='<div class="empty">Ошибка загрузки</div>';}}
function renderCompanies(items){var tb=document.getElementById('companiesTbody');if(!items.length){tb.innerHTML='<div class="empty">Ничего не найдено</div>';return;}tb.innerHTML=items.map(function(c){var av=c.logo_image?'<img src="'+esc(c.logo_image)+'" alt="">':esc(letter(c.name));var badge=c.is_blocked?'<span class="u-badge banned">Заблокирована</span>':c.verification_status==='rejected'?'<span class="u-badge banned">Отклонена</span>':c.is_verified?'<span class="u-badge admin" style="background:#E8F5EE;color:var(--g);border-color:var(--gb)">Подтверждена</span>':'<span class="u-badge active">Не проверена</span>';return '<div class="users-row" style="grid-template-columns:36px 2fr 1fr 1fr 110px 30px" onclick="openCompany(\''+esc(c.public_id)+'\')"><div class="u-av" style="background:'+esc(avc(c.name))+';border-radius:8px">'+av+'</div><div><div class="u-name">'+esc(c.name)+'</div>'+(c.inn?'<div class="u-pos">ИНН: '+esc(c.inn)+'</div>':'')+'</div><div class="u-email">'+esc(c.owner_name||'—')+'</div><div class="u-date">'+fmtDate(c.created_at)+'</div><div>'+badge+'</div><div style="color:var(--gmt);font-size:11px">→</div></div>';}).join('');}
async function openCompany(publicID){document.getElementById('detailPanel').classList.add('open');document.getElementById('panelOverlay').classList.add('show');document.querySelector('.dp-head h3').textContent='Карточка компании';document.getElementById('dpBody').innerHTML='<div class="empty">Загрузка…</div>';document.getElementById('dpActions').innerHTML='';try{var r=await lastopFetch('/api/admin/companies/'+encodeURIComponent(publicID));if(!r.ok)throw 0;var d=await r.json();renderCompanyDetail(d);}catch(e){document.getElementById('dpBody').innerHTML='<div class="empty">Не удалось загрузить</div>';}}
function renderCompanyDetail(d){var c=d.item||{};var av=c.logo_image?'<img src="'+esc(c.logo_image)+'" alt="">':esc(letter(c.name));var badges='';if(c.is_verified)badges+='<span class="u-badge admin" style="background:#E8F5EE;color:var(--g);border-color:var(--gb)">Подтверждена</span>';if(c.verification_status==='rejected'&&!c.is_verified)badges+='<span class="u-badge banned">Отклонена</span>';if(c.blocked_at)badges+='<span class="u-badge banned">Заблокирована</span>';if(!c.is_verified&&c.verification_status!=='rejected'&&!c.blocked_at)badges+='<span class="u-badge active">Не проверена</span>';var blockedBlock=c.blocked_at?'<div class="dp-section">Блокировка</div><div style="background:#FBEEEE;border:1px solid #F0C0C0;border-radius:10px;padding:10px;font-size:12px;color:var(--red)"><div style="font-weight:700;margin-bottom:4px">Заблокирована '+fmtDateTime(c.blocked_at)+'</div><div style="color:var(--tm)">'+esc(c.blocked_reason||'Без причины')+'</div></div>':'';document.getElementById('dpBody').innerHTML='<div class="dp-av-big" style="background:'+esc(avc(c.name))+';border-radius:14px">'+av+'</div><div class="dp-name">'+esc(c.name)+'</div><div class="dp-email">'+esc(c.inn?'ИНН: '+c.inn:'')+'</div><div class="dp-badges">'+badges+'</div>'+blockedBlock+'<div class="dp-section">Реквизиты</div><div class="dp-row"><span class="lbl">Сайт</span><span class="val">'+esc(c.website||'—')+'</span></div><div class="dp-row"><span class="lbl">Email</span><span class="val">'+esc(c.email||'—')+'</span></div><div class="dp-row"><span class="lbl">Телефон</span><span class="val">'+esc(c.phone||'—')+'</span></div><div class="dp-row"><span class="lbl">Регион</span><span class="val">'+esc(c.region||'—')+'</span></div><div class="dp-row"><span class="lbl">Город</span><span class="val">'+esc(c.city||'—')+'</span></div><div class="dp-section">Владелец</div><div class="dp-row"><span class="lbl">Имя</span><span class="val">'+esc(c.owner_name||'—')+'</span></div><div class="dp-row"><span class="lbl">Email</span><span class="val">'+esc(d.owner_email||'—')+'</span></div>'+(d.owner_is_banned?'<div class="dp-row"><span class="lbl">Статус</span><span class="val" style="color:var(--red)">Заблокирован</span></div>':'')+'<div class="dp-section">Активность</div><div class="dp-row"><span class="lbl">Создана</span><span class="val">'+fmtDate(c.created_at)+'</span></div><div class="dp-row"><span class="lbl">Сотрудников</span><span class="val">'+num(c.members_count||0)+'</span></div><div class="dp-row"><span class="lbl">Публикаций</span><span class="val">'+num(d.posts_count||0)+'</span></div>';var actions=[];if(c.blocked_at){actions.push('<button class="dp-btn primary" onclick="actCoUnblock(\''+esc(c.public_id)+'\')">Разблокировать</button>');}else{if(!c.is_verified)actions.push('<button class="dp-btn primary" onclick="actCoVerify(\''+esc(c.public_id)+'\')">Подтвердить</button>');if(c.verification_status!=='rejected')actions.push('<button class="dp-btn" onclick="actCoReject(\''+esc(c.public_id)+'\')">Отклонить</button>');actions.push('<button class="dp-btn danger" onclick="actCoBlock(\''+esc(c.public_id)+'\')">Заблокировать</button>');}actions.push('<button class="dp-btn" onclick="window.open(\'/company/'+esc(c.slug||c.public_id)+'\',\'_blank\')">Открыть публичную страницу</button>');document.getElementById('dpActions').innerHTML=actions.join('');}
async function actCoVerify(pid){if(!await lastopConfirm({title:'Подтвердить компанию?',message:'Компания получит статус «Подтверждена» и значок верификации.',confirmText:'Подтвердить'}))return;try{var r=await lastopFetch('/api/admin/companies/'+encodeURIComponent(pid)+'/verify',{method:'POST'});if(!r.ok){alert('Ошибка');return;}closeDetail();loadCompanies();loadOverview();}catch(e){alert('Ошибка соединения');}}
async function actCoReject(pid){var reason=await lastopPrompt({title:'Отклонить заявку компании',message:'Укажите причину. Владелец увидит её в карточке.',placeholder:'Причина отклонения',confirmText:'Отклонить',danger:true});if(reason===null)return;try{var r=await lastopFetch('/api/admin/companies/'+encodeURIComponent(pid)+'/reject',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:String(reason||'').trim()})});if(!r.ok){alert('Ошибка');return;}closeDetail();loadCompanies();}catch(e){alert('Ошибка соединения');}}
async function actCoBlock(pid){var reason=await lastopPrompt({title:'Заблокировать компанию',message:'Заблокированная компания будет скрыта со всей платформы. Укажите причину.',placeholder:'Причина блокировки',confirmText:'Заблокировать',danger:true});if(!reason||!String(reason).trim())return;try{var r=await lastopFetch('/api/admin/companies/'+encodeURIComponent(pid)+'/block',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:String(reason).trim()})});if(!r.ok){var e=await r.json().catch(function(){return{};});alert(e.error||'Ошибка');return;}closeDetail();loadCompanies();loadOverview();}catch(e){alert('Ошибка соединения');}}
async function actCoUnblock(pid){if(!await lastopConfirm({title:'Разблокировать компанию?',message:'Компания снова станет доступна публично.',confirmText:'Разблокировать'}))return;try{var r=await lastopFetch('/api/admin/companies/'+encodeURIComponent(pid)+'/unblock',{method:'POST'});if(!r.ok){alert('Ошибка');return;}closeDetail();loadCompanies();loadOverview();}catch(e){alert('Ошибка соединения');}}
async function loadOverview(){try{var r=await lastopFetch('/api/admin/overview');if(!r.ok)throw 0;var d=await r.json();renderOverview(d);}catch(e){document.getElementById('overviewGrid').innerHTML='<div class="empty">Не удалось загрузить</div>';}try{var r2=await lastopFetch('/api/admin/audit-log?limit=10');if(!r2.ok)throw 0;var d2=await r2.json();renderRecent(d2.entries||[]);}catch(e){}}
function renderOverview(d){var cards=[{label:'Пользователей',n:d.users_total,sub:'+'+num(d.users_new_7d)+' за неделю'},{label:'Новых за сутки',n:d.users_new_24h,sub:'Регистрации'},{label:'Заблокировано',n:d.users_banned,sub:'Активные баны',cls:d.users_banned>0?'warn':''},{label:'Активных за сутки',n:d.active_24h,sub:'Уникальных сессий'},{label:'Компаний',n:d.companies_total,sub:num(d.companies_unverified)+' непроверенных',cls:d.companies_unverified>0?'warn':''},{label:'Публикаций',n:d.posts_total,sub:'+'+num(d.posts_new_24h)+' за сутки'},{label:'Тех. работы',n:d.maintenance_active?'ВКЛ':'выкл',sub:d.maintenance_active?'Баннер показывается':'Платформа работает',cls:d.maintenance_active?'danger':''}];document.getElementById('overviewGrid').innerHTML=cards.map(function(c){return '<div class="ov-card"><div class="ov-card-label">'+esc(c.label)+'</div><div class="ov-card-num">'+num(c.n)+'</div><div class="ov-card-sub '+(c.cls||'')+'">'+esc(c.sub)+'</div></div>';}).join('');document.getElementById('sysStatus').innerHTML='<div style="display:flex;align-items:center;gap:8px;font-size:13px"><span style="width:8px;height:8px;border-radius:50%;background:#22CC66"></span>База данных</div><div style="display:flex;align-items:center;gap:8px;font-size:13px"><span style="width:8px;height:8px;border-radius:50%;background:#22CC66"></span>API</div><div style="display:flex;align-items:center;gap:8px;font-size:13px"><span style="width:8px;height:8px;border-radius:50%;background:'+(d.maintenance_active?'#E04040':'#22CC66')+'"></span>Платформа '+(d.maintenance_active?'в режиме обслуживания':'работает')+'</div>';}
function renderRecent(entries){if(!entries.length){document.getElementById('overviewRecent').innerHTML='<div class="empty" style="padding:20px">Записей нет</div>';return;}document.getElementById('overviewRecent').innerHTML=entries.map(function(e){return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bdr);font-size:12px"><span class="audit-action">'+esc(e.action)+'</span><span style="flex:1;color:var(--t);font-weight:600">'+esc(e.admin_name||'—')+'</span><span style="color:var(--gmt)">'+fmtDateTime(e.created_at)+'</span></div>';}).join('');}
var usersSearchTimer;
document.getElementById('usersSearch').addEventListener('input',function(e){clearTimeout(usersSearchTimer);usersSearchTimer=setTimeout(function(){usersFilter.q=e.target.value.trim();loadUsers();},300);});
document.querySelectorAll('.uf-filter').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.uf-filter').forEach(function(x){x.classList.remove('active');});b.classList.add('active');usersFilter.status=b.dataset.status;loadUsers();});});
async function loadUsers(){var tb=document.getElementById('usersTbody');tb.innerHTML='<div class="empty">Загрузка…</div>';try{var url='/api/admin/users?limit=100';if(usersFilter.q)url+='&q='+encodeURIComponent(usersFilter.q);if(usersFilter.status)url+='&status='+encodeURIComponent(usersFilter.status);var r=await lastopFetch(url);if(!r.ok)throw 0;var d=await r.json();renderUsers(d.users||[]);}catch(e){tb.innerHTML='<div class="empty">Ошибка загрузки</div>';}}
function renderUsers(users){var tb=document.getElementById('usersTbody');if(!users.length){tb.innerHTML='<div class="empty">Никого не найдено</div>';return;}tb.innerHTML=users.map(function(u){var av=u.avatar_url?'<img src="'+esc(u.avatar_url)+'" alt="">':esc(letter(u.full_name));var badge=u.is_banned?'<span class="u-badge banned">Заблокирован</span>':u.is_admin?'<span class="u-badge admin">Админ</span>':'<span class="u-badge active">Активен</span>';return '<div class="users-row" onclick="openUser('+u.id+')"><div class="u-av" style="background:'+esc(avc(u.full_name))+'">'+av+'</div><div><div class="u-name">'+esc(u.full_name)+'</div>'+(u.position?'<div class="u-pos">'+esc(u.position)+'</div>':'')+'</div><div class="u-email">'+esc(u.email)+'</div><div class="u-date">'+fmtDate(u.created_at)+'</div><div>'+badge+'</div><div style="color:var(--gmt);font-size:11px">→</div></div>';}).join('');}
async function openUser(id){document.getElementById('detailPanel').classList.add('open');document.getElementById('panelOverlay').classList.add('show');document.querySelector('.dp-head h3').textContent='Карточка пользователя';document.getElementById('dpBody').innerHTML='<div class="empty">Загрузка…</div>';document.getElementById('dpActions').innerHTML='';try{var r=await lastopFetch('/api/admin/users/'+id);if(!r.ok)throw 0;var u=await r.json();renderUserDetail(u);}catch(e){document.getElementById('dpBody').innerHTML='<div class="empty">Не удалось загрузить</div>';}}
function closeDetail(){document.getElementById('detailPanel').classList.remove('open');document.getElementById('panelOverlay').classList.remove('show');}
function renderUserDetail(u){var av=u.avatar_url?'<img src="'+esc(u.avatar_url)+'" alt="">':esc(letter(u.full_name));var badges='';if(u.is_admin)badges+='<span class="u-badge admin">Администратор</span>';if(u.is_banned)badges+='<span class="u-badge banned">Заблокирован</span>';if(!u.is_banned&&!u.is_admin)badges+='<span class="u-badge active">Активен</span>';if(u.email_verified)badges+='<span class="u-badge active">Email подтверждён</span>';var bannedBlock=u.is_banned?'<div class="dp-section">Блокировка</div><div style="background:#FBEEEE;border:1px solid #F0C0C0;border-radius:10px;padding:10px;font-size:12px;color:var(--red)"><div style="font-weight:700;margin-bottom:4px">Заблокирован '+fmtDateTime(u.banned_at)+'</div><div style="color:var(--tm)">'+esc(u.banned_reason||'Без причины')+'</div></div>':'';document.getElementById('dpBody').innerHTML='<div class="dp-av-big" style="background:'+esc(avc(u.full_name))+'">'+av+'</div><div class="dp-name">'+esc(u.full_name)+'</div><div class="dp-email">'+esc(u.email)+'</div><div class="dp-badges">'+badges+'</div>'+bannedBlock+'<div class="dp-section">Профиль</div><div class="dp-row"><span class="lbl">Должность</span><span class="val">'+esc(u.position||'—')+'</span></div><div class="dp-row"><span class="lbl">Город</span><span class="val">'+esc(u.city||'—')+'</span></div><div class="dp-row"><span class="lbl">Телефон</span><span class="val">'+esc(u.phone||'—')+'</span></div><div class="dp-section">Активность</div><div class="dp-row"><span class="lbl">Регистрация</span><span class="val">'+fmtDate(u.created_at)+'</span></div><div class="dp-row"><span class="lbl">Публикаций</span><span class="val">'+num(u.posts_count)+'</span></div><div class="dp-row"><span class="lbl">Компаний</span><span class="val">'+num(u.companies_count)+'</span></div><div class="dp-row"><span class="lbl">Активных сессий</span><span class="val">'+num(u.sessions_count)+'</span></div>';var me={};try{me=JSON.parse(localStorage.getItem('user')||'{}');}catch(e){}var isSelf=me.id===u.id;var canTouch=!u.is_admin||isSelf;var actions=[];if(isSelf){actions.push('<div style="font-size:12px;color:var(--gmt);text-align:center;padding:4px">Это вы — действия недоступны</div>');}else if(!canTouch){actions.push('<div style="font-size:12px;color:var(--gmt);text-align:center;padding:4px">Нельзя изменять других администраторов</div>');}else{if(u.is_banned){actions.push('<button class="dp-btn primary" onclick="actUnban('+u.id+')">Разблокировать</button>');}else{actions.push('<button class="dp-btn danger" onclick="actBan('+u.id+')">Заблокировать</button>');}if(u.is_admin&&!isSelf){actions.push('<button class="dp-btn" onclick="actRevokeAdmin('+u.id+')">Снять права администратора</button>');}else if(!u.is_admin){actions.push('<button class="dp-btn" onclick="actGrantAdmin('+u.id+')">Назначить администратором</button>');}if(u.sessions_count>0){actions.push('<button class="dp-btn" onclick="actTerminateSessions('+u.id+')">Завершить все сессии ('+u.sessions_count+')</button>');}}document.getElementById('dpActions').innerHTML=actions.join('');}
async function actBan(id){var reason=await lastopPrompt({title:'Блокировка пользователя',label:'Причина блокировки',placeholder:'Укажите причину',confirmText:'Заблокировать',danger:true});if(!reason||!reason.trim())return;try{var r=await lastopFetch('/api/admin/users/'+id+'/ban',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:reason.trim()})});if(!r.ok){var e=await r.json().catch(function(){return{};});alert(e.error||'Ошибка');return;}closeDetail();loadUsers();}catch(e){alert('Ошибка соединения');}}
async function actUnban(id){if(!await lastopConfirm({title:'Разблокировать?',message:'Пользователь снова получит доступ к платформе.'}))return;try{var r=await lastopFetch('/api/admin/users/'+id+'/unban',{method:'POST'});if(!r.ok){var e=await r.json().catch(function(){return{};});alert(e.error||'Ошибка');return;}closeDetail();loadUsers();}catch(e){alert('Ошибка соединения');}}
async function actGrantAdmin(id){if(!await lastopConfirm({title:'Назначить администратором?',message:'Пользователь получит полные права администратора платформы.',danger:true,confirmText:'Назначить'}))return;try{var r=await lastopFetch('/api/admin/users/'+id+'/grant-admin',{method:'POST'});if(!r.ok){var e=await r.json().catch(function(){return{};});alert(e.error||'Ошибка');return;}closeDetail();loadUsers();}catch(e){alert('Ошибка соединения');}}
async function actRevokeAdmin(id){if(!await lastopConfirm({title:'Снять права администратора?',message:'Пользователь потеряет доступ к админ-панели.',danger:true,confirmText:'Снять'}))return;try{var r=await lastopFetch('/api/admin/users/'+id+'/revoke-admin',{method:'POST'});if(!r.ok){var e=await r.json().catch(function(){return{};});alert(e.error||'Ошибка');return;}closeDetail();loadUsers();}catch(e){alert('Ошибка соединения');}}
async function actTerminateSessions(id){if(!await lastopConfirm({title:'Завершить все сессии?',message:'Пользователь будет разлогинен на всех устройствах.',danger:true,confirmText:'Завершить'}))return;try{var r=await lastopFetch('/api/admin/users/'+id+'/terminate-sessions',{method:'POST'});if(!r.ok){var e=await r.json().catch(function(){return{};});alert(e.error||'Ошибка');return;}var d=await r.json().catch(function(){return{};});alert('Завершено сессий: '+(d.terminated||0));closeDetail();loadUsers();}catch(e){alert('Ошибка соединения');}}
async function loadAudit(){var tb=document.getElementById('auditTbody');tb.innerHTML='<div class="empty">Загрузка…</div>';try{var r=await lastopFetch('/api/admin/audit-log?limit=100');if(!r.ok)throw 0;var d=await r.json();renderAudit(d.entries||[]);}catch(e){tb.innerHTML='<div class="empty">Ошибка загрузки</div>';}}
function renderAudit(entries){var tb=document.getElementById('auditTbody');if(!entries.length){tb.innerHTML='<div class="empty">Записей нет</div>';return;}tb.innerHTML=entries.map(function(e){var meta=e.entity_type?esc(e.entity_type)+(e.entity_id?' #'+e.entity_id:''):'—';var details='';if(e.details){if(e.details.email)details+=' · '+esc(e.details.email);if(e.details.reason)details+=' · '+esc(String(e.details.reason)).slice(0,50);if(e.details.status)details+=' · '+e.details.status;}return '<div class="audit-row"><div><span class="audit-action">'+esc(e.action)+'</span></div><div><div class="audit-admin">'+esc(e.admin_name||'—')+'</div><div class="audit-admin-email">'+esc(e.admin_email||'')+'</div></div><div class="audit-meta">'+meta+details+'</div><div class="audit-time">'+fmtDateTime(e.created_at)+'</div></div>';}).join('');}
loadOverview();
</script>
<script src="/assets/shell-injector.js" defer></script>
<script src="/assets/profile-context.js" defer></script>
</body>
</html>
