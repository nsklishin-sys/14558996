async function uploadAndSendFile(file){
  // Лимит: видео — 100 МБ, остальное — 25 МБ
  const isVideo = (file.type||'').startsWith('video/') || /\.(mp4|mov|webm|m4v)$/i.test(file.name);
  const maxBytes = isVideo ? 100*1024*1024 : 25*1024*1024;
  if (file.size > maxBytes) {
    showToast(isVideo ? `${file.name}: видео слишком большое (макс. 100 МБ)` : `${file.name}: файл слишком большой (макс. 25 МБ)`);
    return;
  }
  try {
    const fd = new FormData();
    fd.append('file', file);
    const r = await fetch('/api/upload', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + (localStorage.getItem('token') || '') },
      body: fd
    });
    if (!r.ok) {
      const errData = await r.json().catch(() => ({}));
      throw new Error(errData.error || 'Загрузка не удалась');
    }
    const data = await r.json();
    // Отправляем сообщение сразу с этим вложением (без захода в pendingAttachment)
    await api(`/chat/conversations/${state.activeConvPublicID}/messages`, {method:'POST', body:{
      content: '',
      attachment_url: data.url || data.file_url || '',
      attachment_name: file.name,
      attachment_type: file.type || '',
      attachment_size: file.size,
      reply_to_id: null
    }});
  } catch(e) {
    showToast(`Не удалось отправить ${file.name}: ${e.message||e}`);
  }
}

chatHiddenFile?.addEventListener('change', async (e) => {
  const files = e.target.files;
  if (!files || !files.length) return;
  e.target.value = '';
  if (!state.activeConvPublicID) {showToast('Сначала откройте диалог');return;}
  state.uploading = true;
  showToast(files.length > 1 ? `Загружаю ${files.length} файлов…` : 'Загружаю файл…');
  try {
    for (const f of files) await uploadAndSendFile(f);
  } finally {
    state.uploading = false;
  }
  try { await loadMessages(); } catch {}
  try { await loadConversations(); } catch {}
  return;
  // ↓ старая логика (одиночный файл с превью) оставлена ниже, не выполняется
  const file = files[0];

  // Лимит: видео — 100 МБ, остальное — 25 МБ
  const isVideo = (file.type||'').startsWith('video/') || /\.(mp4|mov|webm|m4v)$/i.test(file.name);
  const maxBytes = isVideo ? 100*1024*1024 : 25*1024*1024;
  if (file.size > maxBytes) {
    showToast(isVideo ? 'Видео слишком большое (макс. 100 МБ)' : 'Файл слишком большой (макс. 25 МБ)');
    return;
  }

  state.uploading = true;
  showUploadingPreview(file);

  try {
    const fd = new FormData();
    fd.append('file', file);
    const r = await fetch('/api/upload', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + (localStorage.getItem('token') || '') },
      body: fd
    });
    if (!r.ok) {
      const errData = await r.json().catch(() => ({}));
      throw new Error(errData.error || 'Загрузка не удалась');
    }
    const data = await r.json();
    pendingAttachment = {
      url: data.url,
      name: data.name,
      size: data.size,
      type: data.type
    };
    showReadyPreview();
  } catch (err) {
    showToast(err.message || 'Не удалось загрузить файл');
    pendingAttachment = null;
    hidePreview();
  } finally {
    state.uploading = false;
  }
});

function formatFileSize(bytes){
  if (bytes < 1024) return bytes + ' Б';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' КБ';
  return (bytes/1024/1024).toFixed(1) + ' МБ';
}

let _voiceRec = {mediaRecorder:null,stream:null,chunks:[],startTime:0,timerInterval:null,audioContext:null,analyser:null,rafId:null,blob:null,blobUrl:null,duration:0,previewAudio:null};

function pickVoiceMime(){
  // ВАЖНО: audio/mp4 ПЕРВЫЙ — он поддерживается Safari (webm там не работает)
  // На Chrome/Firefox audio/mp4 в MediaRecorder обычно недоступен → fallback на webm/opus
  const candidates=['audio/mp4','audio/mp4;codecs=mp4a.40.2','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];
  for(const m of candidates){if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))return m;}
  return '';
}

async function startVoiceRecord(){
  if(state.uploading||_voiceRec.mediaRecorder)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showToast('Микрофон не поддерживается');return;}
  if(!window.MediaRecorder){showToast('Запись не поддерживается в этом браузере');return;}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch{showToast('Доступ к микрофону отклонён');return;}
  const mime=pickVoiceMime();let recorder;
  try{recorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);}catch{stream.getTracks().forEach(t=>t.stop());showToast('Не удалось запустить запись');return;}
  _voiceRec.mediaRecorder=recorder;_voiceRec.stream=stream;_voiceRec.chunks=[];_voiceRec.startTime=Date.now();
  recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)_voiceRec.chunks.push(e.data);};
  recorder.onstop=()=>{
    const type=recorder.mimeType||mime||'audio/webm';
    const blob=new Blob(_voiceRec.chunks,{type});
    _voiceRec.blob=blob;_voiceRec.blobUrl=URL.createObjectURL(blob);
    _voiceRec.duration=Math.max(1,Math.round((Date.now()-_voiceRec.startTime)/1000));
    if(_voiceRec.stream)_voiceRec.stream.getTracks().forEach(t=>t.stop());
    if(_voiceRec.audioContext)try{_voiceRec.audioContext.close();}catch{}
    if(_voiceRec.rafId)cancelAnimationFrame(_voiceRec.rafId);
    if(_voiceRec.timerInterval)clearInterval(_voiceRec.timerInterval);
    _voiceRec.audioContext=null;_voiceRec.analyser=null;_voiceRec.rafId=null;_voiceRec.timerInterval=null;_voiceRec.stream=null;_voiceRec.mediaRecorder=null;
    showVoicePreview();
  };
  recorder.start(200);showVoiceRecBar();
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const src=ac.createMediaStreamSource(stream);const analyser=ac.createAnalyser();analyser.fftSize=64;src.connect(analyser);
    _voiceRec.audioContext=ac;_voiceRec.analyser=analyser;drawVoiceWave();
  }catch{}
  _voiceRec.timerInterval=setInterval(()=>{
    const sec=Math.floor((Date.now()-_voiceRec.startTime)/1000);
    const m=Math.floor(sec/60),s=sec%60;
    const t=document.getElementById('voiceRecTime');if(t)t.textContent=(m<10?'0'+m:m)+':'+(s<10?'0'+s:s);
    if(sec>=300)stopVoiceRecord();
  },250);
}

function drawVoiceWave(){
  if(!_voiceRec.analyser)return;
  const bars=document.querySelectorAll('#voiceRecWave .vw-bar');
  if(!bars.length){_voiceRec.rafId=requestAnimationFrame(drawVoiceWave);return;}
  const buf=new Uint8Array(_voiceRec.analyser.frequencyBinCount);_voiceRec.analyser.getByteFrequencyData(buf);
  const step=Math.max(1,Math.floor(buf.length/bars.length));
  bars.forEach((b,i)=>{let sum=0;for(let k=0;k<step;k++)sum+=buf[i*step+k]||0;const avg=sum/step;b.style.height=Math.max(3,(avg/255)*28)+'px';});
  _voiceRec.rafId=requestAnimationFrame(drawVoiceWave);
}

function showVoiceRecBar(){
  hidePreview();
  const old=document.getElementById('voiceRecBar');if(old)old.remove();
  const oldPrev=document.getElementById('voicePrevBar');if(oldPrev)oldPrev.remove();
  const wrap=document.querySelector('.chat-input-wrap');if(!wrap||!wrap.parentNode)return;

  bar.innerHTML=`<button class="voice-rec-cancel" onclick="cancelVoiceRecord()" title="Отменить"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button><span class="voice-rec-dot"></span><span class="voice-rec-time" id="voiceRecTime">00:00</span><div class="voice-rec-wave" id="voiceRecWave">${Array.from({length:24}).map(()=>'<div class="vw-bar" style="height:3px"></div>').join('')}</div><button class="voice-rec-stop" onclick="stopVoiceRecord()" title="Остановить"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>`;
  wrap.parentNode.insertBefore(bar,wrap);wrap.style.display='none';

function cancelVoiceRecord(){
  if(_voiceRec.mediaRecorder&&_voiceRec.mediaRecorder.state!=='inactive'){try{_voiceRec.mediaRecorder.onstop=null;_voiceRec.mediaRecorder.stop();}catch{}}
  if(_voiceRec.stream)_voiceRec.stream.getTracks().forEach(t=>t.stop());
  if(_voiceRec.audioContext)try{_voiceRec.audioContext.close();}catch{}
  if(_voiceRec.rafId)cancelAnimationFrame(_voiceRec.rafId);
  if(_voiceRec.timerInterval)clearInterval(_voiceRec.timerInterval);
  if(_voiceRec.blobUrl)URL.revokeObjectURL(_voiceRec.blobUrl);
  _voiceRec={mediaRecorder:null,stream:null,chunks:[],startTime:0,timerInterval:null,audioContext:null,analyser:null,rafId:null,blob:null,blobUrl:null,duration:0,previewAudio:null};
  const bar=document.getElementById('voiceRecBar');if(bar)bar.remove();
  const wrap=document.querySelector('.chat-input-wrap');if(wrap)wrap.style.display='';

function stopVoiceRecord(){
  if(!_voiceRec.mediaRecorder||_voiceRec.mediaRecorder.state==='inactive')return;
  try{_voiceRec.mediaRecorder.stop();}catch{}
  const bar=document.getElementById('voiceRecBar');if(bar)bar.remove();
}

function showVoicePreview(){
  if(!_voiceRec.blobUrl)return;
  const wrap=document.querySelector('.chat-input-wrap');if(!wrap||!wrap.parentNode)return;
  const bar=document.createElement('div');bar.id='voicePrevBar';bar.className='voice-prev-bar';

  wrap.parentNode.insertBefore(bar,wrap);wrap.style.display='none';
  _voiceRec.previewAudio=new Audio(_voiceRec.blobUrl);
  _voiceRec.previewAudio.addEventListener('timeupdate',updateVoicePreviewTime);
  _voiceRec.previewAudio.addEventListener('ended',()=>{
    const ic=document.getElementById('voicePrevPlayIcon');if(ic)ic.innerHTML='<polygon points="5 3 19 12 5 21 5 3"/>';
    const pr=document.getElementById('voicePrevProgress');if(pr)pr.style.width='0%';

function toggleVoicePreviewPlay(){
  const a=_voiceRec.previewAudio;if(!a)return;
  const ic=document.getElementById('voicePrevPlayIcon');
  if(a.paused){a.play();if(ic)ic.innerHTML='<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>';}

function updateVoicePreviewTime(){
  const a=_voiceRec.previewAudio;if(!a||!isFinite(a.duration)||a.duration===0)return;
  const pr=document.getElementById('voicePrevProgress');if(pr)pr.style.width=((a.currentTime/a.duration)*100)+'%';

function seekVoicePreview(ev){

  const tr=document.getElementById('voicePrevTrack');if(!tr)return;
  const rect=tr.getBoundingClientRect();const pct=Math.max(0,Math.min(1,(ev.clientX-rect.left)/rect.width));

async function sendVoiceMessage(){
  if(!_voiceRec.blob||state.uploading)return;
  state.uploading=true;
  try{
    const ext=(_voiceRec.blob.type||'').includes('mp4')?'m4a':(_voiceRec.blob.type||'').includes('ogg')?'ogg':'webm';
    const ts=new Date();const filename='Voice_'+ts.toISOString().replace(/[:.]/g,'-').slice(0,19)+'.'+ext;
    const fd=new FormData();fd.append('file',new File([_voiceRec.blob],filename,{type:_voiceRec.blob.type||'audio/webm'}));
    const r=await fetch('/api/upload',{method:'POST',headers:{Authorization:'Bearer '+(localStorage.getItem('token')||'')},body:fd});
    if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'Не удалось загрузить голосовое');}
    const data=await r.json();

async function _voiceLoadWaveform(wrap, audio){
  if(wrap.dataset.voiceInit==='1')return;
  wrap.dataset.voiceInit='1';
  try{
    const resp=await fetch(audio.src);if(!resp.ok)return;
    const arr=await resp.arrayBuffer();
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const buf=await ac.decodeAudioData(arr);
    const data=buf.getChannelData(0);
    const bars=wrap.querySelectorAll('.vwb');const N=bars.length;
    const step=Math.floor(data.length/N);const peaks=new Array(N).fill(0);
    for(let i=0;i<N;i++){
      let max=0;const start=i*step;const end=start+step;
      for(let j=start;j<end;j++){const v=Math.abs(data[j]);if(v>max)max=v;}
      peaks[i]=max;
    }
    const maxPeak=Math.max(...peaks)||1;
    bars.forEach((b,i)=>{const h=Math.max(3,Math.round((peaks[i]/maxPeak)*22));b.style.height=h+'px';});
    try{ac.close();}catch{}
  }catch{}
}

function _fixAudioDuration(audio){
  return new Promise(resolve=>{
    if(audio.duration && isFinite(audio.duration) && audio.duration>0){resolve();return;}
    if(audio.dataset.durationFixed==='1'){resolve();return;}
    const onChange=()=>{
      if(isFinite(audio.duration)&&audio.duration>0){
        audio.removeEventListener('durationchange',onChange);
        audio.currentTime=0;
        audio.dataset.durationFixed='1';
        resolve();
      }
    };
    audio.addEventListener('durationchange',onChange);
    // Trigger seek to "very long" — браузер вычислит реальную длительность
    try{audio.currentTime=1e7;}catch{}
    // Fallback timeout — если duration не появилась
    setTimeout(()=>{audio.removeEventListener('durationchange',onChange);resolve();},2000);
  });
}

async function _voicePlay(btn){
  const wrap=btn.closest('.msg-voice');if(!wrap)return;
  const audio=wrap.querySelector('audio');if(!audio)return;
  const icon=btn.querySelector('svg');
  if(audio.paused){
    document.querySelectorAll('.msg-voice audio').forEach(a=>{if(a!==audio)a.pause();});
    // Сначала фиксим duration, потом запускаем play и waveform
    await _fixAudioDuration(audio);
    try{
      await audio.play();
      if(icon)icon.innerHTML='<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>';
      if(wrap.dataset.voiceInit!=='1') _voiceLoadWaveform(wrap,audio);
    }catch(e){
      console.warn('voice play failed:',e);
      showToast('Не удалось воспроизвести голосовое');
    }
  }else{
    audio.pause();
    if(icon)icon.innerHTML='<polygon points="5 3 19 12 5 21 5 3"/>';
  }
}

function _voiceSeek(ev,track){
  const wrap=track.closest('.msg-voice');const audio=wrap?.querySelector('audio');
  if(!audio||!isFinite(audio.duration)||audio.duration===0)return;
  const rect=track.getBoundingClientRect();const pct=Math.max(0,Math.min(1,(ev.clientX-rect.left)/rect.width));
  audio.currentTime=audio.duration*pct;
}

// Real-time через WebSocket
function setupChatWS(){
  if(!window.wsClient) return;
  // Typing-индикатор
  window.wsClient.on('chat:typing', function(data){
    if(!data || !data.conversation_public_id) return;
    if(state.activeConvPublicID !== data.conversation_public_id) return;
    const list = state.typingUsers || [];
    const idx = list.findIndex(u => u.user_id === data.user_id);
    if(data.is_typing){
      if(idx === -1) list.push({user_id: data.user_id, name: data.name || ''});
    } else {
      if(idx !== -1) list.splice(idx, 1);
    }
    state.typingUsers = list;
    refreshChatHeaderStatus();
    renderMessages();
  });
  // Онлайн-статус собеседника
  window.wsClient.on('presence:update', function(data){
    if(!data || !data.user_public_id) return;
    // Локально обновляем is_online во всех direct-диалогах с этим юзером
    (state.conversations||[]).forEach(c => {
      if(c.type === 'direct' && c.other_public_id === data.user_public_id){
        c.is_online = !!data.is_online;
      }
    });
    renderConversations();
    // Если открыт диалог с этим собеседником — перерисуем шапку
    const active = (state.conversations||[]).find(x => x.public_id === state.activeConvPublicID);
    if(active && active.type === 'direct' && active.other_public_id === data.user_public_id){
      const chatStatus = document.getElementById('chatStatus');
      if(chatStatus){
        if((state.typingUsers||[]).length > 0){
          chatStatus.textContent = 'печатает…';
          chatStatus.className = 'ch-status typing';
        } else {
          chatStatus.textContent = data.is_online ? 'в сети' : 'был(а) недавно';
          chatStatus.className = 'ch-status' + (data.is_online ? ' online' : '');
        }
      }
    }
  });
  window.wsClient.on('chat:message', function(data){
    if(!data || !data.conversation_public_id || !data.message) return;
    const convPid = data.conversation_public_id;
    const msg = data.message;
    // Если это активный диалог — дописать в DOM и пометить прочитанным
    if(state.activeConvPublicID === convPid){
      // Не дублируем если уже есть (отправитель уже добавил optimistic-render)
      const exists = (state.messages||[]).some(m => m.id === msg.id);
      if(!exists){
        state.messages = state.messages || [];
        state.messages.push(msg);
        renderMessages();
        // Прокрутить вниз
        const wrap = document.getElementById('msgsWrap');
        if(wrap) wrap.scrollTop = wrap.scrollHeight;
        // Помечаем прочитанным сразу — диалог открыт
        api(`/chat/conversations/${convPid}/read`,{method:'POST'}).catch(()=>{});
      }
    }
    // В любом случае — обновляем список диалогов (last_message, unread_count)
    loadConversations().catch(()=>{});
  });
}

window.addEventListener('DOMContentLoaded', async () => {
  // Шаг 0: проверка токена
  if (!tk()) {
    location.href = '/login.html';
    return;
  }

  // Шаг 1: грузим юзера. Если упало — логируем, не валим весь init.
  try {
    await loadCurrentUser();
  } catch (err) {
    console.warn('[chat] loadCurrentUser failed:', err);
    // Если /api/me реально вернул 401 — api() уже сделал редирект.
    // Если упало по другой причине (TypeError, network) — продолжаем без юзера в state.
  }

  // Шаг 2: показываем кеш мгновенно
  loadCachedConversations();

  // Шаг 3: грузим свежий список диалогов
  try {
    await loadConversations();
  } catch (err) {
    console.warn('[chat] loadConversations failed:', err);
  }

  // Шаг 4: разбираем URL-параметры
  const params = new URLSearchParams(location.search);
  const userParam = params.get('user') || params.get('uid');
  const convParam = params.get('conv');
  const communityParam = params.get('community');

  // A2.1R: автовыбор первого диалога убран — юзер сам выбирает что открыть.
  // Открываем диалог только если в URL передан явный параметр (?conv=, ?user=, ?community=).
  try {
    if (convParam) {
      const exists = state.conversations.find(c => c.public_id === convParam);
      if (exists) selectConversation(convParam);
    } else if (userParam) {
      const conv = await openOrCreateDirectByPublicID(userParam);
      if (conv) selectConversation(conv.public_id);
    } else if (communityParam) {
      const conv = await openCommunityConv(communityParam);
      if (conv) selectConversation(conv.public_id);
    }
    // Без параметров — никакого автовыбора, просто показываем список диалогов слева
  } catch (err) {
    console.warn('[chat] open conversation failed:', err);
  }

  // A2.1: загружаем мои компании/сообщества и рисуем баннер контекста
  loadMyContexts().then(()=>renderComposeBanner());

  // Шаг 5: polling раз в 3 сек
  startPolling();

  document.addEventListener('keydown', (e)=>{
    if(e.key==='Escape'){
      const bar=document.getElementById('chatSearchBar');
      if(bar && bar.classList.contains('open'))closeChatSearch();
    }
  });
})

function _collectChatImages(){

function clStep(dir){
  if (!_clImages.length) return;
  _clIdx = (_clIdx + dir + _clImages.length) % _clImages.length;
  _renderClFrame();
}

function _renderClFrame(){
  const img = document.getElementById('chatLightboxImg');
  const prev = document.getElementById('clPrev');
  const next = document.getElementById('clNext');
  const cnt = document.getElementById('chatLightboxCount');
  if (!img) return;
  img.src = _clImages[_clIdx] || '';
  const multi = _clImages.length > 1;
  if (prev) prev.style.display = multi ? '' : 'none';
  if (next) next.style.display = multi ? '' : 'none';
  if (cnt) {
    if (multi) {
      cnt.style.display = '';
      cnt.textContent = (_clIdx + 1) + ' / ' + _clImages.length;
    } else {
      cnt.style.display = 'none';
    }
  }
}

      <button class="fwd-x" onclick="closeForward()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="fwd-search">
      <input id="fwdSearch" type="search" placeholder="Поиск диалога..." autocomplete="off">
    </div>
    <div class="fwd-list" id="fwdList"></div>
  </div>
</div>
</body>
</html>
