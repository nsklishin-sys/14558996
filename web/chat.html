<!DOCTYPE html>
<html lang="ru">
<head>
<script src="/assets/dark-theme-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LASTOP GROUP — Чат</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/shell-layout.css">
<script>document.documentElement.classList.add('lt-shell-2col');</script>
<link rel="stylesheet" href="/assets/hover-lift.css">
<script>document.documentElement.classList.add('hl-on');</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#1E8A4C;--gm:#22A05A;--gl:#E8F5EE;--gp:#F0FAF4;--gmt:#5A8A6A;--gb:#C0DECA;
  --w:#FFF;--bg:#F2F5F3;--t:#1A2A22;--tm:#3A5245;--bdr:#DDE8E2;
  --red:#E04040;--r:8px;--rm:12px;--rl:18px;--rxl:24px;
  --sh:0 2px 12px rgba(30,138,76,.07);--shm:0 6px 24px rgba(30,138,76,.13)
}
html,body{height:100%;overflow:hidden;font-family:'Manrope',sans-serif;background:var(--bg);color:var(--t);font-size:14px}

/* ═══ SHELL ═══ */
.shell{display:grid;grid-template-columns:240px 1fr;grid-template-rows:56px 1fr;grid-template-areas:"logo topbar""nav main";height:100vh;gap:10px;padding:10px}


/* ═══ LOGO ═══ */
.logo-cell{grid-area:logo;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;padding:0 14px;text-decoration:none;box-shadow:var(--sh);transition:box-shadow .2s}
.logo-cell:hover{box-shadow:var(--shm)}
.logo-cell img{height:38px;width:auto;max-width:100%;object-fit:contain;display:block}

/* ═══ TOPBAR ═══ */
.topbar{grid-area:topbar;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:var(--sh);min-width:0}
.search-wrap{flex:1;position:relative;display:flex;align-items:center}
.search-dot{position:absolute;left:13px;width:8px;height:8px;border-radius:50%;background:var(--g);pointer-events:none}
.search-wrap input{width:100%;height:36px;padding:0 14px 0 30px;border:1.5px solid var(--bdr);border-radius:99px;background:var(--gp);font-family:inherit;font-size:13px;color:var(--t);outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--gm)}
.search-wrap input::placeholder{color:var(--gmt)}
/* ─── DROPDOWN ─── */

/* ═══ NAV ═══ */
.nav{grid-area:nav;background:var(--w);border-radius:var(--rxl);border:1px solid var(--bdr);box-shadow:var(--sh);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;padding:12px 10px 10px;gap:1px}
.nav::-webkit-scrollbar{display:none}

/* ═══ MAIN — чат ═══ */
.main{grid-area:main;overflow:hidden;display:flex;flex-direction:column}

/* Единый блок чата */
.chat-panel{
  display:grid;grid-template-columns:280px 1fr;
  height:100%;
  border:1px solid var(--bdr);border-radius:var(--rxl);
  box-shadow:var(--sh);overflow:hidden;background:var(--w)
}

/* Колонка — список диалогов */
.dialogs{
  background:var(--w);border-right:1px solid var(--bdr);
  border-radius:var(--rxl) 0 0 var(--rxl);
  display:flex;flex-direction:column;overflow:hidden
}
.dialogs-head{padding:14px 14px 10px;border-bottom:1px solid var(--bdr);flex-shrink:0}
.dh-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dh-title{font-size:15px;font-weight:800;color:var(--t)}
.dh-btn{
  width:28px;height:28px;border-radius:8px;border:1.5px solid var(--bdr);background:var(--gp);
  display:grid;place-items:center;cursor:pointer;transition:all .15s
}
.dh-btn:hover{border-color:var(--gb);background:var(--gl)}
.dh-btn svg{width:13px;height:13px;stroke:var(--g);fill:none;stroke-width:2.2;stroke-linecap:round}
.d-search{position:relative}
.d-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:var(--gmt);fill:none;stroke-width:1.8;stroke-linecap:round;pointer-events:none}
.d-search input{
  width:100%;height:32px;padding:0 10px 0 30px;
  border:1.5px solid var(--bdr);border-radius:99px;background:var(--gp);
  font-family:inherit;font-size:12px;color:var(--t);outline:none;transition:border-color .2s
}
.d-search input:focus{border-color:var(--gm)}
.d-search input::placeholder{color:var(--gmt)}

/* Табы */
.d-tabs{display:flex;align-items:center;gap:4px;padding:8px 10px;flex-shrink:0;border-bottom:1px solid var(--bdr);overflow-x:auto;scrollbar-width:none}
.d-tabs::-webkit-scrollbar{display:none}
.d-tab{
  padding:4px 10px;border-radius:99px;font-size:11px;font-weight:600;
  cursor:pointer;border:1.5px solid var(--bdr);background:transparent;
  color:var(--tm);font-family:inherit;transition:all .15s;white-space:nowrap;flex-shrink:0
}
.d-tab:hover{background:var(--gp);color:var(--g);border-color:var(--gb)}
.d-tab.active{background:var(--g);color:#fff;border-color:var(--g)}
.d-tab-count{
  display:inline-block;margin-left:4px;padding:1px 5px;border-radius:99px;
  background:var(--g);color:#fff;font-size:9px;font-weight:700
}
.d-tab:not(.active) .d-tab-count{background:var(--gb);color:var(--tm)}

/* Список диалогов */
.d-list{flex:1;overflow-y:auto;padding:6px 6px 6px 6px}
.d-list::-webkit-scrollbar{width:4px}
.d-list::-webkit-scrollbar-thumb{background:var(--gb);border-radius:99px}
.d-item{
  display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:var(--rm);
  cursor:pointer;transition:background .15s;position:relative
}
.d-item:hover{background:var(--gp)}
.d-item.active{background:var(--gl)}
.d-av-wrap{position:relative;flex-shrink:0}
.d-av{
  width:42px;height:42px;border-radius:50%;font-size:14px;font-weight:800;
  color:#fff;display:grid;place-items:center;overflow:hidden
}
.d-av img{width:100%;height:100%;object-fit:cover}
.d-online{
  position:absolute;bottom:-1px;right:-1px;
  width:11px;height:11px;border-radius:50%;background:#22CC66;
  border:2px solid var(--w)
}
.d-body{flex:1;min-width:0}
.d-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px}
.d-name{font-size:13px;font-weight:700;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-time{font-size:10px;color:var(--gmt);flex-shrink:0}
.d-bot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.d-preview{font-size:11px;color:var(--gmt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;line-height:1.4}
.d-preview .me-prefix{color:var(--tm);font-weight:500}
.d-badge{
  display:inline-block;padding:2px 6px;border-radius:99px;
  background:var(--g);color:#fff;font-size:9px;font-weight:700;flex-shrink:0;
  min-width:16px;text-align:center
}
.d-muted-icon{
  width:12px;height:12px;color:var(--gmt);flex-shrink:0
}
.d-item.pinned::before{
  content:'';position:absolute;top:8px;right:8px;
  width:4px;height:4px;border-radius:50%;background:var(--g)
}
.d-tag{
  display:inline-block;padding:1px 6px;border-radius:99px;
  font-size:9px;font-weight:700;margin-left:5px
}
.d-tag.company{background:#FAEEDA;color:#633806}
.d-tag.group{background:#EDE8FA;color:#6040A0}

/* ═══ ЧАТ — центральная зона ═══ */
.chat{
  background:var(--w);border-radius:0 var(--rxl) var(--rxl) 0;
  display:flex;flex-direction:column;overflow:hidden
}

/* Шапка чата */
.chat-dropzone{position:absolute;inset:0;background:rgba(30,138,76,.12);border:3px dashed var(--g);border-radius:14px;display:none;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--g);pointer-events:none;z-index:50}
.chat-dropzone.active{display:flex}
.chat-head{
  padding:12px 16px;border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:12px;flex-shrink:0;background:var(--w)
}
.ch-av-wrap{position:relative;flex-shrink:0}
.ch-av{
  width:40px;height:40px;border-radius:50%;font-size:14px;font-weight:800;
  color:#fff;display:grid;place-items:center;overflow:hidden
}
.ch-online-dot{
  position:absolute;bottom:-1px;right:-1px;
  width:11px;height:11px;border-radius:50%;background:#22CC66;
  border:2px solid var(--w)
}
.ch-info{flex:1;min-width:0}
.ch-name{font-size:14px;font-weight:800;color:var(--t)}
.ch-status{font-size:11px;color:var(--gmt);margin-top:1px;display:flex;align-items:center;gap:5px}
.ch-status.online{color:var(--g);font-weight:600}
.ch-status.typing{color:var(--g);font-weight:600}
.ch-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.ch-act{
  width:34px;height:34px;border-radius:var(--rm);border:1.5px solid var(--bdr);
  background:var(--gp);display:grid;place-items:center;cursor:pointer;
  transition:all .15s;color:var(--gmt)
}
.ch-act:hover{border-color:var(--gb);background:var(--gl);color:var(--g)}
.ch-act svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.chat-friend-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:99px;
  background:transparent;border:1.5px solid var(--bdr);
  font-family:inherit;font-size:11px;font-weight:600;
  color:var(--tm);cursor:pointer;
  transition:all .15s;
  flex-shrink:0
}
.chat-friend-btn:hover{background:var(--gp);color:var(--g);border-color:var(--gb)}
.chat-friend-btn:disabled{opacity:.6;cursor:default}
.chat-friend-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.chat-friend-btn.is-outgoing{color:var(--gmt)}
.chat-friend-btn.is-friends{color:var(--g);border-color:var(--gb);background:var(--gp)}
.chat-friend-btn.is-incoming{color:#fff;background:var(--g);border-color:var(--g)}
.chat-friend-btn.is-incoming:hover{background:var(--gm)}

/* Сообщения */
.chat-body{
  flex:1;overflow-y:auto;padding:16px;
  display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(180deg,var(--gp) 0%,var(--bg) 100%)
}
.chat-body::-webkit-scrollbar{width:4px}
.chat-body::-webkit-scrollbar-thumb{background:var(--gb);border-radius:99px}

/* Разделитель даты */
.date-sep{
  align-self:center;margin:10px 0 4px;
  padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.8);
  backdrop-filter:blur(4px);border:1px solid var(--bdr);
  font-size:10px;font-weight:700;color:var(--gmt);letter-spacing:.05em;text-transform:uppercase
}

/* Пузыри */
.msg{display:flex;gap:8px;max-width:70%;animation:msgIn .25s ease both}
.msg-reply{display:flex;gap:6px;align-items:stretch;background:rgba(30,138,76,.10);border-radius:6px;padding:4px 8px 4px 6px;margin-bottom:4px;cursor:pointer;transition:background .15s;max-width:100%;overflow:hidden}
.msg-reply:hover{background:rgba(30,138,76,.18)}
.msg-reply-bar{width:3px;flex-shrink:0;background:#1E8A4C;border-radius:2px;align-self:stretch}
.msg-reply-body{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.msg-reply-author{font-size:11px;font-weight:700;color:#1E8A4C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.msg-reply-text{font-size:11px;color:#3A5245;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25;opacity:.75}
.msg-highlight{animation:msgHl 1.5s ease}
@keyframes msgHl{0%,100%{background:transparent}30%{background:rgba(30,138,76,.18)}}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.them{align-self:flex-start}
.msg-av{
  width:28px;height:28px;border-radius:50%;font-size:11px;font-weight:800;
  color:#fff;display:grid;place-items:center;flex-shrink:0;align-self:flex-end
}
.msg.me .msg-av{display:none}
.msg-group{display:flex;flex-direction:column;gap:2px;min-width:0}
.msg-link{color:#1E8A4C !important;text-decoration:underline;text-underline-offset:2px;word-break:break-all;font-weight:600}
.msg-link:hover{opacity:.8}
.msg.me .msg-bubble .msg-link,
.msg.me .msg-bubble a.msg-link{color:#0D4A28 !important}
.lp-slot{margin-top:8px;min-height:0}
.lp-card{display:flex;align-items:stretch;gap:10px;padding:10px;background:#FFFFFF;border:1px solid #DDE8E2;border-radius:12px;text-decoration:none;color:#1A2A22;max-width:380px;transition:transform .12s,box-shadow .12s}
.lp-card:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(30,138,76,.12)}
.msg.me .lp-card{background:#FFFFFF;border-color:#DDE8E2;color:#1A2A22}
.lp-img{width:56px;height:56px;border-radius:8px;background-size:cover;background-position:center;flex-shrink:0;background-color:#E8F5EE}
.lp-img-ph{display:grid;place-items:center;font-size:18px;font-weight:800;color:#1E8A4C;background:#E8F5EE}
.msg.me .lp-img-ph{background:#E8F5EE;color:#1E8A4C}
.lp-body{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.lp-badge{font-size:10px;font-weight:700;color:#1E8A4C;text-transform:uppercase;letter-spacing:.05em}
.msg.me .lp-badge{color:#1E8A4C}
.lp-title{font-size:13px;font-weight:700;line-height:1.3;color:#1A2A22;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg.me .lp-title{color:#1A2A22}
.lp-sub{font-size:11px;color:#5A8A6A;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg.me .lp-sub{color:#5A8A6A}
.msg-bubble{
  padding:9px 14px;border-radius:var(--rl);
  font-size:13px;line-height:1.5;color:var(--t);
  background:var(--w);border:1px solid var(--bdr);
  word-wrap:break-word;position:relative
}
.msg.me .msg-bubble{
  background:var(--gl);color:var(--t);border-color:var(--gb);
  border-bottom-right-radius:6px
}
.msg.them .msg-bubble{border-bottom-left-radius:6px}
.msg-meta{font-size:10px;color:var(--gmt);margin-top:2px;display:flex;align-items:center;gap:6px}
.msg.them .msg-meta{justify-content:flex-start}
.msg.me .msg-meta{justify-content:flex-end}
.msg-status{display:inline-flex;align-items:center;cursor:default;position:relative;font-size:12px;font-weight:700;letter-spacing:-3px;line-height:1;padding-right:3px;font-family:-apple-system,sans-serif}
.msg-status::before{content:'✓';display:inline-block}
.msg-status.delivered::after,.msg-status.read::after{content:'✓';display:inline-block}
.msg-status.sent,.msg-status.delivered{color:var(--gmt)}
.msg-status.read{color:var(--g)}
.msg-status[data-tip]:hover::after{
  content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);right:0;
  background:var(--t);color:#fff;padding:4px 8px;border-radius:6px;
  font-size:10px;white-space:nowrap;pointer-events:none;z-index:10
}

/* === A2.1 multi-context: имя автора-компании/сообщества и подпись «От: ...» === */
.msg-as-name{font-size:11px;font-weight:700;color:var(--g);padding:0 4px;margin-bottom:2px;line-height:1.2}
.msg.me .msg-as-name{text-align:right}
.msg-as-user{font-size:10px;color:var(--gmt);margin-top:3px;padding:0 4px;font-style:italic;opacity:.85;line-height:1.2}
.msg.me .msg-as-user{text-align:right}
.msg-av{background-size:cover;background-position:center}
.compose-as-banner{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--gp);border-top:1px solid var(--bdr);font-size:11px;color:var(--gmt);flex-shrink:0;overflow:hidden;min-width:0}
.compose-as-banner > span,.compose-as-banner > div:not(.cab-av):not(.cab-reset){min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compose-as-banner .cab-av{width:20px;height:20px;border-radius:6px;flex-shrink:0;background-size:cover;background-position:center;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:800}
.compose-as-banner b{color:var(--t);font-weight:700}
.compose-as-banner .cab-reset{margin-left:auto;background:transparent;border:1px solid var(--bdr);border-radius:6px;padding:3px 9px;font-family:inherit;font-size:10px;font-weight:600;color:var(--gmt);cursor:pointer}
.compose-as-banner .cab-reset:hover{background:var(--w);color:var(--g);border-color:var(--gb)}

/* Реакции */
.msg-reactions{
  display:flex;gap:3px;margin-top:3px;flex-wrap:wrap
}
.msg.me .msg-reactions{justify-content:flex-end}
.reaction{
  padding:2px 8px;border-radius:99px;background:var(--w);border:1px solid var(--bdr);
  font-size:10px;font-weight:600;color:var(--tm);cursor:pointer;
  display:inline-flex;align-items:center;gap:3px;transition:all .15s
}
.reaction:hover{border-color:var(--gb);background:var(--gp)}
.reaction.mine{background:var(--w);border-color:var(--gb);color:var(--g)}

/* Цитата в сообщении */
.msg-quote{
  padding:6px 10px;margin-bottom:5px;border-left:2.5px solid var(--g);
  background:var(--gp);border-radius:6px;
  font-size:11px;color:var(--tm);line-height:1.4
}
.msg.me .msg-quote{
  background:var(--w);border-left-color:var(--g);color:var(--tm)
}
.mq-author{font-weight:700;color:var(--g);margin-bottom:2px;font-size:10px}
.msg.me .mq-author{color:var(--g)}

/* Превью-карточка поста платформы */
.msg-platform-card{
  margin-top:8px;padding:10px;border-radius:var(--rm);
  background:var(--w);border:1px solid var(--bdr);
  display:flex;gap:10px;align-items:flex-start;cursor:pointer;transition:all .15s
}
.msg.me .msg-platform-card{background:var(--w);border-color:var(--bdr)}
.msg-platform-card:hover{border-color:var(--gb)}
.mpc-icon{
  width:34px;height:34px;border-radius:9px;background:var(--gl);border:1px solid var(--gb);
  display:grid;place-items:center;flex-shrink:0
}
.mpc-icon svg{width:15px;height:15px;stroke:var(--g);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mpc-body{flex:1;min-width:0}
.mpc-label{font-size:9px;font-weight:700;color:var(--gmt);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.msg.me .mpc-label{color:var(--gmt)}
.mpc-title{font-size:12px;font-weight:700;color:var(--t);line-height:1.3;margin-bottom:2px}
.msg.me .mpc-title{color:var(--t)}
.mpc-sub{font-size:10px;color:var(--gmt)}
.msg.me .mpc-sub{color:var(--gmt)}

/* Вложения */
.msg-files{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.msg-file{
  display:flex;align-items:center;gap:9px;padding:8px 10px;
  background:var(--w);border:1px solid var(--bdr);border-radius:var(--rm);
  cursor:pointer;transition:all .15s
}
.msg.me .msg-file{background:var(--w);border-color:var(--bdr)}
.msg-file:hover{border-color:var(--gb)}
.mf-icon{
  width:32px;height:32px;border-radius:8px;background:var(--gl);
  display:grid;place-items:center;flex-shrink:0
}
.mf-icon svg{width:14px;height:14px;stroke:var(--g);fill:none;stroke-width:1.8;stroke-linecap:round}
.msg.me .mf-icon{background:var(--gl)}
.msg.me .mf-icon svg{stroke:var(--g)}
.mf-body{flex:1;min-width:0}
.mf-name{font-size:11px;font-weight:700;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg.me .mf-name{color:var(--t)}
.mf-size{font-size:9px;color:var(--gmt);margin-top:1px}
.msg.me .mf-size{color:var(--gmt)}

/* Картинка */
.msg-image{
  margin-top:5px;border-radius:var(--rm);overflow:hidden;
  max-width:260px;cursor:pointer;border:1px solid var(--bdr)
}
.msg-image img{width:100%;display:block}

/* Индикатор печати */
.typing-bubble{
  align-self:flex-start;padding:10px 14px;background:var(--w);
  border:1px solid var(--bdr);border-radius:var(--rl);border-bottom-left-radius:6px;
  display:flex;align-items:center;gap:4px;margin:0 0 0 36px
}
.typing-dot{
  width:6px;height:6px;border-radius:50%;background:var(--gmt);
  animation:typingDot 1.2s infinite ease-in-out
}
.typing-dot:nth-child(2){animation-delay:.15s}
.typing-dot:nth-child(3){animation-delay:.3s}
@keyframes typingDot{0%,60%,100%{opacity:.3;transform:scale(.85)}30%{opacity:1;transform:scale(1)}}

/* Блок ответа (над инпутом) */
.reply-bar{
  padding:8px 14px;background:var(--gp);border-top:1px solid var(--bdr);
  display:none;align-items:center;gap:10px;flex-shrink:0
}
.reply-bar.active{display:flex}
.reply-line{width:2.5px;height:28px;background:var(--g);border-radius:2px;flex-shrink:0}
.reply-body{flex:1;min-width:0}
.reply-to{font-size:10px;font-weight:700;color:var(--g);margin-bottom:1px}
.reply-text{font-size:11px;color:var(--tm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-close{
  width:24px;height:24px;border-radius:6px;border:none;background:transparent;
  cursor:pointer;color:var(--gmt);display:grid;place-items:center
}
.reply-close:hover{background:var(--w);color:var(--red)}
.reply-close svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* Инпут */
/* Голосовые сообщения */
.voice-rec-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--gp);border-top:1px solid var(--bdr);flex-shrink:0}
.voice-rec-cancel,.voice-rec-stop,.voice-rec-send{width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:background .12s,transform .1s}
.voice-rec-cancel{background:#FCE8E8;color:var(--red)}
.voice-rec-cancel:hover{background:#F7CACA;transform:scale(1.05)}
.voice-rec-stop{background:var(--g);color:#fff;animation:vrPulse 1.4s ease-in-out infinite}
.voice-rec-stop:hover{background:var(--gm);transform:scale(1.05)}
.voice-rec-send{background:var(--g);color:#fff}
.voice-rec-send:hover{background:var(--gm);transform:scale(1.05)}
.voice-rec-cancel svg,.voice-rec-stop svg,.voice-rec-send svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes vrPulse{0%,100%{box-shadow:0 0 0 0 rgba(30,138,76,.4)}50%{box-shadow:0 0 0 8px rgba(30,138,76,0)}}
.voice-rec-time{font-size:13px;font-weight:700;color:var(--t);font-variant-numeric:tabular-nums;min-width:48px;text-align:center}
.voice-rec-dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:vrBlink 1s ease-in-out infinite;flex-shrink:0}
@keyframes vrBlink{0%,100%{opacity:1}50%{opacity:.3}}
.voice-rec-wave{flex:1;height:32px;display:flex;align-items:center;gap:2px;overflow:hidden}
.voice-rec-wave .vw-bar{flex:1;min-width:2px;max-width:3px;background:var(--g);border-radius:99px;transition:height .08s ease-out}

/* Preview плеер голосового перед отправкой */
.voice-prev-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--gp);border-top:1px solid var(--bdr);flex-shrink:0}
.voice-prev-play{width:36px;height:36px;border-radius:50%;background:var(--g);color:#fff;border:none;cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.voice-prev-play:hover{background:var(--gm)}
.voice-prev-play svg{width:14px;height:14px;fill:currentColor}
.voice-prev-track{flex:1;height:4px;background:var(--bdr);border-radius:99px;cursor:pointer;position:relative;overflow:hidden}
.voice-prev-progress{height:100%;background:var(--g);border-radius:99px;width:0%;transition:width .05s linear}
.voice-prev-time{font-size:12px;font-weight:600;color:var(--t);font-variant-numeric:tabular-nums;min-width:42px;text-align:right}

/* Audio плеер ВНУТРИ сообщения (компактный) */
.msg-voice{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:18px;background:var(--gl);border:1px solid var(--gb);max-width:280px;min-width:220px;margin-top:6px}
.msg.me .msg-voice{background:#fff;border-color:var(--gb)}
.msg-voice-play{width:36px;height:36px;border-radius:50%;background:var(--g);color:#fff;border:none;cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:background .12s,transform .1s}
.msg-voice-play:hover{background:var(--gm);transform:scale(1.05)}
.msg-voice-play svg{width:14px;height:14px;fill:currentColor}
.msg-voice-mid{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.msg-voice-wave{height:24px;display:flex;align-items:center;gap:2px;cursor:pointer;position:relative}
.msg-voice-wave .vwb{flex:1;min-width:2px;max-width:3px;background:var(--gb);border-radius:99px;transition:background .1s}
.msg-voice-wave .vwb.played{background:var(--g)}
.msg-voice-time{font-size:11px;font-weight:600;color:var(--gmt);font-variant-numeric:tabular-nums}

.chat-input-wrap{
  padding:12px 16px;border-top:1px solid var(--bdr);
  display:flex;align-items:flex-end;gap:8px;flex-shrink:0;background:var(--w)
}
.chat-input-wrap > .ci-attach,
.chat-input-wrap > .ci-send{align-self:flex-end;margin-bottom:0}
.chat-input-wrap > .ci-input-box{align-self:stretch}
.ci-attach{
  width:36px;height:36px;border-radius:var(--rm);border:1.5px solid var(--bdr);
  background:var(--gp);display:grid;place-items:center;cursor:pointer;
  transition:all .15s;color:var(--gmt);flex-shrink:0
}
.ci-attach:hover{border-color:var(--gb);background:var(--gl);color:var(--g)}
.ci-attach svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ci-input-box{
  flex:1;display:flex;align-items:flex-end;gap:6px;
  background:var(--gp);border:1.5px solid var(--bdr);border-radius:var(--rl);
  padding:7px 10px 7px 14px;transition:border-color .2s;min-height:36px
}
.ci-input-box:focus-within{border-color:var(--gm);background:var(--w)}
.ci-textarea{
  flex:1;border:none;outline:none;background:transparent;
  font-family:inherit;font-size:13px;color:var(--t);resize:none;
  max-height:100px;min-height:22px;line-height:1.5;padding:0
}
.ci-textarea::placeholder{color:var(--gmt)}
.ci-inline-btns{display:flex;align-items:center;gap:2px;flex-shrink:0;padding-bottom:1px}
.ci-inline{
  width:26px;height:26px;border-radius:6px;border:none;background:transparent;
  cursor:pointer;display:grid;place-items:center;color:var(--gmt);transition:all .15s
}
.ci-inline:hover{background:var(--gl);color:var(--g)}
.ci-inline svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ci-send{
  width:36px;height:36px;border-radius:var(--rm);border:none;background:var(--g);
  display:grid;place-items:center;cursor:pointer;transition:all .15s;
  color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(30,138,76,.25)
}
.ci-send:hover{background:var(--gm)}
.ci-send svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Пустое состояние */
.empty-state{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:40px 20px;text-align:center
}
.empty-icon{
  width:72px;height:72px;border-radius:20px;background:var(--gl);border:1.5px solid var(--gb);
  display:grid;place-items:center
}
.empty-icon svg{width:32px;height:32px;stroke:var(--g);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.empty-title{font-size:15px;font-weight:800;color:var(--t)}
.empty-text{font-size:12px;color:var(--gmt);max-width:260px;line-height:1.55}

/* ═══ RIGHT ═══ */
.right{grid-area:right;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.right::-webkit-scrollbar{display:none}
.card{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:14px;box-shadow:var(--sh);transition:box-shadow .2s ease,transform .2s ease}
.card:hover{box-shadow:var(--shm);transform:translateY(-3px)}
.block-title{font-size:10px;font-weight:700;color:var(--gmt);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.stat-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bdr)}
.stat-row:last-child{border-bottom:none;padding-bottom:0}
.stat-lbl{font-size:12px;color:var(--gmt)}
.stat-val{font-size:13px;font-weight:700;color:var(--t)}
.live-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bdr)}
.live-row:last-child{border-bottom:none;padding-bottom:0}
.live-emoji{font-size:14px;width:20px;text-align:center;flex-shrink:0}
.live-label{font-size:12px;color:var(--gmt);flex:1}
.live-val{font-size:12px;font-weight:700;color:var(--g);text-decoration:none}
.live-val:hover{text-decoration:underline}
.live-dot{width:8px;height:8px;border-radius:50%;background:#22CC66;flex-shrink:0;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.live-n{font-size:13px;font-weight:800;color:var(--t)}
.rec-item{display:flex;align-items:center;gap:9px;padding:6px;border-radius:var(--rm);cursor:pointer;transition:background .15s}
.rec-item:hover{background:var(--gp)}
.rec-av{width:32px;height:32px;border-radius:9px;font-size:11px;font-weight:800;color:#fff;display:grid;place-items:center;flex-shrink:0}
.rec-name{font-size:12px;font-weight:700;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-sub{font-size:10px;color:var(--gmt);margin-top:1px}
.ad-block{background:#F8F5FF;border:1px solid #DDD0F0;border-radius:var(--rxl);padding:14px;position:relative;overflow:hidden}
.ad-label{position:absolute;top:10px;left:10px;background:#EAE0FA;color:#8060C0;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:6px}
.ad-content{margin-top:20px;text-align:center}
.ad-title{font-size:13px;font-weight:700;color:#5040A0}
.ad-sub{font-size:11px;color:#7060B0;margin-top:3px}
.ad-btn{display:block;margin:10px auto 0;padding:7px 20px;border-radius:var(--rm);background:#7060B0;color:#fff;font-size:12px;font-weight:600;border:none;cursor:pointer;font-family:inherit}
.ad-btn:hover{opacity:.88}

/* ═══ ВЫПАДАЮЩАЯ ПАНЕЛЬ СВЕДЕНИЙ ═══ */
.info-overlay{
  position:fixed;inset:0;background:rgba(15,25,18,.3);backdrop-filter:blur(3px);
  z-index:150;opacity:0;pointer-events:none;transition:opacity .2s
}
.info-overlay.open{opacity:1;pointer-events:all}
.info-panel{
  position:fixed;top:66px;bottom:10px;right:10px;
  width:340px;max-width:calc(100vw - 20px);
  background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);
  box-shadow:-4px 10px 40px rgba(30,138,76,.18);
  z-index:160;transform:translateX(calc(100% + 20px));transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;overflow:hidden
}
.info-panel.open{transform:translateX(0)}
.info-head{
  padding:14px 16px;border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:10px;flex-shrink:0
}
.info-close{
  width:28px;height:28px;border-radius:8px;border:1.5px solid var(--bdr);
  background:var(--gp);display:grid;place-items:center;cursor:pointer;
  color:var(--gmt);transition:all .15s;flex-shrink:0
}
.info-close:hover{border-color:var(--gb);background:var(--gl);color:var(--g)}
.info-close svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.info-head-t{font-size:13px;font-weight:800;color:var(--t)}
.info-body{flex:1;overflow-y:auto}
.info-body::-webkit-scrollbar{width:4px}
.info-body::-webkit-scrollbar-thumb{background:var(--gb);border-radius:99px}

/* Блок профиля */
.ip-profile{padding:20px 16px;text-align:center;border-bottom:1px solid var(--bdr)}
.ip-av{
  width:72px;height:72px;border-radius:50%;margin:0 auto 10px;
  display:grid;place-items:center;font-size:26px;font-weight:800;color:#fff;
  position:relative
}
.ip-online{
  position:absolute;bottom:2px;right:2px;
  width:16px;height:16px;border-radius:50%;background:#22CC66;
  border:3px solid var(--w)
}
.ip-name{font-size:16px;font-weight:800;color:var(--t);margin-bottom:3px}
.ip-role{font-size:12px;color:var(--gmt);margin-bottom:12px}
.ip-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ip-btn{
  padding:7px;border-radius:var(--rm);border:1.5px solid var(--bdr);
  background:var(--gp);color:var(--tm);font-family:inherit;font-size:11px;font-weight:600;
  cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:5px
}
.ip-btn:hover{border-color:var(--gb);color:var(--g);background:var(--gl)}
.ip-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.ip-btn.primary{background:var(--g);border-color:var(--g);color:#fff}
.ip-btn.primary:hover{background:var(--gm);border-color:var(--gm);color:#fff}
.ip-btn.primary svg{stroke:#fff}

/* О пользователе */
.ip-section{padding:14px 16px;border-bottom:1px solid var(--bdr)}
.ip-section:last-child{border-bottom:none}
.ip-section-title{font-size:10px;font-weight:700;color:var(--gmt);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.ip-field{display:flex;align-items:center;gap:9px;padding:6px 0}
.ip-field-ico{
  width:28px;height:28px;border-radius:8px;background:var(--gl);border:1px solid var(--gb);
  display:grid;place-items:center;flex-shrink:0
}
.ip-field-ico svg{width:12px;height:12px;stroke:var(--g);fill:none;stroke-width:1.8;stroke-linecap:round}
.ip-field-body{flex:1;min-width:0}
.ip-field-lbl{font-size:10px;color:var(--gmt);margin-bottom:1px}
.ip-field-val{font-size:12px;font-weight:600;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Табы вложений */
.ip-tabs{
  display:flex;gap:4px;padding:10px 16px 0;border-bottom:1px solid var(--bdr);
  overflow-x:auto;scrollbar-width:none;flex-shrink:0;min-width:0;max-width:100%
}
.ip-tabs::-webkit-scrollbar{display:none}
.ip-tab{
  padding:7px 10px;border:none;background:transparent;
  font-family:inherit;font-size:11px;font-weight:600;color:var(--gmt);
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px
}
.ip-tab:hover{color:var(--g)}
.ip-tab.active{color:var(--g);border-bottom-color:var(--g)}
.ip-tab-n{
  padding:1px 5px;border-radius:99px;background:var(--gp);
  font-size:9px;font-weight:700
}
.ip-tab.active .ip-tab-n{background:var(--gl);color:var(--g)}

/* Содержимое табов */
.ip-tab-content{display:none;padding:10px 16px 16px}
.ip-tab-content.active{display:block}

/* Сетка изображений */
.ip-images-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:10px
}
.ip-img-cell{
  aspect-ratio:1;border-radius:var(--r);cursor:pointer;
  position:relative;overflow:hidden;transition:transform .15s;
  border:1px solid var(--bdr)
}
.ip-img-cell:hover{transform:scale(.97)}
.ip-img-cell:hover .ip-img-overlay{opacity:1}
.ip-img-overlay{
  position:absolute;inset:0;background:rgba(15,25,18,.55);
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;color:#fff;text-align:center;padding:4px;
  opacity:0;transition:opacity .15s
}
.ip-show-all{
  width:100%;padding:8px;border-radius:var(--rm);
  background:var(--gp);border:1.5px solid var(--bdr);
  color:var(--tm);font-family:inherit;font-size:11px;font-weight:600;
  cursor:pointer;transition:all .15s
}
.ip-show-all:hover{border-color:var(--gb);color:var(--g);background:var(--gl)}

/* Список сообщений (поиск) */
.ip-msg-item{
  padding:9px 10px;border-radius:var(--rm);background:var(--gp);border:1px solid var(--bdr);
  margin-bottom:6px;cursor:pointer;transition:all .15s
}
.ip-msg-item:hover{border-color:var(--gb);background:var(--gl)}
.ip-msg-meta{font-size:10px;color:var(--gmt);margin-bottom:3px;font-weight:600}
.ip-msg-text{font-size:12px;color:var(--t);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Файлы */
.ip-file-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;
  border-radius:var(--rm);background:var(--gp);border:1px solid var(--bdr);
  margin-bottom:6px;cursor:pointer;transition:all .15s
}
.ip-file-item:hover{border-color:var(--gb);background:var(--gl)}
.ip-file-ico{
  width:36px;height:36px;border-radius:9px;background:var(--w);border:1px solid var(--bdr);
  display:grid;place-items:center;flex-shrink:0
}
.ip-file-ico svg{width:15px;height:15px;stroke:var(--g);fill:none;stroke-width:1.8;stroke-linecap:round}
.ip-file-b{flex:1;min-width:0}
.ip-file-n{font-size:11px;font-weight:700;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ip-file-m{font-size:10px;color:var(--gmt);margin-top:1px}
.ip-file-dl{
  width:26px;height:26px;border-radius:7px;border:1.5px solid var(--bdr);background:var(--w);
  display:grid;place-items:center;cursor:pointer;flex-shrink:0;color:var(--gmt);transition:all .15s
}
.ip-file-dl:hover{border-color:var(--gb);color:var(--g);background:var(--gl)}
.ip-file-dl svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* Ссылки */
.ip-link-item{
  padding:9px 10px;border-radius:var(--rm);background:var(--gp);border:1px solid var(--bdr);
  margin-bottom:6px;cursor:pointer;transition:all .15s
}
.ip-link-item:hover{border-color:var(--gb)}
.ip-link-t{font-size:11px;font-weight:700;color:var(--t);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ip-link-u{font-size:10px;color:var(--g);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ip-link-d{font-size:10px;color:var(--gmt)}

/* Аудио */
.ip-audio-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;
  border-radius:var(--rm);background:var(--gp);border:1px solid var(--bdr);
  margin-bottom:6px
}
.ip-audio-play{
  width:34px;height:34px;border-radius:50%;background:var(--g);border:none;
  display:grid;place-items:center;cursor:pointer;flex-shrink:0;color:#fff;transition:background .15s
}
.ip-audio-play:hover{background:var(--gm)}
.ip-audio-play svg{width:13px;height:13px;fill:#fff;stroke:none;margin-left:2px}
.ip-audio-b{flex:1;min-width:0}
.ip-audio-wave{
  display:flex;align-items:center;gap:2px;margin-bottom:4px;height:14px
}
.ip-audio-wave span{
  width:2px;background:var(--gb);border-radius:2px;flex-shrink:0
}
.ip-audio-meta{display:flex;justify-content:space-between;gap:8px}
.ip-audio-d{font-size:10px;font-weight:600;color:var(--t)}
.ip-audio-t{font-size:10px;color:var(--gmt)}

.ip-empty{text-align:center;padding:30px 20px;color:var(--gmt);font-size:12px}

/* Имя собеседника кликабельное */
.ch-info{cursor:pointer;transition:opacity .15s}
.ch-info:hover{opacity:.7}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#1A2A22;color:#fff;padding:10px 18px;border-radius:var(--rm);font-size:13px;font-weight:600;z-index:300;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:1200px){.shell{grid-template-columns:220px 1fr}.chat-panel{grid-template-columns:260px 1fr}}
@media(max-width:1000px){.shell{grid-template-columns:220px 1fr}}
@media(max-width:740px){.shell{grid-template-columns:52px 1fr}.nav-item span,.nav-group{display:none}.nav-item{justify-content:center;padding:10px}.chat-panel{grid-template-columns:1fr}.dialogs{display:none}}

/* Unified hover effect for all card-like classes */
[class*="card"]{transition:box-shadow .2s ease,transform .2s ease}
[class*="card"]:hover{box-shadow:var(--shm);transform:translateY(-3px)}
.chat-search-bar{display:none;align-items:center;gap:8px;padding:8px 12px;background:var(--gp);border-bottom:1px solid var(--bdr);font-size:12px}
.chat-search-bar.open{display:flex}
.chat-search-bar input{flex:1;background:var(--w);border:1px solid var(--bdr);border-radius:8px;padding:6px 10px;font-size:12px;font-family:inherit;color:var(--t);outline:none}
.chat-search-bar input:focus{border-color:var(--g)}
.chat-search-counter{font-size:11px;color:var(--gmt);min-width:50px;text-align:center}
.chat-search-nav{display:flex;gap:4px}
.chat-search-nav button{width:24px;height:24px;border-radius:6px;background:transparent;border:1px solid var(--bdr);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--tm)}
.chat-search-nav button:hover{background:var(--w);border-color:var(--g)}
.chat-search-nav button:disabled{opacity:.4;cursor:not-allowed}
.chat-search-nav button svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.chat-search-close{background:transparent;border:none;cursor:pointer;color:var(--gmt);font-size:18px;padding:0 4px}
.msg.search-highlight .msg-bubble{box-shadow:0 0 0 2px var(--g);transition:box-shadow .2s}
.msg.search-current .msg-bubble{box-shadow:0 0 0 2px #FFA500;background:rgba(255,165,0,0.08)}
</style>

<style>
.nd-overlay{position:fixed;inset:0;background:rgba(10,20,16,.35);backdrop-filter:blur(2px);z-index:300;opacity:0;pointer-events:none;transition:.2s}
.nd-overlay.open{opacity:1;pointer-events:auto}.nd-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-46%);width:min(560px,92vw);background:var(--w);border:1px solid var(--bdr);border-radius:var(--rl);box-shadow:var(--shm);z-index:301;opacity:0;pointer-events:none;transition:.2s}.nd-modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.nd-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bdr);font-weight:800}.nd-close{border:0;background:transparent;cursor:pointer}.nd-tabs{display:flex;gap:8px;padding:12px}.nd-tab{padding:6px 12px;border:1px solid var(--bdr);border-radius:99px;background:var(--gp);cursor:pointer}.nd-tab.active{background:var(--g);color:#fff;border-color:var(--g)}
.nd-body{padding:0 12px 12px}.nd-pane{display:none}.nd-pane.active{display:block}.nd-search,.nd-input{width:100%;height:34px;margin-bottom:8px;padding:0 10px;border:1px solid var(--bdr);border-radius:8px}.nd-list{max-height:240px;overflow:auto;border:1px solid var(--bdr);border-radius:10px}.nd-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--bdr);cursor:pointer}.nd-item:last-child{border-bottom:none}.nd-selected{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.nd-chip{padding:4px 8px;border-radius:99px;background:var(--gl);border:1px solid var(--gb);font-size:11px}.nd-submit{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--g);background:var(--g);color:#fff;cursor:pointer}
.msg-actions{position:absolute;top:-14px;right:6px;display:none;background:var(--w);border:1px solid var(--bdr);border-radius:99px;box-shadow:var(--sh);padding:2px;gap:1px;z-index:5}
.msg-bubble:hover .msg-actions{display:flex}
.msg-actions button{width:26px;height:26px;border-radius:50%;border:none;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--gmt);transition:background .12s,color .12s}
.msg-actions button:hover{background:var(--gp);color:var(--g)}
.msg-actions button.danger:hover{background:#FCE8E8;color:var(--red)}
.msg-actions svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.msg.me .msg-actions{right:6px}
.msg.them .msg-actions{left:6px;right:auto}
.msg-bubble{position:relative}

/* Forward модалка */
.fwd-overlay{position:fixed;inset:0;background:rgba(15,25,18,.45);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.fwd-overlay.open{display:flex}
.fwd-modal{background:var(--w);border-radius:var(--rxl);border:1px solid var(--bdr);box-shadow:0 24px 60px rgba(30,138,76,.15);width:100%;max-width:460px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden}
.fwd-head{padding:18px 20px 12px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
.fwd-head h3{font-size:16px;font-weight:800;color:var(--t);margin:0}
.fwd-x{width:30px;height:30px;border-radius:8px;background:var(--gp);border:none;cursor:pointer;display:grid;place-items:center;color:var(--gmt)}
.fwd-x:hover{background:var(--gl);color:var(--g)}
.fwd-x svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.fwd-search{padding:10px 16px;border-bottom:1px solid var(--bdr)}
.fwd-search input{width:100%;height:34px;padding:0 12px;border:1.5px solid var(--bdr);border-radius:99px;background:var(--gp);font-family:inherit;font-size:13px;outline:none}
.fwd-search input:focus{border-color:var(--gm);background:var(--w)}
.fwd-list{flex:1;overflow-y:auto;padding:6px}
.fwd-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--rm);cursor:pointer;transition:background .12s}
.fwd-item:hover{background:var(--gp)}
.fwd-av{width:36px;height:36px;border-radius:10px;font-size:12px;font-weight:800;color:#fff;display:grid;place-items:center;flex-shrink:0;background-size:cover;background-position:center}
.fwd-name{font-size:13px;font-weight:700;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emoji-picker{position:absolute;bottom:62px;right:78px;max-width:240px;display:none;flex-wrap:wrap;gap:4px;padding:8px;background:var(--w);border:1px solid var(--bdr);border-radius:10px;box-shadow:var(--sh)}.emoji-picker.open{display:flex}.emoji-picker button{border:0;background:transparent;cursor:pointer;font-size:18px}
</style>
<link rel="stylesheet" href="/assets/dark-theme.css">
</head>
<body>
<div class="shell">

<!-- ── LOGO ── -->
<a class="logo-cell" href="/">
  <img src="/assets/lastop-group-logo.svg" alt="LASTOP GROUP" onerror="this.style.display='none'"></a>

<!-- ── TOPBAR ── -->
<header class="topbar"></header>

<!-- ── NAV ── -->
<nav class="nav"></nav>

<!-- ════════════════════ MAIN — чат ════════════════════ -->
<div class="main">

  <div class="chat-panel">

  <!-- ── Список диалогов ── -->
  <aside class="dialogs">
    <div class="dialogs-head">
      <div class="dh-row">
        <div class="dh-title">Сообщения</div>
        <button class="dh-btn" onclick="openNewDialogModal()" title="Новый диалог">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <div class="d-search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="dialogSearch" type="search" placeholder="Поиск диалогов…" oninput="filterDialogs(this.value)">
      </div>
    </div>

    <div class="d-tabs">
      <button class="d-tab active" onclick="filterTab('all', this)">Все <span class="d-tab-count" id="dTabCntAll">0</span></button>
      <button class="d-tab" onclick="filterTab('unread', this)">Непрочитанные <span class="d-tab-count" id="dTabCntUnread">0</span></button>
      <button class="d-tab" onclick="filterTab('companies', this)">Компании <span class="d-tab-count" id="dTabCntCompanies">0</span></button>
    </div>

    <div class="d-list" id="dialogList"></div>
  </aside>

  <!-- ── Окно чата ── -->
  <section class="chat">

    <!-- Шапка -->
    <div class="chat-head">
      <div class="ch-av-wrap">
        <div class="ch-av" id="chatAv" style="background:transparent"></div>
        <div class="ch-online-dot" id="chatOnlineDot" style="display:none"></div>
      </div>
      <div class="ch-info" onclick="openInfoPanel()">
        <div class="ch-name" id="chatName"></div>
        <div class="ch-status" id="chatStatus"></div>
      </div>
      <div class="ch-actions">
        <button class="chat-friend-btn" id="chatFriendBtn" onclick="chatFriendClick()" style="display:none" title="">
          <svg id="chatFriendIcon" viewBox="0 0 24 24"></svg>
          <span id="chatFriendLabel"></span>
        </button>
        <button class="ch-act" title="Поиск в диалоге" onclick="openChatSearch()">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="ch-act" title="Аудиозвонок" onclick="showToast('Аудиозвонки будут доступны в следующей версии')">
          <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </button>
        <button class="ch-act" title="Видеозвонок" onclick="showToast('Видеозвонки будут доступны в следующей версии')">
          <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        </button>
        <button class="ch-act" title="Сведения о диалоге" onclick="openInfoPanel()">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        </button>
      </div>
    </div>

    <!-- Лента сообщений -->
    <div class="chat-search-bar" id="chatSearchBar">
      <input type="text" id="chatSearchInput" placeholder="Поиск в диалоге..." oninput="searchInChat(this.value)">
      <span class="chat-search-counter" id="chatSearchCounter"></span>
      <div class="chat-search-nav">
        <button id="chatSearchPrev" onclick="searchNavigate(-1)" title="Предыдущее"><svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg></button>
        <button id="chatSearchNext" onclick="searchNavigate(1)" title="Следующее"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button>
      </div>
      <button class="chat-search-close" onclick="closeChatSearch()">✕</button>
    </div>
    <div class="chat-body" id="chatBody">
      <div style="text-align:center;padding:60px 20px;color:var(--gmt);font-size:13px">Выберите диалог слева, чтобы начать общение</div>
    </div>

    <!-- Блок ответа -->
    <div class="reply-bar" id="replyBar">
      <div class="reply-line"></div>
      <div class="reply-body">
        <div class="reply-to" id="replyToTitle">Ответ</div>
        <div class="reply-text" id="replyText"></div>
      </div>
      <button class="reply-close" onclick="closeReply()">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- A2.1: баннер «Отправляете как ...» -->
    <div id="composeAsBanner" class="compose-as-banner" style="display:none"></div>

    <!-- Инпут -->
    <div class="chat-input-wrap">
      <button class="ci-attach" onclick="triggerAttach()" title="Прикрепить">
        <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <div class="ci-input-box">
        <textarea class="ci-textarea" id="msgInput" placeholder="Написать сообщение…" rows="1" oninput="autoGrow(this)" onkeydown="handleEnter(event)"></textarea>
        <div class="ci-inline-btns">
          <button class="ci-inline" onclick="toggleEmojiPicker()" title="Эмодзи">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          </button>
          <button class="ci-inline" onclick="startVoiceRecord()" title="Голосовое сообщение">
            <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button class="ci-send" onclick="sendMessage()" title="Отправить">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>

  </section>

  </div><!-- /chat-panel -->

</div><!-- /main -->

</div><!-- /shell -->

<!-- Lightbox для картинок чата (12-D) -->
<div class="chat-lightbox" id="chatLightbox" onclick="closeChatLightbox(event)" style="position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:2000;padding:40px;cursor:zoom-out">
  <button class="cl-nav cl-prev" id="clPrev" onclick="event.stopPropagation();clStep(-1)" style="display:none;position:absolute;left:24px;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:24px;cursor:pointer;backdrop-filter:blur(10px)">‹</button>
  <img id="chatLightboxImg" src="" alt="" onclick="event.stopPropagation()" style="max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5)">
  <button class="cl-nav cl-next" id="clNext" onclick="event.stopPropagation();clStep(1)" style="display:none;position:absolute;right:24px;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:24px;cursor:pointer;backdrop-filter:blur(10px)">›</button>
  <div id="chatLightboxCount" style="position:absolute;top:24px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;font-weight:600;background:rgba(0,0,0,.4);padding:6px 14px;border-radius:99px;backdrop-filter:blur(10px);display:none"></div>
  <button onclick="closeChatLightbox(event)" style="position:absolute;top:24px;right:24px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;cursor:pointer;backdrop-filter:blur(10px);font-size:18px">✕</button>
</div>

<!-- ═══ ВЫПАДАЮЩАЯ ПАНЕЛЬ СВЕДЕНИЙ ═══ -->
<div class="info-overlay" id="infoOverlay" onclick="closeInfoPanel()"></div>
<aside class="info-panel" id="infoPanel">
  <div class="info-head">
    <button class="info-close" onclick="closeInfoPanel()">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="info-head-t">Сведения о диалоге</div>
  </div>

  <div class="info-body">

    <!-- Профиль -->
    <div class="ip-profile">
      <div class="ip-av" id="ipAv" style="background:var(--gp)"></div>
      <div class="ip-name" id="ipName"></div>
      <div class="ip-role" id="ipRole"></div>
      <div class="ip-actions">
        <button class="ip-btn primary" id="ipOpenProfileBtn" onclick="openPeerProfile()">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Открыть профиль
        </button>
        <button class="ip-btn" id="ipAddFriendBtn" onclick="sendFriendRequest()">
          <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
          В друзья
        </button>
      </div>
    </div>

    <!-- Информация -->
    <div class="ip-section" id="ipUserInfoSection">
      <div class="ip-section-title">О пользователе</div>
      <div id="ipUserFields"></div>
    </div>

    <!-- Вложения из переписки -->
    <div class="ip-tabs">
      <button class="ip-tab active" data-tab="images" onclick="switchInfoTab('images',this)">
        <svg viewBox="0 0 14 14" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round"><rect x="1.5" y="1.5" width="11" height="11" rx="1"/><circle cx="5" cy="5" r="1"/><polyline points="12.5 9 9.5 6 1.5 12.5"/></svg>
        Изображения <span class="ip-tab-n" id="ipCntImages">0</span>
      </button>
      <button class="ip-tab" data-tab="files" onclick="switchInfoTab('files',this)">
        <svg viewBox="0 0 14 14" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round"><path d="M8 1H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V5"/><polyline points="8 1 8 5 12 5"/></svg>
        Файлы <span class="ip-tab-n" id="ipCntFiles">0</span>
      </button>
      <button class="ip-tab" data-tab="links" onclick="switchInfoTab('links',this)">
        <svg viewBox="0 0 14 14" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round"><path d="M6 8a3 3 0 0 0 4 0l2-2a3 3 0 0 0-4-4L7 3"/><path d="M8 6a3 3 0 0 0-4 0L2 8a3 3 0 0 0 4 4l1-1"/></svg>
        Ссылки <span class="ip-tab-n" id="ipCntLinks">0</span>
      </button>
      <button class="ip-tab" data-tab="audio" onclick="switchInfoTab('audio',this)">
        <svg viewBox="0 0 14 14" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round"><path d="M7 1a2 2 0 0 0-2 2v4a2 2 0 0 0 4 0V3a2 2 0 0 0-2-2z"/><path d="M11 6v1a4 4 0 0 1-8 0V6"/><line x1="7" y1="11" x2="7" y2="13"/></svg>
        Аудио <span class="ip-tab-n" id="ipCntAudio">0</span>
      </button>
    </div>

    <div class="ip-tab-content active" id="ipt-images"></div>
    <div class="ip-tab-content" id="ipt-files" style="display:none"></div>
    <div class="ip-tab-content" id="ipt-links" style="display:none"></div>
    <div class="ip-tab-content" id="ipt-audio" style="display:none"></div>

  </div>

    <!-- Опасная зона -->
    <div class="ip-section" style="margin-top:auto;border-top:1px solid var(--bdr);padding-top:14px">
      <button class="ip-btn" id="ipDeleteChatBtn" onclick="confirmDeleteChat()" style="width:100%;color:var(--red);border-color:#FABCBC;background:#FFF5F5">
        <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        Удалить чат
      </button>
    </div>
</aside>


<div class="nd-overlay" id="newDialogOverlay" onclick="closeNewDialog()"></div>
<div class="nd-modal" id="newDialogModal">
  <div class="nd-head"><span>Новый диалог</span><button class="nd-close" onclick="closeNewDialog()">✕</button></div>
  <div class="nd-tabs">
    <button class="nd-tab active" onclick="ndSwitchTab('direct', this)">Личный</button>
    <button class="nd-tab" onclick="ndSwitchTab('group', this)">Группа</button>
  </div>
  <div class="nd-body">
    <div class="nd-pane active" id="nd-direct"><input class="nd-search" id="ndSearchUsers" placeholder="Поиск друзей…" oninput="ndSearchFriends(this.value)"><div class="nd-list" id="ndFriendList"></div></div>
    <div class="nd-pane" id="nd-group"><input class="nd-input" id="ndGroupTitle" placeholder="Название группы"><input class="nd-search" id="ndGroupSearch" placeholder="Добавить участников…" oninput="ndSearchForGroup(this.value)"><div class="nd-list" id="ndGroupList"></div><div class="nd-selected" id="ndGroupSelected"></div><button class="nd-submit" onclick="ndCreateGroup()">Создать группу</button></div>
  </div>
</div>
<input id="chatHiddenFile" type="file" hidden multiple accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.zip,.rar,.txt">
<div class="emoji-picker" id="emojiPicker"></div>
<div class="toast" id="toast"></div>

<script>
const API='/api';const tk=()=>localStorage.getItem('token');
const state={conversations:[],allConversationsForCounts:[],activeConvPublicID:null,messages:[],typingUsers:[],activeFilter:'all',searchQuery:'',replyTo:null,editing:null,pollTimer:null,typingTimer:null,currentUser:null,groupSelected:[],uploading:false,myCompanies:[],myCommunities:[]};
// ── Кнопка дружбы в шапке диалога ───────────────────────
let _chatPeerPublicID = '';
let _chatPeerFriendStatus = 'none';

async function loadChatPeerStatus(peerPublicID){
  if (!peerPublicID) return;
  _chatPeerPublicID = peerPublicID;
  try {
    const r = await fetch('/api/users/' + encodeURIComponent(peerPublicID), {
      headers: { Authorization: 'Bearer ' + localStorage.getItem('token') }
    });
    if (!r.ok) throw 0;
    const d = await r.json();
    _chatPeerFriendStatus = (d.user && d.user.friend_status) || 'none';
    applyChatFriendButton();
    // Обновляем кнопку в инфо-панели (она использует тот же _chatPeerFriendStatus)
    if (state.activeConversation) renderInfoPanel();
  } catch {
    _chatPeerFriendStatus = 'none';
    applyChatFriendButton();
    if (state.activeConversation) renderInfoPanel();
  }
}

function applyChatFriendButton(){
  const btn = document.getElementById('chatFriendBtn');
  const lbl = document.getElementById('chatFriendLabel');
  const icon = document.getElementById('chatFriendIcon');
  if (!btn || !lbl) return;

  if (_chatPeerFriendStatus === 'self' || !_chatPeerPublicID) {
    btn.style.display = 'none';
    return;
  }

  btn.style.display = '';
  btn.classList.remove('is-outgoing','is-incoming','is-friends');

  switch (_chatPeerFriendStatus) {
    case 'friends':
      lbl.textContent = 'В друзьях';
      btn.classList.add('is-friends');
      btn.title = 'Удалить из друзей';
      if (icon) icon.innerHTML = '<polyline points="20 6 9 17 4 12"/>';
      break;
    case 'outgoing':
      lbl.textContent = 'Заявка отправлена';
      btn.classList.add('is-outgoing');
      btn.title = 'Отменить заявку';
      if (icon) icon.innerHTML = '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>';
      break;
    case 'incoming':
      lbl.textContent = 'Принять';
      btn.classList.add('is-incoming');
      btn.title = 'Принять заявку';
      if (icon) icon.innerHTML = '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>';
      break;
    default:
      lbl.textContent = 'В друзья';
      btn.title = 'Отправить заявку';
      if (icon) icon.innerHTML = '<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/>';
  }
}

async function chatFriendClick(){
  if (!_chatPeerPublicID || _chatPeerFriendStatus === 'self') return;
  const btn = document.getElementById('chatFriendBtn');
  if (btn) btn.disabled = true;

  const tk = localStorage.getItem('token');
  const headers = { Authorization: 'Bearer ' + tk, 'Content-Type': 'application/json' };

  try {
    if (_chatPeerFriendStatus === 'none') {
      const r = await fetch('/api/friends/request/' + encodeURIComponent(_chatPeerPublicID), { method: 'POST', headers });
      if (!r.ok) throw new Error('failed');
      _chatPeerFriendStatus = 'outgoing';
    } else if (_chatPeerFriendStatus === 'outgoing') {
      const r = await fetch('/api/friends/cancel/' + encodeURIComponent(_chatPeerPublicID), { method: 'POST', headers });
      if (!r.ok) throw new Error('failed');
      _chatPeerFriendStatus = 'none';
    } else if (_chatPeerFriendStatus === 'incoming') {
      const r = await fetch('/api/friends/accept/' + encodeURIComponent(_chatPeerPublicID), { method: 'POST', headers });
      if (!r.ok) throw new Error('failed');
      _chatPeerFriendStatus = 'friends';
    } else if (_chatPeerFriendStatus === 'friends') {
      if (!await lastopConfirm({title:'Удалить из друзей?',danger:true})) { if (btn) btn.disabled = false; return; }
      const r = await fetch('/api/friends/' + encodeURIComponent(_chatPeerPublicID), { method: 'DELETE', headers });
      if (!r.ok) throw new Error('failed');
      _chatPeerFriendStatus = 'none';
    }
    applyChatFriendButton();
  } catch {
    if (typeof showToast === 'function') showToast('Не удалось выполнить действие');
  } finally {
    if (btn) btn.disabled = false;
  }
}

const renderCache={conversationsSig:'',messagesSig:'',typingSig:''};
function makeSig(obj){try{return JSON.stringify(obj)}catch{return''}}
const CHAT_CACHE_NS='chat-cache-v1';
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')} function letter(s){const p=String(s||'').trim().split(/\s+/).filter(Boolean);if(!p.length)return '?';if(p.length>=2)return (p[0][0]+p[1][0]).toUpperCase();return p[0][0].toUpperCase();}

const _linkPreviewCache = new Map();
const _linkPreviewPending = new Map();
const URL_RE = /(?:^|\s)(\/[a-z][a-z0-9\-]*\.html\?[^\s<]+|https?:\/\/[^\s<]+)/gi;

function linkifyContent(s){
  return esc(s).replace(/(^|\s)(\/[a-z][a-z0-9\-]*\.html\?[^\s<]+|https?:\/\/[^\s<]+)/gi,
    (_,p,u)=>{
      const isInternal = u.startsWith('/');
      const target = isInternal ? '' : ' target="_blank" rel="noopener"';
      return `${p}<a href="${u}" class="msg-link"${target}>${u}</a>`;
    });
}

function extractURLs(content){
  const out = [];
  const re = /(\/[a-z][a-z0-9\-]*\.html\?[^\s<]+|https?:\/\/[^\s<]+)/gi;
  let m;
  while ((m = re.exec(content)) !== null) {
    if (out.length >= 3) break; // максимум 3 превью на сообщение
    if (!out.includes(m[1])) out.push(m[1]);
  }
  return out;
}

async function loadLinkPreview(url){
  if (_linkPreviewCache.has(url)) return _linkPreviewCache.get(url);
  if (_linkPreviewPending.has(url)) return _linkPreviewPending.get(url);
  const p = (async () => {
    try {
      const r = await fetch('/api/link-preview?url=' + encodeURIComponent(url),
        { headers: { Authorization: 'Bearer ' + tk() } });
      if (!r.ok) return null;
      const d = await r.json();
      if (!d.ok || !d.preview) return null;
      _linkPreviewCache.set(url, d.preview);
      return d.preview;
    } catch { return null; }
  })();
  _linkPreviewPending.set(url, p);
  const result = await p;
  _linkPreviewPending.delete(url);
  if (result) _linkPreviewCache.set(url, result);
  return result;
}

function renderLinkPreviewCard(p){
  if (!p) return '';
  const img = p.image
    ? `<div class="lp-img" style="background-image:url('${esc(p.image)}')"></div>`
    : `<div class="lp-img lp-img-ph">${esc((p.badge||'?')[0])}</div>`;
  const sub = p.subtitle ? `<div class="lp-sub">${esc(p.subtitle)}</div>` : '';
  const target = p.url.startsWith('/') ? '' : ' target="_blank" rel="noopener"';
  return `<a href="${esc(p.url)}" class="lp-card"${target}>
    ${img}
    <div class="lp-body">
      <div class="lp-badge">${esc(p.badge||'')}</div>
      <div class="lp-title">${esc(p.title||'')}</div>
      ${sub}
    </div>
  </a>`;
}

async function hydrateLinkPreviews(msgEl, urls){
  for (const url of urls) {
    const preview = await loadLinkPreview(url);
    if (!preview || !msgEl.isConnected) continue;
    const slot = msgEl.querySelector(`.lp-slot[data-url="${CSS.escape(url)}"]`);
    if (slot && !slot.dataset.loaded) {
      slot.innerHTML = renderLinkPreviewCard(preview);
      slot.dataset.loaded = '1';
    }
  }
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
async function api(path,opt={}){
  const h={...(opt.headers||{}),Authorization:`Bearer ${tk()}`};
  if(opt.body&&!(opt.body instanceof FormData)){h['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}
  // A2.1R: для ВСЕХ запросов /chat/* — добавляем заголовок активного контекста.
  // Это влияет и на чтение списка диалогов (фильтр по owner), и на отправку (запись sender_company_id).
  if(path.startsWith('/chat/') && typeof window.withActiveContextHeaders === 'function'){
    Object.assign(h, window.withActiveContextHeaders({}));
  }
  const r=await fetch(API+path,{...opt,headers:h});
  if(r.status===401){localStorage.removeItem('token');location.href='/login.html';throw new Error('401')}
  if(r.status===429)showToast('Слишком часто, подождите секунду');
  if(!r.ok)throw new Error((await r.text())||r.status);
  return r.status===204?{}:r.json()
}
function getCacheUserID(){if(state.currentUser?.public_id)return state.currentUser.public_id;try{return JSON.parse(localStorage.getItem('user')||'{}')?.public_id||'guest'}catch{return'guest'}}
function cacheKeyConversations(){return `${CHAT_CACHE_NS}:${getCacheUserID()}:conversations`}
function cacheKeyMessages(pid){return `${CHAT_CACHE_NS}:${getCacheUserID()}:messages:${pid}`}
function cacheRead(key,fallback){try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback}catch{return fallback}}
function cacheWrite(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{}}
function conversationSortTs(c){const fallback=Date.parse(c?.created_at||'')||0;const last=Date.parse(c?.last_message_at||'')||0;return last||fallback}
function sortConversationsByLastMessage(items){return(items||[]).slice().sort((a,b)=>conversationSortTs(b)-conversationSortTs(a))}
function loadCachedConversations(){const cached=cacheRead(cacheKeyConversations(),[]);if(Array.isArray(cached)&&cached.length){state.conversations=sortConversationsByLastMessage(cached);renderConversations();return true}return false}
function saveCachedConversations(){cacheWrite(cacheKeyConversations(),sortConversationsByLastMessage(state.conversations||[]))}
function loadCachedMessages(pid){const cached=cacheRead(cacheKeyMessages(pid),[]);if(Array.isArray(cached)&&cached.length){state.messages=cached;renderMessages();return true}return false}

async function loadCurrentUser(){
  const d = await api('/me');
  state.currentUser = d.user;
  // ID элементов в HTML chat.html: topbarName, topbarRole, topbarAv (см. строки 680-684)
  // Раньше код искал tpName/tpRole/tpAv — это были ID с другой страницы (template mismatch).
  // Дополнительно защищаемся через optional chaining — если каких-то элементов вдруг нет,
  // не падаем с TypeError, который остановит весь init чата.
  const set = (id, value) => {
    const el = document.getElementById(id);
    if (el) el.textContent = value;
  };
  const fullName = d.user.full_name || ((d.user.first_name || '') + ' ' + (d.user.last_name || '')).trim() || d.user.email || '';
  set('topbarName', fullName);
  set('topbarRole', d.user.position || d.user.company_name || 'Участник LASTOP');
  // pdd-элементы (выпадающее меню профиля)
  set('pddName', fullName);
  set('pddRole', d.user.position || d.user.company_name || 'Участник LASTOP');
  // Аватарки — через LASTOP_SET_AV (учитывает avatar_url, фолбэк на букву)
  const avatarUrl = d.user.avatar_url || '';
  const color = (window.avc ? window.avc(fullName) : '');
  if (window.LASTOP_SET_AV) {
    window.LASTOP_SET_AV('topbarAv', letter(fullName), color, avatarUrl);
    window.LASTOP_SET_AV('pddAv', letter(fullName), color, avatarUrl);
  } else {
    set('topbarAv', letter(fullName));
    set('pddAv', letter(fullName));
  }
}
async function loadConversations(){
  try{
    const d = await api(`/chat/conversations?filter=${encodeURIComponent(state.activeFilter)}&q=${encodeURIComponent(state.searchQuery)}`);
    // Если активный фильтр = all, то это и есть полный список
    if(state.activeFilter==='all' && !state.searchQuery){
      state.allConversationsForCounts = d.conversations || [];
    } else if(!state.allConversationsForCounts.length){
      // Иначе — догружаем полный список фоном для счётчиков
      try{
        const full = await api(`/chat/conversations?filter=all&q=`);
        state.allConversationsForCounts = full.conversations || [];
      }catch(e){}
    }
    state.conversations = sortConversationsByLastMessage(d.conversations || []);
    saveCachedConversations();
    renderConversations();
  }catch(err){
    // Не затираем кеш если запрос упал. Просто оставляем что было.
    // Если кеша не было — state.conversations останется [] и UI покажет «Нет диалогов».
    console.warn('[chat] loadConversations failed:', err);
    if(!state.conversations) state.conversations = [];
    renderConversations();
  }
}
function updateTabCounts(){
  // Считаем по полному списку, не по отфильтрованному
  const conv = state.allConversationsForCounts && state.allConversationsForCounts.length
    ? state.allConversationsForCounts
    : (state.activeFilter === 'all' ? (state.conversations||[]) : []);
  if(!conv.length && state.activeFilter !== 'all') return; // не сбрасываем счётчики
  const all=conv.length;
  const unread=conv.filter(c=>c.unread_count>0).length;
  const companies=conv.filter(c=>{const r=(c.display_role||'').toString();return r.includes('·');}).length;
  const groups=conv.filter(c=>c.type==='group'||c.type==='community').length;
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=String(v);};
  set('dTabCntAll',all);
  set('dTabCntUnread',unread);
  set('dTabCntCompanies',companies);
  set('dTabCntGroups',groups);
}

      authorPrefix = `<span class='me-prefix' style="color:var(--g)">${esc(c.last_message_sender_company_name)}: </span>`;
    } else if(c.last_message_sender_community_name){
      authorPrefix = `<span class='me-prefix' style="color:#9060C0">${esc(c.last_message_sender_community_name)}: </span>`;
    }
    return `<div class="d-item ${state.activeConvPublicID===c.public_id?'active':''} ${c.pinned?'pinned':''}" onclick="selectConversation('${c.public_id}')"><div class="d-av-wrap"><div class="d-av" style="background:${c.display_color}">${c.display_avatar?`<img src="${esc(c.display_avatar)}">`:letter(c.display_name)}</div>${c.is_online?'<div class="d-online"></div>':''}</div><div class="d-body"><div class="d-top"><div class="d-name">${esc(c.display_name)}</div></div><div class="d-bot"><div class="d-preview">${authorPrefix}${esc(c.last_message_text||'')}</div>${c.unread_count?`<span class='d-badge'>${c.unread_count}</span>`:''}</div></div></div>`;
  }).join('');

function refreshChatHeaderStatus(){
  const chatStatus = document.getElementById('chatStatus');
  if(!chatStatus) return;
  const conv = (state.conversations||[]).find(x=>x.public_id===state.activeConvPublicID);
  if(!conv) return;
  if(conv.type === 'direct'){
    if((state.typingUsers||[]).length > 0){
      chatStatus.textContent = 'печатает…';
      chatStatus.className = 'ch-status typing';
    } else {
      chatStatus.textContent = conv.is_online ? 'в сети' : 'был(а) недавно';
      chatStatus.className = 'ch-status' + (conv.is_online ? ' online' : '');
    }
  } else {
    if((state.typingUsers||[]).length > 0){
      const names = state.typingUsers.map(u => u.name).filter(Boolean).join(', ');
      chatStatus.textContent = names ? `${names} печатает…` : 'печатает…';
      chatStatus.className = 'ch-status typing';
    } else {
      chatStatus.textContent = conv.members_count ? `${conv.members_count} участников` : '';
      chatStatus.className = 'ch-status';
    }
  }
}

function applyConversation(c){
  if(!c)return;
  chatName.textContent=c.display_name||'Диалог';
  const color=c.display_color||avc(c.display_name||'?');
  chatAv.style.background=color;
  if(c.display_avatar){
    chatAv.innerHTML=`<img src="${esc(c.display_avatar)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`;
  }else{

function renderMsgStatus(m){

function renderAttachment(m){
  if (!m.attachment_url) return '';
  const url = m.attachment_url;
  const name = m.attachment_name || 'файл';
  const type = m.attachment_type || '';
  const size = m.attachment_size || 0;
  const isImage = type.startsWith('image/') || /\.(jpe?g|png|gif|webp)$/i.test(url);
  // ВАЖНО: audio проверяется ПЕРЕД video, чтобы .webm от MediaRecorder (голосовые) попадали в audio-ветку
  const isAudio = type.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|webm|mp4|aac|opus)$/i.test(url);
  const isVideo = !isAudio && (type.startsWith('video/') || /\.(mp4|mov|webm|m4v)$/i.test(url));

  if (isImage) {
    return `<div class='msg-image' data-img-url='${esc(url)}'>
      <img src='${esc(url)}' alt='${esc(name)}' loading='lazy'>
    </div>`;
  }
  if (isVideo) {
    return `<div style='margin-top:6px;border-radius:10px;overflow:hidden;background:#000;max-width:380px'>
      <video controls preload='metadata' style='width:100%;display:block;max-height:320px' src='${esc(url)}'></video>
    </div>`;
  }
  if (isAudio) {
    const _bars = Array.from({length:32}).map((_,i)=>{
      // Псевдо-случайная высота для waveform-плейсхолдера (заменится реальной при загрузке)
      const h = 6 + ((i*7+11)%16);
      return `<div class='vwb' style='height:${h}px'></div>`;
    }).join('');
    return `<div class='msg-voice' data-voice-init='0'>
      <button class='msg-voice-play' onclick='_voicePlay(this)' type='button'>
        <svg viewBox='0 0 24 24'><polygon points='5 3 19 12 5 21 5 3'/></svg>
      </button>
      <div class='msg-voice-mid'>
        <div class='msg-voice-wave' onclick='_voiceSeek(event,this)'>${_bars}</div>
        <span class='msg-voice-time'>00:00</span>
      </div>
      <audio preload='metadata' src='${esc(url)}' style='display:none'></audio>
    </div>`;
  }

  // Иначе — карточка файла
  const sizeStr = size < 1024 ? size + ' Б' :
                  size < 1024*1024 ? (size/1024).toFixed(1) + ' КБ' :
                  (size/1024/1024).toFixed(1) + ' МБ';
  // Иконка по типу
  const isPdf = /\.pdf$/i.test(url);
  const isDoc = /\.(docx?|odt|rtf)$/i.test(url);
  const isXls = /\.(xlsx?|csv|ods)$/i.test(url);
  const iconType = isPdf ? '📄' : isDoc ? '📝' : isXls ? '📊' : '📎';

  return `<div class='msg-files' style='margin-top:6px'>
    <a href='${esc(url)}' target='_blank' rel='noopener' class='msg-file' style='text-decoration:none;color:inherit'>
      <div class='mf-icon' style='font-size:20px'>${iconType}</div>
      <div class='mf-body'>
        <div class='mf-name'>${esc(name)}</div>
        <div class='mf-size'>${sizeStr}</div>
      </div>
    </a>
  </div>`;
}

window.addEventListener('DOMContentLoaded', () => {
  const chatArea = document.querySelector('.chat');
  if (!chatArea) return;

  const dz = document.createElement('div');
  dz.className = 'chat-dropzone';
  dz.textContent = '📎 Отпустите файлы здесь';

  chatArea.addEventListener('dragenter', e => {

    e.preventDefault();

  });
  chatArea.addEventListener('dragover', e => {
    if (!Array.from(e.dataTransfer?.types||[]).includes('Files')) return;
    e.preventDefault();
  });
  chatArea.addEventListener('dragleave', e => {
    dragCounter--;
    if (dragCounter <= 0) {dragCounter = 0; dz.classList.remove('active');}

let pendingAttachment = null; // {url, name, size, type} — файл готов к отправке

function triggerAttach(){
