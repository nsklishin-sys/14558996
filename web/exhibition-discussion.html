<!DOCTYPE html>
<html lang="ru">
<head>
<script src="/assets/utils.js"></script>
<script src="/assets/dark-theme-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обсуждение выставки — LASTOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/shell-layout.css">
<script>document.documentElement.classList.add('lt-shell');</script>
<link rel="stylesheet" href="/assets/hover-lift.css">
<script>document.documentElement.classList.add('hl-on');</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#1E8A4C;--gm:#22A05A;--gl:#E8F5EE;--gp:#F0FAF4;--gmt:#5A8A6A;--gb:#C0DECA;
  --w:#FFF;--bg:#F2F5F3;--t:#1A2A22;--tm:#3A5245;--bdr:#DDE8E2;
  --red:#E04040;--r:8px;--rm:12px;--rl:18px;--rxl:24px;
  --sh:0 2px 12px rgba(30,138,76,.07);--shm:0 6px 24px rgba(30,138,76,.13)
}
html,body{height:100%;overflow:hidden;font-family:'Manrope',sans-serif;background:var(--bg);color:var(--t);font-size:14px}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}

.shell{display:grid;grid-template-columns:240px 1fr 300px;grid-template-rows:56px 1fr;grid-template-areas:"logo topbar topbar" "nav main right";height:100vh;gap:10px;padding:10px}
.logo-cell{grid-area:logo;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;padding:0 14px;text-decoration:none;box-shadow:var(--sh);transition:box-shadow .2s}
.logo-cell:hover{box-shadow:var(--shm)}
.logo-cell img{height:38px;width:auto;max-width:100%;object-fit:contain;display:block}
.topbar{grid-area:topbar;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:grid;grid-template-columns:1fr 300px;align-items:center;gap:10px;padding:0 16px;box-shadow:var(--sh);min-width:0}
.nav{grid-area:nav;background:var(--w);border-radius:var(--rxl);border:1px solid var(--bdr);box-shadow:var(--sh);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;padding:12px 10px 10px;gap:1px}
.main{grid-area:main;overflow-y:auto;overflow-x:hidden;min-width:0;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.main > *{flex-shrink:0}
.right{grid-area:right;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.right > *{flex-shrink:0}

.head-card{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:16px 18px;box-shadow:var(--sh);display:flex;align-items:center;gap:14px}
.head-back{width:38px;height:38px;border-radius:10px;background:var(--gp);border:1px solid var(--bdr);cursor:pointer;display:grid;place-items:center;color:var(--gmt);transition:background .12s,color .12s;flex-shrink:0;text-decoration:none}
.head-back:hover{background:var(--gl);color:var(--g)}
.head-back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.head-info{flex:1;min-width:0}
.head-pre{font-size:11px;color:var(--gmt);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:3px}
.head-title{font-size:18px;font-weight:800;color:var(--t);line-height:1.25}
.head-stats{font-size:12px;color:var(--gmt);margin-top:3px}
.head-link{padding:8px 16px;border-radius:99px;background:var(--gp);border:1px solid var(--bdr);color:var(--t);text-decoration:none;font-size:12px;font-weight:600;flex-shrink:0;transition:background .12s}
.head-link:hover{background:var(--gl);color:var(--g);border-color:var(--gb)}

.composer{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:14px 16px;box-shadow:var(--sh)}
.composer-row{display:flex;gap:10px;align-items:flex-start}
.disc-av{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0;background-size:cover;background-position:center;text-decoration:none}
.disc-input-wrap{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.disc-input{width:100%;border:1.5px solid var(--bdr);border-radius:var(--rm);background:var(--w);padding:10px 12px;font-family:inherit;font-size:13px;color:var(--t);outline:none;resize:none;min-height:80px;transition:border-color .12s}
.disc-input:focus{border-color:var(--gm)}
.disc-input::placeholder{color:var(--gmt)}
.disc-actions{display:flex;align-items:center;justify-content:space-between;gap:10px}
.disc-hint{font-size:11px;color:var(--gmt)}
.disc-send{padding:8px 22px;border-radius:var(--rm);background:var(--g);border:none;color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s}
.disc-send:hover:not(:disabled){background:var(--gm)}
.disc-send:disabled{background:var(--bdr);color:var(--gmt);cursor:not-allowed}
.guest-hint{padding:18px;background:var(--gp);border:1px solid var(--bdr);border-radius:var(--rxl);text-align:center;color:var(--gmt);font-size:13px;box-shadow:var(--sh)}
.guest-hint a{color:var(--g);font-weight:700}

.list-card{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px}
.list-head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--bdr);padding-bottom:10px}
.list-title{font-size:14px;font-weight:800;color:var(--t)}
.list-count{font-size:12px;color:var(--gmt)}

.disc-msg{display:flex;gap:11px;padding:12px 14px;border:1px solid var(--bdr);border-radius:var(--rl);background:var(--w);transition:box-shadow .15s;margin-bottom:8px}
.disc-msg:hover{box-shadow:var(--sh)}
.disc-msg.deleted{opacity:.55}
.disc-msg-body{flex:1;min-width:0}
.disc-msg-head{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.disc-msg-name{font-size:13px;font-weight:700;color:var(--t);text-decoration:none}
.disc-msg-name:hover{color:var(--g)}
.disc-msg-time{font-size:11px;color:var(--gmt)}
.disc-msg-content{font-size:13px;color:var(--t);line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.disc-msg-content.deleted-text{color:var(--gmt);font-style:italic}
.disc-msg-actions{display:flex;align-items:center;gap:6px;margin-top:6px;opacity:0;transition:opacity .15s}
.disc-msg:hover .disc-msg-actions{opacity:1}
.disc-msg-del{padding:3px 10px;border-radius:99px;background:transparent;border:none;color:var(--red);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;transition:background .12s}
.disc-msg-del:hover{background:#FCE8E8}
.disc-empty{padding:36px 16px;text-align:center;color:var(--gmt);font-size:13px}
.disc-loading{padding:24px;text-align:center;color:var(--gmt);font-size:12px}

.card{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);box-shadow:var(--sh);padding:14px}
.block-title{font-size:11px;font-weight:800;color:var(--gmt);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
</style>
</head>
<body>
<div class="shell">

<a class="logo-cell" href="/"><img src="/assets/lastop-group-logo.svg" alt="LASTOP GROUP" onerror="this.style.display='none'"></a>

<header class="topbar"></header>

<nav class="nav"></nav>

<div class="main">

  <div class="head-card">
    <a class="head-back" href="#" id="backLink" title="Назад к выставке">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="head-info">
      <div class="head-pre">Обсуждение выставки</div>
      <div class="head-title" id="exhTitleText">Загрузка…</div>
      <div class="head-stats" id="exhStatsText"></div>
    </div>
    <a class="head-link" href="#" id="openExhLink">К выставке →</a>
  </div>

  <div id="composerWrap" style="display:none">
    <div class="composer">
      <div class="composer-row">
        <div class="disc-av" id="composerAv">?</div>
        <div class="disc-input-wrap">
          <textarea class="disc-input" id="composerInput" placeholder="Поделитесь мыслью или задайте вопрос…" maxlength="4000"></textarea>
          <div class="disc-actions">
            <span class="disc-hint">Ctrl+Enter — отправить</span>
            <button class="disc-send" id="composerSend" onclick="sendMessage()" disabled>Отправить</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="guestHint" class="guest-hint" style="display:none">
    <a href="/login.html">Войдите</a>, чтобы участвовать в обсуждении
  </div>

  <div class="list-card">
    <div class="list-head">
      <div class="list-title">Все сообщения</div>
      <div class="list-count" id="listCount"></div>
    </div>
    <div id="messagesList">
      <div class="disc-loading">Загрузка обсуждения…</div>
    </div>
  </div>

</div>

<aside class="right">
  <div class="card">
    <div class="block-title">Информация</div>
    <div id="rightInfo" style="font-size:13px;color:var(--t);line-height:1.7">Загрузка…</div>
  </div>
</aside>

</div>

<script src="/assets/shell-injector.js" defer></script>
<script src="/assets/profile-context.js" defer></script>
<script src="/assets/confirm-modal.js" defer></script>
<script>
const API='/api';
const tk=()=>localStorage.getItem('token');
const esc = window.lastopEsc;
function letter(s){return ((s||'?').trim()[0]||'?').toUpperCase();}
function colorFor(s){const C=['#5AB080','#3A90C0','#9060C0','#C07030','#1A8A6A','#B05090','#208090'];return C[(String(s||'').charCodeAt(0)||0)%C.length];}
function ago(ts){
  if(!ts)return '';
  const m=Math.max(1,Math.floor((Date.now()-new Date(ts))/60000));
  if(m<60)return m+' мин назад';
  if(m<1440)return Math.floor(m/60)+' ч назад';
  if(m<10080)return Math.floor(m/1440)+' д назад';
  return new Date(ts).toLocaleDateString('ru-RU',{day:'2-digit',month:'short',year:'numeric'});
}

let _publicID = '';
let _messages = [];

async function loadExhibition(){
  const params = new URLSearchParams(location.search);
  _publicID = params.get('id') || params.get('public_id') || '';
  if (!_publicID) { location.href='/exhibitions.html'; return; }
  const backHref = '/exhibition-detail.html?id=' + encodeURIComponent(_publicID);
  document.getElementById('backLink').setAttribute('href', backHref);
  document.getElementById('openExhLink').setAttribute('href', backHref);
  try {
    const r = await fetch(API + '/exhibitions/' + encodeURIComponent(_publicID), { headers: tk()?{Authorization:'Bearer '+tk()}:{} });
    if (!r.ok) throw 0;
    const d = await r.json();
    const ex = d.exhibition || {};
    document.getElementById('exhTitleText').textContent = ex.title || 'Выставка';
    document.title = (ex.title || 'Обсуждение') + ' — LASTOP';
    const parts = [];
    if (ex.starts_at) parts.push(new Date(ex.starts_at).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}));
    if (ex.city) parts.push(ex.city);
    if (ex.format === 'online') parts.push('Онлайн');
    document.getElementById('exhStatsText').textContent = parts.join(' · ');
    const right = document.getElementById('rightInfo');
    if (right) {
      const lines = [];
      if (ex.starts_at) lines.push('<div><b>Начало:</b> ' + new Date(ex.starts_at).toLocaleDateString('ru-RU') + '</div>');
      if (ex.ends_at) lines.push('<div><b>Конец:</b> ' + new Date(ex.ends_at).toLocaleDateString('ru-RU') + '</div>');
      if (ex.city) lines.push('<div><b>Город:</b> ' + esc(ex.city) + '</div>');
      if (ex.venue) lines.push('<div><b>Место:</b> ' + esc(ex.venue) + '</div>');
      if (ex.format) lines.push('<div><b>Формат:</b> ' + (ex.format==='online'?'Онлайн':ex.format==='hybrid'?'Гибрид':'Офлайн') + '</div>');
      lines.push('<a href="' + backHref + '" style="display:block;margin-top:12px;padding:8px 14px;background:var(--gl);border:1px solid var(--gb);color:var(--g);text-decoration:none;border-radius:8px;text-align:center;font-weight:700">К выставке →</a>');
      right.innerHTML = lines.join('');
    }
  } catch {
    document.getElementById('exhTitleText').textContent = 'Выставка не найдена';
  }
}

async function loadMessages(){
  const list = document.getElementById('messagesList');
  if (!list) return;
  try {
    const headers = tk() ? { Authorization: 'Bearer ' + tk() } : {};
    const r = await fetch(API + '/exhibitions/' + encodeURIComponent(_publicID) + '/messages', { headers });
    if (!r.ok) throw 0;
    const d = await r.json();
    _messages = d.messages || [];
    renderMessages();
  } catch {
    list.innerHTML = '<div class="disc-empty">Не удалось загрузить обсуждение</div>';
  }
}

function renderMessages(){
  const list = document.getElementById('messagesList');
  const counter = document.getElementById('listCount');
  if (!list) return;
  if (counter) counter.textContent = _messages.length ? (_messages.length + ' сообщений') : '';
  if (!_messages.length) {
    list.innerHTML = '<div class="disc-empty">Пока никто не оставил сообщений. Будьте первым!</div>';
    return;
  }
  list.innerHTML = _messages.map(function(m){
    const name = esc(m.author_name || 'Участник');
    const pid = esc(m.author_public_id || '');
    const ltr = letter(m.author_name);
    const bg = m.author_avatar
      ? 'background-image:url("' + esc(m.author_avatar) + '")'
      : 'background:' + colorFor(m.author_name);
    const time = ago(m.created_at);
    const content = m.is_deleted
      ? '<div class="disc-msg-content deleted-text">[сообщение удалено]</div>'
      : '<div class="disc-msg-content">' + esc(m.content || '') + '</div>';
    const actions = (m.is_mine && !m.is_deleted)
      ? '<div class="disc-msg-actions"><button class="disc-msg-del" onclick="deleteMessage(' + m.id + ')">Удалить</button></div>'
      : '';
    return '<div class="disc-msg' + (m.is_deleted ? ' deleted' : '') + '" data-msg-id="' + m.id + '">'
      + '<a href="/profile_user.html?id=' + pid + '" class="disc-av" style="' + bg + ';text-decoration:none">'
      + (m.author_avatar ? '' : ltr) + '</a>'
      + '<div class="disc-msg-body">'
      + '<div class="disc-msg-head">'
      + '<a href="/profile_user.html?id=' + pid + '" class="disc-msg-name">' + name + '</a>'
      + '<span class="disc-msg-time">' + esc(time) + '</span>'
      + '</div>'
      + content
      + actions
      + '</div>'
      + '</div>';
  }).join('');
}

async function sendMessage(){
  const inp = document.getElementById('composerInput');
  const btn = document.getElementById('composerSend');
  if (!inp || !btn) return;
  const content = inp.value.trim();
  if (!content) return;
  btn.disabled = true;
  btn.textContent = 'Отправка…';
  try {
    const r = await fetch(API + '/exhibitions/' + encodeURIComponent(_publicID) + '/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tk() },
      body: JSON.stringify({ content: content })
    });
    if (!r.ok) {
      const er = await r.json().catch(() => ({}));
      throw new Error(er.error || 'Не удалось отправить');
    }
    const d = await r.json();
    if (d.message) {
      _messages.unshift(d.message);
      renderMessages();
    }
    inp.value = '';
  } catch (e) {
    alert(e.message || 'Не удалось отправить сообщение');
  } finally {
    btn.disabled = inp.value.trim() === '';
    btn.textContent = 'Отправить';
  }
}

async function deleteMessage(msgID){
  const confirmed = window.lastopConfirm
    ? await window.lastopConfirm({ title: 'Удалить сообщение?', danger: true })
    : confirm('Удалить сообщение?');
  if (!confirmed) return;
  try {
    const r = await fetch(API + '/exhibitions/' + encodeURIComponent(_publicID) + '/messages/' + msgID, {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + tk() }
    });
    if (!r.ok) throw 0;
    const m = _messages.find(function(x){ return x.id === msgID; });
    if (m) { m.is_deleted = true; m.content = ''; }
    renderMessages();
  } catch {
    alert('Не удалось удалить сообщение');
  }
}

function initComposer(){
  const tk0 = tk();
  if (!tk0) {
    document.getElementById('guestHint').style.display = '';
    return;
  }
  document.getElementById('composerWrap').style.display = '';
  try {
    const u = JSON.parse(localStorage.getItem('user') || '{}');
    const av = document.getElementById('composerAv');
    if (av) {
      const name = u.full_name || u.name || 'Я';
      if (u.avatar_url) {
        av.style.backgroundImage = 'url("' + u.avatar_url + '")';
        av.textContent = '';
      } else {
        av.style.background = colorFor(name);
        av.textContent = letter(name);
      }
    }
  } catch {}
  const inp = document.getElementById('composerInput');
  const btn = document.getElementById('composerSend');
  if (inp && btn) {
    inp.addEventListener('input', function(){ btn.disabled = inp.value.trim() === ''; });
    inp.addEventListener('keydown', function(e){
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        if (!btn.disabled) sendMessage();
      }
    });
  }
}

document.addEventListener('DOMContentLoaded', function(){
  initComposer();
  loadExhibition();
  loadMessages();
  function trySubscribe(){
    if (!_publicID || !window.wsClient) return false;
    window.wsClient.subscribe('exhibition:' + _publicID);
    window.wsClient.on('discussion:exhibition_new', function(d){
      if (!d || d.exhibition_public_id !== _publicID || !d.message) return;
      if (_messages.find(function(x){ return x.id === d.message.id; })) return;
      _messages.unshift(d.message);
      renderMessages();
    });
    window.wsClient.on('discussion:exhibition_deleted', function(d){
      if (!d || d.exhibition_public_id !== _publicID) return;
      const m = _messages.find(function(x){ return x.id === d.message_id; });
      if (m) { m.is_deleted = true; m.content = ''; renderMessages(); }
    });
    return true;
  }
  if (!trySubscribe()) setTimeout(trySubscribe, 500);
});
window.addEventListener('beforeunload', function(){
  try { if (window.wsClient && _publicID) window.wsClient.unsubscribe('exhibition:' + _publicID); } catch {}
});
</script>
<script src="/assets/guest-nav.js" defer></script>
</body>
</html>
