<!DOCTYPE html>
<html lang="ru">
<head>
<script src="/assets/utils.js"></script>
<script src="/assets/dark-theme-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LASTOP GROUP — Сохранённое</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/shell-layout.css">
<script>document.documentElement.classList.add('lt-shell');</script>
<link rel="stylesheet" href="/assets/hover-lift.css">
<script>document.documentElement.classList.add('hl-on');</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#1E8A4C;--gm:#22A05A;--gl:#E8F5EE;--gp:#F0FAF4;--gmt:#5A8A6A;--gb:#C0DECA;
  --w:#FFF;--bg:#F2F5F3;--t:#1A2A22;--tm:#3A5245;--bdr:#DDE8E2;
  --red:#E04040;--r:8px;--rm:12px;--rl:18px;--rxl:24px;
  --sh:0 2px 12px rgba(30,138,76,.07);--shm:0 6px 24px rgba(30,138,76,.13)
}
html,body{height:100%;overflow:hidden;font-family:'Manrope',sans-serif;background:var(--bg);color:var(--t);font-size:14px}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}

/* SHELL */
.shell{display:grid;grid-template-columns:240px 1fr 300px;grid-template-rows:56px 1fr;grid-template-areas:"logo topbar topbar""nav main right";height:100vh;gap:10px;padding:10px}

.logo-cell{grid-area:logo;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;padding:0 14px;text-decoration:none;box-shadow:var(--sh);transition:box-shadow .2s}
.logo-cell:hover{box-shadow:var(--shm)}
.logo-cell img{height:38px;width:auto;max-width:100%;object-fit:contain;display:block}

/* TOPBAR */
.topbar{grid-area:topbar;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:grid;grid-template-columns:1fr 300px;align-items:center;gap:10px;padding:0 16px;box-shadow:var(--sh);min-width:0}
.search-wrap{position:relative;display:flex;align-items:center;min-width:0}
.search-wrap input{width:100%;height:36px;padding:0 14px 0 30px;border:1.5px solid var(--bdr);border-radius:99px;background:#fff;font-family:inherit;font-size:13px;color:var(--t);outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--gm)}
.search-wrap input::placeholder{color:var(--gmt)}

/* NAV */
.nav{grid-area:nav;background:var(--w);border-radius:var(--rxl);border:1px solid var(--bdr);box-shadow:var(--sh);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;padding:12px 10px 10px;gap:1px}
.nav::-webkit-scrollbar{display:none}

/* MAIN / RIGHT */
.main{grid-area:main;overflow-y:auto;overflow-x:hidden;min-width:0;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.main > *{flex-shrink:0}
.right{grid-area:right;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.right > *{flex-shrink:0}

/* HEADER */
.sv-toolbar{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:12px 14px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sv-title{font-size:16px;font-weight:900;color:var(--t)}
.sv-subtitle{font-size:12px;color:var(--gmt);margin-right:auto}
.sv-total{font-size:12px;font-weight:800;color:var(--g);padding:4px 12px;border-radius:99px;background:var(--gl);border:1px solid var(--gb)}

/* TABS */
.tabs-row{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:10px 14px;box-shadow:var(--sh);display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:6px 13px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--bdr);background:transparent;color:var(--tm);font-family:inherit;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab:hover{background:var(--gp);color:var(--g);border-color:var(--gb)}
.tab.active{background:var(--g);color:#fff;border-color:var(--g)}
.tab-count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--gp);color:var(--gmt);font-size:10px;font-weight:800;border:1px solid var(--bdr)}
.tab.active .tab-count{background:rgba(255,255,255,.25);color:#fff;border-color:transparent}

/* SECTIONS (для таба «Все») */
.feed-section{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:14px 16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px}
.fs-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--bdr);padding-bottom:8px}
.fs-title{font-size:13px;font-weight:800;color:var(--t);display:inline-flex;align-items:center;gap:6px}
.fs-title svg{width:14px;height:14px;stroke:var(--g);fill:none;stroke-width:2;stroke-linecap:round}
.fs-count{font-size:11px;color:var(--gmt);font-weight:600}
.fs-link{margin-left:auto;font-size:11px;color:var(--g);font-weight:700;text-decoration:none;cursor:pointer;border:none;background:transparent;font-family:inherit}
.fs-link:hover{text-decoration:underline}
.fs-cards{display:flex;flex-direction:column;gap:8px}

/* GENERIC CARD */
.gc{background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:all .15s;text-decoration:none;color:inherit;animation:fadeUp .25s ease both}
.gc:hover{box-shadow:var(--shm);transform:translateY(-2px);border-color:var(--gb)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.gc-thumb{width:60px;height:60px;border-radius:var(--rm);background:var(--gp);overflow:hidden;flex-shrink:0;display:grid;place-items:center;color:var(--gmt)}
.gc-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.gc-thumb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5}
.gc-stripe{width:3px;align-self:stretch;border-radius:99px;flex-shrink:0;min-height:48px}
.gc-body{flex:1;min-width:0}
.gc-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.gc-tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:#fff;flex-shrink:0}
.gc-mini{display:inline-flex;align-items:center;padding:2px 7px;border-radius:99px;font-size:9px;font-weight:700;background:var(--gl);color:var(--g);border:1px solid var(--gb)}
.gc-title{font-size:13px;font-weight:800;color:var(--t);line-height:1.3;letter-spacing:-.005em;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gc:hover .gc-title{color:var(--g)}
.gc-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--gmt)}
.gc-meta-item{display:inline-flex;align-items:center;gap:3px}
.gc-meta-item svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}
.gc-price{font-size:12px;font-weight:800;color:var(--g);margin-left:auto;flex-shrink:0}
.gc-price-empty{font-size:10px;font-weight:700;color:var(--gmt);font-style:italic;margin-left:auto;flex-shrink:0}

/* EMPTY */
.empty{padding:40px 20px;text-align:center;color:var(--gmt);font-size:13px;font-style:italic}
.empty a{color:var(--g);font-weight:700;font-style:normal;text-decoration:none}
.empty a:hover{text-decoration:underline}

/* SIDEBAR */
.card{background:var(--w);border-radius:var(--rxl);border:1px solid var(--bdr);box-shadow:var(--sh);padding:14px}
.block-title{font-size:11px;font-weight:800;color:var(--tm);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.kv{display:flex;flex-direction:column;gap:8px}
.kv-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;gap:10px}
.kv-key{color:var(--gmt);font-weight:600}
.kv-val{color:var(--t);font-weight:700}
.tip-card{background:linear-gradient(135deg,var(--gl),var(--gp));border:1px solid var(--gb);border-radius:var(--rxl);padding:14px}
.tip-title{font-size:12px;font-weight:800;color:var(--g);margin-bottom:6px}
.tip-text{font-size:11px;color:var(--tm);line-height:1.5}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--t);color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:var(--z-overlay);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:1200px){.shell{grid-template-columns:220px 1fr 260px}}
@media(max-width:1000px){.shell{grid-template-columns:220px 1fr;grid-template-areas:"logo topbar""nav main"}.right{display:none}}
@media(max-width:740px){.shell{grid-template-columns:52px 1fr}.nav-item span,.nav-group{display:none}.nav-item{justify-content:center;padding:10px}}
@media (min-width:1921px) and (min-height:1081px){
  html,body{font-size:15px}
  .shell{grid-template-columns:280px 1fr 360px !important;gap:12px;padding:12px}
  .topbar{grid-template-columns:1fr 360px !important}
  .nav{padding:14px 12px 12px}
}
</style>
<link rel="stylesheet" href="/assets/dark-theme.css">
</head>
<body>
<div class="shell">

<a class="logo-cell" href="/"><img src="/assets/lastop-group-logo.svg" alt="LASTOP GROUP" onerror="this.style.display='none'"></a>

<header class="topbar"></header>

<nav class="nav"></nav>

<!-- MAIN -->
<div class="main">

  <div class="sv-toolbar">
    <span class="sv-title">Сохранённое</span>
    <span class="sv-subtitle">Всё, что ты отложил для себя — в одном месте</span>
    <span class="sv-total" id="svTotal">Всего: 0</span>
  </div>

  <div class="tabs-row" id="tabsRow"></div>

  <div id="feed"></div>

</div>

<!-- RIGHT -->
<aside class="right">
  <div class="card">
    <div class="block-title">По категориям</div>
    <div class="kv" id="countsList">
      <div style="padding:6px;color:var(--gmt);font-size:11px;font-style:italic">Загрузка…</div>
    </div>
  </div>
  <div class="tip-card">
    <div class="tip-title">💡 Подсказка</div>
    <div class="tip-text">Нажимай иконку «закладка» на любом проекте, вакансии, резюме или товаре — и они появятся здесь, разделённые по категориям.</div>
  </div>
</aside>

</div>

<div id="toast" class="toast"></div>

<script>
const API = '/api';

const TABS = [
  { key: 'all',      label: 'Все',          countKey: 'total' },
  { key: 'posts',    label: 'Новости',      countKey: 'posts' },
  { key: 'projects', label: 'Проекты',      countKey: 'projects' },
  { key: 'jobs',     label: 'Вакансии',     countKey: 'jobs' },
  { key: 'resumes',  label: 'Резюме',       countKey: 'resumes' },
  { key: 'catalog',  label: 'Каталог',      countKey: 'catalog' },
  { key: 'events',   label: 'Мероприятия',  countKey: 'events' },
];

let currentTab = 'all';
let counts = { posts:0, projects:0, jobs:0, resumes:0, catalog:0, events:0, total:0 };
let allData = { posts:[], projects:[], jobs:[], resumes:[], catalog:[], events:[] };

// HELPERS
const esc = window.lastopEsc;const escAttr = window.lastopEsc;
function pluralRu(n,f){const a=[2,0,1,1,1,2];return f[(n%100>4&&n%100<20)?2:a[Math.min(n%10,5)]];}
const fmtNum = window.lastopFmtNum;
function fmtPrice(price, cur){
  if (price == null) return null;
  const sym = {RUB:'₽',USD:'$',EUR:'€',CNY:'¥'}[cur] || cur || '';
  return fmtNum(price) + ' ' + sym;
}
function fmtSalary(from){
  if (!from) return null;
  return 'от ' + fmtNum(from) + ' ₽';
}
function formatRel(iso){
  if (!iso) return '';
  const d = new Date(iso); const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return 'только что';
  if (diff < 3600) return Math.floor(diff/60) + ' ' + pluralRu(Math.floor(diff/60),['минута','минуты','минут']) + ' назад';
  if (diff < 86400) return Math.floor(diff/3600) + ' ' + pluralRu(Math.floor(diff/3600),['час','часа','часов']) + ' назад';
  if (diff < 86400*30) return Math.floor(diff/86400) + ' ' + pluralRu(Math.floor(diff/86400),['день','дня','дней']) + ' назад';
  return d.toLocaleDateString('ru-RU');
}
function stableColor(s){
  let h = 0; const n = String(s||'?');
  for (let i = 0; i < n.length; i++) h = (h*31 + n.charCodeAt(i)) | 0;
  return ['#1E8A4C','#0891B2','#7C3AED','#DB2777','#EA580C','#65A30D','#475569','#2563EB','#9333EA','#0EA5E9','#F59E0B'][Math.abs(h) % 11];
}
function initials(name){
  if (!name) return '?';
  return name.split(/\s+/).filter(Boolean).map(s => s[0]).slice(0,2).join('').toUpperCase();
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => t.classList.remove('show'), 2500);
}
function logout(){try{lastopFetch('/api/auth/logout',{method:'POST',keepalive:true});}catch{}try{localStorage.removeItem('user');}catch{}location.replace('/home-guest.html');}
function toggleProfileDD(e){
  e.stopPropagation();
  document.getElementById('profileDD').classList.toggle('open');
  document.getElementById('topbarProfile').classList.toggle('open');
}
document.addEventListener('click', e => {
  const dd = document.getElementById('profileDD');
  const tp = document.getElementById('topbarProfile');
  if (dd && tp && !tp.contains(e.target) && !dd.contains(e.target)) {
    dd.classList.remove('open'); tp.classList.remove('open');
  }
});
function authHeaders(){ return tk() ? { Authorization: 'Bearer ' + tk() } : {}; }

// PROFILE
async function loadProfile(){
  if (!tk()) { location.href = '/login.html'; return; }
  try {
    const r = await lastopFetch(API + '/me', { headers: authHeaders() });
    if (!r.ok) return;
    const d = await r.json();
    const u = d.user || d;
    const name = u.full_name || u.handle || 'Пользователь';
    const ini = initials(name);
    if(window.LASTOP_SET_AV)window.LASTOP_SET_AV("topbarAv",ini);else{const _e=document.getElementById("topbarAv");if(_e)_e.textContent=ini;}
    document.getElementById('topbarName').textContent = name;
    if(window.LASTOP_SET_AV)window.LASTOP_SET_AV("pddAv",ini);else{const _e=document.getElementById("pddAv");if(_e)_e.textContent=ini;}
    document.getElementById('pddName').textContent = name;
  } catch {}
}

// LOAD
async function loadAll(){
  try {
    const r = await lastopFetch(API + '/me/saved', { headers: authHeaders() });
    if (!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();
    counts = d.counts || counts;
    allData = {
      posts:    d.posts    || [],
      projects: d.projects || [],
      jobs:     d.jobs     || [],
      resumes:  d.resumes  || [],
      events:   d.events   || [],
      catalog:  d.catalog  || [],
    };
    renderTabs();
    renderCountsCard();
    document.getElementById('svTotal').textContent = 'Всего: ' + (counts.total || 0);
    renderFeed();
  } catch (err) {
    console.error('loadAll', err);
    document.getElementById('feed').innerHTML = '<div class="empty">Не удалось загрузить сохранённое.</div>';
  }
}

async function loadTab(tabKey){
  if (tabKey === 'all') { renderFeed(); return; }
  // Перезагружаем конкретную секцию полным списком (не превью)
  try {
    const r = await lastopFetch(API + '/me/saved?tab=' + encodeURIComponent(tabKey) + '&limit=100', { headers: authHeaders() });
    if (!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();
    allData[tabKey] = d[tabKey] || [];
    renderFeed();
  } catch (err) {
    console.error('loadTab', err);
    document.getElementById('feed').innerHTML = '<div class="empty">Не удалось загрузить раздел.</div>';
  }
}

// TABS
function renderTabs(){
  document.getElementById('tabsRow').innerHTML = TABS.map(t => {
    const c = counts[t.countKey] || 0;
    return '<button type="button" class="tab' + (currentTab === t.key ? ' active' : '') + '" onclick="setTab(\'' + escAttr(t.key) + '\')">' +
      esc(t.label) + '<span class="tab-count">' + c + '</span>' +
    '</button>';
  }).join('');
}
function setTab(key){
  currentTab = key;
  renderTabs();
  loadTab(key);
}

// COUNTS sidebar
function renderCountsCard(){
  document.getElementById('countsList').innerHTML =
    '<div class="kv-row"><span class="kv-key">Новости</span><span class="kv-val">' + (counts.posts || 0) + '</span></div>' +
    '<div class="kv-row"><span class="kv-key">Проекты</span><span class="kv-val">' + (counts.projects || 0) + '</span></div>' +
    '<div class="kv-row"><span class="kv-key">Вакансии</span><span class="kv-val">' + (counts.jobs || 0) + '</span></div>' +
    '<div class="kv-row"><span class="kv-key">Резюме</span><span class="kv-val">' + (counts.resumes || 0) + '</span></div>' +
    '<div class="kv-row"><span class="kv-key">Товары/услуги</span><span class="kv-val">' + (counts.catalog || 0) + '</span></div>' +
    '<div class="kv-row"><span class="kv-key">Мероприятия</span><span class="kv-val">' + (counts.events || 0) + '</span></div>';
}

// FEED
function renderFeed(){
  const feed = document.getElementById('feed');
  const isAll = currentTab === 'all';

  if (isAll) {
    if (!counts.total) {
      feed.innerHTML = renderEmpty('all');
      return;
    }
    let html = '';
    const sections = [
      { key:'posts',    label:'Новости',  icon:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>' },
      { key:'projects', label:'Проекты',  icon:'<svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>' },
      { key:'jobs',     label:'Вакансии', icon:'<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>' },
      { key:'resumes',  label:'Резюме',   icon:'<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' },
      { key:'catalog',  label:'Товары и услуги',  icon:'<svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/></svg>' },
      { key:'events',   label:'Мероприятия',  icon:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' },
    ];
    for (const s of sections) {
      const items = allData[s.key] || [];
      if (!items.length) continue;
      const cnt = counts[s.key] || items.length;
      const hasMore = cnt > items.length;
      html += '<div class="feed-section">' +
        '<div class="fs-head">' +
          '<span class="fs-title">' + s.icon + esc(s.label) + '</span>' +
          '<span class="fs-count">' + cnt + ' ' + pluralRu(cnt, ['элемент','элемента','элементов']) + '</span>' +
          (hasMore ? '<button type="button" class="fs-link" onclick="setTab(\'' + s.key + '\')">Показать все →</button>' : '') +
        '</div>' +
        '<div class="fs-cards">' + items.map(i => renderCard(s.key, i)).join('') + '</div>' +
      '</div>';
    }
    feed.innerHTML = html;
    return;
  }

  // Конкретная категория
  const items = allData[currentTab] || [];
  if (!items.length) {
    feed.innerHTML = renderEmpty(currentTab);
    return;
  }
  feed.innerHTML = '<div class="feed-section">' +
    '<div class="fs-cards">' + items.map(i => renderCard(currentTab, i)).join('') + '</div>' +
  '</div>';
}

function renderCard(type, i){
  if (type === 'posts') return renderPostCard(i);
  if (type === 'projects') return renderProjectCard(i);
  if (type === 'jobs') return renderJobCard(i);
  if (type === 'resumes') return renderResumeCard(i);
  if (type === 'catalog') return renderCatalogCard(i);
  if (type === 'events') return renderEventCard(i);
  return '';
}

function renderEventCard(e){
  const url = '/event-detail.html?id=' + encodeURIComponent(e.public_id || '');
  const title = e.title || 'Мероприятие';
  const stripe = stableColor(e.type || e.title || '?');
  const dateStr = e.starts_at ? new Date(e.starts_at).toLocaleDateString('ru-RU',{day:'numeric',month:'long'}) : '';
  const fmt = e.format === 'online' ? 'онлайн' : 'офлайн';
  return '<a class="gc" href="' + escAttr(url) + '">' +
    '<div class="gc-stripe" style="background:' + esc(stripe) + '"></div>' +
    '<div class="gc-body">' +
      '<div class="gc-head"><span class="gc-mini">Мероприятие</span></div>' +
      '<div class="gc-title">' + esc(title) + '</div>' +
      '<div class="gc-meta"><span class="gc-meta-item">' + esc(dateStr) + '</span><span class="gc-meta-item">' + esc(fmt) + '</span></div>' +
    '</div></a>';
}

function renderPostCard(p){
  let author = p.author_name || p.author || 'Без имени';
  if (p.author_company_id && p.author_company_name) author = p.author_company_name;
  else if (p.author_community_id && p.author_community_name) author = p.author_community_name;
  const url = p.public_id ? '/news-detail.html?id=' + encodeURIComponent(p.public_id) : '#';
  const text = p.content || p.text || p.title || '';
  const preview = text.length > 200 ? text.slice(0, 200) + '…' : text;
  return '<a class="gc" href="' + escAttr(url) + '">' +
    '<div class="gc-thumb" style="background:' + esc(stableColor(author)) + '"><span style="color:#fff;font-weight:800;font-size:14px">' + esc(initials(author)) + '</span></div>' +
    '<div class="gc-body">' +
      '<div class="gc-head"><span class="gc-mini">Новость</span></div>' +
      '<div class="gc-title">' + esc(preview) + '</div>' +
      '<div class="gc-meta"><span class="gc-meta-item">' + esc(author) + '</span><span class="gc-meta-item">' + esc(formatRel(p.created_at)) + '</span></div>' +
    '</div></a>';
}

function renderProjectCard(p){
  const url = '/project-detail.html?id=' + encodeURIComponent(p.public_id);
  const stripe = p.cover_color || stableColor(p.category || p.title);
  const status = p.status || 'active';
  const statusLabel = {active:'Активный', planning:'Планируется', completed:'Завершён', paused:'На паузе'}[status] || status;
  return '<a class="gc" href="' + escAttr(url) + '">' +
    '<div class="gc-stripe" style="background:' + esc(stripe) + '"></div>' +
    '<div class="gc-body">' +
      '<div class="gc-head"><span class="gc-mini">Проект</span><span class="gc-mini" style="background:#FFF7EE;color:#EA580C;border-color:#FFE0BC">' + esc(statusLabel) + '</span></div>' +
      '<div class="gc-title">' + esc(p.title) + '</div>' +
      '<div class="gc-meta">' +
        (p.owner_name ? '<span class="gc-meta-item">' + esc(p.owner_name) + '</span>' : '') +
        '<span class="gc-meta-item"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>' + (p.members_count || 0) + '</span>' +
        '<span class="gc-meta-item">' + esc(formatRel(p.created_at)) + '</span>' +
      '</div>' +
    '</div></a>';
}

function renderJobCard(j){
  const url = '/job-detail.html?id=' + encodeURIComponent(j.public_id);
  const cat = j.category_label || j.category || '';
  const catColor = j.category_color || stableColor(j.category || '?');
  const sal = fmtSalary(j.salary_from);
  return '<a class="gc" href="' + escAttr(url) + '">' +
    '<div class="gc-stripe" style="background:' + esc(catColor) + '"></div>' +
    '<div class="gc-body">' +
      '<div class="gc-head">' +
        (cat ? '<span class="gc-tag" style="background:' + esc(catColor) + '">' + esc(cat) + '</span>' : '') +
        '<span class="gc-mini">Вакансия</span>' +
      '</div>' +
      '<div class="gc-title">' + esc(j.title) + '</div>' +
      '<div class="gc-meta">' +
        (j.author_name ? '<span class="gc-meta-item">' + esc(j.author_name) + '</span>' : '') +
        (j.city ? '<span class="gc-meta-item">' + esc(j.city) + '</span>' : '') +
        '<span class="gc-meta-item">' + esc(formatRel(j.created_at)) + '</span>' +
        (sal ? '<span class="gc-price">' + esc(sal) + '</span>' : '') +
      '</div>' +
    '</div></a>';
}

function renderResumeCard(r){
  const url = '/resume-detail.html?id=' + encodeURIComponent(r.public_id);
  const cat = r.category_label || r.category || '';
  const catColor = r.category_color || stableColor(r.category || '?');
  const sal = fmtSalary(r.salary_from);
  return '<a class="gc" href="' + escAttr(url) + '">' +
    '<div class="gc-stripe" style="background:' + esc(catColor) + '"></div>' +
    '<div class="gc-body">' +
      '<div class="gc-head">' +
        (cat ? '<span class="gc-tag" style="background:' + esc(catColor) + '">' + esc(cat) + '</span>' : '') +
        '<span class="gc-mini">Резюме</span>' +
      '</div>' +
      '<div class="gc-title">' + esc(r.title) + '</div>' +
      '<div class="gc-meta">' +
        (r.author_name ? '<span class="gc-meta-item">' + esc(r.author_name) + '</span>' : '') +
        (r.city ? '<span class="gc-meta-item">' + esc(r.city) + '</span>' : '') +
        ((r.experience_years != null) ? '<span class="gc-meta-item">опыт ' + r.experience_years + ' ' + pluralRu(r.experience_years,['год','года','лет']) + '</span>' : '') +
        (sal ? '<span class="gc-price">' + esc(sal) + '</span>' : '') +
      '</div>' +
    '</div></a>';
}

function renderCatalogCard(c){
  const isProduct = c.type === 'product';
  const url = (isProduct ? '/product-detail.html?id=' : '/service-detail.html?id=') + encodeURIComponent(c.public_id);
  const groupLabel = c.category_group || '';
  const catColor = stableColor(c.category || '?');
  const cover = (isProduct && c.cover_image) ? c.cover_image : '';
  const price = c.price != null ? fmtPrice(c.price, c.currency) : null;
  const thumb = cover
    ? '<div class="gc-thumb"><img src="' + escAttr(cover) + '" alt="" loading="lazy"></div>'
    : '<div class="gc-thumb"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/></svg></div>';
  return '<a class="gc" href="' + escAttr(url) + '">' +
    thumb +
    '<div class="gc-body">' +
      '<div class="gc-head">' +
        (groupLabel ? '<span class="gc-tag" style="background:' + esc(catColor) + '">' + esc(groupLabel) + '</span>' : '') +
        '<span class="gc-mini">' + (isProduct ? 'Товар' : 'Услуга') + '</span>' +
      '</div>' +
      '<div class="gc-title">' + esc(c.title) + '</div>' +
      '<div class="gc-meta">' +
        (c.author_name ? '<span class="gc-meta-item">' + esc(c.author_name) + '</span>' : '') +
        (c.city ? '<span class="gc-meta-item">' + esc(c.city) + '</span>' : '') +
        '<span class="gc-meta-item">' + esc(formatRel(c.created_at)) + '</span>' +
        (price ? '<span class="gc-price">' + esc(price) + '</span>' : '<span class="gc-price-empty">По запросу</span>') +
      '</div>' +
    '</div></a>';
}

function renderEmpty(tabKey){
  const map = {
    all:      { text: 'Ты пока ничего не сохранил.', link: 'Перейти на главную', href: '/' },
    posts:    { text: 'Сохранённых новостей пока нет.',     link: 'Перейти к новостям →',      href: '/dashboard.html' },
    projects: { text: 'Сохранённых проектов пока нет.',     link: 'Перейти к проектам →',      href: '/projects.html' },
    jobs:     { text: 'Сохранённых вакансий пока нет.',     link: 'Перейти к вакансиям →',     href: '/jobs.html' },
    resumes:  { text: 'Сохранённых резюме пока нет.',       link: 'Перейти к резюме →',         href: '/jobs.html' },
    events:   { text: 'Сохранённых мероприятий пока нет.',  link: 'Перейти к мероприятиям →',  href: '/events.html' },
    catalog:  { text: 'Сохранённых товаров и услуг пока нет.', link: 'Перейти в каталог →', href: '/catalog.html' },
  };
  const m = map[tabKey] || map.all;
  return '<div class="feed-section"><div class="empty">' + esc(m.text) + ' <a href="' + escAttr(m.href) + '">' + esc(m.link) + '</a></div></div>';
}
