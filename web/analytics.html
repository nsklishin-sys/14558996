<!DOCTYPE html>
<html lang="ru">
<head>
<script src="/assets/utils.js"></script>
<script src="/assets/dark-theme-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LASTOP GROUP — Аналитика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/shell-layout.css">
<script>document.documentElement.classList.add('lt-shell');</script>
<link rel="stylesheet" href="/assets/hover-lift.css">
<script>document.documentElement.classList.add('hl-on');</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#1E8A4C;--gm:#22A05A;--gl:#E8F5EE;--gp:#F0FAF4;--gmt:#5A8A6A;--gb:#C0DECA;
  --w:#FFF;--bg:#F2F5F3;--t:#1A2A22;--tm:#3A5245;--bdr:#DDE8E2;
  --red:#E04040;--r:8px;--rm:12px;--rl:18px;--rxl:24px;
  --sh:0 2px 12px rgba(30,138,76,.07);--shm:0 6px 24px rgba(30,138,76,.13)
}
html,body{height:100%;overflow:hidden;font-family:'Manrope',sans-serif;background:var(--bg);color:var(--t);font-size:14px}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}

/* SHELL */
.shell{display:grid;grid-template-columns:240px 1fr 300px;grid-template-rows:56px 1fr;grid-template-areas:"logo topbar topbar""nav main right";height:100vh;gap:10px;padding:10px}

.logo-cell{grid-area:logo;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;padding:0 14px;text-decoration:none;box-shadow:var(--sh);transition:box-shadow .2s}
.logo-cell:hover{box-shadow:var(--shm)}
.logo-cell img{height:38px;width:auto;max-width:100%;object-fit:contain;display:block}

/* TOPBAR */
.topbar{grid-area:topbar;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:grid;grid-template-columns:1fr 300px;align-items:center;gap:10px;padding:0 16px;box-shadow:var(--sh);min-width:0}
.search-wrap{position:relative;display:flex;align-items:center;min-width:0}
.search-wrap input{width:100%;height:36px;padding:0 14px 0 30px;border:1.5px solid var(--bdr);border-radius:99px;background:#fff;font-family:inherit;font-size:13px;color:var(--t);outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--gm)}
.search-wrap input::placeholder{color:var(--gmt)}

/* NAV */
.nav{grid-area:nav;background:var(--w);border-radius:var(--rxl);border:1px solid var(--bdr);box-shadow:var(--sh);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;padding:12px 10px 10px;gap:1px}
.nav::-webkit-scrollbar{display:none}

/* MAIN / RIGHT */
.main{grid-area:main;overflow-y:auto;overflow-x:hidden;min-width:0;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.main > *{flex-shrink:0}
.right{grid-area:right;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.right > *{flex-shrink:0}


/* ── ANALYTICS TOOLBAR ── */
.an-toolbar{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:14px 18px;box-shadow:var(--sh);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.an-title{font-size:18px;font-weight:900;color:var(--t);letter-spacing:-.01em;white-space:nowrap}
.an-subtitle{font-size:12px;color:var(--gmt);margin-right:auto}

/* PERIOD SWITCHER */
.period-switch{display:flex;background:var(--gp);border:1.5px solid var(--bdr);border-radius:99px;padding:3px;gap:2px;flex-shrink:0}
.period-btn{padding:6px 14px;border-radius:99px;background:transparent;color:var(--gmt);border:none;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;min-width:42px}
.period-btn:hover{color:var(--g)}
.period-btn.active{background:var(--g);color:#fff;box-shadow:0 1px 4px rgba(30,138,76,.2)}

/* SCOPE TABS */
.scope-tabs{display:flex;gap:6px;background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:6px;box-shadow:var(--sh);overflow-x:auto;align-items:center;flex-wrap:wrap}
.scope-tab{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:var(--rm);border:none;background:transparent;color:var(--tm);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.scope-tab:hover{background:var(--gp);color:var(--g)}
.scope-tab.active{background:var(--g);color:#fff;font-weight:700}
.scope-tab svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.scope-select{margin-left:auto;height:32px;padding:0 12px;border:1.5px solid var(--bdr);border-radius:var(--rm);background:var(--w);font-family:inherit;font-size:12px;color:var(--t);cursor:pointer;outline:none;display:none;max-width:240px}
.scope-select.show{display:block}
.ctx-selector{background:var(--gp);border:1px solid var(--bdr);border-radius:var(--rxl);padding:11px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctx-label{font-size:11px;color:var(--gmt);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.ctx-select{height:34px;padding:0 30px 0 12px;border:1.5px solid var(--bdr);border-radius:var(--rm);background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><polyline points='6 9 12 15 18 9' stroke='%235A8A6A' fill='none' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>") right 8px center/12px no-repeat;font-family:inherit;font-size:13px;font-weight:600;color:var(--t);cursor:pointer;outline:none;-webkit-appearance:none;-moz-appearance:none;appearance:none;min-width:240px;transition:border-color .15s}
.ctx-select:focus{border-color:var(--g)}
.ctx-current{font-size:14px;font-weight:800;color:var(--t)}


/* DASHBOARD */
.dash{display:flex;flex-direction:column;gap:12px;animation:fadeUp .25s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* KPI CARDS */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.kpi-card{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:14px 16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--g)}
.kpi-card.kpi-blue::before{background:#3A90C0}
.kpi-card.kpi-orange::before{background:#C07030}
.kpi-card.kpi-purple::before{background:#9060C0}
.kpi-card.kpi-pink::before{background:#B05090}
.kpi-card.kpi-teal::before{background:#208090}
.kpi-label{font-size:10px;color:var(--gmt);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kpi-value{font-size:28px;font-weight:900;color:var(--t);line-height:1;letter-spacing:-.02em}
.kpi-hint{font-size:11px;color:var(--gmt)}

/* PANELS (charts, tables) */
.panels-row{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.panels-row.panels-row-1col{grid-template-columns:1fr}
.panel{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:16px 18px;box-shadow:var(--sh)}
.panel-title{font-size:13px;font-weight:800;color:var(--t);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel-title svg{width:14px;height:14px;stroke:var(--g);fill:none;stroke-width:1.8;stroke-linecap:round}
.panel-empty{padding:30px 14px;text-align:center;color:var(--gmt);font-size:12px;font-style:italic}

/* CHART CONTAINER */
.chart-box{position:relative;height:240px;width:100%}
.chart-box.chart-tall{height:320px}

/* TABLES */
.an-table{width:100%;border-collapse:collapse;font-size:12px}
.an-table th{padding:8px 10px;text-align:left;color:var(--gmt);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1.5px solid var(--bdr);white-space:nowrap}
.an-table td{padding:9px 10px;border-bottom:1px solid var(--bdr);color:var(--t)}
.an-table tr:last-child td{border-bottom:none}
.an-table .an-td-num{text-align:right;font-weight:700;color:var(--g)}
.an-row-link{cursor:pointer;transition:background .12s}
.an-row-link:hover{background:var(--gp)}
.an-user{display:flex;align-items:center;gap:8px}
.an-av{width:28px;height:28px;border-radius:8px;background:var(--g);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;flex-shrink:0;background-size:cover;background-position:center}
.an-name{font-weight:700;color:var(--t);font-size:12px;line-height:1.3}
.an-sub{font-size:10px;color:var(--gmt);margin-top:1px}

/* RIGHT SIDEBAR INFO */
.card{background:var(--w);border-radius:var(--rxl);border:1px solid var(--bdr);box-shadow:var(--sh);padding:14px}
.block-title{font-size:11px;font-weight:800;color:var(--tm);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.tip-card{background:linear-gradient(135deg,var(--gl),var(--gp));border:1px solid var(--gb);border-radius:var(--rxl);padding:14px}
.tip-title{font-size:12px;font-weight:800;color:var(--g);margin-bottom:6px}
.tip-text{font-size:11px;color:var(--tm);line-height:1.55}
.ad-block{background:#F8F5FF;border:1px solid #DDD0F0;border-radius:var(--rxl);padding:14px;position:relative;overflow:hidden}
.ad-label{position:absolute;top:10px;left:10px;background:#EAE0FA;color:#8060C0;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:6px}
.ad-content{margin-top:20px;text-align:center}
.ad-title{font-size:13px;font-weight:700;color:#5040A0}
.ad-sub{font-size:11px;color:#7060B0;margin-top:3px}
.ad-btn{display:block;margin:10px auto 0;padding:7px 20px;border-radius:var(--rm);background:#7060B0;color:#fff;font-size:12px;font-weight:600;border:none;cursor:pointer;font-family:inherit;transition:opacity .15s}
.ad-btn:hover{opacity:.88}

.skel{background:var(--gp);border-radius:var(--rm);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--t);color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:var(--z-overlay);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}


/* ── SIDEBAR ── */
.sb-card{padding:14px 16px}
.sb-summary-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--bdr);font-size:12px;color:var(--t)}
.sb-summary-row:last-child{border-bottom:none}
.sb-summary-icon{font-size:14px;flex-shrink:0;width:18px;text-align:center}
.sb-summary-num{font-weight:800;color:var(--g);margin-left:auto;font-size:13px;white-space:nowrap}
.sb-summary-num.neg{color:var(--red)}
.sb-summary-num.zero{color:var(--gmt)}
.sb-summary-empty,.sb-top-empty{font-size:11px;color:var(--gmt);font-style:italic;padding:6px 2px}
.sb-top-row{display:flex;align-items:center;gap:8px;padding:7px 4px;cursor:pointer;border-radius:var(--rm);transition:background .12s;text-decoration:none;color:inherit}
.sb-top-row:hover{background:var(--gp)}
.sb-top-row:not(:last-child){border-bottom:1px solid var(--bdr);border-radius:0}
.sb-top-row:hover{border-radius:var(--rm)}
.sb-top-av{width:28px;height:28px;border-radius:8px;background:var(--g);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;flex-shrink:0;background-size:cover;background-position:center}
.sb-top-info{flex:1;min-width:0}
.sb-top-name{font-size:11.5px;font-weight:700;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.sb-top-sub{font-size:10px;color:var(--gmt);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-top-num{font-size:11px;font-weight:800;color:var(--g);flex-shrink:0;white-space:nowrap}
.sb-top-more{display:block;text-align:center;padding:6px;margin-top:6px;border-top:1px solid var(--bdr);font-size:10px;font-weight:700;color:var(--g);text-decoration:none;cursor:pointer;letter-spacing:.05em;text-transform:uppercase}
.sb-top-more:hover{color:var(--gm)}
.sb-action-btn{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--rm);border:1.5px solid var(--bdr);background:var(--w);color:var(--t);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;width:100%;transition:all .15s;margin-bottom:6px}
.sb-action-btn:last-child{margin-bottom:0}
.sb-action-btn:hover{background:var(--gp);border-color:var(--gb);color:var(--g)}
.sb-action-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

@media(max-width:1200px){.shell{grid-template-columns:220px 1fr 260px}}
@media(max-width:1000px){.shell{grid-template-columns:220px 1fr;grid-template-areas:"logo topbar" "nav main"}.right{display:none}}
@media(max-width:740px){.shell{grid-template-columns:52px 1fr}.nav-item span,.nav-group{display:none}.nav-item{justify-content:center;padding:10px}.panels-row{grid-template-columns:1fr}}
@media (min-width:1921px) and (min-height:1081px){
  html,body{font-size:15px}
  .shell{grid-template-columns:280px 1fr 360px !important;gap:12px;padding:12px}
  .topbar{grid-template-columns:1fr 360px !important}
  .nav{padding:14px 12px 12px}
}
</style>
<link rel="stylesheet" href="/assets/dark-theme.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="shell">

<!-- LOGO -->
<a class="logo-cell" href="/"><img src="/assets/lastop-group-logo.svg" alt="LASTOP GROUP" onerror="this.style.display='none'"></a>

<!-- TOPBAR (стандартный — заполняется shell-layout/profile-context) -->
<header class="topbar"></header>

<!-- NAV (стандартный) -->
<nav class="nav"></nav>

<!-- ════ MAIN ════ -->
<div class="main">

  <!-- TOOLBAR -->
  <div class="an-toolbar">
    <span class="an-title">Аналитика</span>
    <span class="an-subtitle">Активность и метрики на платформе</span>
    <div class="period-switch" id="periodSwitch">
      <button type="button" class="period-btn" data-period="7d">7д</button>
      <button type="button" class="period-btn active" data-period="30d">30д</button>
      <button type="button" class="period-btn" data-period="90d">90д</button>
      <button type="button" class="period-btn" data-period="all">всё</button>
    </div>
  </div>

  <!-- SCOPE TABS -->
  <div class="scope-tabs" id="scopeTabs">
    <!-- табы рендерятся в JS на основе доступности -->
  </div>

  <!-- DASHBOARD -->
  <div class="dash" id="dashContainer">
    <div class="panel"><div class="panel-empty">Загрузка…</div></div>
  </div>

</div>

<!-- ════ RIGHT ════ -->
<aside class="right">
  <!-- Слот 1: Сводка периода -->
  <div class="card sb-card" id="sbSummary">
    <div class="block-title">Ключевая динамика</div>
    <div class="sb-summary-empty">Загрузка…</div>
  </div>

  <!-- Слот 2: Топ-3 (контекстный по табу) -->
  <div class="card sb-card" id="sbTop">
    <div class="block-title" id="sbTopTitle">Топ</div>
    <div class="sb-top-empty">Загрузка…</div>
  </div>

  <!-- Слот 3: Действия (контекстный по табу) -->
  <div class="card sb-card" id="sbActions">
    <div class="block-title">Действия</div>
    <div id="sbActionsList"></div>
  </div>

  <!-- Реклама -->
  <div class="ad-block">
    <div class="ad-label">реклама</div>
    <div class="ad-content">
      <div class="ad-title">LogisticsPro 2026</div>
      <div class="ad-sub">Выставка · Москва · май</div>
      <button type="button" class="ad-btn" onclick="location.href='/events.html'">Узнать подробнее</button>
    </div>
  </div>
</aside>

</div><!-- /shell -->

<div class="toast" id="toast"></div>

<script>
const API = '/api';

// ── STATE ──
const state = {
  user: null,
  scope: 'me',           // me | company | community | platform
  period: '30d',
  companies: [],         // мои компании
  communities: [],       // мои сообщества
  selectedCompanyId: null,
  selectedCommunityId: null,
  charts: {},            // живые экземпляры Chart.js (для destroy при перерендере)
};

// ── UTILS ──
const esc = window.lastopEsc;
const letter = window.lastopLetter;
const avc = window.lastopAvc;
function fmtNum(n){
  n = parseInt(n)||0;
  if(n>=1e6)return (n/1e6).toFixed(1).replace('.0','')+'M';
  if(n>=1e4)return (n/1e3).toFixed(1).replace('.0','')+'k';
  return new Intl.NumberFormat('ru-RU').format(n);
}
function fmtPct(n){if(!n)return '0%';return (Math.round(n*10)/10).toFixed(1).replace(/\.0$/,'')+'%';}
const ago = window.lastopAgo;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
function logout(){try{lastopFetch('/api/auth/logout',{method:'POST',keepalive:true});}catch{}try{localStorage.removeItem('user');}catch{}location.replace('/home-guest.html');}
function toggleProfileDD(e){e.stopPropagation();const dd=document.getElementById('profileDD');const tp=document.getElementById('topbarProfile');dd.classList.toggle('open');tp.classList.toggle('open');}
document.addEventListener('click',(e)=>{const dd=document.getElementById('profileDD');if(dd&&!dd.contains(e.target)&&!document.getElementById('topbarProfile').contains(e.target)){dd.classList.remove('open');document.getElementById('topbarProfile').classList.remove('open');}});

// ── AUTH + USER ──
async function loadUser(){
  if(!tk()){location.href='/login.html';return;}
  try{
    const r = await lastopFetch(API+'/me',{headers:{Authorization:'Bearer '+tk()}});
    if(!r.ok)throw 0;
    const{user={}} = await r.json();
    state.user = user;
    localStorage.setItem('user', JSON.stringify(user));
    populateProfile(user);
  }catch{
    state.user = JSON.parse(localStorage.getItem('user')||'{}');
    if(!state.user.id){location.href='/login.html';return;}
    populateProfile(state.user);
  }
}
function populateProfile(u){
  const name = u.full_name||u.name||'Участник';
  const ltr = letter(name);
  ["topbarAv","pddAv"].forEach(id=>{if(window.LASTOP_SET_AV)window.LASTOP_SET_AV(id,ltr,avc(name),((typeof u!=="undefined"&&u&&u.avatar_url)||(typeof currentUser!=="undefined"&&currentUser&&currentUser.avatar_url)||(typeof user!=="undefined"&&user&&user.avatar_url)||"")); else{const el=document.getElementById(id);if(el){el.textContent=ltr;el.style.background=avc(name);}}});
  ['topbarName','pddName'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=name;});
  ['topbarRole','pddRole'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=u.position||u.role||'Участник LASTOP';});
}

// ── SCOPES (доступные табы) ──
async function loadAvailableScopes(){
  // 1. Получить мои компании (где owner/admin)
  try{
    const r = await lastopFetch(API+'/companies?tab=my&role_filter=admin&limit=50',{headers:{Authorization:'Bearer '+tk()}});
    if(r.ok){
      const d = await r.json();
      state.companies = (d.items || d.companies || []);
    }
  }catch{}
  // 2. Получить мои сообщества (где owner/admin/moderator)
  try{
    const r = await lastopFetch(API+'/communities?tab=my&role_filter=admin&limit=50',{headers:{Authorization:'Bearer '+tk()}});
    if(r.ok){
      const d = await r.json();
      state.communities = (d.communities || d.items || []);
    }
  }catch{}
  renderScopeTabs();
}

function renderScopeTabs(){
  const tabs = [];
  // Личная — всегда
  tabs.push({key:'me', label:'Личная', svg:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'});
  // Компания — если есть
  if(state.companies.length){
    tabs.push({key:'company', label:'Компания', svg:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>'});
  }
  // Сообщество — если есть
  if(state.communities.length){
    tabs.push({key:'community', label:'Сообщество', svg:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'});
  }

async function fetchAnalytics(url){
  const r = await lastopFetch(url, {headers:{Authorization:'Bearer '+tk()}});
  if(!r.ok){
    return {error: 'HTTP '+r.status, status: r.status};
  }
  return await r.json();
}

// ── CHART HELPERS ──
function makeLineChart(canvasId, labels, datasets){
  const ctx = document.getElementById(canvasId);
  if(!ctx)return;
  const chart = new Chart(ctx, {
    type:'line',
    data:{labels, datasets: datasets.map((ds,i)=>({
      label: ds.label,
      data: ds.data,
      borderColor: ds.color || CHART_COLORS[i%CHART_COLORS.length],
      backgroundColor: (ds.color || CHART_COLORS[i%CHART_COLORS.length])+'22',
      fill:true, tension:0.35, pointRadius:2, pointHoverRadius:5, borderWidth:2
    }))},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:datasets.length>1, position:'top', labels:{font:{size:11}, boxWidth:12}}},
      scales:{
        y:{beginAtZero:true, ticks:{font:{size:10}, color:'#5A8A6A'}, grid:{color:'#DDE8E2'}},
        x:{ticks:{font:{size:9}, color:'#5A8A6A', maxRotation:0, autoSkip:true, maxTicksLimit:8}, grid:{display:false}}
      }
    }
  });
  state.charts[canvasId] = chart;
}
function makeDoughnutChart(canvasId, labels, data, colors){
  const ctx = document.getElementById(canvasId);
  if(!ctx)return;
  const chart = new Chart(ctx,{
    type:'doughnut',
    data:{labels, datasets:[{data, backgroundColor: colors||CHART_COLORS, borderWidth:0}]},
    options:{
      responsive:true, maintainAspectRatio:false, cutout:'60%',
      plugins:{legend:{position:'right', labels:{font:{size:11}, boxWidth:12, padding:10}}}
    }
  });
  state.charts[canvasId] = chart;
}
function makeBarChart(canvasId, labels, data, label, color){
  const ctx = document.getElementById(canvasId);
  if(!ctx)return;
  const chart = new Chart(ctx,{
    type:'bar',
    data:{labels, datasets:[{label: label||'', data, backgroundColor: color||CHART_COLORS[0], borderRadius:6}]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        y:{beginAtZero:true, ticks:{font:{size:10}, color:'#5A8A6A'}, grid:{color:'#DDE8E2'}},
        x:{ticks:{font:{size:10}, color:'#5A8A6A', maxRotation:0, autoSkip:true, maxTicksLimit:10}, grid:{display:false}}
      }
    }
  });
  state.charts[canvasId] = chart;
}

function dailyToChart(daily, mergeAll){
  // принимает [{date:'2026-04-01', count: 5}] или [{date, event_type, count}] (если mergeAll=true → все типы суммируем)
  if(!daily||!daily.length)return {labels:[], data:[]};
  const map = {};
  daily.forEach(d=>{
    map[d.date] = (map[d.date]||0) + (d.count||0);
  });
  const labels = Object.keys(map).sort();
  const data = labels.map(l=>map[l]);
  return {labels: labels.map(l=>l.slice(5)), data}; // показываем MM-DD
}

function dailyByTypeToChart(daily){
  // daily: [{date, event_type, count}]
  if(!daily||!daily.length)return {labels:[], datasets:[]};
  const types = [...new Set(daily.map(d=>d.event_type))];
  const dates = [...new Set(daily.map(d=>d.date))].sort();
  const datasets = types.map((t,i)=>({
    label: EVENT_LABELS[t]||t,
    color: CHART_COLORS[i%CHART_COLORS.length],
    data: dates.map(d=>{
      const m = daily.find(x=>x.date===d && x.event_type===t);
      return m ? m.count : 0;
    })
  }));
  return {labels: dates.map(d=>d.slice(5)), datasets};
}

// Расчёт сводки периода: сравниваем текущий период с предыдущим равной длины
function computeSummary(daily, periodLabel){
  if(!daily || !daily.length){
    return null;
  }
  // Агрегируем по дням (если daily содержит event_type — суммируем все типы)
  const byDay = {};
  daily.forEach(d=>{ byDay[d.date] = (byDay[d.date]||0) + (d.count||0); });
  const dates = Object.keys(byDay).sort();
  if(!dates.length) return null;

  // Лучший день
  let bestDay = dates[0], bestCount = byDay[dates[0]];
  dates.forEach(d=>{ if(byDay[d] > bestCount){ bestDay = d; bestCount = byDay[d]; } });

  // Сравнение с предыдущим периодом — если у нас есть >= 2 дней, делим пополам
  let growth = null;
  if(dates.length >= 2){
    const half = Math.floor(dates.length / 2);
    const firstHalf = dates.slice(0, half).reduce((s,d)=>s+byDay[d], 0);
    const secondHalf = dates.slice(half).reduce((s,d)=>s+byDay[d], 0);
    if(firstHalf > 0){
      growth = ((secondHalf - firstHalf) / firstHalf) * 100;
    } else if(secondHalf > 0){
      growth = 100;
    }
  }

  const total = dates.reduce((s,d)=>s+byDay[d], 0);

  return { bestDay, bestCount, growth, total, days: dates.length };
}

function renderSummary(daily, extra){
  // extra: {label2, val2, icon2} — опциональная третья строка (зависит от скоупа)
  const sum = computeSummary(daily);
  const el = document.getElementById('sbSummary');
  if(!sum){
    el.innerHTML = '<div class="block-title">Ключевая динамика</div><div class="sb-summary-empty">Нет данных за период</div>';
    return;
  }
  let growthRow = '';
  if(sum.growth !== null){
    const positive = sum.growth >= 0;
    const cls = positive ? '' : 'neg';
    const sign = positive ? '+' : '';
    const arrow = positive ? '↗' : '↘';
    growthRow = `<div class="sb-summary-row">
      <span class="sb-summary-icon">${arrow}</span>
      <span>Динамика к началу периода</span>
      <span class="sb-summary-num ${cls}">${sign}${Math.round(sum.growth)}%</span>
    </div>`;
  } else {
    growthRow = `<div class="sb-summary-row">
      <span class="sb-summary-icon">—</span>
      <span>Период слишком короткий</span>
      <span class="sb-summary-num zero">—</span>
    </div>`;
  }

  // Лучший день в человеческом формате
  const d = new Date(sum.bestDay);
  const dayLabel = isNaN(d) ? sum.bestDay : d.toLocaleDateString('ru-RU', {day:'numeric', month:'short'});

  let extraRow = '';
  if(extra){
    extraRow = `<div class="sb-summary-row">
      <span class="sb-summary-icon">${extra.icon||'•'}</span>
      <span>${esc(extra.label)}</span>
      <span class="sb-summary-num">${esc(String(extra.value))}</span>
    </div>`;
  }

  el.innerHTML = `<div class="block-title">Ключевая динамика</div>
    ${growthRow}
    <div class="sb-summary-row">
      <span class="sb-summary-icon">🏆</span>
      <span>Лучший день: ${dayLabel}</span>
      <span class="sb-summary-num">${fmtNum(sum.bestCount)}</span>
    </div>
    <div class="sb-summary-row">
      <span class="sb-summary-icon">∑</span>
      <span>Всего за период</span>
      <span class="sb-summary-num">${fmtNum(sum.total)}</span>
    </div>
    ${extraRow}`;
}
