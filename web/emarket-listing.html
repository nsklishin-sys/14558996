<!DOCTYPE html>
<html lang="ru">
<head>
<script src="/assets/utils.js"></script>
<script src="/assets/confirm-modal.js"></script>
<script src="/assets/dark-theme-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LASTOP GROUP — Товар</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/shell-layout.css">
<script>document.documentElement.classList.add('lt-shell');</script>
<link rel="stylesheet" href="/assets/hover-lift.css">
<script>document.documentElement.classList.add('hl-on');</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#1E8A4C;--gm:#22A05A;--gl:#E8F5EE;--gp:#F0FAF4;--gmt:#5A8A6A;--gb:#C0DECA;
  --w:#FFF;--bg:#F2F5F3;--t:#1A2A22;--tm:#3A5245;--bdr:#DDE8E2;
  --red:#E04040;--r:8px;--rm:12px;--rl:18px;--rxl:24px;
  --sh:0 2px 12px rgba(30,138,76,.07);--shm:0 6px 24px rgba(30,138,76,.13)
}
html,body{height:100%;overflow:hidden;font-family:'Manrope',sans-serif;background:var(--bg);color:var(--t);font-size:14px}
.logo-cell{grid-area:logo;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;padding:0 14px;text-decoration:none;box-shadow:var(--sh);transition:box-shadow .2s}
.logo-cell img{height:38px;width:auto;max-width:100%;object-fit:contain;display:block}
.main{grid-area:main;overflow-y:auto;display:flex;flex-direction:column;gap:14px;min-height:0;padding-bottom:16px;scrollbar-width:none;-ms-overflow-style:none}
.main::-webkit-scrollbar{display:none}
.right{grid-area:right;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:0}
@media(min-width:1921px) and (min-height:1081px){html.lt-shell .topbar{grid-template-columns:1fr 340px}}
.right::-webkit-scrollbar{width:4px}.right::-webkit-scrollbar-thumb{background:var(--gb);border-radius:99px}

/* breadcrumb */
.crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--gmt);flex-shrink:0}
.crumb a{color:var(--gmt);text-decoration:none}
.crumb a:hover{color:var(--g)}
.crumb svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8}

/* detail layout */
.ld-wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:18px;box-shadow:var(--sh)}
@media(max-width:900px){.ld-wrap{grid-template-columns:1fr}}

/* gallery */
.ld-gallery{min-width:0}
.ld-main-img{width:100%;aspect-ratio:4/3;border-radius:var(--rl);overflow:hidden;background:var(--gp);border:1px solid var(--bdr);display:grid;place-items:center}
.ld-main-img img{width:100%;height:100%;object-fit:cover}
.ld-main-img .ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--gb)}
.ld-main-img .ph svg{width:54px;height:54px;fill:none;stroke:currentColor;stroke-width:1.3}
.ld-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ld-thumb{width:64px;height:64px;border-radius:var(--rm);overflow:hidden;border:2px solid var(--bdr);cursor:pointer;background:var(--gp);transition:border-color .15s}
.ld-thumb.active{border-color:var(--g)}
.ld-thumb img{width:100%;height:100%;object-fit:cover}

/* info */
.ld-info{min-width:0;display:flex;flex-direction:column}
.ld-kind{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;margin-bottom:9px}
.ld-kind.product{background:var(--gl);color:var(--g)}
.ld-kind.service{background:#EAF1FB;color:#2479C8}
.ld-title{font-size:21px;font-weight:800;line-height:1.25;margin-bottom:8px}
.ld-rateline{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:12px;color:var(--gmt)}
.ld-stars{display:flex;align-items:center;gap:3px;color:#E8A52A;font-weight:700}
.ld-stars svg{width:14px;height:14px;fill:currentColor;stroke:none}
.ld-price{font-size:26px;font-weight:900;color:var(--t);margin-bottom:4px}
.ld-price.neg{font-size:18px;font-weight:700;color:var(--gmt)}
.ld-pay{font-size:12px;color:var(--gmt);margin-bottom:16px}
.ld-actions{display:flex;gap:9px;margin-bottom:18px;flex-wrap:wrap}
.ld-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:var(--rm);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .15s}
.ld-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ld-btn.primary{background:var(--g);color:#fff;flex:1;min-width:150px}
.ld-btn.primary:hover{background:var(--gm)}
.ld-btn.ghost{background:var(--gp);color:var(--tm);border:1.5px solid var(--bdr)}
.ld-btn.ghost:hover{background:var(--gl);color:var(--g);border-color:var(--gb)}
.ld-btn.saved{background:var(--gl);color:var(--g);border-color:var(--gb)}
/* EM-LISTING-WIRE: ld-soon больше не нужен — корзина и сохранения подключены к работающему бэку */
.ld-info-desc{margin-top:4px;padding-top:16px;border-top:1px solid var(--bdr)}
.ld-info-desc-h{font-size:13px;font-weight:800;margin-bottom:8px}

/* section blocks */
.ld-sec{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:18px;box-shadow:var(--sh)}
.ld-sec-h{font-size:15px;font-weight:800;margin-bottom:12px}
.ld-desc{font-size:13.5px;line-height:1.7;color:var(--tm);white-space:pre-wrap}
.ld-chars{display:grid;grid-template-columns:1fr;gap:0}
.ld-char{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dashed var(--bdr);font-size:13px}
.ld-char:last-child{border-bottom:none}
.ld-char .k{color:var(--gmt);flex-shrink:0}
.ld-char .v{color:var(--t);font-weight:600;text-align:right}

/* seller card */
.ld-seller{display:flex;align-items:center;gap:13px;cursor:pointer}
.ld-seller-logo{width:50px;height:50px;border-radius:var(--rm);background:var(--g);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:800;flex-shrink:0;overflow:hidden}
.ld-seller-logo img{width:100%;height:100%;object-fit:cover}
.ld-seller-info{flex:1;min-width:0}
.ld-seller-name{font-size:15px;font-weight:700}
.ld-seller-sub{font-size:12px;color:var(--gmt);margin-top:2px}
.ld-seller-arrow{color:var(--gmt)}
.ld-seller-arrow svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}

/* reviews placeholder */
.ld-empty{text-align:center;padding:24px 12px;color:var(--gmt)}
.ld-empty svg{width:34px;height:34px;fill:none;stroke:var(--gb);stroke-width:1.4;margin-bottom:8px}
.ld-empty p{font-size:13px}

/* right sidebar */
.rcard{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:14px;box-shadow:var(--sh)}
.rcard-h{font-size:11px;font-weight:700;color:var(--gmt);letter-spacing:.06em;text-transform:uppercase;margin-bottom:11px}
.rstat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bdr);font-size:12px}
.rstat:last-child{border-bottom:none}
.rstat .l{color:var(--gmt)}
.rstat .v{font-weight:700}
.ld-other{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--bdr);cursor:pointer;align-items:center}
.ld-other:last-child{border-bottom:none}
.ld-other:hover .ld-other-title{color:var(--g)}
.ld-other-img{width:46px;height:46px;border-radius:var(--rm);overflow:hidden;background:var(--gp);flex-shrink:0;display:grid;place-items:center}
.ld-other-img img{width:100%;height:100%;object-fit:cover}
.ld-other-ph{color:var(--gb)}
.ld-other-ph svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.4}
.ld-other-info{flex:1;min-width:0}
.ld-other-title{font-size:12.5px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;transition:color .15s}
.ld-other-price{font-size:12px;font-weight:700;color:var(--g);margin-top:3px}

.ld-skel{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:18px}
.sk{background:var(--bg);border-radius:var(--r);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* EM-TOAST-UNIFY: локальный .toast удалён — используется глобальный window.lastopToast */
</style>
<link rel="stylesheet" href="/assets/dark-theme.css">
</head>
<body>
<div class="shell">
<a class="logo-cell" href="/"><img src="/assets/lastop-group-logo.svg" alt="LASTOP GROUP" onerror="this.style.display='none'"></a>
<header class="topbar"></header>
<nav class="nav"></nav>
<main class="main" id="ldMain"></main>
<aside class="right" id="ldRight"></aside>
</div>

<script>
const API='/api';
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function letter(s){return((s||'?').trim()[0]||'?').toUpperCase();}
/* EM-TOAST-UNIFY: глобальная window.showToast из confirm-modal.js — поддерживает 'success'/'error'/'warn' */
function priceHTML(p,cur){
  if(p==null||p===0)return '<div class="ld-price neg">Цена договорная</div>';
  var sym=cur==='USD'?'$':cur==='EUR'?'€':'₽';
  return '<div class="ld-price">'+Number(p).toLocaleString('ru-RU')+' '+sym+'</div>';
}

var LD={id:0,listing:null,shop:null,gallery:[],saved:false};

function getId(){
  var p=new URLSearchParams(location.search);
  return parseInt(p.get('id'))||0;
}

window.addEventListener('DOMContentLoaded',function(){
  LD.id=getId();
  if(!LD.id){renderError('Товар не указан');return;}
  loadListing();
});

function skeleton(){
  document.getElementById('ldMain').innerHTML='<div class="ld-skel"><div style="display:grid;grid-template-columns:1.15fr 1fr;gap:16px"><div class="sk" style="aspect-ratio:4/3;border-radius:18px"></div><div><div class="sk" style="height:22px;width:70%;margin-bottom:12px;border-radius:6px"></div><div class="sk" style="height:30px;width:40%;margin-bottom:16px;border-radius:6px"></div><div class="sk" style="height:44px;width:100%;border-radius:12px"></div></div></div></div>';
}

async function loadListing(){
  skeleton();
  try{
    var r=await lastopFetch(API+'/emarket/listings/'+LD.id);
    if(!r.ok)throw new Error('not found');
    var d=await r.json();
    LD.listing=d.listing;
    if(!LD.listing)throw new Error('empty');
    LD.gallery=Array.isArray(LD.listing.photos)?LD.listing.photos:[];
    LD.saved=!!LD.listing.is_saved;
    render();
    loadShop(LD.listing.shop_id);
  }catch(e){
    renderError('Товар не найден или был удалён');
  }
}

async function loadShop(shopId){
  if(!shopId)return;
  try{
    var r=await lastopFetch(API+'/emarket/shops/'+shopId);
    if(!r.ok)return;
    var d=await r.json();
    LD.shop=d.shop;
    renderRight();
  }catch(e){}
}

function renderError(msg){
  document.getElementById('ldMain').innerHTML='<div class="ld-sec"><div class="ld-empty"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><p>'+esc(msg)+'</p><div style="margin-top:14px"><a class="ld-btn ghost" href="/emarket" style="text-decoration:none;display:inline-flex">← Вернуться в E-market</a></div></div></div>';
  document.getElementById('ldRight').innerHTML='';
}

function render(){
  var l=LD.listing;
  var isService=l.kind==='service';
  var chars=Array.isArray(l.characteristics)?l.characteristics:[];
  var rating=l.rating>0?Number(l.rating).toFixed(1):null;

  var mainImg=LD.gallery.length
    ? '<img id="ldMainImg" src="'+esc(LD.gallery[0])+'" alt="'+esc(l.title)+'">'
    : '<div class="ph"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span style="font-size:12px">Нет фото</span></div>';

  var thumbs=LD.gallery.length>1
    ? '<div class="ld-thumbs">'+LD.gallery.map(function(p,i){return '<div class="ld-thumb'+(i===0?' active':'')+'" onclick="setMainImg('+i+',this)"><img src="'+esc(p)+'" alt=""></div>';}).join('')+'</div>'
    : '';

  var charsHTML='<div class="ld-sec"><div class="ld-sec-h">Характеристики</div>';
  if(chars.length){
    charsHTML+='<div class="ld-chars">'+chars.map(function(c){
      var k=c.name||c.key||c.k||'';
      var v=c.value||c.val||c.v||'';
      if(!k&&!v)return '';
      return '<div class="ld-char"><span class="k">'+esc(k)+'</span><span class="v">'+esc(v)+'</span></div>';
    }).join('')+'</div>';
  }else{
    charsHTML+='<div style="font-size:13px;color:var(--gmt)">Характеристики не указаны</div>';
  }
  charsHTML+='</div>';

  document.getElementById('ldMain').innerHTML=
    '<div class="crumb"><a href="/emarket">E-market</a><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg><a href="/emarket?tab='+(isService?'services':'products')+'">'+(isService?'Услуги':'Товары')+'</a><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg><span>'+esc(l.title)+'</span></div>'
    +'<div class="ld-wrap">'
      +'<div class="ld-gallery"><div class="ld-main-img">'+mainImg+'</div>'+thumbs+'</div>'
      +'<div class="ld-info">'
        +'<span class="ld-kind '+(isService?'service':'product')+'">'+(isService?'Услуга':'Товар')+'</span>'
        +'<div class="ld-title">'+esc(l.title)+'</div>'
        +'<div class="ld-rateline">'
          +(rating?'<span class="ld-stars"><svg viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/></svg>'+rating+'</span><span>'+(l.reviews_count||0)+' отзывов</span>':'<span>Нет оценок</span>')
          +'<span>'+(l.views_count||0)+' просмотров</span>'
        +'</div>'
        +priceHTML(l.price,l.currency)
        +(l.payment_method?'<div class="ld-pay">Оплата: '+esc(l.payment_method)+'</div>':'<div style="height:8px"></div>')
        +'<div class="ld-actions">'
          +'<button class="ld-btn primary" id="ldCartBtn" onclick="addToCart()"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>В корзину</button>'
          +'<button class="ld-btn ghost" onclick="contactSeller()"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Связаться</button>'
          +'<button class="ld-btn primary" onclick="openLeadModal()"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13 1.05.36 2.07.68 3a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.97.32 1.98.55 3 .68A2 2 0 0 1 22 16.92z"/></svg>Оставить заявку</button>'
          +'<button class="ld-btn ghost'+(LD.saved?' saved':'')+'" id="ldSaveBtn" onclick="toggleSave()" title="'+(LD.saved?'Убрать из сохранённого':'Сохранить')+'"><svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" fill="'+(LD.saved?'currentColor':'none')+'"/></svg></button>'
        +'</div>'
        +'<div class="ld-info-desc"><div class="ld-info-desc-h">Описание</div><div class="ld-desc">'+(l.description?esc(l.description):'<span style="color:var(--gmt)">Описание не указано</span>')+'</div></div>'
      +'</div>'
    +'</div>'
    +charsHTML
    +'<div class="ld-sec"><div class="ld-sec-h">Отзывы</div><div class="ld-empty"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><p>Отзывы появятся здесь. Раздел в разработке.</p></div></div>';
}

function setMainImg(i,el){
  var img=document.getElementById('ldMainImg');
  if(img)img.src=LD.gallery[i];
  document.querySelectorAll('.ld-thumb').forEach(function(t){t.classList.remove('active');});
  if(el)el.classList.add('active');
}

function renderRight(){
  var l=LD.listing,s=LD.shop;
  var box=document.getElementById('ldRight');
  var sellerCard=s?'<div class="rcard"><div class="rcard-h">Продавец</div><div class="ld-seller" onclick="openShop('+s.id+')" style="cursor:pointer"><div class="ld-seller-logo" style="width:42px;height:42px;font-size:15px">'+(s.logo_url?'<img src="'+esc(s.logo_url)+'" alt="">':esc(letter(s.name)))+'</div><div class="ld-seller-info"><div class="ld-seller-name" style="font-size:14px">'+esc(s.name)+'</div><div class="ld-seller-sub">'+(s.rating>0?('★ '+Number(s.rating).toFixed(1)):'Нет оценок')+'</div></div></div></div>':'';
  box.innerHTML=
    sellerCard
    +'<div class="rcard"><div class="rcard-h">О позиции</div>'
      +'<div class="rstat"><span class="l">Тип</span><span class="v">'+(l.kind==='service'?'Услуга':'Товар')+'</span></div>'
      +(l.category_key?'<div class="rstat"><span class="l">Категория</span><span class="v">'+esc(l.category_key)+'</span></div>':'')
      +'<div class="rstat"><span class="l">Просмотров</span><span class="v">'+(l.views_count||0)+'</span></div>'
      +'<div class="rstat"><span class="l">Рейтинг</span><span class="v">'+(l.rating>0?Number(l.rating).toFixed(1):'—')+'</span></div>'
    +'</div>'
    +'<div class="rcard" id="ldOtherCard" style="display:none"><div class="rcard-h" style="display:flex;justify-content:space-between;align-items:center">Другие товары продавца<a href="#" id="ldAllLink" style="font-size:11px;color:var(--g);text-decoration:none;font-weight:700">Все →</a></div><div id="ldOther"></div></div>';
  if(s)loadOther(s.id);
}

async function loadOther(shopId){
  try{
    var r=await lastopFetch(API+'/emarket/shop-listings?shop_id='+shopId);
    if(!r.ok)return;
    var d=await r.json();
    var items=(d.listings||[]).filter(function(x){return x.id!==LD.id;}).slice(0,4);
    if(!items.length)return;
    var card=document.getElementById('ldOtherCard');
    var box=document.getElementById('ldOther');
    var allLink=document.getElementById('ldAllLink');
    if(allLink)allLink.onclick=function(e){e.preventDefault();openShop(shopId);};
    box.innerHTML=items.map(function(x){
      var img=(Array.isArray(x.photos)&&x.photos.length)?'<img src="'+esc(x.photos[0])+'" alt="">':'<div class="ld-other-ph"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>';
      var price=(x.price==null||x.price===0)?'Договорная':(Number(x.price).toLocaleString('ru-RU')+' '+(x.currency==='USD'?'$':x.currency==='EUR'?'€':'₽'));
      return '<div class="ld-other" onclick="location.href=\'/emarket-listing?id='+x.id+'\'"><div class="ld-other-img">'+img+'</div><div class="ld-other-info"><div class="ld-other-title">'+esc(x.title)+'</div><div class="ld-other-price">'+price+'</div></div></div>';
    }).join('');
    card.style.display='';
  }catch(e){}
}

async function addToCart(){
  var btn=document.getElementById('ldCartBtn');
  if(!btn||btn.disabled)return;
  btn.disabled=true;
  try{
    var r=await lastopFetch(API+'/emarket/cart',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({listing_id:LD.id,quantity:1})});
    if(r.status===401){showToast('Войдите, чтобы добавлять в корзину','warn');return;}
    if(!r.ok){showToast('Не удалось добавить в корзину','error');return;}
    showToast('Добавлено в корзину','success');
  }catch(e){showToast('Сеть недоступна','error');}
  finally{btn.disabled=false;}
}
async function toggleSave(){
  var btn=document.getElementById('ldSaveBtn');
  if(!btn||btn.disabled)return;
  btn.disabled=true;
  try{
    var r;
    if(LD.saved){
      r=await lastopFetch(API+'/emarket/saved?listing_id='+LD.id,{method:'DELETE'});
    }else{
      r=await lastopFetch(API+'/emarket/saved',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({listing_id:LD.id})});
    }
    if(r.status===401){showToast('Войдите, чтобы сохранять','warn');return;}
    if(!r.ok){showToast('Не удалось сохранить','error');return;}
    LD.saved=!LD.saved;
    btn.classList.toggle('saved',LD.saved);
    btn.title=LD.saved?'Убрать из сохранённого':'Сохранить';
    var path=btn.querySelector('path');
    if(path)path.setAttribute('fill',LD.saved?'currentColor':'none');
    showToast(LD.saved?'Добавлено в сохранённое':'Убрано из сохранённого','success');
  }catch(e){showToast('Сеть недоступна','error');}
  finally{btn.disabled=false;}
}
function contactSeller(){
  if(LD.shop&&LD.shop.owner_type==='user'&&LD.shop.owner_id){
    location.href='/chat?user='+LD.shop.owner_id;
  }else if(LD.shop&&LD.shop.contact_phone){
    showToast('Контакт продавца: '+LD.shop.contact_phone);
  }else{
    showToast('Свяжитесь с продавцом через страницу магазина');
    if(LD.shop)setTimeout(function(){openShop(LD.shop.id);},900);
  }
}
function openLeadModal(){
  if(!LD.shop||!LD.shop.slug){showToast('Магазин недоступен','warn');return;}
  var subj=document.getElementById('leadModalSubject');
  if(subj&&LD.listing)subj.innerHTML='По позиции: <b style="color:var(--t)">'+esc(LD.listing.title||'')+'</b>';
  var form=document.getElementById('leadForm'),ok=document.getElementById('leadFormOk');
  if(form)form.style.display='';
  if(ok)ok.style.display='none';
  document.getElementById('leadModalBg').style.display='flex';
}
function closeLeadModal(){document.getElementById('leadModalBg').style.display='none';}
async function submitListingLead(e){
  e.preventDefault();
  var form=e.target;
  var btn=document.getElementById('leadFormBtn');
  var name=(form.querySelector('[name=name]')||{}).value||'';
  var contact=(form.querySelector('[name=contact]')||{}).value||'';
  var message=(form.querySelector('[name=message]')||{}).value||'';
  if(btn){btn.disabled=true;btn.textContent='Отправка…';}
  try{
    var r=await lastopFetch(API+'/emarket/site/'+encodeURIComponent(LD.shop.slug)+'/lead',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        name:name.trim(),contact:contact.trim(),message:message.trim(),
        subject_type:'listing',
        subject_id:(LD.listing&&LD.listing.id)||0,
        subject_title:(LD.listing&&LD.listing.title)||''
      })
    });
    if(!r.ok)throw 0;
    form.style.display='none';
    document.getElementById('leadFormOk').style.display='block';
  }catch(err){
    if(btn){btn.disabled=false;btn.textContent='Отправить заявку';}
    showToast('Не удалось отправить заявку, попробуйте позже','error');
  }
  return false;
}
function openShop(id){location.href='/emarket-shop?id='+id;}
</script>
<div id="leadModalBg" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(15,25,18,.5);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:18px" onclick="if(event.target===this)closeLeadModal()">
  <div style="background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);box-shadow:0 24px 60px rgba(30,138,76,.2);width:100%;max-width:440px;padding:22px">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px">
      <div style="font-size:17px;font-weight:800;color:var(--t)">Оставить заявку</div>
      <button onclick="closeLeadModal()" style="width:30px;height:30px;flex-shrink:0;border:none;background:var(--gp);border-radius:var(--r);cursor:pointer;color:var(--gmt);font-size:18px;line-height:1">×</button>
    </div>
    <div id="leadModalSubject" style="font-size:13px;color:var(--gmt);margin-bottom:16px"></div>
    <form id="leadForm" onsubmit="return submitListingLead(event)">
      <input required name="name" placeholder="Ваше имя" style="width:100%;border:1.5px solid var(--bdr);border-radius:var(--rm);padding:11px 13px;font-family:inherit;font-size:14px;color:var(--t);background:var(--gp);outline:none;margin-bottom:10px">
      <input required name="contact" placeholder="Телефон или email" style="width:100%;border:1.5px solid var(--bdr);border-radius:var(--rm);padding:11px 13px;font-family:inherit;font-size:14px;color:var(--t);background:var(--gp);outline:none;margin-bottom:10px">
      <textarea name="message" placeholder="Сообщение (необязательно)" style="width:100%;height:84px;resize:none;border:1.5px solid var(--bdr);border-radius:var(--rm);padding:11px 13px;font-family:inherit;font-size:14px;color:var(--t);background:var(--gp);outline:none;line-height:1.5;margin-bottom:12px"></textarea>
      <label style="display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--gmt);margin-bottom:14px;cursor:pointer"><input type="checkbox" required style="margin-top:2px;flex-shrink:0">Согласен на обработку персональных данных</label>
      <button class="ld-btn primary" type="submit" id="leadFormBtn" style="width:100%">Отправить заявку</button>
    </form>
    <div id="leadFormOk" style="display:none;text-align:center;padding:14px 0;font-size:14px;font-weight:700;color:var(--g)">Спасибо! Ваша заявка отправлена продавцу.</div>
  </div>
</div>
</body>
</html>
