<!DOCTYPE html>
<html lang="ru">
<head>
<script src="/assets/utils.js"></script>
<script src="/assets/dark-theme-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LASTOP GROUP — Карьера</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/shell-layout.css">
<script>document.documentElement.classList.add('lt-shell');</script>
<link rel="stylesheet" href="/assets/hover-lift.css">
<script>document.documentElement.classList.add('hl-on');</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#1E8A4C;--gm:#22A05A;--gl:#E8F5EE;--gp:#F0FAF4;--gmt:#5A8A6A;--gb:#C0DECA;
  --w:#FFF;--bg:#F2F5F3;--t:#1A2A22;--tm:#3A5245;--bdr:#DDE8E2;
  --red:#E04040;--r:8px;--rm:12px;--rl:18px;--rxl:24px;
  --sh:0 2px 12px rgba(30,138,76,.07);--shm:0 6px 24px rgba(30,138,76,.13)
}
html,body{height:100%;overflow:hidden;font-family:'Manrope',sans-serif;background:var(--bg);color:var(--t);font-size:14px}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}

/* SHELL */
.shell{display:grid;grid-template-columns:240px 1fr 300px;grid-template-rows:56px 1fr;grid-template-areas:"logo topbar topbar""nav main right";height:100vh;gap:10px;padding:10px}

.logo-cell{grid-area:logo;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;padding:0 14px;text-decoration:none;box-shadow:var(--sh);transition:box-shadow .2s}
.logo-cell:hover{box-shadow:var(--shm)}
.logo-cell img{height:38px;width:auto;max-width:100%;object-fit:contain;display:block}

/* TOPBAR */
.topbar{grid-area:topbar;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:grid;grid-template-columns:1fr 300px;align-items:center;gap:10px;padding:0 16px;box-shadow:var(--sh);min-width:0}
.search-wrap{position:relative;display:flex;align-items:center;min-width:0}
.search-wrap input{width:100%;height:36px;padding:0 14px 0 30px;border:1.5px solid var(--bdr);border-radius:99px;background:#fff;font-family:inherit;font-size:13px;color:var(--t);outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--gm)}
.search-wrap input::placeholder{color:var(--gmt)}

/* NAV */
.nav{grid-area:nav;background:var(--w);border-radius:var(--rxl);border:1px solid var(--bdr);box-shadow:var(--sh);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;padding:12px 10px 10px;gap:1px}
.nav::-webkit-scrollbar{display:none}

/* MAIN / RIGHT */
.main{grid-area:main;overflow-y:auto;overflow-x:hidden;min-width:0;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.main > *{flex-shrink:0}
.right{grid-area:right;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.right > *{flex-shrink:0}

/* ── ТУЛБАР ── */
.jobs-toolbar{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:12px 14px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.jobs-title{font-size:16px;font-weight:900;color:var(--t);white-space:nowrap}
.jobs-subtitle{font-size:12px;color:var(--gmt);margin-right:auto}
.mode-switch{display:flex;background:var(--gp);border:1.5px solid var(--bdr);border-radius:99px;padding:3px;gap:2px;flex-shrink:0}
.mode-btn{padding:5px 16px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit;color:var(--gmt);background:transparent;transition:all .15s;white-space:nowrap}
.mode-btn.active{background:var(--g);color:#fff;box-shadow:0 2px 6px rgba(30,138,76,.2)}
.btn-create-job{padding:8px 18px;border-radius:99px;background:var(--g);border:none;color:#fff;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(30,138,76,.22);white-space:nowrap;flex-shrink:0}
.btn-create-job:hover{background:var(--gm)}
.btn-create-job svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round}

/* ── ТАБЫ ── */
.tabs-row{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:10px 14px;box-shadow:var(--sh);display:flex;gap:6px;flex-wrap:wrap}
.jtab{padding:6px 13px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--bdr);background:transparent;color:var(--tm);font-family:inherit;transition:all .15s;white-space:nowrap}
.jtab:hover{background:var(--gp);color:var(--g);border-color:var(--gb)}
.jtab.active{background:var(--g);color:#fff;border-color:var(--g)}

/* ── ФИЛЬТРЫ ── */
.filter-row{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:10px 14px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pf-search{flex:1;min-width:220px;position:relative;display:flex;align-items:center}
.pf-search svg{position:absolute;left:11px;width:13px;height:13px;stroke:var(--gmt);fill:none;stroke-width:1.8;stroke-linecap:round;pointer-events:none}
.pf-search input{width:100%;height:32px;padding:0 14px 0 30px;border:1.5px solid var(--bdr);border-radius:99px;background:#fff;font-family:inherit;font-size:12px;color:var(--t);outline:none;transition:border-color .15s}
.pf-search input:focus{border-color:var(--gm)}
.pf-select{height:32px;padding:0 26px 0 12px;border:1.5px solid var(--bdr);border-radius:99px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><polyline points='6 9 12 15 18 9' stroke='%235A8A6A' fill='none' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>") right 8px center/12px no-repeat;font-family:inherit;font-size:12px;color:var(--t);cursor:pointer;outline:none;-webkit-appearance:none;-moz-appearance:none;appearance:none;transition:border-color .15s}
.pf-select:focus{border-color:var(--gm)}
.pf-count{font-size:11px;font-weight:700;color:var(--gmt);margin-left:auto}

/* ── КАРТОЧКА ВАКАНСИИ ── */
.feed{display:flex;flex-direction:column;gap:10px}
.job-card{background:var(--w);border-radius:var(--rxl);border:1px solid var(--bdr);box-shadow:var(--sh);padding:16px 18px;cursor:pointer;display:flex;gap:14px;align-items:flex-start;transition:all .2s;animation:fadeUp .25s ease both}
.job-card:hover{box-shadow:var(--shm);transform:translateY(-2px);border-color:var(--gb)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.jc-stripe{width:4px;align-self:stretch;border-radius:99px;flex-shrink:0;min-height:60px}
.jc-body{flex:1;min-width:0}
.jc-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.jc-cat-tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:#fff;flex-shrink:0}
.jc-status-tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;flex-shrink:0;border:1px solid}
.jc-status-hot{background:#FFF1F0;color:#E04040;border-color:#FFD5D2}
.jc-status-new{background:#FFF7EE;color:#EA580C;border-color:#FFE0BC}
.jc-status-paused{background:#F1F5F4;color:#5A8A6A;border-color:#DDE8E2}
.jc-format-tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;background:var(--gl);color:var(--g);border:1px solid var(--gb);flex-shrink:0}
.jc-title{font-size:15px;font-weight:800;color:var(--t);line-height:1.3;letter-spacing:-.01em;margin-bottom:6px}
.job-card:hover .jc-title{color:var(--g)}
.jc-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--gmt);margin-bottom:6px}
.jc-meta-item{display:flex;align-items:center;gap:4px}
.jc-meta-item svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;flex-shrink:0}
.jc-author{font-weight:700;color:var(--tm)}
.jc-salary{font-size:14px;font-weight:800;color:var(--g)}
.jc-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.jc-tag{padding:2px 8px;background:var(--gp);color:var(--tm);border-radius:99px;font-size:10px;font-weight:600;border:1px solid var(--bdr)}

/* ── РЕЗЮМЕ КАРТОЧКА ── */
.cv-card{background:var(--w);border-radius:var(--rxl);border:1px solid var(--bdr);box-shadow:var(--sh);padding:16px 18px;cursor:pointer;display:flex;gap:14px;align-items:flex-start;transition:all .2s;animation:fadeUp .25s ease both}
.cv-card:hover{box-shadow:var(--shm);transform:translateY(-2px);border-color:var(--gb)}
.cv-av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800;flex-shrink:0}
.cv-body{flex:1;min-width:0}
.cv-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.cv-status-tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;border:1px solid;flex-shrink:0}
.cv-status-active{background:#FFF1F0;color:#E04040;border-color:#FFD5D2}
.cv-status-open{background:var(--gl);color:var(--g);border-color:var(--gb)}
.cv-status-passive{background:#F1F5F4;color:#5A8A6A;border-color:#DDE8E2}
.cv-name{font-size:14px;font-weight:800;color:var(--t);margin-bottom:2px}
.cv-position{font-size:13px;color:var(--tm);font-weight:600;margin-bottom:6px}
.cv-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--gmt);margin-bottom:6px}
.cv-meta-item{display:flex;align-items:center;gap:4px}
.cv-meta-item svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;flex-shrink:0}
.cv-salary{font-size:13px;font-weight:800;color:var(--g)}
.cv-skills{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.cv-skill{padding:2px 8px;background:var(--gp);color:var(--tm);border-radius:99px;font-size:10px;font-weight:600;border:1px solid var(--bdr)}

/* ── EMPTY ── */
.empty-state{padding:50px 20px;text-align:center;color:var(--gmt);font-size:13px;font-style:italic}

/* ── САЙДБАР ── */
.card{background:var(--w);border-radius:var(--rxl);border:1px solid var(--bdr);box-shadow:var(--sh);padding:14px}
.block-title{font-size:11px;font-weight:800;color:var(--tm);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.cat-list{display:flex;flex-direction:column;gap:4px}
.cat-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--r);cursor:pointer;transition:background .12s;color:var(--t);text-decoration:none;font-size:12px}
.cat-row:hover{background:var(--gp)}
.cat-row.active{background:var(--gl);color:var(--g);font-weight:700}
.cat-row-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cat-caret{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--gmt);flex-shrink:0;border-radius:4px;cursor:pointer;transition:background .12s}
.cat-caret:hover{background:var(--gl);color:var(--g)}
.cat-caret-empty{width:16px;flex-shrink:0;display:inline-block}
.cat-lvl1{padding-left:18px;font-size:11.5px}
.cat-lvl2{padding-left:34px;font-size:11px;color:var(--tm)}
.tip-card{background:linear-gradient(135deg,var(--gl),var(--gp));border:1px solid var(--gb);border-radius:var(--rxl);padding:14px}
.tip-title{font-size:12px;font-weight:800;color:var(--g);margin-bottom:6px}
.tip-text{font-size:11px;color:var(--tm);line-height:1.5}

/* ── МОДАЛКА ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:var(--z-modal);padding:20px;backdrop-filter:blur(2px)}
.modal-bg.open{display:flex}
.modal{background:var(--w);border-radius:var(--rxl);box-shadow:0 20px 50px rgba(0,0,0,.2);max-width:760px;width:100%;max-height:90vh;display:flex;flex-direction:column;animation:fadeUp .2s ease;margin:auto}
@media(min-height:800px){.modal{max-height:86vh}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--bdr)}
.modal-title{font-size:16px;font-weight:800;color:var(--t)}
.modal-close{width:32px;height:32px;border-radius:8px;background:transparent;border:none;color:var(--gmt);cursor:pointer;display:grid;place-items:center;transition:all .12s}
.modal-close:hover{background:var(--gp);color:var(--t)}
.modal-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.modal-body{padding:18px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--bdr)}
.mf-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mf-row > div{min-width:0}
.mf-label{font-size:12px;font-weight:700;color:var(--tm);margin-bottom:5px;display:block}
.mf-input,.mf-textarea,.mf-select{width:100%;padding:9px 12px;border:1.5px solid var(--bdr);border-radius:var(--rm);font-family:inherit;font-size:13px;background:#fff;color:var(--t);outline:none;transition:border-color .12s}
.mf-textarea{height:90px;resize:vertical;min-height:60px}
.mf-input:focus,.mf-textarea:focus,.mf-select:focus{border-color:var(--g)}
.mf-counter{font-size:10px;color:var(--gmt);text-align:right;margin-top:2px}
.btn-cancel{padding:9px 16px;border-radius:99px;background:transparent;color:var(--t);border:1.5px solid var(--bdr);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .12s}
.btn-cancel:hover{background:var(--gp)}
.btn-submit{padding:9px 16px;border-radius:99px;background:var(--g);color:#fff;border:none;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:background .12s}
.btn-submit:hover{background:var(--gm)}
.btn-submit:disabled{opacity:.6;cursor:default}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--t);color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:var(--z-overlay);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--g)}

@media(max-width:1200px){.shell{grid-template-columns:220px 1fr 260px}}
@media(max-width:1000px){.shell{grid-template-columns:220px 1fr;grid-template-areas:"logo topbar""nav main"}.right{display:none}}
@media(max-width:740px){.shell{grid-template-columns:52px 1fr}.nav-item span,.nav-group{display:none}.nav-item{justify-content:center;padding:10px}.mf-row{grid-template-columns:1fr}}
@media (min-width:1921px) and (min-height:1081px){
  html,body{font-size:15px}
  .shell{grid-template-columns:280px 1fr 360px !important;gap:12px;padding:12px}
  .topbar{grid-template-columns:1fr 360px !important}
  .nav{padding:14px 12px 12px}
}
</style>
<link rel="stylesheet" href="/assets/dark-theme.css">
</head>
<body>
<div class="shell">

<!-- LOGO -->
<a class="logo-cell" href="/"><img src="/assets/lastop-group-logo.svg" alt="LASTOP GROUP" onerror="this.style.display='none'"></a>

<!-- TOPBAR -->
<header class="topbar"></header>

<!-- NAV -->
<nav class="nav"></nav>

<!-- ════ MAIN ════ -->
<div class="main">

  <!-- Тулбар -->
  <div class="jobs-toolbar">
    <span class="jobs-title">Карьера</span>
    <span class="jobs-subtitle">B2B-найм для бизнеса</span>
    <div class="mode-switch">
      <button type="button" class="mode-btn active" id="modeJobs" onclick="setMode('jobs')">Вакансии</button>
      <button type="button" class="mode-btn" id="modeCvs" onclick="setMode('cvs')">Резюме</button>
    </div>
    <button type="button" class="btn-create-job" onclick="openCreateModal()">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span id="createBtnLabel">Создать вакансию</span>
    </button>
  </div>

  <!-- Табы -->
  <div class="tabs-row" id="tabsRow"></div>

  <!-- Фильтры -->
  <div class="filter-row">
    <div class="pf-search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="searchInput2" placeholder="Поиск…" oninput="applyFilters()">
    </div>
    <select class="pf-select" id="filterCity" onchange="loadList()">
      <option value="">Все города</option>
      <option>Москва</option><option>Санкт-Петербург</option><option>Самара</option>
      <option>Екатеринбург</option><option>Новосибирск</option><option>Казань</option>
    </select>
    <select class="pf-select" id="filterFormat" onchange="loadList()">
      <option value="">Любой формат</option>
      <option value="office">Офис</option>
      <option value="remote">Удалённо</option>
      <option value="hybrid">Гибрид</option>
    </select>
    <select class="pf-select" id="filterExp" onchange="loadList()">
      <option value="">Любой опыт</option>
      <option value="1">До 1 года</option>
      <option value="3">До 3 лет</option>
      <option value="5">До 5 лет</option>
      <option value="10">До 10 лет</option>
    </select>
    <span class="pf-count" id="resultsCount">0</span>
  </div>

  <!-- Лента -->
  <div id="feed" class="feed"></div>

</div>

<!-- RIGHT -->
<aside class="right">
  <div class="card">
    <div class="block-title">Категории</div>
    <div class="cat-list" id="catList">
      <div class="lt-skel-pulse" style="height:10px;width:70%;margin:8px 0;border-radius:4px"></div>
      <div class="lt-skel-pulse" style="height:10px;width:50%;margin:8px 0;border-radius:4px"></div>
    </div>
  </div>

  <div class="tip-card">
    <div class="tip-title">💡 Совет</div>
    <div class="tip-text" id="tipText">Используйте теги, чтобы соискателям было проще находить вашу вакансию по навыкам.</div>
  </div>
</aside>

</div>

<!-- ===== Модалка: Вакансия ===== -->
<div class="modal-bg" id="modalJob" onclick="if(event.target===this)closeCreateModal()">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title">Создать вакансию</span>
      <button type="button" class="modal-close" onclick="closeCreateModal()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div>
        <label class="mf-label">Название позиции *</label>
        <input class="mf-input" id="jobTitle" placeholder="Например: Логист международных перевозок" maxlength="200">
      </div>
      <div class="mf-row">
        <div>
          <label class="mf-label">Категория *</label>
          <select class="mf-select" id="jobCategory" data-category-picker></select>
        </div>
        <div>
          <label class="mf-label">Опыт (мин. лет)</label>
          <input class="mf-input" id="jobExp" type="number" min="0" max="50" value="0">
        </div>
      </div>
      <div class="mf-row">
        <div>
          <label class="mf-label">Город</label>
          <input class="mf-input" id="jobCity" placeholder="Москва">
        </div>
        <div>
          <label class="mf-label">Формат работы</label>
          <select class="mf-select" id="jobFormat">
            <option value="office">Офис</option>
            <option value="remote">Удалённо</option>
            <option value="hybrid">Гибрид</option>
          </select>
        </div>
      </div>
      <div>
        <label class="mf-label">Адрес работы (для офиса)</label>
        <input class="mf-input" id="jobAddress" placeholder="Москва, БЦ Башня Эверест, ул. Тверская 5" maxlength="500">
      </div>
      <div class="mf-row">
        <div>
          <label class="mf-label">Зарплата от (₽)</label>
          <input class="mf-input" id="jobSalFrom" type="number" min="0" placeholder="150000">
        </div>
        <div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="/assets/global-settings.js"></script>
<script>
const API = '/api';

let CATEGORIES = [];
let CAT_TREE = []; // дерево групп для формы и сайдбара
let catTreeExpanded = {}; // раскрытие узлов сайдбара
let currentMode = 'jobs';
let currentTab = 'all';
let currentCategory = '';
let allItems = [];

const TABS_JOBS = [
  {key:'all', label:'Все'},
  {key:'hot', label:'🔥 Срочные'},
  {key:'new', label:'Новые'},
  {key:'my', label:'Мои отклики'},
  {key:'saved', label:'Сохранённые'},
];
const TABS_CVS = [
  {key:'all', label:'Все'},
  {key:'active', label:'Активно ищут'},
  {key:'open', label:'Рассматривают'},
  {key:'passive', label:'Открыты к офферам'},
];

// ─── Helpers ───
const esc = window.lastopEsc;const escAttr = window.lastopEsc;
function pluralRu(n, forms){const a=[2,0,1,1,1,2];return forms[(n%100>4&&n%100<20)?2:a[Math.min(n%10,5)]];}
function fmtNumber(n){ return Number(n).toLocaleString('ru-RU'); }
function fmtSalary(from, to){
  if (!from && !to) return 'З/п не указана';
  if (from && to) return fmtNumber(from) + ' — ' + fmtNumber(to) + ' ₽';
  if (from) return 'от ' + fmtNumber(from) + ' ₽';
  return 'до ' + fmtNumber(to) + ' ₽';
}
function fmtFormat(f){return {office:'Офис', remote:'Удалённо', hybrid:'Гибрид'}[f] || f;}
function fmtEmployment(e){return {full:'Полная', part:'Частичная', project:'Проектная', internship:'Стажировка'}[e] || e;}
function fmtExp(y){
  if (!y) return 'Без опыта';
  return y + ' ' + pluralRu(y, ['год','года','лет']);
}
function stableColor(name){
  let h = 0; const s = String(name||'?');
  for (let i = 0; i < s.length; i++) h = (h*31 + s.charCodeAt(i)) | 0;
  const palette = ['#1E8A4C','#0891B2','#7C3AED','#DB2777','#EA580C','#65A30D','#475569','#2563EB'];
  return palette[Math.abs(h) % palette.length];
}
function initials(name){
  if (!name) return '?';
  return name.split(/\s+/).filter(Boolean).map(s => s[0]).slice(0, 2).join('').toUpperCase();
}
function toast(msg, success){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (success ? ' success' : '');
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => t.classList.remove('show'), 2500);
}
function logout(){try{lastopFetch('/api/auth/logout',{method:'POST',keepalive:true});}catch{}try{localStorage.removeItem('user');}catch{}location.replace('/home-guest.html');}
function toggleProfileDD(e){
  e.stopPropagation();
  document.getElementById('profileDD').classList.toggle('open');
  document.getElementById('topbarProfile').classList.toggle('open');
}
document.addEventListener('click', e => {
  const dd = document.getElementById('profileDD');
  const tp = document.getElementById('topbarProfile');
  if (dd && tp && !tp.contains(e.target) && !dd.contains(e.target)) {
    dd.classList.remove('open'); tp.classList.remove('open');
  }
});

// ─── Profile ───
async function loadProfile(){
  if (!tk()) return;
  try {
    const r = await lastopFetch(API + '/me', { headers:{}});
    if (!r.ok) return;
    const d = await r.json();
    const u = d.user || d;
    const name = u.full_name || u.handle || 'Пользователь';
    const ini = initials(name);
    if(window.LASTOP_SET_AV)window.LASTOP_SET_AV("topbarAv",ini);else{const _e=document.getElementById("topbarAv");if(_e)_e.textContent=ini;}
    document.getElementById('topbarName').textContent = name;
    if(window.LASTOP_SET_AV)window.LASTOP_SET_AV("pddAv",ini);else{const _e=document.getElementById("pddAv");if(_e)_e.textContent=ini;}
    document.getElementById('pddName').textContent = name;
  } catch {}
}

// ─── Categories ───
async function loadCategories(){
  try {
    const r = await lastopFetch(API + '/jobs/categories');
    const d = await r.json();
    CATEGORIES = d.categories || [];
    CAT_TREE = d.groups || [];
    renderCategorySidebar();
    fillCategorySelects();
  } catch (err) { console.error('loadCategories', err); }
}
function renderCategorySidebar(){
  const wrap = document.getElementById('catList');
  // дерево: группы → категории → подкатегории, с раскрытием
  let html = '<a class="cat-row' + (currentCategory === '' ? ' active' : '') + '" onclick="setCategory(\'\')">' +
      '<span class="cat-row-dot" style="background:#5A8A6A"></span>Все категории</a>';
  const tree = (CAT_TREE && CAT_TREE.length) ? CAT_TREE : null;
  if (tree) {
    tree.forEach(g => {
      const hasKids = g.items && g.items.length;
      const exp = !!catTreeExpanded[g.key];
      const caret = hasKids
        ? '<span class="cat-caret" onclick="event.stopPropagation();catTreeToggle(\'' + esc(g.key) + '\')">' + (exp ? '▾' : '▸') + '</span>'
        : '<span class="cat-caret-empty"></span>';
      html += '<a class="cat-row cat-lvl0' + (currentCategory === g.key ? ' active' : '') + '" onclick="setCategory(\'' + esc(g.key) + '\')">' +
        caret + '<span>' + esc(g.label) + '</span></a>';
      if (exp && hasKids) {
        g.items.forEach(c => {
          const hasSub = c.items && c.items.length;
          const cexp = !!catTreeExpanded[c.key];
          const ccaret = hasSub
            ? '<span class="cat-caret" onclick="event.stopPropagation();catTreeToggle(\'' + esc(c.key) + '\')">' + (cexp ? '▾' : '▸') + '</span>'
            : '<span class="cat-caret-empty"></span>';
          html += '<a class="cat-row cat-lvl1' + (currentCategory === c.key ? ' active' : '') + '" onclick="setCategory(\'' + esc(c.key) + '\')">' +
            ccaret + '<span>' + esc(c.label) + '</span></a>';
          if (cexp && hasSub) {
            c.items.forEach(s => {
              html += '<a class="cat-row cat-lvl2' + (currentCategory === s.key ? ' active' : '') + '" onclick="setCategory(\'' + esc(s.key) + '\')">' +
                '<span class="cat-caret-empty"></span><span>' + esc(s.label) + '</span></a>';
            });
          }
        });
      }
    });
  } else {
    // fallback: плоский (если дерево пустое)
    html += CATEGORIES.map(c =>
      '<a class="cat-row' + (currentCategory === c.key ? ' active' : '') + '" onclick="setCategory(\'' + esc(c.key) + '\')">' +
        '<span class="cat-row-dot" style="background:' + esc(c.color) + '"></span>' + esc(c.label) + '</a>'
    ).join('');
  }
  wrap.innerHTML = html;
}
function catTreeToggle(key){ catTreeExpanded[key] = !catTreeExpanded[key]; renderCategorySidebar(); }
function fillCategorySelects(){
  const tree = (CAT_TREE && CAT_TREE.length) ? CAT_TREE : null;
  const buildOptions = () => {
    if (!tree) {
      // fallback: плоский список
      return CATEGORIES.map(c => '<option value="' + esc(c.key) + '">' + esc(c.label) + '</option>').join('');
    }
    return tree.map(g => {
      const cats = (g.items && g.items.length) ? g.items : [{ key: g.key, label: g.label }];
      const opts = cats.map(c => {
        let o = '<option value="' + esc(c.key) + '">' + esc(c.label) + '</option>';
        if (c.items && c.items.length) {
          o += c.items.map(s =>
            '<option value="' + esc(s.key) + '" data-parent="' + esc(c.key) + '">' + esc(s.label) + '</option>'
          ).join('');
        }
        return o;
      }).join('');
      return '<optgroup label="' + esc(g.label) + '">' + opts + '</optgroup>';
    }).join('');
  };
  ['jobCategory','cvCategory'].forEach(id => {
    const sel = document.getElementById(id);
    if (!sel) return;
    sel.innerHTML = buildOptions();
  });
  if (window.initCategoryPickers) window.initCategoryPickers();
}
function setCategory(key){ currentCategory = key; renderCategorySidebar(); loadList(); }

// ─── Mode + Tabs ───
function setMode(mode){
  currentMode = mode;
  currentTab = 'all';
  document.getElementById('modeJobs').classList.toggle('active', mode === 'jobs');
  document.getElementById('modeCvs').classList.toggle('active', mode === 'cvs');
  document.getElementById('createBtnLabel').textContent = mode === 'jobs' ? 'Создать вакансию' : 'Создать резюме';
  document.getElementById('tipText').textContent = mode === 'jobs'
    ? 'Используйте теги, чтобы соискателям было проще находить вашу вакансию по навыкам.'
    : 'Чем подробнее опишете опыт и навыки — тем больше работодателей увидят ваше резюме.';
  renderTabs();
  loadList();
}
function renderTabs(){
  const tabs = currentMode === 'jobs' ? TABS_JOBS : TABS_CVS;
  document.getElementById('tabsRow').innerHTML = tabs.map(t =>
    '<button type="button" class="jtab' + (t.key === currentTab ? ' active' : '') + '" onclick="setTab(\'' + esc(t.key) + '\')">' + esc(t.label) + '</button>'
  ).join('');
}
function setTab(key){
  currentTab = key;
  renderTabs();
  loadList();
}

// ─── Data ───
async function loadList(){
  const feed = document.getElementById('feed');
  feed.innerHTML = window.lastopSkel ? window.lastopSkel.cards(6) : '<div class="empty-state">Загрузка…</div>';
  const params = new URLSearchParams();
  if (currentCategory) params.set('category', currentCategory);
  const city = document.getElementById('filterCity').value;
  if (city) params.set('city', city);
  const fmt = document.getElementById('filterFormat').value;
  if (fmt) params.set('work_format', fmt);
  const exp = document.getElementById('filterExp').value;

  if (currentMode === 'jobs') {
    if (exp) params.set('experience_max', exp);
    if (currentTab && currentTab !== 'all') params.set('tab', currentTab);
    try {
      const r = await lastopFetch(API + '/jobs?' + params.toString(), {
        headers: {}
      });
      if (!r.ok) throw new Error('http ' + r.status);
      const d = await r.json();
      allItems = d.jobs || [];
      applyFilters();
    } catch (err) {
      console.error('loadJobs', err);
      feed.innerHTML = '<div class="empty-state">Не удалось загрузить вакансии</div>';
    }
  } else {
    if (exp) params.set('experience_min', exp);
    if (currentTab && currentTab !== 'all') params.set('status', currentTab);
    try {
      const r = await lastopFetch(API + '/resumes?' + params.toString(), {
        headers: {}
      });
      if (!r.ok) throw new Error('http ' + r.status);
      const d = await r.json();
      allItems = d.resumes || [];
      applyFilters();
    } catch (err) {
      console.error('loadResumes', err);
      feed.innerHTML = '<div class="empty-state">Не удалось загрузить резюме</div>';
    }
  }
}

function applyFilters(){
  const q = (document.getElementById('searchInput2').value || '').trim().toLowerCase();
  let items = allItems.slice();
  if (q) {
    items = items.filter(it => {
      const t = ((it.title || '') + ' ' + (it.description || it.about || '') + ' ' + (it.author_name || '')).toLowerCase();
      return t.includes(q);
    });
  }
  document.getElementById('resultsCount').textContent = items.length + ' ' +
    (currentMode === 'jobs' ? pluralRu(items.length, ['вакансия','вакансии','вакансий'])
                            : pluralRu(items.length, ['резюме','резюме','резюме']));
  renderFeed(items);
}

function pickAuthor(item){
  if (item.author_community_id && item.author_community_name) {
    return {
      name: item.author_community_name,
      href: '/community-detail.html?id=' + item.author_community_id,
      avatar: item.author_community_avatar || '',
      color: item.author_community_color || '#5AB080',
      kind: 'community'
    };
  }
  if (item.author_company_id && item.author_company_name) {
    return {
      name: item.author_company_name,
      href: '/company-detail.html?id=' + encodeURIComponent(item.author_company_slug || ''),
      avatar: item.author_company_logo || '',
      color: '#1E8A4C',
      kind: 'company'
    };
  }
  return {
    name: item.author_name || item.author || 'Участник',
    href: item.author_public_id ? '/profile_user.html?id=' + item.author_public_id : '#',
    avatar: item.author_avatar || '',
    color: '#5A8A6A',
    kind: 'user'
  };
}

function renderFeed(items){
  const feed = document.getElementById('feed');
  if (!items.length) {
    feed.innerHTML = '<div class="empty-state">' +
      (currentMode === 'jobs' ? 'Вакансий пока нет — создай первую!' : 'Резюме пока нет — создай первое!') +
      '</div>';
    return;
  }
  feed.innerHTML = items.map(it => currentMode === 'jobs' ? renderJobCard(it) : renderCvCard(it)).join('');
}

function renderJobCard(j){
  const color = j.category_color || '#5A8A6A';
  const statusTag = (j.status === 'hot' || j.status === 'new' || j.status === 'paused')
    ? '<span class="jc-status-tag jc-status-' + j.status + '">' +
      ({hot:'🔥 Срочно', new:'Новая', paused:'На паузе'}[j.status]) +
      '</span>'
    : '';
  const tagsHtml = (j.tags || []).slice(0, 6).map(t => '<span class="jc-tag">' + esc(t) + '</span>').join('');
  const author = pickAuthor(j);
  return '<div class="job-card" onclick="location.href=\'/job-detail.html?id=' + esc(j.public_id) + '\'">' +
    '<div class="jc-stripe" style="background:' + esc(color) + '"></div>' +
    '<div class="jc-body">' +
      '<div class="jc-head">' +
        '<span class="jc-cat-tag" style="background:' + esc(color) + '">' + esc(j.category_label) + '</span>' +
        '<span class="jc-format-tag">' + esc(fmtFormat(j.work_format)) + '</span>' +
        statusTag +
      '</div>' +
      '<div class="jc-title">' + esc(j.title) + '</div>' +
      '<div class="jc-meta">' +
        '<span class="jc-meta-item jc-author">' + (author.href !== '#' ? '<span onclick="event.preventDefault();event.stopPropagation();window.location.href=\'' + escAttr(author.href) + '\'" style="cursor:pointer;font-weight:700">' + esc(author.name) + '</span>' : esc(author.name)) + '</span>' +
        (j.city ? '<span class="jc-meta-item"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' + esc(j.city) + '</span>' : '') +
        '<span class="jc-meta-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>от ' + j.experience_min_years + ' ' + pluralRu(j.experience_min_years, ['года','лет','лет']) + '</span>' +
        '<span class="jc-meta-item"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>' + esc(fmtEmployment(j.employment_type)) + '</span>' +
      '</div>' +
      '<div class="jc-salary">' + esc(fmtSalary(j.salary_from, j.salary_to)) + '</div>' +
      (tagsHtml ? '<div class="jc-tags">' + tagsHtml + '</div>' : '') +
    '</div>' +
  '</div>';
}

function renderCvCard(c){
  const color = stableColor(c.author_name || '?');
  const statusTag = '<span class="cv-status-tag cv-status-' + c.status + '">' +
    ({active:'🔥 Активно ищет', open:'Рассматривает', passive:'Открыт к офферам', hidden:'Скрытое'}[c.status] || c.status) +
    '</span>';
  const skillsHtml = (c.skills || []).slice(0, 6).map(s => '<span class="cv-skill">' + esc(s) + '</span>').join('');
  return '<div class="cv-card" onclick="location.href=\'/resume-detail.html?id=' + esc(c.public_id) + '\'">' +
    '<div class="cv-av" style="background:' + esc(color) + '">' + esc(initials(c.author_name)) + '</div>' +
    '<div class="cv-body">' +
      '<div class="cv-head">' +
        statusTag +
        '<span class="jc-cat-tag" style="background:' + esc(c.category_color || '#5A8A6A') + '">' + esc(c.category_label) + '</span>' +
        '<span class="jc-format-tag">' + esc(fmtFormat(c.work_format)) + '</span>' +
      '</div>' +
      '<div class="cv-name">' + esc(c.author_name) + '</div>' +
      '<div class="cv-position">' + esc(c.title) + '</div>' +
      '<div class="cv-meta">' +
        (c.city ? '<span class="cv-meta-item"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' + esc(c.city) + '</span>' : '') +
        '<span class="cv-meta-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' + esc(fmtExp(c.experience_years)) + '</span>' +
        '<span class="cv-meta-item"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>' + esc(fmtEmployment(c.employment_type)) + '</span>' +
      '</div>' +
      (c.salary_from ? '<div class="cv-salary">' + esc(fmtSalary(c.salary_from, null)) + '</div>' : '') +
      (skillsHtml ? '<div class="cv-skills">' + skillsHtml + '</div>' : '') +
    '</div>' +
  '</div>';
}

// ─── Modals ───
function openCreateModal(){
  if (!tk()){ toast('Войдите чтобы публиковать'); setTimeout(() => location.href = '/login.html', 1200); return; }
  if (currentMode === 'jobs') {
    ['jobTitle','jobCity','jobAddress','jobSalFrom','jobSalTo','jobDesc','jobTags'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('jobExp').value = 0;
    document.getElementById('jobFormat').value = 'office';
    document.getElementById('jobEmpl').value = 'full';
    document.getElementById('jobStatus').value = 'active';
    if (currentCategory) { const _s=document.getElementById('jobCategory'); _s.value = currentCategory; _s.dispatchEvent(new Event('change',{bubbles:true})); }
    document.getElementById('modalJob').classList.add('open');
    setTimeout(() => document.getElementById('jobTitle').focus(), 150);
  } else {
    ['cvTitle','cvCity','cvSalFrom','cvAbout','cvSkills','cvEducation','cvContacts'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('cvExp').value = 0;
    document.getElementById('cvFormat').value = 'office';
    document.getElementById('cvEmpl').value = 'full';
    document.getElementById('cvStatus').value = 'open';
    if (currentCategory) { const _s=document.getElementById('cvCategory'); _s.value = currentCategory; _s.dispatchEvent(new Event('change',{bubbles:true})); }
    document.getElementById('modalCv').classList.add('open');
    setTimeout(() => document.getElementById('cvTitle').focus(), 150);
  }
}
function closeCreateModal(){
  document.getElementById('modalJob').classList.remove('open');
  document.getElementById('modalCv').classList.remove('open');
}

async function submitJob(){
  const title = document.getElementById('jobTitle').value.trim();
  if (!title){ toast('Укажите название позиции'); document.getElementById('jobTitle').focus(); return; }
  if (title.length > 200){ toast('Слишком длинное название'); return; }
  const tagsRaw = document.getElementById('jobTags').value.trim();
  const tags = tagsRaw ? tagsRaw.split(',').map(s => s.trim()).filter(Boolean) : [];
  const body = {
    title,
    description: document.getElementById('jobDesc').value.trim(),
    category: document.getElementById('jobCategory').value,
    city: document.getElementById('jobCity').value.trim(),
    address: document.getElementById('jobAddress').value.trim(),
    work_format: document.getElementById('jobFormat').value,
    salary_from: parseInt(document.getElementById('jobSalFrom').value) || null,
    salary_to: parseInt(document.getElementById('jobSalTo').value) || null,
    salary_currency: 'RUB',
    experience_min_years: parseInt(document.getElementById('jobExp').value) || 0,
    employment_type: document.getElementById('jobEmpl').value,
    status: document.getElementById('jobStatus').value,
    tags
  };
  const btn = document.getElementById('jobSubmitBtn');
  btn.disabled = true; btn.textContent = 'Создание…';
  try {
    const r = await lastopFetch(API + '/jobs', {
      method: 'POST',
      headers: window.withActiveContextHeaders ? window.withActiveContextHeaders({ 'Content-Type': 'application/json' }) : { 'Content-Type': 'application/json', ...(window.getActiveCompanyID && window.getActiveCompanyID() ? { 'X-Active-Company-Id': String(window.getActiveCompanyID()) } : {}) },
      body: JSON.stringify(body)
    });
    if (!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e.error || ('http ' + r.status)); }
    const d = await r.json();
    closeCreateModal();
    toast('Вакансия опубликована', true);
    setTimeout(() => location.href = '/job-detail.html?id=' + d.job.public_id, 600);
  } catch (err) {
    console.error(err);
    toast('Ошибка: ' + (err.message || 'не удалось'));
  } finally {
    btn.disabled = false; btn.textContent = 'Опубликовать';
  }
}

async function submitCv(){
  const title = document.getElementById('cvTitle').value.trim();
  if (!title){ toast('Укажите должность'); document.getElementById('cvTitle').focus(); return; }
  if (title.length > 200){ toast('Слишком длинная должность'); return; }
  const skillsRaw = document.getElementById('cvSkills').value.trim();
  const skills = skillsRaw ? skillsRaw.split(',').map(s => s.trim()).filter(Boolean) : [];
  const body = {
    title,
    about: document.getElementById('cvAbout').value.trim(),
    category: document.getElementById('cvCategory').value,
    city: document.getElementById('cvCity').value.trim(),
    work_format: document.getElementById('cvFormat').value,
    salary_from: parseInt(document.getElementById('cvSalFrom').value) || null,
    salary_currency: 'RUB',
    experience_years: parseInt(document.getElementById('cvExp').value) || 0,
    employment_type: document.getElementById('cvEmpl').value,
    status: document.getElementById('cvStatus').value,
    skills,
    education: document.getElementById('cvEducation').value.trim(),
    contacts: document.getElementById('cvContacts').value.trim()
  };
  const btn = document.getElementById('cvSubmitBtn');
  btn.disabled = true; btn.textContent = 'Создание…';
  try {
    const r = await lastopFetch(API + '/resumes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e.error || ('http ' + r.status)); }
    const d = await r.json();
    closeCreateModal();
    toast('Резюме опубликовано', true);
    setTimeout(() => location.href = '/resume-detail.html?id=' + d.resume.public_id, 600);
  } catch (err) {
    console.error(err);
    toast('Ошибка: ' + (err.message || 'не удалось'));
  } finally {
    btn.disabled = false; btn.textContent = 'Опубликовать';
  }
}
