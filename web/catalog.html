<!DOCTYPE html>
<html lang="ru">
<head>
<script src="/assets/utils.js"></script>
<script src="/assets/dark-theme-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LASTOP GROUP — Товары и услуги</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/shell-layout.css">
<script>document.documentElement.classList.add('lt-shell');</script>
<link rel="stylesheet" href="/assets/hover-lift.css">
<script>document.documentElement.classList.add('hl-on');</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#1E8A4C;--gm:#22A05A;--gl:#E8F5EE;--gp:#F0FAF4;--gmt:#5A8A6A;--gb:#C0DECA;
  --w:#FFF;--bg:#F2F5F3;--t:#1A2A22;--tm:#3A5245;--bdr:#DDE8E2;
  --red:#E04040;--r:8px;--rm:12px;--rl:18px;--rxl:24px;
  --sh:0 2px 12px rgba(30,138,76,.07);--shm:0 6px 24px rgba(30,138,76,.13)
}
html,body{height:100%;overflow:hidden;font-family:'Manrope',sans-serif;background:var(--bg);color:var(--t);font-size:14px}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}

/* SHELL */
.shell{display:grid;grid-template-columns:240px 1fr 300px;grid-template-rows:56px 1fr;grid-template-areas:"logo topbar topbar""nav main right";height:100vh;gap:10px;padding:10px}

.logo-cell{grid-area:logo;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;padding:0 14px;text-decoration:none;box-shadow:var(--sh);transition:box-shadow .2s}
.logo-cell:hover{box-shadow:var(--shm)}
.logo-cell img{height:38px;width:auto;max-width:100%;object-fit:contain;display:block}

/* TOPBAR */
.topbar{grid-area:topbar;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:grid;grid-template-columns:1fr 300px;align-items:center;gap:10px;padding:0 16px;box-shadow:var(--sh);min-width:0}
.search-wrap{position:relative;display:flex;align-items:center;min-width:0}
.search-wrap input{width:100%;height:36px;padding:0 14px 0 30px;border:1.5px solid var(--bdr);border-radius:99px;background:#fff;font-family:inherit;font-size:13px;color:var(--t);outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--gm)}
.search-wrap input::placeholder{color:var(--gmt)}

/* NAV */
.nav{grid-area:nav;background:var(--w);border-radius:var(--rxl);border:1px solid var(--bdr);box-shadow:var(--sh);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;padding:12px 10px 10px;gap:1px}
.nav::-webkit-scrollbar{display:none}

/* MAIN / RIGHT */
.main{grid-area:main;overflow-y:auto;overflow-x:hidden;min-width:0;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.main > *{flex-shrink:0}
.right{grid-area:right;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.right > *{flex-shrink:0}

/* ── ТУЛБАР ── */
.cat-toolbar{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:12px 14px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cat-title{font-size:16px;font-weight:900;color:var(--t);white-space:nowrap}
.cat-subtitle{font-size:12px;color:var(--gmt);margin-right:auto}
.mode-switch{display:flex;background:var(--gp);border:1.5px solid var(--bdr);border-radius:99px;padding:3px;gap:2px;flex-shrink:0}
.mode-btn{padding:5px 16px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit;color:var(--gmt);background:transparent;transition:all .15s;white-space:nowrap}
.mode-btn.active{background:var(--g);color:#fff;box-shadow:0 2px 6px rgba(30,138,76,.2)}
.btn-create{padding:8px 18px;border-radius:99px;background:var(--g);border:none;color:#fff;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(30,138,76,.22);white-space:nowrap;flex-shrink:0}
.btn-create:hover{background:var(--gm)}
.btn-create svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round}

/* ── ТАБЫ ── */
.tabs-row{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:10px 14px;box-shadow:var(--sh);display:flex;gap:6px;flex-wrap:wrap}
.jtab{padding:6px 13px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--bdr);background:transparent;color:var(--tm);font-family:inherit;transition:all .15s;white-space:nowrap}
.jtab:hover{background:var(--gp);color:var(--g);border-color:var(--gb)}
.jtab.active{background:var(--g);color:#fff;border-color:var(--g)}

/* ── ФИЛЬТРЫ ── */
.filter-row{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:10px 14px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pf-search{flex:1;min-width:220px;position:relative;display:flex;align-items:center}
.pf-search svg{position:absolute;left:11px;width:13px;height:13px;stroke:var(--gmt);fill:none;stroke-width:1.8;stroke-linecap:round;pointer-events:none}
.pf-search input{width:100%;height:32px;padding:0 14px 0 30px;border:1.5px solid var(--bdr);border-radius:99px;background:#fff;font-family:inherit;font-size:12px;color:var(--t);outline:none;transition:border-color .15s}
.pf-search input:focus{border-color:var(--gm)}
.pf-select{height:32px;padding:0 26px 0 12px;border:1.5px solid var(--bdr);border-radius:99px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><polyline points='6 9 12 15 18 9' stroke='%235A8A6A' fill='none' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>") right 8px center/12px no-repeat;font-family:inherit;font-size:12px;color:var(--t);cursor:pointer;outline:none;-webkit-appearance:none;-moz-appearance:none;appearance:none;transition:border-color .15s}
.pf-select:focus{border-color:var(--gm)}
.pf-input{height:32px;padding:0 12px;border:1.5px solid var(--bdr);border-radius:99px;background:#fff;font-family:inherit;font-size:12px;color:var(--t);outline:none;transition:border-color .15s;width:120px}
.pf-input:focus{border-color:var(--gm)}
.pf-count{font-size:11px;font-weight:700;color:var(--gmt);margin-left:auto}

/* ── КАРТОЧКА КАТАЛОГА ── */
.feed{display:flex;flex-direction:column;gap:10px}
.cat-card{background:var(--w);border-radius:var(--rxl);border:1px solid var(--bdr);box-shadow:var(--sh);padding:16px 18px;cursor:pointer;display:flex;gap:14px;align-items:flex-start;transition:all .2s;animation:fadeUp .25s ease both;text-decoration:none;color:inherit}
.cat-card:hover{box-shadow:var(--shm);transform:translateY(-2px);border-color:var(--gb)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.cat-cover{width:96px;height:96px;border-radius:var(--rm);background:var(--gp);overflow:hidden;flex-shrink:0;display:grid;place-items:center;color:var(--gmt)}
.cat-cover img{width:100%;height:100%;object-fit:cover;display:block}
.cat-cover-empty svg{width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:1.5}
.cat-stripe{width:4px;align-self:stretch;border-radius:99px;flex-shrink:0;min-height:60px}
.cat-body{flex:1;min-width:0}
.cat-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.cat-cat-tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:#fff;flex-shrink:0}
.cat-status-tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;flex-shrink:0;border:1px solid}
.cat-status-out{background:#FFF1F0;color:#E04040;border-color:#FFD5D2}
.cat-status-paused{background:#F1F5F4;color:#5A8A6A;border-color:#DDE8E2}
.cat-status-hidden{background:#F1F5F4;color:#5A8A6A;border-color:#DDE8E2}
.cat-type-tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;background:var(--gl);color:var(--g);border:1px solid var(--gb);flex-shrink:0}
.cat-card-title{font-size:15px;font-weight:800;color:var(--t);line-height:1.3;letter-spacing:-.01em;margin-bottom:6px}
.cat-card:hover .cat-card-title{color:var(--g)}
.cat-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--gmt);margin-bottom:6px}
.cat-meta-item{display:flex;align-items:center;gap:4px}
.cat-meta-item svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;flex-shrink:0}
.cat-author{font-weight:700;color:var(--tm)}
.cat-price{font-size:14px;font-weight:800;color:var(--g)}
.cat-price-empty{font-size:12px;font-weight:700;color:var(--gmt);font-style:italic}
.cat-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.cat-tag{padding:2px 8px;background:var(--gp);color:var(--tm);border-radius:99px;font-size:10px;font-weight:600;border:1px solid var(--bdr)}

/* ── EMPTY ── */
.empty-state{padding:50px 20px;text-align:center;color:var(--gmt);font-size:13px;font-style:italic}

/* ── САЙДБАР ── */
.card{background:var(--w);border-radius:var(--rxl);border:1px solid var(--bdr);box-shadow:var(--sh);padding:14px}
.block-title{font-size:11px;font-weight:800;color:var(--tm);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.cat-list{display:flex;flex-direction:column;gap:4px}
.cat-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--r);cursor:pointer;transition:background .12s;color:var(--t);text-decoration:none;font-size:12px}
.cat-row:hover{background:var(--gp)}
.cat-row.active{background:var(--gl);color:var(--g);font-weight:700}
.cat-row-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--g)}
.tip-card{background:linear-gradient(135deg,var(--gl),var(--gp));border:1px solid var(--gb);border-radius:var(--rxl);padding:14px}
.tip-title{font-size:12px;font-weight:800;color:var(--g);margin-bottom:6px}
.tip-text{font-size:11px;color:var(--tm);line-height:1.5}

/* ── МОДАЛКА ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:var(--z-modal);padding:20px;backdrop-filter:blur(2px)}
.modal-bg.open{display:flex}
.modal{background:var(--w);border-radius:var(--rxl);box-shadow:0 20px 50px rgba(0,0,0,.2);max-width:680px;width:100%;max-height:92vh;display:flex;flex-direction:column;animation:fadeUp .2s ease}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--bdr)}
.modal-title{font-size:16px;font-weight:800;color:var(--t)}
.modal-close{width:32px;height:32px;border-radius:8px;background:transparent;border:none;color:var(--gmt);cursor:pointer;display:grid;place-items:center;transition:all .12s}
.modal-close:hover{background:var(--gp);color:var(--t)}
.modal-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.modal-body{padding:18px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--bdr)}
.mf-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mf-row > div{min-width:0}
.mf-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.mf-row3 > div{min-width:0}
.mf-label{font-size:12px;font-weight:700;color:var(--tm);margin-bottom:5px;display:block}
.mf-input,.mf-textarea,.mf-select{width:100%;height:38px;padding:0 12px;border:1.5px solid var(--bdr);border-radius:var(--rm);font-family:inherit;font-size:13px;background:#fff;color:var(--t);outline:none;transition:border-color .12s;line-height:1}
.mf-select{padding-right:30px;cursor:pointer;-webkit-appearance:none;-moz-appearance:none;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><polyline points='6 9 12 15 18 9' stroke='%235A8A6A' fill='none' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 10px center;background-size:12px}
.mf-textarea{height:90px;padding:9px 12px;resize:vertical;min-height:60px;line-height:1.4}
.mf-input:focus,.mf-textarea:focus,.mf-select:focus{border-color:var(--g)}
.mf-counter{font-size:10px;color:var(--gmt);text-align:right;margin-top:2px}
.mf-checkbox{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.mf-checkbox input{width:16px;height:16px;accent-color:var(--g)}
.mf-checkbox span{font-size:12px;color:var(--tm);font-weight:600}
.btn-cancel{padding:9px 16px;border-radius:99px;background:transparent;color:var(--t);border:1.5px solid var(--bdr);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .12s}
.btn-cancel:hover{background:var(--gp)}
.btn-submit{padding:9px 16px;border-radius:99px;background:var(--g);color:#fff;border:none;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:background .12s}
.btn-submit:hover{background:var(--gm)}
.btn-submit:disabled{opacity:.6;cursor:default}

/* ── PHOTO PICKER ── */
.photo-picker{display:flex;flex-wrap:wrap;gap:8px}
.photo-thumb{width:78px;height:78px;border-radius:var(--rm);border:1.5px solid var(--bdr);background:var(--gp);position:relative;overflow:hidden;flex-shrink:0;cursor:pointer;display:grid;place-items:center;color:var(--gmt);transition:all .15s}
.photo-thumb:hover{border-color:var(--g);color:var(--g)}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-thumb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
.photo-thumb .photo-remove{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;cursor:pointer;display:grid;place-items:center;font-size:10px;font-weight:700;padding:0;opacity:0;transition:opacity .15s}
.photo-thumb:hover .photo-remove{opacity:1}
.photo-thumb.cover-mark::before{content:'★';position:absolute;top:4px;left:4px;width:18px;height:18px;border-radius:4px;background:var(--g);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.photo-add{border-style:dashed;cursor:pointer}
.photo-hint{font-size:10px;color:var(--gmt);margin-top:6px;font-style:italic}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--t);color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:var(--z-overlay);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--g)}

@media(max-width:1200px){.shell{grid-template-columns:220px 1fr 260px}}
@media(max-width:1000px){.shell{grid-template-columns:220px 1fr;grid-template-areas:"logo topbar""nav main"}.right{display:none}}
@media(max-width:740px){.shell{grid-template-columns:52px 1fr}.nav-item span,.nav-group{display:none}.nav-item{justify-content:center;padding:10px}.mf-row,.mf-row3{grid-template-columns:1fr}}
@media (min-width:1921px) and (min-height:1081px){
  html,body{font-size:15px}
  .shell{grid-template-columns:280px 1fr 360px !important;gap:12px;padding:12px}
  .topbar{grid-template-columns:1fr 360px !important}
  .nav{padding:14px 12px 12px}
}
</style>
<link rel="stylesheet" href="/assets/dark-theme.css">
</head>
<body>
<div class="shell">

<!-- LOGO -->
<a class="logo-cell" href="/"><img src="/assets/lastop-group-logo.svg" alt="LASTOP GROUP" onerror="this.style.display='none'"></a>

<!-- TOPBAR -->
<header class="topbar"></header>

<!-- NAV -->
<nav class="nav"></nav>

<!-- ════ MAIN ════ -->
<div class="main">

  <!-- Тулбар -->
  <div class="cat-toolbar">
    <span class="cat-title">Товары и услуги</span>
    <span class="cat-subtitle">B2B-маркет: предложения от компаний и специалистов</span>
    <div class="mode-switch">
      <button type="button" class="mode-btn active" id="modeProducts" onclick="setMode('product')">Товары</button>
      <button type="button" class="mode-btn" id="modeServices" onclick="setMode('service')">Услуги</button>
    </div>
    <button type="button" class="btn-create" onclick="openCreateModal()">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span id="createBtnLabel">Создать товар</span>
    </button>
  </div>

  <!-- Табы -->
  <div class="tabs-row" id="tabsRow"></div>

  <!-- Фильтры -->
  <div class="filter-row">
    <div class="pf-search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="searchInput2" placeholder="Поиск…" oninput="applyFilters()">
    </div>
    <select class="pf-select" id="filterCity" onchange="loadList()">
      <option value="">Все города</option>
      <option>Москва</option><option>Санкт-Петербург</option><option>Самара</option>
      <option>Екатеринбург</option><option>Новосибирск</option><option>Казань</option>
      <option>Краснодар</option><option>Ростов-на-Дону</option><option>Владивосток</option>
    </select>
    <input type="number" class="pf-input" id="filterPriceMax" placeholder="Цена до" min="0" onchange="loadList()">
    <select class="pf-select" id="filterCurrency" onchange="loadList()">
      <option value="">Все валюты</option>
      <option value="RUB">₽ RUB</option>
      <option value="USD">$ USD</option>
      <option value="EUR">€ EUR</option>
      <option value="CNY">¥ CNY</option>
    </select>
    <select class="pf-select" id="filterSort" onchange="loadList()">
      <option value="newest">Сначала новые</option>
      <option value="popular">Популярные</option>
      <option value="price_asc">Дешевле сначала</option>
      <option value="price_desc">Дороже сначала</option>
    </select>
    <span class="pf-count" id="resultsCount" style="display:none">0</span>
  </div>

  <!-- Лента -->
  <div id="feed" class="feed"></div>

</div>

<!-- RIGHT -->
<aside class="right">
  <div class="card">
    <div class="block-title">Категории</div>
    <div class="cat-list" id="catList">
      <div style="padding:6px;color:var(--gmt);font-size:11px;font-style:italic">Загрузка…</div>
    </div>
  </div>

  <div class="tip-card">
    <div class="tip-title">💡 Совет</div>
    <div class="tip-text" id="tipText">Хорошее фото и точное описание увеличивают количество заявок в разы.</div>
  </div>
</aside>

</div>

<!-- ===== Модалка: Создание товара/услуги ===== -->
<div class="modal-bg" id="modalCreate" onclick="if(event.target===this)closeCreateModal()">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title" id="modalTitle">Создать товар</span>
      <button type="button" class="modal-close" onclick="closeCreateModal()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="mf-row">
        <div>
          <label class="mf-label">Тип публикации *</label>
          <select class="mf-select" id="ciType" onchange="onTypeChange()">
            <option value="product">Товар</option>
            <option value="service">Услуга</option>
          </select>
        </div>
        <div>
          <label class="mf-label">Категория *</label>
          <select class="mf-select" id="ciCategory"></select>
        </div>
      </div>
      <div>
        <label class="mf-label">Название *</label>
        <input class="mf-input" id="ciTitle" placeholder="Например: Запчасти для тягача DAF XF" maxlength="200">
      </div>
      <div>
        <label class="mf-label">Описание</label>
        <textarea class="mf-textarea" id="ciDesc" placeholder="Подробное описание, характеристики, условия" maxlength="10000"></textarea>
      </div>
      <div class="mf-row3">
        <div>
          <label class="mf-label">Цена</label>
          <input class="mf-input" id="ciPrice" type="number" min="0" placeholder="—">
        </div>
        <div>
          <label class="mf-label">Валюта</label>
          <select class="mf-select" id="ciCurrency">
            <option value="RUB">₽ RUB</option>
            <option value="USD">$ USD</option>
            <option value="EUR">€ EUR</option>
            <option value="CNY">¥ CNY</option>
          </select>
        </div>
        <div>
          <label class="mf-label">Город</label>
          <input class="mf-input" id="ciCity" placeholder="Москва">
        </div>
      </div>
      <div id="ciInStockRow" class="mf-row">
        <div>
          <label class="mf-checkbox"><input type="checkbox" id="ciInStock" checked><span>В наличии</span></label>
        </div>
        <div>
          <label class="mf-label">Статус</label>
          <select class="mf-select" id="ciStatus">
            <option value="active">Активно</option>
            <option value="paused">На паузе</option>
            <option value="hidden">Скрыто</option>
          </select>
        </div>
      </div>
      <div>
        <label class="mf-label">Теги (через запятую, до 10)</label>
        <input class="mf-input" id="ciTags" placeholder="запчасти, daf, оптом" maxlength="500">
      </div>
      <div>
        <label class="mf-label">Фотографии (до 6)</label>
        <div class="photo-picker" id="photoPicker"></div>
        <input type="file" id="photoInput" accept="image/*" multiple style="display:none" onchange="onPhotoSelected(event)">
        <div class="photo-hint">Первая фотография станет обложкой. Поддерживаются JPG, PNG, WebP. Максимум 6 фото.</div>
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn-cancel" onclick="closeCreateModal()">Отмена</button>
      <button type="button" class="btn-submit" id="ciSubmitBtn" onclick="submitItem()">Опубликовать</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const API = '/api';
const tk = () => localStorage.getItem('token');

// ─── State ───
let CATEGORY_GROUPS = []; // [{key, label, items:[{key, label}]}]
let currentMode = 'product';        // product / service
let currentCategoryGroup = '';      // ключ группы из сайдбара (industry / agro / ...)
let currentTab = 'all';
let allItems = [];
let photos = []; // base64 strings; index 0 = cover

const TABS = [
  {key:'all', label:'Все'},
  {key:'saved', label:'Сохранённые'},
  {key:'my', label:'Мои'},
];

// ─── Helpers ───
const esc = window.lastopEsc;const escAttr = window.lastopEsc;
function pluralRu(n, forms){const a=[2,0,1,1,1,2];return forms[(n%100>4&&n%100<20)?2:a[Math.min(n%10,5)]];}
function fmtNumber(n){ return Number(n).toLocaleString('ru-RU'); }
function fmtPrice(price, currency){
  if (price == null || price === undefined) return null;
  const sym = {RUB:'₽', USD:'$', EUR:'€', CNY:'¥'}[currency] || currency || '';
  return fmtNumber(price) + ' ' + sym;
}
function formatRelative(dateStr){
  if (!dateStr) return '';
  const d = new Date(dateStr);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return 'только что';
  if (diff < 3600) return Math.floor(diff/60) + ' ' + pluralRu(Math.floor(diff/60),['минута','минуты','минут']) + ' назад';
  if (diff < 86400) return Math.floor(diff/3600) + ' ' + pluralRu(Math.floor(diff/3600),['час','часа','часов']) + ' назад';
  if (diff < 86400*30) return Math.floor(diff/86400) + ' ' + pluralRu(Math.floor(diff/86400),['день','дня','дней']) + ' назад';
  return d.toLocaleDateString('ru-RU');
}
function stableColor(name){
  let h = 0; const s = String(name||'?');
  for (let i = 0; i < s.length; i++) h = (h*31 + s.charCodeAt(i)) | 0;
  const palette = ['#1E8A4C','#0891B2','#7C3AED','#DB2777','#EA580C','#65A30D','#475569','#2563EB','#9333EA','#0EA5E9','#F59E0B'];
  return palette[Math.abs(h) % palette.length];
}
function initials(name){
  if (!name) return '?';
  return name.split(/\s+/).filter(Boolean).map(s => s[0]).slice(0, 2).join('').toUpperCase();
}
function toast(msg, success){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (success ? ' success' : '');
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => t.classList.remove('show'), 2500);
}
function logout(){ location.href = '/home-guest.html'; }
function toggleProfileDD(e){
  e.stopPropagation();
  document.getElementById('profileDD').classList.toggle('open');
  document.getElementById('topbarProfile').classList.toggle('open');
}
document.addEventListener('click', e => {
  const dd = document.getElementById('profileDD');
  const tp = document.getElementById('topbarProfile');
  if (dd && tp && !tp.contains(e.target) && !dd.contains(e.target)) {
    dd.classList.remove('open'); tp.classList.remove('open');
  }
});

// ─── Profile ───
async function loadProfile(){
  if (!tk()) return;
  try {
    const r = await lastopFetch(API + '/me', { headers: { Authorization: 'Bearer ' + tk() }});
    if (!r.ok) return;
    const d = await r.json();
    const u = d.user || d;
    const name = u.full_name || u.handle || 'Пользователь';
    const ini = initials(name);
    if(window.LASTOP_SET_AV)window.LASTOP_SET_AV("topbarAv",ini);else{const _e=document.getElementById("topbarAv");if(_e)_e.textContent=ini;}
    document.getElementById('topbarName').textContent = name;
    if(window.LASTOP_SET_AV)window.LASTOP_SET_AV("pddAv",ini);else{const _e=document.getElementById("pddAv");if(_e)_e.textContent=ini;}
    document.getElementById('pddName').textContent = name;
  } catch {}
}

// ─── Categories ───
async function loadCategories(){
  try {
    const r = await lastopFetch(API + '/catalog/categories');
    const d = await r.json();
    CATEGORY_GROUPS = d.groups || [];
    renderCategorySidebar();
    fillCategorySelects();
  } catch (err) { console.error('loadCategories', err); }
}
function pickAuthor(item){
  if (item.author_community_id && item.author_community_name) {
    return {
      name: item.author_community_name,
      href: '/community-detail.html?id=' + item.author_community_id,
      avatar: item.author_community_avatar || '',
      color: item.author_community_color || '#5AB080',
      kind: 'community'
    };
  }
  if (item.author_company_id && item.author_company_name) {
    return {
      name: item.author_company_name,
      href: '/company-detail.html?id=' + encodeURIComponent(item.author_company_slug || ''),
      avatar: item.author_company_logo || '',
      color: '#1E8A4C',
      kind: 'company'
    };
  }
  return {
    name: item.author_name || item.author || 'Участник',
    href: item.author_public_id ? '/profile_user.html?id=' + item.author_public_id : '#',
    avatar: item.author_avatar || '',
    color: '#5A8A6A',
    kind: 'user'
  };
}

function renderCategorySidebar(){
  const wrap = document.getElementById('catList');
  wrap.innerHTML =
    '<a class="cat-row' + (currentCategoryGroup === '' ? ' active' : '') + '" onclick="setCategoryGroup(\'\')">' +
      '<span class="cat-row-dot"></span>Все категории</a>' +
    CATEGORY_GROUPS.map(g =>
      '<a class="cat-row' + (currentCategoryGroup === g.key ? ' active' : '') + '" onclick="setCategoryGroup(\'' + escAttr(g.key) + '\')">' +
        '<span class="cat-row-dot" style="background:' + esc(stableColor(g.key)) + '"></span>' + esc(g.label) + '</a>'
    ).join('');
}
function fillCategorySelects(){
  const sel = document.getElementById('ciCategory');
  if (!sel) return;
  sel.innerHTML = CATEGORY_GROUPS.map(g =>
    '<optgroup label="' + escAttr(g.label) + '">' +
    g.items.map(c => '<option value="' + escAttr(c.key) + '">' + esc(c.label) + '</option>').join('') +
    '</optgroup>'
  ).join('');
}
function setCategoryGroup(key){ currentCategoryGroup = key; renderCategorySidebar(); applyFilters(); }

// ─── Mode + Tabs ───
function setMode(mode){
  currentMode = mode;
  currentTab = 'all';
  document.getElementById('modeProducts').classList.toggle('active', mode === 'product');
  document.getElementById('modeServices').classList.toggle('active', mode === 'service');
  document.getElementById('createBtnLabel').textContent = mode === 'product' ? 'Создать товар' : 'Создать услугу';
  document.getElementById('tipText').textContent = mode === 'product'
    ? 'Хорошее фото и точное описание увеличивают количество заявок в разы.'
    : 'Опишите ясно, что входит в услугу и сроки выполнения — клиенты ценят прозрачность.';
  renderTabs();
  loadList();
}
function renderTabs(){
  document.getElementById('tabsRow').innerHTML = TABS.map(t =>
    '<button type="button" class="jtab' + (t.key === currentTab ? ' active' : '') + '" onclick="setTab(\'' + escAttr(t.key) + '\')">' + esc(t.label) + '</button>'
  ).join('');
}
function setTab(key){
  currentTab = key;
  renderTabs();
  loadList();
}

// ─── Data ───
async function loadList(){
  const feed = document.getElementById('feed');
  feed.innerHTML = '<div class="empty-state">Загрузка…</div>';
  const params = new URLSearchParams();
  params.set('type', currentMode);

  // Если выбрана группа категорий — фильтруем по списку подкатегорий внутри неё.
  // Бэк принимает один category=ключ, поэтому если выбрана группа — будем фильтровать на фронте после загрузки.
  // Это ок для MVP-объёмов; при росте каталога перенесём в бэк-фильтр.

  const city = document.getElementById('filterCity').value;
  if (city) params.set('city', city);
  const priceMax = document.getElementById('filterPriceMax').value;
  if (priceMax) params.set('price_max', priceMax);
  const cur = document.getElementById('filterCurrency').value;
  if (cur) params.set('currency', cur);
  const sort = document.getElementById('filterSort').value;
  if (sort) params.set('sort', sort);
  if (currentTab && currentTab !== 'all') params.set('tab', currentTab);

  try {
    const r = await lastopFetch(API + '/catalog?' + params.toString(), {
      headers: tk() ? { Authorization: 'Bearer ' + tk() } : {}
    });
    if (!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();
    allItems = d.items || [];
    applyFilters();
  } catch (err) {
    console.error('loadCatalog', err);
    feed.innerHTML = '<div class="empty-state">Не удалось загрузить ленту</div>';
  }
}

function applyFilters(){
  const q = (document.getElementById('searchInput2').value || '').trim().toLowerCase();
  let items = allItems.slice();
  // Фильтр по группе категорий (фронтовый)
  if (currentCategoryGroup) {
    const groupItems = (CATEGORY_GROUPS.find(g => g.key === currentCategoryGroup) || {}).items || [];
    const allowedKeys = new Set(groupItems.map(c => c.key));
    items = items.filter(it => allowedKeys.has(it.category));
  }
  if (q) {
    items = items.filter(it => {
      const t = ((it.title || '') + ' ' + (it.description || '') + ' ' + (it.author_name || '') + ' ' + (it.tags||[]).join(' ')).toLowerCase();
      return t.includes(q);
    });
  }
  const noun = currentMode === 'product'
    ? pluralRu(items.length, ['товар','товара','товаров'])
    : pluralRu(items.length, ['услуга','услуги','услуг']);
  document.getElementById('resultsCount').textContent = items.length + ' ' + noun;
  renderFeed(items);
}

function renderFeed(items){
  const feed = document.getElementById('feed');
  if (!items.length) {
    feed.innerHTML = '<div class="empty-state">' +
      (currentMode === 'product'
        ? (currentTab === 'saved' ? 'У тебя пока нет сохранённых товаров.' :
           currentTab === 'my' ? 'Ты ещё не публиковал товары — нажми «Создать товар».' :
           'Товаров пока нет — создай первый!')
        : (currentTab === 'saved' ? 'У тебя пока нет сохранённых услуг.' :
           currentTab === 'my' ? 'Ты ещё не публиковал услуги — нажми «Создать услугу».' :
           'Услуг пока нет — создай первую!'))
      + '</div>';
    return;
  }
  feed.innerHTML = items.map(it => renderCard(it)).join('');
}

function renderCard(it){
  const isProduct = it.type === 'product';
  const detailUrl = isProduct ? '/product-detail.html?id=' : '/service-detail.html?id=';
  const cover = (isProduct && it.cover_image) ? it.cover_image : '';
  const stripeColor = stableColor(it.category_group || it.category || '?');
  const priceHtml = it.price != null
    ? '<span class="cat-price">' + esc(fmtPrice(it.price, it.currency)) + '</span>'
    : '<span class="cat-price-empty">По запросу</span>';

  // Бейджи статуса
  const badges = [];
  if (isProduct && !it.in_stock) badges.push('<span class="cat-status-tag cat-status-out">Под заказ</span>');
  if (it.status === 'paused') badges.push('<span class="cat-status-tag cat-status-paused">На паузе</span>');
  if (it.status === 'hidden') badges.push('<span class="cat-status-tag cat-status-hidden">Скрыто</span>');

  const groupLabel = it.category_group || '';
  const catLabel = it.category_label || '';
  const catTag = groupLabel
    ? '<span class="cat-cat-tag" style="background:' + esc(stableColor(it.category_group||it.category||'?')) + '">' + esc(groupLabel) + '</span>'
    : '';
  const typeTag = '<span class="cat-type-tag">' + (isProduct ? 'Товар' : 'Услуга') + '</span>';

  const tags = (it.tags || []).slice(0, 5).map(t => '<span class="cat-tag">' + esc(t) + '</span>').join('');

  const coverHtml = isProduct
    ? (cover
        ? '<div class="cat-cover"><img src="' + escAttr(cover) + '" alt="" loading="lazy"></div>'
        : '<div class="cat-cover cat-cover-empty"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/></svg></div>')
    : '';

  return '<a class="cat-card" href="' + detailUrl + escAttr(it.public_id) + '">' +
    coverHtml +
    '<div class="cat-stripe" style="background:' + esc(stripeColor) + '"></div>' +
    '<div class="cat-body">' +
      '<div class="cat-head">' +
        catTag + typeTag + badges.join('') +
      '</div>' +
      '<div class="cat-card-title">' + esc(it.title) + '</div>' +
      '<div class="cat-meta">' +
        (catLabel ? '<span class="cat-meta-item">' + esc(catLabel) + '</span>' : '') +
        (it.city ? '<span class="cat-meta-item"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' + esc(it.city) + '</span>' : '') +
        '<span class="cat-meta-item cat-author">' + (function(){ var a = pickAuthor(it); return a.href !== '#' ? '<span onclick="event.preventDefault();event.stopPropagation();window.location.href=\'' + escAttr(a.href) + '\'" style="cursor:pointer;font-weight:700">' + esc(a.name) + '</span>' : esc(a.name); })() + '</span>' +
        '<span class="cat-meta-item">' + esc(formatRelative(it.created_at)) + '</span>' +
      '</div>' +
      '<div class="cat-meta">' +
        priceHtml +
      '</div>' +
      (tags ? '<div class="cat-tags">' + tags + '</div>' : '') +
    '</div></a>';
}

// ─── Modal: Create ───
function openCreateModal(){
  if (!tk()) { toast('Войдите, чтобы создать публикацию'); return; }
  // Сбросим форму
  document.getElementById('ciType').value = currentMode;
  document.getElementById('ciTitle').value = '';
  document.getElementById('ciDesc').value = '';
  document.getElementById('ciPrice').value = '';
  document.getElementById('ciCurrency').value = 'RUB';
  document.getElementById('ciCity').value = '';
  document.getElementById('ciInStock').checked = true;
  document.getElementById('ciStatus').value = 'active';
  document.getElementById('ciTags').value = '';
  photos = [];
  renderPhotos();
  onTypeChange();
  document.getElementById('modalCreate').classList.add('open');
  setTimeout(() => document.getElementById('ciTitle').focus(), 150);
}
function closeCreateModal(){
  document.getElementById('modalCreate').classList.remove('open');
}
function onTypeChange(){
  const t = document.getElementById('ciType').value;
  document.getElementById('modalTitle').textContent = t === 'product' ? 'Создать товар' : 'Создать услугу';
  document.getElementById('ciInStockRow').style.display = t === 'product' ? '' : 'none';
}

// ─── Photo picker ───
function renderPhotos(){
  const wrap = document.getElementById('photoPicker');
  let html = '';
  photos.forEach((p, i) => {
    html += '<div class="photo-thumb' + (i === 0 ? ' cover-mark' : '') + '">' +
      '<img src="' + escAttr(p) + '" alt="">' +
      '<button class="photo-remove" type="button" onclick="removePhoto(' + i + ')" title="Удалить">×</button>' +
    '</div>';
  });
  if (photos.length < 6) {
    html += '<div class="photo-thumb photo-add" onclick="document.getElementById(\'photoInput\').click()">' +
      '<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
    '</div>';
  }
  wrap.innerHTML = html;
}
function onPhotoSelected(e){
  const files = Array.from(e.target.files || []);
  e.target.value = ''; // сбросить input
  files.forEach(file => {
    if (photos.length >= 6) return;
    if (!file.type.startsWith('image/')) { toast('Только изображения'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      photos.push(reader.result);
      renderPhotos();
    };
    reader.onerror = () => toast('Не удалось прочитать файл');
    reader.readAsDataURL(file);
  });
}
function removePhoto(i){
  photos.splice(i, 1);
  renderPhotos();
}

// ─── Submit ───
async function submitItem(){
  const btn = document.getElementById('ciSubmitBtn');
  const type = document.getElementById('ciType').value;
  const category = document.getElementById('ciCategory').value;
  const title = document.getElementById('ciTitle').value.trim();
  const desc = document.getElementById('ciDesc').value.trim();
  const priceRaw = document.getElementById('ciPrice').value.trim();
  const price = priceRaw ? parseInt(priceRaw, 10) : null;
  const currency = document.getElementById('ciCurrency').value;
  const city = document.getElementById('ciCity').value.trim();
  const inStock = document.getElementById('ciInStock').checked;
  const status = document.getElementById('ciStatus').value;
  const tagsRaw = document.getElementById('ciTags').value.trim();
  const tags = tagsRaw ? tagsRaw.split(',').map(s => s.trim()).filter(Boolean).slice(0, 10) : [];

  if (!title) { toast('Введите название'); document.getElementById('ciTitle').focus(); return; }
  if (title.length > 200) { toast('Слишком длинное название'); return; }

  const cover = photos[0] || '';
  const rest = photos.slice(1);

  btn.disabled = true; btn.textContent = 'Публикация…';
  try {
    const r = await lastopFetch(API + '/catalog', {
      method: 'POST',
      headers: window.withActiveContextHeaders ? window.withActiveContextHeaders({ Authorization: 'Bearer ' + tk(), 'Content-Type': 'application/json' }) : { Authorization: 'Bearer ' + tk(), 'Content-Type': 'application/json', ...(window.getActiveCompanyID && window.getActiveCompanyID() ? { 'X-Active-Company-Id': String(window.getActiveCompanyID()) } : {}) },
      body: JSON.stringify({
        type, category, title,
        description: desc,
        price, currency,
        in_stock: inStock,
        status,
        cover_image: cover,
        photos: rest,
        tags, city
      })
    });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.error || 'не удалось');
    }
    const d = await r.json();
    closeCreateModal();
    toast(type === 'product' ? 'Товар опубликован' : 'Услуга опубликована', true);
    if (d.item && d.item.public_id) {
      const url = (type === 'product' ? '/product-detail.html?id=' : '/service-detail.html?id=') + d.item.public_id;
      setTimeout(() => location.href = url, 600);
    } else {
      loadList();
    }
  } catch (err) {
    console.error('submitItem', err);
    toast('Ошибка: ' + (err.message || 'не удалось'));
  } finally {
    btn.disabled = false; btn.textContent = 'Опубликовать';
  }
}

// ─── Init ───
document.addEventListener('DOMContentLoaded', async () => {
  await loadProfile();
  await loadCategories();
  renderTabs();
  loadList();

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeCreateModal();
  });
});
</script>
<script src="/assets/guest-nav.js" defer></script>
<script src="/site-search.js" defer></script>
<script src="/assets/profile-context.js" defer></script>
<script>
if (window.lastopUX) {
  const si = document.getElementById('searchInput');
  if (si) window.lastopUX.attachSearchDebounce(si, () => {
    if (typeof applyFilters === 'function') applyFilters();
    else if (typeof loadCatalog === 'function') loadCatalog();
  }, 300);
}
</script>
</body>
