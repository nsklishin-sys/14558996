<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обновления платформы — LASTOP GROUP</title>
<script src="/assets/utils.js"></script>
<script src="/assets/dark-theme-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--g:#1E8A4C;--gm:#22A05A;--gl:#E8F5EE;--gp:#F0FAF4;--gmt:#5A8A6A;--gb:#C0DECA;--w:#FFF;--bg:#F2F5F3;--t:#1A2A22;--tm:#3A5245;--bdr:#DDE8E2;--r:8px;--rm:12px;--rl:18px;--rxl:24px;--sh:0 2px 12px rgba(30,138,76,.07)}
html,body{height:100%;overflow:hidden;font-family:'Manrope',sans-serif;background:var(--bg);color:var(--t);font-size:14px}
.shell{display:grid;grid-template-columns:220px 1fr 264px;grid-template-rows:56px 1fr;grid-template-areas:"logo topbar topbar" "nav main right";height:100vh;gap:10px;padding:10px}
.main{grid-area:main;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:20px}
.right{grid-area:right;overflow-y:auto;display:flex;flex-direction:column;gap:10px}

/* Заголовок страницы */
.up-header{background:linear-gradient(135deg,var(--g),var(--gm));border-radius:var(--rxl);padding:22px 24px;color:#fff;box-shadow:0 6px 24px rgba(30,138,76,.18)}
.up-header h1{font-size:22px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.up-header h1 svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.up-header p{font-size:13px;opacity:.9;line-height:1.55;max-width:600px}

/* Карточка обновления */
.up-card{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:20px 24px;box-shadow:var(--sh);transition:box-shadow .15s}
.up-card:hover{box-shadow:0 6px 20px rgba(30,138,76,.10)}
.up-meta{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.up-av{width:36px;height:36px;border-radius:10px;background:var(--g);display:grid;place-items:center;flex-shrink:0;overflow:hidden}
.up-av img{width:22px;height:22px;object-fit:contain}
.up-author{font-size:13px;font-weight:700;color:var(--t)}
.up-date{font-size:11px;color:var(--gmt);margin-top:1px}
.up-badge{margin-left:auto;padding:3px 10px;border-radius:99px;background:var(--gl);color:var(--g);font-size:10px;font-weight:700;letter-spacing:.05em;border:1px solid var(--gb)}
.up-title{font-size:18px;font-weight:800;color:var(--t);margin-bottom:10px;line-height:1.3}
.up-content{font-size:14px;color:var(--tm);line-height:1.65;white-space:pre-wrap}
.up-cover{width:100%;max-height:380px;object-fit:cover;border-radius:var(--rm);margin-bottom:14px;background:var(--bg)}

.up-empty{background:var(--w);border:1px dashed var(--gb);border-radius:var(--rxl);padding:60px 24px;text-align:center;color:var(--gmt)}
.up-empty svg{width:48px;height:48px;fill:none;stroke:var(--gb);stroke-width:1.5;stroke-linecap:round;margin-bottom:14px}
.up-empty h3{font-size:15px;font-weight:700;color:var(--t);margin-bottom:6px}
.up-empty p{font-size:13px}

.card{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:14px;box-shadow:var(--sh)}
.block-title{font-size:11px;font-weight:700;color:var(--gmt);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}

@media(max-width:1000px){.shell{grid-template-columns:220px 1fr;grid-template-areas:"logo topbar" "nav main"}.right{display:none}}
</style>
</head>
<body>
<div class="shell">
  <a class="logo-cell" href="/" style="grid-area:logo"></a>
  <header class="topbar"></header>
  <nav class="nav"></nav>

  <div class="main">
    <div class="up-header">
      <h1>
        <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        Обновления платформы
      </h1>
      <p>Анонсы новых возможностей, изменений и улучшений LASTOP GROUP. Подписывайтесь на новости платформы, чтобы быть в курсе всех нововведений.</p>
    </div>
    <div id="updatesList"></div>
  </div>

  <aside class="right">
    <div class="card">
      <div class="block-title">О разделе</div>
      <p style="font-size:12px;color:var(--tm);line-height:1.6">Здесь публикуются официальные новости от команды LASTOP GROUP — о новых функциях, изменениях и важных событиях платформы.</p>
    </div>
  </aside>
</div>

<script>
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function ago(ts){
  const dt = new Date(ts);
  const diff = Math.floor((Date.now() - dt) / 60000);
  if (diff < 60) return diff + ' мин назад';
  if (diff < 1440) return Math.floor(diff/60) + ' ч назад';
  if (diff < 10080) return Math.floor(diff/1440) + ' дн назад';
  return dt.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
}

async function loadUpdates(){
  const list = document.getElementById('updatesList');
  list.innerHTML = '<div class="up-card" style="text-align:center;color:var(--gmt)">Загрузка…</div>';
  try {
    const r = await lastopFetch('/api/posts/platform-updates?limit=50');
    if (!r.ok) throw 0;
    const d = await r.json();
    const posts = d.posts || [];
    if (!posts.length) {
      list.innerHTML = `
        <div class="up-empty">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <h3>Пока нет обновлений</h3>
          <p>Команда LASTOP GROUP скоро поделится новостями — заглядывайте позже.</p>
        </div>`;
      return;
    }
    list.innerHTML = posts.map(p => {
      const a = p.author || {};
      const cover = p.cover_url ? `<img class="up-cover" src="${esc(p.cover_url)}" alt="">` : '';
      return `
        <div class="up-card" id="post-${esc(p.public_id)}">
          <div class="up-meta">
            <div class="up-av"><img src="/favicon.svg" alt="LASTOP"></div>
            <div>
              <div class="up-author">${esc(a.full_name || 'LASTOP GROUP')}</div>
              <div class="up-date">${esc(ago(p.created_at))}</div>
            </div>
            <span class="up-badge">ОБНОВЛЕНИЕ</span>
          </div>
          ${cover}
          <div class="up-title">${esc(p.title)}</div>
          <div class="up-content">${esc(p.content)}</div>
        </div>`;
    }).join('');
    if (location.hash) {
      const el = document.getElementById('post-' + location.hash.slice(1));
      if (el) setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}), 100);
    }
  } catch(e) {
    list.innerHTML = '<div class="up-card" style="color:var(--gmt);text-align:center">Не удалось загрузить обновления.</div>';
  }
}

document.addEventListener('DOMContentLoaded', loadUpdates);
</script>
<script src="/assets/guest-nav.js" defer></script>
<script src="/assets/profile-context.js" defer></script>
</body>
</html>
