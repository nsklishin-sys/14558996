<!DOCTYPE html>
<html lang="ru">
<head>
<script src="/assets/utils.js"></script>
<script src="/assets/dark-theme-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LASTOP GROUP — Управление сообществом</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/shell-layout.css">
<script>document.documentElement.classList.add('lt-shell');</script>
<link rel="stylesheet" href="/assets/hover-lift.css">
<script>document.documentElement.classList.add('hl-on');</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#1E8A4C;--gm:#22A05A;--gl:#E8F5EE;--gp:#F0FAF4;--gmt:#5A8A6A;--gb:#C0DECA;
  --w:#FFF;--bg:#F2F5F3;--t:#1A2A22;--tm:#3A5245;--bdr:#DDE8E2;
  --red:#E04040;--r:8px;--rm:12px;--rl:18px;--rxl:24px;
  --sh:0 2px 12px rgba(30,138,76,.07);--shm:0 6px 24px rgba(30,138,76,.13)
}
html,body{height:100%;overflow:hidden;font-family:'Manrope',sans-serif;background:var(--bg);color:var(--t);font-size:14px}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}

.shell{display:grid;grid-template-columns:240px 1fr 300px;grid-template-rows:56px 1fr;grid-template-areas:"logo topbar topbar""nav main right";height:100vh;gap:10px;padding:10px}

.logo-cell{grid-area:logo;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;padding:0 14px;text-decoration:none;box-shadow:var(--sh);transition:box-shadow .2s}
.logo-cell:hover{box-shadow:var(--shm)}
.logo-cell img{height:38px;width:auto;max-width:100%;object-fit:contain;display:block}

.topbar{grid-area:topbar;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:grid;grid-template-columns:1fr 300px;align-items:center;gap:10px;padding:0 16px;box-shadow:var(--sh);min-width:0}
.search-wrap{position:relative;display:flex;align-items:center;min-width:0}
.search-wrap input{width:100%;height:36px;padding:0 14px 0 30px;border:1.5px solid var(--bdr);border-radius:99px;background:#fff;font-family:inherit;font-size:13px;color:var(--t);outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--gm)}
.search-wrap input::placeholder{color:var(--gmt)}

.nav{grid-area:nav;background:var(--w);border-radius:var(--rxl);border:1px solid var(--bdr);box-shadow:var(--sh);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;padding:12px 10px 10px;gap:1px}

.main{grid-area:main;overflow-y:auto;overflow-x:hidden;min-width:0;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.main > *{flex-shrink:0}
.right{grid-area:right;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.right > *{flex-shrink:0}

.mc-header{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);box-shadow:var(--sh);padding:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mc-logo{width:60px;height:60px;border-radius:var(--rl);background:var(--gl);display:grid;place-items:center;font-size:18px;font-weight:900;color:var(--g);overflow:hidden;flex-shrink:0;border:1px solid var(--gb)}
.mc-logo img{width:100%;height:100%;object-fit:cover;display:block}
.mc-info{flex:1;min-width:200px}
.mc-name{font-size:18px;font-weight:900;color:var(--t)}
.mc-meta{font-size:11px;color:var(--gmt);margin-top:3px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mc-select{height:36px;padding:0 12px;border:1.5px solid var(--bdr);border-radius:99px;font-family:inherit;font-size:12px;background:#fff;color:var(--t);outline:none;cursor:pointer;-webkit-appearance:none;appearance:none;padding-right:32px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><polyline points='6 9 12 15 18 9' stroke='%235A8A6A' fill='none' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 10px center;background-size:12px;font-weight:600}
.mc-select:focus{border-color:var(--g)}

.mc-tabs{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);box-shadow:var(--sh);padding:8px;display:flex;gap:4px;flex-wrap:wrap}
.mc-tab{padding:8px 14px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--tm);font-family:inherit;transition:all .15s}
.mc-tab:hover{background:var(--gp);color:var(--g)}
.mc-tab.active{background:var(--g);color:#fff}

.panel{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);box-shadow:var(--sh);padding:18px;display:flex;flex-direction:column;gap:14px}
.panel-title{font-size:14px;font-weight:800;color:var(--t);display:flex;align-items:center;gap:8px;margin-bottom:4px}
.panel-title svg{width:16px;height:16px;stroke:var(--g);fill:none;stroke-width:2;flex-shrink:0}

.fld{display:flex;flex-direction:column;gap:5px}
.fld-label{font-size:11px;font-weight:700;color:var(--tm)}
.fld-input,.fld-textarea,.fld-select{width:100%;height:38px;padding:0 12px;border:1.5px solid var(--bdr);border-radius:var(--rm);font-family:inherit;font-size:13px;background:#fff;color:var(--t);outline:none;transition:border-color .12s;line-height:1}
.fld-textarea{height:90px;padding:9px 12px;resize:vertical;min-height:60px;line-height:1.4}
.fld-input:focus,.fld-textarea:focus,.fld-select:focus{border-color:var(--g)}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.fld-hint{font-size:10px;color:var(--gmt);margin-top:2px}

.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 18px;border-radius:99px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid transparent;transition:all .15s;white-space:nowrap;text-decoration:none}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}
.btn-primary{background:var(--g);color:#fff;box-shadow:0 2px 8px rgba(30,138,76,.22)}
.btn-primary:hover{background:var(--gm)}
.btn-secondary{background:transparent;color:var(--t);border-color:var(--bdr)}
.btn-secondary:hover{background:var(--gp);border-color:var(--gb);color:var(--g)}
.btn-danger{background:transparent;color:var(--red);border-color:#FFD5D2}
.btn-danger:hover{background:#FFF5F5}
.btn-ghost{background:transparent;color:var(--gmt);border-color:var(--bdr);height:32px;padding:0 12px;font-size:12px}
.btn-ghost:hover{color:var(--g);border-color:var(--gb)}
.btn:disabled{opacity:.6;cursor:default}

.member-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--bdr);border-radius:var(--rm);background:var(--gp);transition:all .12s}
.member-row:hover{border-color:var(--gb);background:var(--gl)}
.member-av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;flex-shrink:0;text-decoration:none;overflow:hidden}
.member-av img{width:100%;height:100%;object-fit:cover}
.member-info{flex:1;min-width:0}
.member-name{font-size:13px;font-weight:800;color:var(--t)}
.member-name a{color:inherit;text-decoration:none}
.member-name a:hover{color:var(--g)}
.member-role-line{font-size:11px;color:var(--gmt);margin-top:2px}
.member-role-badge{font-size:9px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--gl);color:var(--g);border:1px solid var(--gb);text-transform:uppercase;letter-spacing:.04em;flex-shrink:0}
.member-role-badge.owner{background:#FFF7E6;color:#B7791F;border-color:#FFD78A}
.member-role-badge.moderator{background:#E8F0FF;color:#2D5BB7;border-color:#B8CDF5}
.member-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}

.req-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--bdr);border-radius:var(--rm);background:var(--gp);transition:all .12s}
.req-row:hover{border-color:var(--gb);background:var(--gl)}
.req-message{flex:1;min-width:0;font-size:11px;color:var(--gmt);font-style:italic;margin-top:2px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--t);color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:2000;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--g)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--w);border-radius:var(--rxl);box-shadow:0 20px 50px rgba(0,0,0,.2);max-width:480px;width:100%;max-height:92vh;display:flex;flex-direction:column}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--bdr)}
.modal-title{font-size:16px;font-weight:800;color:var(--t)}
.modal-close{width:32px;height:32px;border-radius:8px;background:transparent;border:none;color:var(--gmt);cursor:pointer;display:grid;place-items:center}
.modal-close:hover{background:var(--gp);color:var(--t)}
.modal-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.modal-body{padding:18px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--bdr)}

.placeholder{padding:40px 20px;text-align:center;color:var(--gmt);font-size:13px;font-style:italic}

@media(max-width:1200px){.shell{grid-template-columns:220px 1fr 260px}}
@media(max-width:1000px){.shell{grid-template-columns:220px 1fr;grid-template-areas:"logo topbar""nav main"}.right{display:none}}
@media(max-width:740px){.shell{grid-template-columns:52px 1fr}.nav-item span,.nav-group{display:none}.nav-item{justify-content:center;padding:10px}.fld-row,.fld-row3{grid-template-columns:1fr}}
@media (min-width:1921px) and (min-height:1081px){
  html,body{font-size:15px}
  .shell{grid-template-columns:280px 1fr 360px !important;gap:12px;padding:12px}
  .topbar{grid-template-columns:1fr 360px !important}
  .nav{padding:14px 12px 12px}
}
</style>
<link rel="stylesheet" href="/assets/dark-theme.css">
</head>
<body>
<div class="shell">

<a class="logo-cell" href="/"><img src="/assets/lastop-group-logo.svg" alt="LASTOP GROUP" onerror="this.style.display='none'"></a>

<header class="topbar"></header>

<nav class="nav"></nav>

<div class="main" id="mainArea">
  <div class="placeholder">Загрузка…</div>
</div>

<aside class="right" id="rightArea"></aside>

</div>

<div class="toast" id="toast"></div>

<script src="/site-search.js" defer></script>
<script src="/assets/profile-context.js" defer></script>
<script>
const API = '/api';
function tk(){ return localStorage.getItem('token'); }
const esc = window.lastopEsc;function ltr(name){ if(!name)return '?'; return name.split(/\s+/).filter(Boolean).map(s=>s[0]).slice(0,2).join('').toUpperCase(); }
function avc(s){ const palette=['#1E8A4C','#2D5BB7','#7C3AED','#EA580C','#0891B2','#BE185D','#15803D','#9333EA','#DC2626','#0284C7','#65A30D','#7E22CE']; let h=0; const str=String(s||'?'); for(let i=0;i<str.length;i++)h=str.charCodeAt(i)+((h<<5)-h); return palette[Math.abs(h)%palette.length]; }
function toast(msg, ok){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast'+(ok?' success':''); requestAnimationFrame(()=>t.classList.add('show')); setTimeout(()=>t.classList.remove('show'),2500); }
function logout(){ localStorage.removeItem('token'); location.href='/home-guest.html'; }

function toggleProfileDD(e){
  e.stopPropagation();
  document.getElementById('profileDD').classList.toggle('open');
  document.getElementById('topbarProfile').classList.toggle('open');
}
document.addEventListener('click', e => {
  const dd=document.getElementById('profileDD');
  const tp=document.getElementById('topbarProfile');
  if(dd && tp && !tp.contains(e.target) && !dd.contains(e.target)){
    dd.classList.remove('open');
    tp.classList.remove('open');
  }
});

let myCommunities = [];
let currentCommunity = null;
let currentTab = 'about';

const COMMUNITY_CATEGORIES = ['Логистика','ВЭД','IT','Регионы','Карьера','Другое'];
const PRIVACY_LABEL = { open: 'Открытое (любой может вступить)', closed: 'Закрытое (вступление по заявке)' };

async function loadProfile(){
  try {
    const r = await fetch(API+'/me', { headers: { Authorization: 'Bearer '+tk() }});
    if(!r.ok){ location.href='/login.html'; return; }
    const u = await r.json();
    const name = u.full_name || u.handle || 'Пользователь';
    document.getElementById('topbarName').textContent = name;
    if(window.LASTOP_SET_AV)window.LASTOP_SET_AV("topbarAv",ltr(name),avc(name),((typeof u!=="undefined"&&u&&u.avatar_url)||(typeof currentUser!=="undefined"&&currentUser&&currentUser.avatar_url)||(typeof user!=="undefined"&&user&&user.avatar_url)||""));else{document.getElementById("topbarAv").textContent=ltr(name);document.getElementById("topbarAv").style.background=avc(name);}
    document.getElementById('pddName').textContent = name;
    if(window.LASTOP_SET_AV)window.LASTOP_SET_AV("pddAv",ltr(name),avc(name),((typeof u!=="undefined"&&u&&u.avatar_url)||(typeof currentUser!=="undefined"&&currentUser&&currentUser.avatar_url)||(typeof user!=="undefined"&&user&&user.avatar_url)||""));else{document.getElementById("pddAv").textContent=ltr(name);document.getElementById("pddAv").style.background=avc(name);}
  } catch(err){ console.error('loadProfile', err); }
}

async function loadMyCommunities(){
  const r = await fetch(API+'/communities?limit=200', { headers: { Authorization: 'Bearer '+tk() }});
  if(!r.ok){ throw new Error('communities '+r.status); }
  const d = await r.json();
  const all = d.communities || d.items || [];
  // Только где юзер owner или admin (модератор не управляет — он только модерирует посты)
  myCommunities = all.filter(c => c.my_role === 'owner' || c.my_role === 'admin');
}

async function loadCurrentCommunity(){
  if (!currentCommunity) return;
  const r = await fetch(API+'/communities/'+currentCommunity.id, { headers: { Authorization: 'Bearer '+tk() }});
  if (r.ok){
    const d = await r.json();
    currentCommunity = d.community || d;
  }
}

function renderEmpty(){
  document.getElementById('mainArea').innerHTML =
    '<div class="panel"><div class="panel-title"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>Нет сообществ для управления</div>'+
    '<p style="font-size:13px;color:var(--tm);line-height:1.5">Вы не являетесь владельцем ни одного сообщества. Создайте новое сообщество, чтобы получить возможность им управлять.</p>'+
    '<a class="btn btn-primary" href="/communities.html?create=1" style="align-self:flex-start"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Создать сообщество</a></div>';
  document.getElementById('rightArea').innerHTML = '';
}

function render(){
  if (!currentCommunity){ renderEmpty(); return; }
  const c = currentCommunity;
  const switcher = myCommunities.length > 1
    ? '<select class="mc-select" onchange="switchCommunity(parseInt(this.value))">'
      + myCommunities.map(co => '<option value="'+co.id+'"'+(co.id===c.id?' selected':'')+'>'+esc(co.name)+'</option>').join('')
      + '</select>'
    : '';
  const avatarHtml = c.avatar_url
    ? '<img src="'+esc(c.avatar_url)+'" alt="">'
    : esc(ltr(c.name));
  const headerHtml =
    '<div class="mc-header">'+
      '<div class="mc-logo" style="background:'+esc(c.color || avc(c.name))+';color:#fff">'+avatarHtml+'</div>'+
      '<div class="mc-info">'+
        '<div class="mc-name">'+esc(c.name)+'</div>'+
        '<div class="mc-meta"><span>'+esc(c.category || 'Категория не задана')+'</span><span>·</span><span>'+esc(c.privacy_level === 'closed' ? 'Закрытое' : 'Открытое')+'</span><span>·</span><span>'+(c.members_count || 0)+' участников</span></div>'+
      '</div>'+
      switcher+
      '<a class="btn btn-secondary" href="/community-detail.html?id='+c.id+'"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>Перейти к сообществу</a>'+
    '</div>';

  const tabs = [
    {key:'about', label:'О сообществе'},
    {key:'members', label:'Участники'},
  ];
  if (c.privacy_level === 'closed'){
    tabs.push({key:'requests', label:'Заявки'});
  }

  const tabsHtml = '<div class="mc-tabs">'+
    tabs.map(t => '<button class="mc-tab'+(currentTab===t.key?' active':'')+'" onclick="setTab(\''+t.key+'\')">'+esc(t.label)+'</button>').join('')+
    '</div>';

  document.getElementById('mainArea').innerHTML = headerHtml + tabsHtml + '<div id="tabContent"></div>';
  renderSidebar();
  renderTab();
}

function setTab(key){ currentTab = key; render(); }

async function renderTab(){
  const wrap = document.getElementById('tabContent');
  if (!wrap) return;
  if (currentTab === 'about') return renderAbout(wrap);
  if (currentTab === 'members') return renderMembers(wrap);
  if (currentTab === 'requests') return renderRequests(wrap);
}

function renderAbout(wrap){
  const c = currentCommunity;
  const tagsValue = (c.tags || []).join(', ');
  wrap.innerHTML =
    '<div class="panel">'+
      '<div class="panel-title"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>О сообществе</div>'+
      '<div class="fld"><label class="fld-label">Название *</label><input class="fld-input" id="fName" value="'+esc(c.name||'')+'" maxlength="120"></div>'+
      '<div class="fld-row">'+
        '<div class="fld"><label class="fld-label">Категория</label><select class="fld-select" id="fCategory">'+
          COMMUNITY_CATEGORIES.map(cat => '<option value="'+esc(cat)+'"'+(c.category===cat?' selected':'')+'>'+esc(cat)+'</option>').join('')+
        '</select></div>'+
        '<div class="fld"><label class="fld-label">Тип</label><select class="fld-select" id="fPrivacy">'+
          '<option value="open"'+(c.privacy_level==='open'?' selected':'')+'>Открытое</option>'+
          '<option value="closed"'+(c.privacy_level==='closed'?' selected':'')+'>Закрытое</option>'+
        '</select></div>'+
      '</div>'+
      '<div class="fld"><label class="fld-label">Описание</label><textarea class="fld-textarea" id="fDescription" maxlength="2000">'+esc(c.description||'')+'</textarea></div>'+
      '<div class="fld-row">'+
        '<div class="fld"><label class="fld-label">Регион</label><input class="fld-input" id="fRegion" value="'+esc(c.region||'')+'" maxlength="100"></div>'+
        '<div class="fld"><label class="fld-label">Цвет (HEX)</label><input class="fld-input" id="fColor" value="'+esc(c.color||'')+'" placeholder="#5AB080" maxlength="9"></div>'+
      '</div>'+
      '<div class="fld-row">'+
        '<div class="fld">'+
          '<label class="fld-label">Аватарка</label>'+
          '<input type="hidden" id="fAvatar" value="'+esc(c.avatar_url||'')+'">'+
          '<div id="fAvatarPreview" style="'+(c.avatar_url?'':'display:none;')+'position:relative;margin-bottom:8px;width:80px;height:80px;border-radius:14px;overflow:hidden;border:1px solid var(--bdr)">'+
            '<img id="fAvatarImg" src="'+esc(c.avatar_url||'')+'" alt="" style="width:100%;height:100%;object-fit:cover;display:block">'+
            '<button type="button" onclick="removeEditAvatar()" title="Удалить" style="position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);border:none;color:#fff;display:grid;place-items:center;cursor:pointer"><svg viewBox="0 0 24 24" style="width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>'+
            '<div id="fAvatarUploading" style="display:none;position:absolute;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700">Загрузка…</div>'+
          '</div>'+
          '<button type="button" class="btn" onclick="document.getElementById(\'fAvatarInput\').click()" style="display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1.5px solid var(--bdr);background:var(--gp);border-radius:10px;font-family:inherit;font-size:12px;font-weight:600;color:var(--tm);cursor:pointer"><svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>Загрузить</button>'+

async function _uploadEditImage(file, hiddenID, imgID, previewID, uploadingID){
  if(!file || !file.type.startsWith('image/')){ toast('Только изображения'); return; }
  if(file.size > 10*1024*1024){ toast('Макс. 10 МБ'); return; }
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById(imgID).src = ev.target.result;
    document.getElementById(previewID).style.display = 'block';
    document.getElementById(uploadingID).style.display = 'flex';
  };
  reader.readAsDataURL(file);
  try{
    const fd = new FormData(); fd.append('file', file);
    const r = await fetch(API+'/upload',{method:'POST',headers:{Authorization:'Bearer '+tk()},body:fd});
    const d = await r.json().catch(()=>({}));
    if(!r.ok || !d.url){ toast(d.error||'Не удалось'); document.getElementById(previewID).style.display='none'; return; }
    document.getElementById(hiddenID).value = d.url;
    document.getElementById(uploadingID).style.display = 'none';
  }catch{
    toast('Ошибка сети');
    document.getElementById(previewID).style.display = 'none';
  }
}
async function onEditAvatarSelected(e){
  const f = e.target.files && e.target.files[0]; e.target.value='';
  if(f) await _uploadEditImage(f,'fAvatar','fAvatarImg','fAvatarPreview','fAvatarUploading');
}
async function onEditCoverSelected(e){
  const f = e.target.files && e.target.files[0]; e.target.value='';
  if(f) await _uploadEditImage(f,'fCover','fCoverImg','fCoverPreview','fCoverUploading');
}

}

async function saveAbout(){
  const tagsRaw = document.getElementById('fTags').value || '';
  const tags = tagsRaw.split(',').map(t => t.trim()).filter(Boolean);
  const body = {
    name: document.getElementById('fName').value.trim(),
    category: document.getElementById('fCategory').value,
    privacy_level: document.getElementById('fPrivacy').value,
    description: document.getElementById('fDescription').value.trim(),
    region: document.getElementById('fRegion').value.trim(),
    color: document.getElementById('fColor').value.trim(),
    avatar_url: document.getElementById('fAvatar').value.trim(),
    cover_url: document.getElementById('fCover').value.trim(),
    website: document.getElementById('fWebsite').value.trim(),
    email: document.getElementById('fEmail').value.trim(),
    phone: document.getElementById('fPhone').value.trim(),
    tags: tags
  };
  if (!body.name){ toast('Название обязательно'); return; }
  try {
    const r = await fetch(API+'/communities/'+currentCommunity.id, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer '+tk() },
      body: JSON.stringify(body)
    });
    if (!r.ok){
      const d = await r.json().catch(()=>null);
      toast(d?.error || ('Ошибка '+r.status));
      return;
    }
    const d = await r.json();
    currentCommunity = d.community || d;
    toast('Сохранено', true);
    render();
  } catch(err){ toast('Сеть: '+err.message); }
}

async function renderMembers(wrap){
  wrap.innerHTML = '<div class="panel"><div class="panel-title"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Участники</div><div class="placeholder">Загрузка…</div></div>';
  try {
    const r = await fetch(API+'/communities/'+currentCommunity.id+'/members?limit=200', { headers: { Authorization: 'Bearer '+tk() }});
    const d = await r.json();
    const members = (d.members || []);
    const myRole = currentCommunity.my_role;
    const isOwner = myRole === 'owner';
    const rows = members.map(m => {
      const role = m.role || 'member';
      const roleLabel = role === 'owner' ? 'Владелец' : role === 'admin' ? 'Администратор' : role === 'moderator' ? 'Модератор' : 'Участник';
      const badge = role !== 'member' ? '<span class="member-role-badge '+role+'">'+esc(roleLabel)+'</span>' : '';
      const avSrc = m.avatar_url ? '<img src="'+esc(m.avatar_url)+'" alt="">' : esc(ltr(m.full_name));
      let actions = '';
      if (isOwner && role !== 'owner'){
        const isMod = role === 'moderator';
        actions += '<button class="btn btn-ghost" onclick="toggleModerator(\''+esc(m.user_public_id)+'\','+(!isMod)+',\''+esc(m.full_name||'')+'\')">'+(isMod?'Снять модератора':'Назначить модератором')+'</button>';
        actions += '<button class="btn btn-ghost" onclick="kickMember(\''+esc(m.user_public_id)+'\',\''+esc(m.full_name||'')+'\')" style="color:var(--red);border-color:#FFD5D2">Исключить</button>';
      }
      return '<div class="member-row">'+
        '<a class="member-av" href="/profile_user.html?id='+encodeURIComponent(m.user_public_id||'')+'" style="background:'+esc(avc(m.full_name))+'">'+avSrc+'</a>'+
        '<div class="member-info">'+
          '<div class="member-name"><a href="/profile_user.html?id='+encodeURIComponent(m.user_public_id||'')+'">'+esc(m.full_name||'Участник')+'</a></div>'+
          '<div class="member-role-line">'+esc(roleLabel)+(m.position ? ' · '+esc(m.position) : '')+'</div>'+
        '</div>'+
        badge+
        '<div class="member-actions">'+actions+'</div>'+
      '</div>';
    }).join('');
    wrap.innerHTML = '<div class="panel">'+
      '<div class="panel-title"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Участники ('+members.length+')</div>'+
      (rows || '<div class="placeholder">Пока нет участников</div>')+
    '</div>';
  } catch(err){
    wrap.innerHTML = '<div class="panel"><div class="placeholder">Ошибка загрузки участников</div></div>';
  }
}

async function toggleModerator(userPublicID, makeMod, name){
  const newRole = makeMod ? 'moderator' : 'member';
  const verb = makeMod ? 'назначить '+name+' модератором' : 'снять модератора с '+name;
  if (!await lastopConfirm({title:'Вы уверены что хотите '+verb+'?',danger:true})) return;
  try {
    const r = await fetch(API+'/communities/'+currentCommunity.id+'/members/'+userPublicID+'/role', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer '+tk() },
      body: JSON.stringify({ role: newRole })
    });
    if (!r.ok){ toast('Ошибка '+r.status); return; }
    toast('Готово', true);
    renderTab();
  } catch(err){ toast('Сеть: '+err.message); }
}

async function kickMember(userPublicID, name){
  if (!await lastopConfirm({title:'Исключить '+name+' из сообщества?',danger:true})) return;
  try {
    const r = await fetch(API+'/communities/'+currentCommunity.id+'/members/'+userPublicID, {
      method: 'DELETE',
      headers: { Authorization: 'Bearer '+tk() }
    });
    if (!r.ok){ toast('Ошибка '+r.status); return; }
    toast('Участник исключён', true);
    renderTab();
  } catch(err){ toast('Сеть: '+err.message); }
}

async function renderRequests(wrap){
  wrap.innerHTML = '<div class="panel"><div class="panel-title"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>Заявки на вступление</div><div class="placeholder">Загрузка…</div></div>';
  try {
    const r = await fetch(API+'/communities/'+currentCommunity.id+'/join-requests', { headers: { Authorization: 'Bearer '+tk() }});
    const d = await r.json();
    const reqs = (d.requests || d.items || []).filter(rq => rq.status === 'pending' || !rq.status);
    if (!reqs.length){
      wrap.innerHTML = '<div class="panel"><div class="panel-title"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/></svg>Заявки на вступление</div><div class="placeholder">Нет открытых заявок</div></div>';
      return;
    }
    const rows = reqs.map(rq => {
      const userName = rq.user_name || rq.full_name || 'Пользователь';
      const upid = rq.user_public_id || '';
      const msg = rq.message || '';
      const avSrc = rq.user_avatar ? '<img src="'+esc(rq.user_avatar)+'" alt="">' : esc(ltr(userName));
      return '<div class="req-row">'+
        '<a class="member-av" href="/profile_user.html?id='+encodeURIComponent(upid)+'" style="background:'+esc(avc(userName))+'">'+avSrc+'</a>'+
        '<div class="member-info">'+
          '<div class="member-name"><a href="/profile_user.html?id='+encodeURIComponent(upid)+'">'+esc(userName)+'</a></div>'+
          (msg ? '<div class="req-message">«'+esc(msg)+'»</div>' : '<div class="member-role-line">Без сообщения</div>')+
        '</div>'+
        '<div class="member-actions">'+
          '<button class="btn btn-ghost" onclick="answerRequest('+rq.id+',\'approve\')" style="color:var(--g);border-color:var(--gb)">Принять</button>'+
          '<button class="btn btn-ghost" onclick="answerRequest('+rq.id+',\'reject\')" style="color:var(--red);border-color:#FFD5D2">Отклонить</button>'+
        '</div>'+
      '</div>';
    }).join('');
    wrap.innerHTML = '<div class="panel">'+
      '<div class="panel-title"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/></svg>Заявки на вступление ('+reqs.length+')</div>'+
      rows+
    '</div>';
  } catch(err){
    wrap.innerHTML = '<div class="panel"><div class="placeholder">Ошибка загрузки заявок</div></div>';
  }
}

async function answerRequest(id, action){
  try {
    const r = await fetch(API+'/communities/'+currentCommunity.id+'/join-requests/'+id+'/'+action, {
      method: 'POST',
      headers: { Authorization: 'Bearer '+tk() }
    });
    if (!r.ok){ toast('Ошибка '+r.status); return; }
    toast(action==='approve'?'Принято':'Отклонено', true);
    renderTab();
  } catch(err){ toast('Сеть: '+err.message); }
}

function deleteCommunity(){
  const c=currentCommunity;
  if(!c)return;
  document.getElementById('deleteModalExpected').textContent=c.name;
  document.getElementById('deleteModalInput').value='';
  document.getElementById('deleteModalConfirm').disabled=true;
  document.getElementById('deleteModalConfirm').style.opacity='.5';
  document.getElementById('deleteModalBg').classList.add('open');
  setTimeout(()=>document.getElementById('deleteModalInput').focus(),100);
}
function closeDeleteModal(){document.getElementById('deleteModalBg').classList.remove('open');}
function checkDeleteInput(){
  const c=currentCommunity;if(!c)return;
  const val=document.getElementById('deleteModalInput').value.trim();
  const btn=document.getElementById('deleteModalConfirm');
  const match=val===c.name;
  btn.disabled=!match;
  btn.style.opacity=match?'1':'.5';
}
async function executeDelete(){
  const c=currentCommunity;if(!c)return;
  const btn=document.getElementById('deleteModalConfirm');
  btn.disabled=true;btn.textContent='Удаление…';
  try{
    const r=await fetch(API+'/communities/'+c.id,{method:'DELETE',headers:{Authorization:'Bearer '+tk()}});
    if(!r.ok){toast('Ошибка '+r.status);btn.disabled=false;btn.textContent='Удалить';return;}
    closeDeleteModal();
    toast('Сообщество удалено',true);
    setTimeout(()=>{location.href='/communities.html';},800);
  }catch(err){
    toast('Сеть: '+err.message);
    btn.disabled=false;btn.textContent='Удалить';
  }
}

async function switchCommunity(id){
  const c = myCommunities.find(co => co.id === id);
  if (!c) return;
  currentCommunity = c;
  await loadCurrentCommunity();
  history.replaceState({}, '', '/my-community-edit.html?id='+id);
  render();
}

document.addEventListener('DOMContentLoaded', async () => {
  if (!tk()){ location.href='/login.html'; return; }
  await loadProfile();
  try {
    await loadMyCommunities();
  } catch(err){
    document.getElementById('mainArea').innerHTML = '<div class="panel"><div class="placeholder">Не удалось загрузить сообщества</div></div>';
    return;
  }
  if (!myCommunities.length){ renderEmpty(); return; }
  const params = new URLSearchParams(location.search);
  const idParam = parseInt(params.get('id'), 10);
  currentCommunity = myCommunities.find(c => c.id === idParam) || myCommunities[0];
  await loadCurrentCommunity();
  render();
});
