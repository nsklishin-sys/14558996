<!DOCTYPE html>
<html lang="ru">
<head>
<script src="/assets/utils.js"></script>
<script src="/assets/dark-theme-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LASTOP GROUP — E-market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/shell-layout.css">
<script>document.documentElement.classList.add('lt-shell');</script>
<link rel="stylesheet" href="/assets/hover-lift.css">
<script>document.documentElement.classList.add('hl-on');</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#1E8A4C;--gm:#22A05A;--gl:#E8F5EE;--gp:#F0FAF4;--gmt:#5A8A6A;--gb:#C0DECA;
  --w:#FFF;--bg:#F2F5F3;--t:#1A2A22;--tm:#3A5245;--bdr:#DDE8E2;
  --red:#E04040;--r:8px;--rm:12px;--rl:18px;--rxl:24px;
  --sh:0 2px 12px rgba(30,138,76,.07);--shm:0 6px 24px rgba(30,138,76,.13)
}
html,body{height:100%;overflow:hidden;font-family:'Manrope',sans-serif;background:var(--bg);color:var(--t);font-size:14px}
.logo-cell{grid-area:logo;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;padding:0 14px;text-decoration:none;box-shadow:var(--sh);transition:box-shadow .2s}
.logo-cell img{height:38px;width:auto;max-width:100%;object-fit:contain;display:block}
.main{grid-area:main;overflow-y:auto;display:flex;flex-direction:column;gap:14px;min-height:0;padding-bottom:16px}
.main::-webkit-scrollbar{width:4px}.main::-webkit-scrollbar-thumb{background:var(--gb);border-radius:99px}
.right{grid-area:right;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:0}
.right::-webkit-scrollbar{width:4px}.right::-webkit-scrollbar-thumb{background:var(--gb);border-radius:99px}

/* DEV-режим админа: бейдж сверху */
.dev-strip{background:linear-gradient(135deg,#1E8A4C 0%,#146A38 100%);border-radius:var(--rl);padding:9px 16px;color:#fff;display:flex;align-items:center;gap:10px;flex-shrink:0;font-size:12px;font-weight:700}
.dev-strip svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round}
.dev-strip .ds-tag{margin-left:auto;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.18);font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}

/* Топ-баннер рекламы */
.em-banner{background:linear-gradient(120deg,#185FA5 0%,#2479C8 100%);border-radius:var(--rxl);padding:18px 22px;color:#fff;display:flex;align-items:center;gap:14px;flex-shrink:0;box-shadow:var(--shm);position:relative;overflow:hidden}
.em-banner::after{content:'';position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.em-banner-txt{flex:1;z-index:1}
.em-banner-txt h2{font-size:16px;font-weight:900;margin-bottom:3px}
.em-banner-txt p{font-size:12px;color:rgba(255,255,255,.82);line-height:1.5}
.em-banner-tag{z-index:1;padding:4px 11px;border-radius:99px;background:rgba(255,255,255,.18);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}

/* Тулбар: переключатель + поиск */
.em-toolbar{display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap}
.em-switch{display:inline-flex;background:var(--w);border:1px solid var(--bdr);border-radius:var(--rm);padding:3px;box-shadow:var(--sh)}
.em-switch button{border:none;background:none;font-family:inherit;font-size:13px;font-weight:700;color:var(--gmt);padding:8px 18px;border-radius:9px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:7px}
.em-switch button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.em-switch button.active{background:var(--g);color:#fff}
.em-search{flex:1;min-width:200px;position:relative;display:flex;align-items:center}
.em-search svg{position:absolute;left:13px;width:16px;height:16px;stroke:var(--gmt);fill:none;stroke-width:1.8;stroke-linecap:round;pointer-events:none}
.em-search input{width:100%;height:42px;padding:0 14px 0 38px;border:1.5px solid var(--bdr);border-radius:var(--rm);background:var(--w);font-family:inherit;font-size:13px;color:var(--t);outline:none;transition:border-color .2s}
.em-search input:focus{border-color:var(--gm)}
.em-sort{height:42px;padding:0 14px;border:1.5px solid var(--bdr);border-radius:var(--rm);background:var(--w);font-family:inherit;font-size:13px;color:var(--t);cursor:pointer;outline:none}

/* Чипсы категорий */
.em-cats{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}
.em-cat{padding:6px 14px;border-radius:99px;border:1.5px solid var(--bdr);background:var(--w);font-family:inherit;font-size:12px;font-weight:700;color:var(--tm);cursor:pointer;transition:all .15s}
.em-cat:hover{border-color:var(--gb);color:var(--g)}
.em-cat.active{background:var(--g);border-color:var(--g);color:#fff}

/* Сетка карточек */
.em-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;flex-shrink:0}
.em-card{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);box-shadow:var(--sh);overflow:hidden;cursor:pointer;transition:all .18s;display:flex;flex-direction:column}
.em-card:hover{box-shadow:var(--shm);transform:translateY(-2px);border-color:var(--gb)}
.em-card-img{aspect-ratio:16/10;background:linear-gradient(135deg,var(--gl),var(--gp));display:grid;place-items:center;overflow:hidden}
.em-card-img img{width:100%;height:100%;object-fit:cover}
.em-card-img .ph{width:42px;height:42px;stroke:var(--gb);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.em-card-body{padding:13px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.em-card-kind{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--gmt)}
.em-card-title{font-size:14px;font-weight:800;color:var(--t);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.em-card-shop{font-size:11px;color:var(--gmt);display:flex;align-items:center;gap:4px}
.em-card-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:8px}
.em-card-price{font-size:15px;font-weight:900;color:var(--g)}
.em-card-price.neg{font-size:12px;font-weight:700;color:var(--gmt)}
.em-card-rating{font-size:11px;color:var(--gmt);display:flex;align-items:center;gap:3px}
.em-card-rating svg{width:12px;height:12px;fill:#F0A030;stroke:none}

/* Карточка магазина */
.em-shop-card{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);box-shadow:var(--sh);overflow:hidden;cursor:pointer;transition:all .18s}
.em-shop-card:hover{box-shadow:var(--shm);transform:translateY(-2px);border-color:var(--gb)}
.em-shop-cover{height:80px;background:linear-gradient(120deg,var(--g),var(--gm));position:relative}
.em-shop-cover img{width:100%;height:100%;object-fit:cover}
.em-shop-body{padding:0 16px 16px;position:relative}
.em-shop-logo{width:54px;height:54px;border-radius:14px;background:var(--w);border:3px solid var(--w);margin-top:-27px;box-shadow:var(--sh);display:grid;place-items:center;font-size:20px;font-weight:900;color:#fff;overflow:hidden}
.em-shop-logo img{width:100%;height:100%;object-fit:cover;border-radius:11px}
.em-shop-name{font-size:15px;font-weight:800;color:var(--t);margin-top:8px}
.em-shop-desc{font-size:12px;color:var(--gmt);line-height:1.5;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.em-shop-meta{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:11px;color:var(--gmt)}
.em-shop-meta .star{display:flex;align-items:center;gap:3px}
.em-shop-meta .star svg{width:12px;height:12px;fill:#F0A030;stroke:none}

/* Состояния */
.em-empty{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--gmt)}
.em-empty svg{width:44px;height:44px;stroke:var(--gb);fill:none;stroke-width:1.3;stroke-linecap:round;margin-bottom:14px}
.em-empty-t{font-size:15px;font-weight:800;color:var(--t);margin-bottom:6px}
.em-empty-d{font-size:12.5px;line-height:1.5}
.em-skel{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);overflow:hidden}
.em-skel-img{aspect-ratio:16/10;background:var(--gp);animation:pulse 1.4s ease-in-out infinite}
.em-skel-body{padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.em-skel-line{height:11px;border-radius:5px;background:var(--gp);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* Плашка «в разработке» (юзеры) */
.dev-wrap{flex:1;display:grid;place-items:center;min-height:60vh}
.dev-card{max-width:440px;text-align:center;background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);box-shadow:var(--shm);padding:36px 30px}
.dev-ico{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--gl),var(--gp));display:grid;place-items:center;margin:0 auto 16px}
.dev-ico svg{width:32px;height:32px;stroke:var(--g);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dev-badge{display:inline-block;padding:4px 12px;border-radius:99px;background:var(--gl);color:var(--g);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.dev-title{font-size:20px;font-weight:900;color:var(--t);margin-bottom:10px}
.dev-text{font-size:13.5px;color:var(--tm);line-height:1.6;margin-bottom:10px}
.dev-sub{font-size:12px;color:var(--gmt);line-height:1.55;margin-bottom:20px}
.dev-back{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:var(--rm);background:var(--g);color:#fff;text-decoration:none;font-size:13px;font-weight:700;transition:all .15s}
.dev-back:hover{background:var(--gm)}
.dev-back svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Правый сайдбар */
.rs-card{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);box-shadow:var(--sh);padding:16px}
.rs-title{font-size:11px;font-weight:800;color:var(--gmt);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
.rs-shop{text-align:center}
.rs-shop-ico{width:50px;height:50px;border-radius:14px;margin:0 auto 10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gl),var(--gp));border:1px solid var(--bdr)}
.rs-shop-ico svg{width:25px;height:25px;stroke:var(--g);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rs-shop-t{font-size:13px;font-weight:800;color:var(--t);margin-bottom:4px}
.rs-shop-d{font-size:11px;color:var(--gmt);line-height:1.5;margin-bottom:12px}
.rs-shop-btn{width:100%;padding:10px;border-radius:var(--rm);background:var(--g);border:none;color:#fff;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .15s}
.rs-shop-btn:hover{background:var(--gm)}
.rs-shop-btn.ghost{background:var(--gp);border:1.5px dashed var(--gb);color:var(--gmt);cursor:default}
.rs-top-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bdr);cursor:pointer;transition:opacity .15s}
.rs-top-item:last-child{border-bottom:none}
.rs-top-item:hover{opacity:.7}
.rs-top-rank{width:20px;font-size:13px;font-weight:900;color:var(--gb);flex-shrink:0;text-align:center}
.rs-top-logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--g),var(--gm));display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0;overflow:hidden}
.rs-top-logo img{width:100%;height:100%;object-fit:cover}
.rs-top-info{flex:1;min-width:0}
.rs-top-name{font-size:12.5px;font-weight:700;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs-top-rating{font-size:10.5px;color:var(--gmt);display:flex;align-items:center;gap:3px;margin-top:1px}
.rs-top-rating svg{width:11px;height:11px;fill:#F0A030;stroke:none}
.rs-empty{font-size:11px;color:var(--gmt);text-align:center;padding:10px 4px;line-height:1.5}
.rs-ad{background:#F8F5FF;border:1px solid #DDD0F0;border-radius:var(--rxl);padding:14px;position:relative;overflow:hidden}
.rs-ad-label{position:absolute;top:10px;left:10px;background:#EAE0FA;color:#8060C0;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:6px}
.rs-ad-c{margin-top:20px;text-align:center}
.rs-ad-t{font-size:13px;font-weight:700;color:#5040A0}
.rs-ad-s{font-size:11px;color:#7060B0;margin-top:3px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#1A2A22;color:#fff;padding:10px 20px;border-radius:var(--rm);font-size:13px;font-weight:600;z-index:300;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;box-shadow:0 12px 28px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<link rel="stylesheet" href="/assets/dark-theme.css">
</head>
<body>
<div class="shell">
<a class="logo-cell" href="/"><img src="/assets/lastop-group-logo.svg" alt="LASTOP GROUP" onerror="this.style.display='none'"></a>
<header class="topbar"></header>
<nav class="nav"></nav>
<main class="main" id="emarketMain"></main>
<aside class="right" id="emarketRight"></aside>
</div>
<div class="toast" id="toast"></div>

<script>
const API='/api';
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function letter(s){return((s||'?').trim()[0]||'?').toUpperCase();}
function fmtPrice(p,cur){
  if(p==null)return '<span class="em-card-price neg">Цена договорная</span>';
  var n=Number(p);
  var s=n.toLocaleString('ru-RU');
  var sym=cur==='USD'?'$':cur==='EUR'?'€':'₽';
  return '<span class="em-card-price">'+s+' '+sym+'</span>';
}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2600);}

(function(){
  var user={};
  try{user=JSON.parse(localStorage.getItem('user')||'{}');}catch(e){}
  var isAdmin=!!(user&&user.is_admin);
  var main=document.getElementById('emarketMain');
  var right=document.getElementById('emarketRight');
  if(!main)return;

  // ── Обычные пользователи: плашка «в разработке» ──
  if(!isAdmin){
    main.innerHTML=
      '<div class="dev-wrap"><div class="dev-card">'+
        '<div class="dev-ico"><svg viewBox="0 0 24 24"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.3 2.3c-.6.6-.2 1.7.7 1.7H17"/><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg></div>'+
        '<span class="dev-badge">Скоро</span>'+
        '<div class="dev-title">E-market в разработке</div>'+
        '<div class="dev-text">Мы готовим новый раздел — площадку, где компании, сообщества и пользователи смогут открывать свои магазины и размещать товары и услуги.</div>'+
        '<div class="dev-sub">Раздел станет доступен в одном из ближайших обновлений. Следите за новостями платформы.</div>'+
        '<a class="dev-back" href="/"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Вернуться на главную</a>'+
      '</div></div>';
    if(right)right.innerHTML='';
    return;
  }

  // ── Админ: рабочая страница ──
  main.innerHTML=
    '<div class="dev-strip"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.4H22l-6 4.5 2.3 7.1L12 16.6 5.7 21l2.3-7.1-6-4.5h7.6z"/></svg>Режим разработки — раздел виден только администраторам<span class="ds-tag">E-market</span></div>'+
    '<div class="em-banner"><div class="em-banner-txt"><h2>Торговая площадка LASTOP</h2><p>Товары и услуги от компаний, сообществ и специалистов отрасли</p></div><span class="em-banner-tag">Реклама</span></div>'+
    '<div class="em-toolbar">'+
      '<div class="em-switch">'+
        '<button id="swProducts" class="active" onclick="setMode(\'products\')"><svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>Товары</button>'+
        '<button id="swShops" onclick="setMode(\'shops\')"><svg viewBox="0 0 24 24"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M9 22V12h6v10"/></svg>Магазины</button>'+
      '</div>'+
      '<div class="em-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="emSearch" type="search" placeholder="Поиск по E-market…" autocomplete="off"></div>'+
      '<select class="em-sort" id="emSort" onchange="reloadFeed()"><option value="">Сначала новые</option><option value="price_asc">Дешевле</option><option value="price_desc">Дороже</option><option value="rating">По рейтингу</option><option value="popular">Популярные</option></select>'+
    '</div>'+
    '<div class="em-cats" id="emCats"></div>'+
    '<div class="em-grid" id="emGrid"></div>';

  renderRight();
  bindSearch();
  loadCategories();
  reloadFeed();
})();

var EM_MODE='products';
var EM_CAT='';
var EM_SEARCH='';
var _searchT;

function setMode(m){
  EM_MODE=m; EM_CAT='';
  var p=document.getElementById('swProducts'), s=document.getElementById('swShops');
  if(p)p.classList.toggle('active',m==='products');
  if(s)s.classList.toggle('active',m==='shops');
  var cats=document.getElementById('emCats');
  if(cats)cats.style.display=(m==='products')?'flex':'none';
  var sort=document.getElementById('emSort');
  if(sort)sort.style.display=(m==='products')?'block':'none';
  loadCategories();
  reloadFeed();
}

function bindSearch(){
  var inp=document.getElementById('emSearch');
  if(!inp)return;
  inp.addEventListener('input',function(){
    clearTimeout(_searchT);
    EM_SEARCH=inp.value.trim();
    _searchT=setTimeout(reloadFeed,350);
  });
}

async function loadCategories(){
  var box=document.getElementById('emCats');
  if(!box)return;
  if(EM_MODE!=='products'){box.style.display='none';return;}
  box.style.display='flex';
  try{
    var r=await lastopFetch(API+'/emarket/categories');
    var d=await r.json();
    var cats=(d&&d.categories)||[];
    var html='<button class="em-cat active" data-key="" onclick="setCat(\'\')">Все</button>';
    cats.forEach(function(c){
      html+='<button class="em-cat" data-key="'+esc(c.key)+'" onclick="setCat(\''+esc(c.key)+'\')">'+esc(c.label)+'</button>';
    });
    box.innerHTML=html;
  }catch(e){box.innerHTML='';}
}

function setCat(k){
  EM_CAT=k;
  document.querySelectorAll('.em-cat').forEach(function(b){b.classList.toggle('active',b.dataset.key===k);});
  reloadFeed();
}

function skeletons(n){
  var s='';
  for(var i=0;i<n;i++){
    s+='<div class="em-skel"><div class="em-skel-img"></div><div class="em-skel-body"><div class="em-skel-line" style="width:80%"></div><div class="em-skel-line" style="width:50%"></div><div class="em-skel-line" style="width:35%"></div></div></div>';
  }
  return s;
}

async function reloadFeed(){
  var grid=document.getElementById('emGrid');
  if(!grid)return;
  grid.innerHTML=skeletons(6);
  if(EM_MODE==='products')loadProducts(grid);
  else loadShops(grid);
}

async function loadProducts(grid){
  var qs=[];
  if(EM_CAT)qs.push('category='+encodeURIComponent(EM_CAT));
  if(EM_SEARCH)qs.push('q='+encodeURIComponent(EM_SEARCH));
  var sort=document.getElementById('emSort');
  if(sort&&sort.value)qs.push('sort='+sort.value);
  try{
    var r=await lastopFetch(API+'/emarket/feed-listings'+(qs.length?'?'+qs.join('&'):''));
    var d=await r.json();
    var items=(d&&d.listings)||[];
    if(!items.length){
      grid.innerHTML='<div class="em-empty"><svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><div class="em-empty-t">Товаров пока нет</div><div class="em-empty-d">'+(EM_SEARCH||EM_CAT?'Попробуйте изменить фильтры или поиск.':'В этом разделе ещё не размещены товары.')+'</div></div>';
      return;
    }
    grid.innerHTML=items.map(function(it){
      var photo='';
      if(it.photos&&it.photos.length&&it.photos[0]){photo='<img src="'+esc(it.photos[0])+'" alt="" onerror="this.style.display=\'none\'">';}
      else{photo='<svg class="ph" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';}
      var rating=it.rating>0?'<span class="em-card-rating"><svg viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/></svg>'+Number(it.rating).toFixed(1)+'</span>':'';
      return '<div class="em-card" onclick="openListing('+it.id+')">'+
        '<div class="em-card-img">'+photo+'</div>'+
        '<div class="em-card-body">'+
          '<div class="em-card-kind">'+(it.kind==='service'?'Услуга':'Товар')+'</div>'+
          '<div class="em-card-title">'+esc(it.title)+'</div>'+
          '<div class="em-card-shop">'+esc(it.shop_name||'')+'</div>'+
          '<div class="em-card-foot">'+fmtPrice(it.price,it.currency)+rating+'</div>'+
        '</div>'+
      '</div>';
    }).join('');
  }catch(e){
    grid.innerHTML='<div class="em-empty"><div class="em-empty-t">Не удалось загрузить</div><div class="em-empty-d">Попробуйте обновить страницу.</div></div>';
  }
}

async function loadShops(grid){
  var qs=[];
  if(EM_SEARCH)qs.push('q='+encodeURIComponent(EM_SEARCH));
  try{
    var r=await lastopFetch(API+'/emarket/feed-shops'+(qs.length?'?'+qs.join('&'):''));
    var d=await r.json();
    var items=(d&&d.shops)||[];
    if(!items.length){
      grid.innerHTML='<div class="em-empty"><svg viewBox="0 0 24 24"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M9 22V12h6v10"/></svg><div class="em-empty-t">Магазинов пока нет</div><div class="em-empty-d">'+(EM_SEARCH?'Попробуйте изменить поиск.':'Ещё ни один магазин не открыт.')+'</div></div>';
      return;
    }
    grid.innerHTML=items.map(function(s){
      var cover=s.cover_url?'<img src="'+esc(s.cover_url)+'" alt="" onerror="this.style.display=\'none\'">':'';
      var logo=s.logo_url?'<img src="'+esc(s.logo_url)+'" alt="">':esc(letter(s.name));
      var rating=s.rating>0?'<span class="star"><svg viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/></svg>'+Number(s.rating).toFixed(1)+' ('+(s.reviews_count||0)+')</span>':'<span>Нет отзывов</span>';
      return '<div class="em-shop-card" onclick="openShop('+s.id+')">'+
        '<div class="em-shop-cover">'+cover+'</div>'+
        '<div class="em-shop-body">'+
          '<div class="em-shop-logo">'+logo+'</div>'+
          '<div class="em-shop-name">'+esc(s.name)+'</div>'+
          '<div class="em-shop-desc">'+esc(s.description||'Описание не указано')+'</div>'+
          '<div class="em-shop-meta">'+rating+'</div>'+
        '</div>'+
      '</div>';
    }).join('');
  }catch(e){
    grid.innerHTML='<div class="em-empty"><div class="em-empty-t">Не удалось загрузить</div><div class="em-empty-d">Попробуйте обновить страницу.</div></div>';
  }
}

// Деталки — заглушки до СЛОЯ 5
function openListing(id){showToast('Карточка товара — в СЛОЕ 5');}
function openShop(id){showToast('Страница магазина — в СЛОЕ 5');}

// ── Правый сайдбар ──
async function renderRight(){
  var right=document.getElementById('emarketRight');
  if(!right)return;
  right.innerHTML=
    '<div class="rs-card rs-shop" id="rsShop"><div class="rs-shop-ico"><svg viewBox="0 0 24 24"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M9 22V12h6v10"/></svg></div><div class="rs-shop-t">Мой магазин</div><div class="rs-shop-d">Загрузка…</div></div>'+
    '<div class="rs-card"><div class="rs-title">Топ-магазины</div><div id="rsTop"><div class="rs-empty">Загрузка…</div></div></div>'+
    '<div class="rs-card"><div class="rs-title">Сохранённое</div><div class="rs-empty">Здесь появятся товары,<br>которые вы добавите в закладки.</div></div>'+
    '<div class="rs-ad"><div class="rs-ad-label">реклама</div><div class="rs-ad-c"><div class="rs-ad-t">Рекламное место</div><div class="rs-ad-s">Блок в разработке</div></div></div>';
  loadMyShop();
  loadTopShops();
}

async function loadMyShop(){
  var box=document.getElementById('rsShop');
  if(!box)return;
  try{
    var ra=await lastopFetch(API+'/emarket/access');
    var da=await ra.json();
    var rs=await lastopFetch(API+'/emarket/shops/my');
    var ds=await rs.json();
    var shops=(ds&&ds.shops)||[];
    if(shops.length){
      var sh=shops[0];
      box.innerHTML='<div class="rs-shop-ico"><svg viewBox="0 0 24 24"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M9 22V12h6v10"/></svg></div>'+
        '<div class="rs-shop-t">'+esc(sh.name)+'</div>'+
        '<div class="rs-shop-d">Ваш магазин активен.</div>'+
        '<button class="rs-shop-btn" onclick="showToast(\'Кабинет продавца — в СЛОЕ 5\')">Управление магазином</button>';
    }else if(da&&da.has_access){
      box.innerHTML='<div class="rs-shop-ico"><svg viewBox="0 0 24 24"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M9 22V12h6v10"/></svg></div>'+
        '<div class="rs-shop-t">Мой магазин</div>'+
        '<div class="rs-shop-d">Доступ открыт. Создайте витрину.</div>'+
        '<button class="rs-shop-btn" onclick="showToast(\'Создание магазина — в СЛОЕ 5\')">Открыть магазин</button>';
    }else{
      box.innerHTML='<div class="rs-shop-ico"><svg viewBox="0 0 24 24"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M9 22V12h6v10"/></svg></div>'+
        '<div class="rs-shop-t">Мой магазин</div>'+
        '<div class="rs-shop-d">Откройте витрину от своего имени, компании или сообщества.</div>'+
        '<button class="rs-shop-btn" onclick="showToast(\'Оплата доступа — в СЛОЕ 6\')">Получить доступ</button>';
    }
  }catch(e){
    box.innerHTML='<div class="rs-shop-ico"><svg viewBox="0 0 24 24"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M9 22V12h6v10"/></svg></div><div class="rs-shop-t">Мой магазин</div><div class="rs-shop-d">Не удалось загрузить.</div>';
  }
}

async function loadTopShops(){
  var box=document.getElementById('rsTop');
  if(!box)return;
  try{
    var r=await lastopFetch(API+'/emarket/top-shops');
    var d=await r.json();
    var shops=(d&&d.shops)||[];
    if(!shops.length){box.innerHTML='<div class="rs-empty">Пока нет магазинов<br>в рейтинге.</div>';return;}
    box.innerHTML=shops.map(function(s,i){
      var logo=s.logo_url?'<img src="'+esc(s.logo_url)+'" alt="">':esc(letter(s.name));
      var rating=s.rating>0?'<svg viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/></svg>'+Number(s.rating).toFixed(1):'нет оценок';
      return '<div class="rs-top-item" onclick="openShop('+s.id+')">'+
        '<div class="rs-top-rank">'+(i+1)+'</div>'+
        '<div class="rs-top-logo">'+logo+'</div>'+
        '<div class="rs-top-info"><div class="rs-top-name">'+esc(s.name)+'</div><div class="rs-top-rating">'+rating+'</div></div>'+
      '</div>';
    }).join('');
  }catch(e){box.innerHTML='<div class="rs-empty">Не удалось загрузить.</div>';}
}
</script>
