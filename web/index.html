    <script>
      (function redirectHomeByAuth() {
        // Phase 3 cookie-only: индикатор логина — user в localStorage 
        // (token-cookie httpOnly, в JS его не видно).
        var authed = false;
        try {
          var u = JSON.parse(localStorage.getItem("user") || "{}");
          authed = !!(u && (u.id || u.public_id));
        } catch (_) {}
        location.replace(authed ? "/home-auth.html" : "/home-guest.html");
      })();
    </script>
  <link rel="stylesheet" href="/assets/dark-theme.css">
<link rel="stylesheet" href="/assets/hover-lift.css">

<link rel="stylesheet" href="/assets/shell-layout.css">
