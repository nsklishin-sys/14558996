<!doctype html>
<html lang="ru">
  <head>
<script src="/assets/dark-theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LASTOP GROUP</title>
    <script>
      (function redirectHomeByAuth() {
        function hasAccount() {
          const token = localStorage.getItem("token");
          if (token && token.trim()) return true;

          try {
            const user = JSON.parse(localStorage.getItem("user") || "null");
            return Boolean(user && (user.id || user.email || user.name));
          } catch {
            return false;
          }
        }

        const target = hasAccount() ? "/home-auth.html" : "/home-guest.html";
        location.replace(target);
      })();
    </script>
  <link rel="stylesheet" href="/assets/dark-theme.css">
</head>
  <body></body>
</html>
