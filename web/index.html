<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LASTOP GROUP</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
    </style>
    <script>
      (function redirectHomeByAuth() {
        function applyBaseThemeColor() {
          const isDarkTheme =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;

          document.documentElement.style.backgroundColor = isDarkTheme ? "#000" : "#fff";
          document.body.style.backgroundColor = isDarkTheme ? "#000" : "#fff";
        }

        function hasAccount() {
          const token = localStorage.getItem("token");
          if (token && token.trim()) return true;

          try {
            const user = JSON.parse(localStorage.getItem("user") || "null");
            return Boolean(user && (user.id || user.email || user.name));
          } catch {
            return false;
          }
        }

        applyBaseThemeColor();
        const target = hasAccount() ? "/home-auth.html" : "/home-guest.html";
        location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
