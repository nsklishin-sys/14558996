<title>LASTOP GROUP — Профиль компании</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#1E8A4C;--gm:#22A05A;--gl:#E8F5EE;--gp:#F0FAF4;--gmt:#5A8A6A;--gb:#C0DECA;
  --w:#FFF;--bg:#F2F5F3;--t:#1A2A22;--tm:#3A5245;--bdr:#DDE8E2;
  --red:#E04040;--r:8px;--rm:12px;--rl:18px;--rxl:24px;
  --sh:0 2px 12px rgba(30,138,76,.07);--shm:0 6px 24px rgba(30,138,76,.13)
}
html,body{height:100%;overflow:hidden;font-family:'Manrope',sans-serif;background:var(--bg);color:var(--t);font-size:14px}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}

.shell{display:grid;grid-template-columns:240px 1fr 300px;grid-template-rows:56px 1fr;grid-template-areas:"logo topbar topbar""nav main right";height:100vh;gap:10px;padding:10px}
.logo-cell{grid-area:logo;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;padding:0 14px;text-decoration:none;box-shadow:var(--sh);transition:box-shadow .2s}
.logo-cell:hover{box-shadow:var(--shm)}
.logo-cell img{height:38px;width:auto;max-width:100%;object-fit:contain;display:block}
.shell > .topbar{padding-left:0!important;padding-right:0!important;gap:10px!important}
.shell > .topbar > .search-wrap{padding-left:16px!important;padding-right:0!important}
.shell > .topbar > .profile-dd-wrap{padding-right:16px!important;padding-left:0!important}
.topbar{grid-area:topbar;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:grid!important;grid-template-columns:1fr 300px!important;align-items:center;gap:10px;padding:0!important;box-shadow:var(--sh);min-width:0}
.search-wrap{position:relative;display:flex;align-items:center;min-width:0}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;display:grid;place-items:center;pointer-events:none}
.search-icon svg{width:14px;height:14px;stroke:var(--g);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.search-wrap input{width:100%;height:36px;padding:0 14px 0 30px;border:1.5px solid var(--bdr);border-radius:99px;background:#fff;font-family:inherit;font-size:13px;color:var(--t);outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--gm)}
.search-wrap input::placeholder{color:var(--gmt)}
.topbar-profile{display:flex;align-items:center;gap:10px;padding:6px 22px 6px 12px;border-radius:var(--rm);border:1.5px solid var(--bdr);background:var(--gp);cursor:pointer;transition:all .15s;flex-shrink:0;user-select:none}
.topbar-profile:hover,.topbar-profile.open{border-color:var(--gb);background:var(--gl)}
.topbar-profile.open .tp-arrow{transform:rotate(180deg)}
.tp-av{width:30px;height:30px;border-radius:8px;background:var(--g);display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.tp-info{display:flex;flex-direction:column;line-height:1.25}
.tp-name{font-size:12px;font-weight:700;color:var(--t)}
.tp-role{font-size:10px;color:var(--gmt)}
.tp-arrow{width:14px;height:14px;stroke:var(--gmt);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;transition:transform .2s}
.profile-dd-wrap{position:relative;display:flex;align-items:center;justify-content:flex-end;min-width:0;gap:8px}
.profile-dd{position:absolute;top:calc(100% + 8px);right:0;width:280px;background:var(--w);border:1px solid var(--bdr);border-radius:var(--rl);box-shadow:0 12px 36px rgba(30,138,76,.15);opacity:0;pointer-events:none;transform:translateY(-6px);transition:opacity .2s,transform .2s;z-index:200;overflow:hidden}
.profile-dd.open{opacity:1;pointer-events:all;transform:translateY(0)}
.pdd-head{padding:14px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px;background:var(--gp)}
.pdd-av{width:40px;height:40px;border-radius:10px;background:var(--g);display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0}
.pdd-info{min-width:0;flex:1}
.pdd-name{font-size:13px;font-weight:800;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdd-role{font-size:10px;color:var(--gmt);margin-top:1px}
.pdd-view{display:block;margin:10px 14px 0;padding:6px;border-radius:var(--rm);background:var(--gl);border:1px solid var(--gb);color:var(--g);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;transition:all .15s}
.pdd-view:hover{background:var(--g);color:#fff;border-color:var(--g)}
.pdd-body{padding:6px}
.pdd-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);cursor:pointer;text-decoration:none;color:var(--tm);font-size:13px;font-weight:500;transition:background .15s,color .15s}
.pdd-item:hover{background:var(--gp);color:var(--g)}
.pdd-item svg{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pdd-item-label{flex:1}
.pdd-div{height:1px;background:var(--bdr);margin:4px 6px}
.pdd-item.logout{color:var(--red)}
.pdd-item.logout:hover{background:#FFF5F5;color:var(--red)}

.nav{grid-area:nav;background:var(--w);border-radius:var(--rxl);border:1px solid var(--bdr);box-shadow:var(--sh);overflow-y:auto;display:flex;flex-direction:column;padding:12px 10px 10px;gap:1px}
.nav-group{font-size:10px;font-weight:700;color:var(--gmt);letter-spacing:.1em;text-transform:uppercase;padding:10px 8px 5px}
.nav-group:first-child{padding-top:2px;margin-top:0}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);text-decoration:none;color:var(--tm);font-size:13px;font-weight:500;transition:background .15s,color .15s}
.nav-item:hover{background:var(--gp);color:var(--g)}
.nav-item.active{background:var(--gl);color:var(--g);font-weight:700}
.nav-item svg{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav-bottom{margin-top:auto;padding-top:8px;border-top:1px solid var(--bdr)}

.main{grid-area:main;overflow-y:auto;min-width:0;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.main > *{flex-shrink:0}
.right{grid-area:right;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.right > *{flex-shrink:0}

.crumbs{display:flex;align-items:center;gap:6px;padding:0 4px;font-size:12px;color:var(--gmt);flex-wrap:wrap}
.crumbs a{color:var(--gmt);text-decoration:none}
.crumbs a:hover{color:var(--g)}
.crumbs-sep{opacity:.5}
.crumbs-cur{color:var(--t);font-weight:600}

/* HERO */
.co-hero{background:var(--w);border-radius:var(--rxl);border:1px solid var(--bdr);box-shadow:var(--sh);overflow:hidden;animation:fadeUp .25s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.co-hero-band{height:80px;background:linear-gradient(135deg,var(--accent,#1E8A4C),var(--accent2,#22A05A))}
.co-hero-body{padding:0 22px 18px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.co-logo{width:96px;height:96px;border-radius:var(--rl);background:#fff;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.1);margin-top:-48px;overflow:hidden;display:grid;place-items:center;font-size:28px;font-weight:900;color:var(--g);flex-shrink:0}
.co-logo img{width:100%;height:100%;object-fit:cover;display:block}
.co-info{flex:1;min-width:200px;padding-top:14px}
.co-name{font-size:22px;font-weight:900;color:var(--t);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.co-verified{display:inline-flex;align-items:center;width:18px;height:18px;color:var(--g)}
.co-verified svg{width:18px;height:18px;fill:currentColor}
.co-tagline{font-size:13px;color:var(--gmt);margin-top:4px}
.co-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--gmt)}
.co-meta-item{display:inline-flex;align-items:center;gap:4px}
.co-meta-item svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}
.co-actions{padding-top:14px;display:flex;gap:8px;flex-wrap:wrap}

/* TABS */
.co-tabs{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);box-shadow:var(--sh);padding:8px;display:flex;gap:4px;flex-wrap:wrap}
.co-tab{padding:8px 14px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--tm);font-family:inherit;transition:all .15s}
.co-tab:hover{background:var(--gp);color:var(--g)}
.co-tab.active{background:var(--g);color:#fff}

.panel{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);box-shadow:var(--sh);padding:18px}
.panel h3{font-size:14px;font-weight:800;color:var(--t);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.panel h3 svg{width:16px;height:16px;stroke:var(--g);fill:none;stroke-width:2;flex-shrink:0}
.panel-text{font-size:13px;color:var(--t);line-height:1.6;white-space:pre-wrap;word-break:break-word}
.panel-text-empty{font-size:12px;color:var(--gmt);font-style:italic}

.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag-chip{padding:3px 11px;background:var(--gp);color:var(--tm);border-radius:99px;font-size:11px;font-weight:600;border:1px solid var(--bdr)}

/* MEMBERS */
.members-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.member-card{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--bdr);border-radius:var(--rm);background:var(--gp);text-decoration:none;color:inherit;transition:all .12s}
.member-card:hover{border-color:var(--gb);background:var(--gl)}
.m-av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;flex-shrink:0;overflow:hidden}
.m-av img{width:100%;height:100%;object-fit:cover}
.m-info{flex:1;min-width:0}
.m-name{font-size:12px;font-weight:800;color:var(--t);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-pos{font-size:10px;color:var(--gmt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-role{font-size:9px;font-weight:800;padding:2px 6px;border-radius:99px;background:var(--gl);color:var(--g);border:1px solid var(--gb);text-transform:uppercase}

/* PUB CARDS */
.pub-card{padding:12px 14px;border:1px solid var(--bdr);border-radius:var(--rm);text-decoration:none;color:inherit;display:flex;gap:12px;align-items:center;transition:all .15s;margin-bottom:8px}
.pub-filters{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.pub-filter{padding:6px 12px;border:1px solid var(--bdr);background:var(--w);color:var(--tm);border-radius:99px;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;display:inline-flex;align-items:center;gap:5px;transition:all .12s}
.pub-filter:hover{border-color:var(--g);color:var(--g)}
.pub-filter.active{background:var(--g);border-color:var(--g);color:#fff}
.pub-filter-cnt{font-size:10px;opacity:.75}
.pub-card:hover{border-color:var(--gb);background:var(--gp);transform:translateY(-1px)}
.pub-type{padding:3px 10px;border-radius:99px;font-size:9px;font-weight:800;text-transform:uppercase;background:var(--gl);color:var(--g);border:1px solid var(--gb);flex-shrink:0}
.pub-title{flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--t)}
.pub-meta{font-size:10px;color:var(--gmt)}

/* CONTACT KV */
.kv{display:flex;flex-direction:column;gap:10px}
.kv-row{display:flex;align-items:flex-start;gap:10px;padding:10px;border:1px solid var(--bdr);border-radius:var(--rm);background:var(--gp)}
.kv-icon{width:30px;height:30px;border-radius:8px;background:var(--gl);color:var(--g);display:grid;place-items:center;flex-shrink:0}
.kv-icon svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kv-body{flex:1;min-width:0}
.kv-key{font-size:10px;color:var(--gmt);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kv-val{font-size:13px;color:var(--t);font-weight:600;word-break:break-word}
.kv-val a{color:var(--g);text-decoration:none}
.kv-val a:hover{text-decoration:underline}

.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:99px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid transparent;transition:all .15s;white-space:nowrap;text-decoration:none}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}
.btn-primary{background:var(--g);color:#fff;box-shadow:0 2px 8px rgba(30,138,76,.22)}
.btn-primary:hover{background:var(--gm)}
.btn-secondary{background:transparent;color:var(--t);border-color:var(--bdr)}
.btn-secondary:hover{background:var(--gp);border-color:var(--gb);color:var(--g)}

/* SIDEBAR */
.card{background:var(--w);border-radius:var(--rxl);border:1px solid var(--bdr);box-shadow:var(--sh);padding:14px}
.block-title{font-size:11px;font-weight:800;color:var(--tm);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}

/* SIDEBAR ROWS */
.sb-rows{display:flex;flex-direction:column;gap:8px}
.sb-row{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--t)}
.sb-icon{width:26px;height:26px;border-radius:7px;background:var(--gp);color:var(--g);display:grid;place-items:center;flex-shrink:0}
.sb-icon svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sb-val{flex:1;min-width:0;word-break:break-word;font-weight:600}
.sb-val a{color:var(--g);text-decoration:none}
.sb-val a:hover{text-decoration:underline}

.sb-kv{display:flex;flex-direction:column;gap:8px}
.sb-kv-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:12px;line-height:1.4}
.sb-kv-k{color:var(--gmt);flex-shrink:0;font-weight:600}
.sb-kv-v{color:var(--t);font-weight:700;text-align:right;word-break:break-word}

.sb-team{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sb-team-av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:800;flex-shrink:0;text-decoration:none;border:2px solid #fff;box-shadow:0 0 0 1px var(--bdr);overflow:hidden;transition:transform .15s}
.sb-team-av:hover{transform:scale(1.1);z-index:1}
.sb-team-av img{width:100%;height:100%;object-fit:cover;display:block}
.sb-team-more{font-size:11px;font-weight:700;color:var(--gmt);padding:4px 8px;background:var(--gp);border-radius:99px;border:1px solid var(--bdr)}

.placeholder{padding:40px 20px;text-align:center;color:var(--gmt);font-size:13px;font-style:italic}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--t);color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:2000;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--g)}

@media(max-width:1200px){.shell{grid-template-columns:220px 1fr 260px}}
@media(max-width:1000px){.shell{grid-template-columns:220px 1fr;grid-template-areas:"logo topbar""nav main"}.right{display:none}}
@media(max-width:740px){.shell{grid-template-columns:52px 1fr}.nav-item span,.nav-group{display:none}.nav-item{justify-content:center;padding:10px}}
@media(min-width:1921px) and (min-height:1081px){html{zoom:1.18}.shell{grid-template-columns:250px 1fr 340px;gap:12px;padding:12px;height:calc(100vh / 1.18)}}
</style>

</header>

<nav class="nav">

  <div class="crumbs">
    <a href="/">Главная</a>
    <span class="crumbs-sep">›</span>
    <a href="/companies.html">Компании</a>
    <span class="crumbs-sep">›</span>
    <span class="crumbs-cur" id="crumbCurrent">…</span>

</div>

<aside class="right" id="rightArea"></aside>

</div>

<div id="toast" class="toast"></div>

<script>
const API = '/api';
const tk = () => localStorage.getItem('token');

let identifier = null;
let company = null;
let currentTab = 'about';
let viewerID = null;

function esc(s){ return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escAttr(s){ return esc(s); }
function pluralRu(n,f){const a=[2,0,1,1,1,2];return f[(n%100>4&&n%100<20)?2:a[Math.min(n%10,5)]];}
function initials(name){ if (!name) return '?'; return name.split(/\s+/).filter(Boolean).map(s=>s[0]).slice(0,2).join('').toUpperCase(); }
function stableColor(s){
  let h=0; const n=String(s||'?');
  for(let i=0;i<n.length;i++) h=(h*31+n.charCodeAt(i))|0;
  return ['#1E8A4C','#0891B2','#7C3AED','#DB2777','#EA580C','#65A30D','#475569','#2563EB','#9333EA','#0EA5E9','#F59E0B'][Math.abs(h)%11];
}
function formatRel(iso){
  if(!iso) return '';
  const d=new Date(iso); const diff=(new Date()-d)/1000;
  if(diff<60) return 'только что';
  if(diff<3600) return Math.floor(diff/60)+' '+pluralRu(Math.floor(diff/60),['минута','минуты','минут'])+' назад';
  if(diff<86400) return Math.floor(diff/3600)+' '+pluralRu(Math.floor(diff/3600),['час','часа','часов'])+' назад';
  if(diff<86400*30) return Math.floor(diff/86400)+' '+pluralRu(Math.floor(diff/86400),['день','дня','дней'])+' назад';
  return d.toLocaleDateString('ru-RU');
}
function fmtDateAbs(iso){ if(!iso) return ''; return new Date(iso).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}); }
function toast(msg, success){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast'+(success?' success':'');
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>t.classList.remove('show'),2500);
}
function logout(){ localStorage.removeItem('token'); location.href='/'; }
function toggleProfileDD(e){
  e.stopPropagation();
  document.getElementById('profileDD').classList.toggle('open');
  document.getElementById('topbarProfile').classList.toggle('open');
}
document.addEventListener('click', e=>{
  const dd=document.getElementById('profileDD');
  const tp=document.getElementById('topbarProfile');
  if(dd&&tp&&!tp.contains(e.target)&&!dd.contains(e.target)){
    dd.classList.remove('open'); tp.classList.remove('open');
  }
});
function authHeaders(){ return tk()?{Authorization:'Bearer '+tk()}:{}; }

async function loadProfile(){
  if (!tk()) return;
  try {
    const r = await fetch(API+'/me', { headers: authHeaders() });
    if (!r.ok) return;
    const d = await r.json();
    const u = d.user || d;
    viewerID = u.id;
    const name = u.full_name || u.handle || 'Пользователь';
    const ini = initials(name);
    document.getElementById('topbarAv').textContent = ini;
    document.getElementById('topbarName').textContent = name;
    document.getElementById('pddAv').textContent = ini;
    document.getElementById('pddName').textContent = name;
  } catch {}
}

async function loadCompany(){
  try {
    const r = await fetch(API+'/companies/'+encodeURIComponent(identifier), { headers: authHeaders() });
    if (r.status === 404) {
      document.getElementById('mainContent').innerHTML = '<div class="placeholder">Компания не найдена.</div>';
      document.getElementById('crumbCurrent').textContent = 'Не найдено';
      return;
    }
    if (!r.ok) throw new Error('http '+r.status);
    const d = await r.json();
    company = d.item;
    if (!company) throw new Error('пустой ответ');
    document.title = 'LASTOP GROUP — '+company.name;
    document.getElementById('crumbCurrent').textContent = company.name;
    render();
  } catch (err) {
    console.error('loadCompany', err);
    document.getElementById('mainContent').innerHTML = '<div class="placeholder">Не удалось загрузить компанию.</div>';
  }
}

function render(){
  const c = company;
  const accent = c.accent_color || '#1E8A4C';
  const verifiedBadge = c.is_verified
    ? '<span class="co-verified" title="Подтверждена"><svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20z"/></svg></span>'
    : '';
  const logoHtml = c.logo_image
    ? '<div class="co-logo"><img src="'+escAttr(c.logo_image)+'" alt=""></div>'
    : '<div class="co-logo" style="background:'+escAttr(accent)+';color:#fff">'+esc(initials(c.name))+'</div>';

  const heroHtml =
    '<div class="co-hero" style="--accent:'+escAttr(accent)+';--accent2:'+escAttr(accent)+'">'+
      '<div class="co-hero-band"></div>'+
      '<div class="co-hero-body">'+
        logoHtml+
        '<div class="co-info">'+
          '<div class="co-name">'+esc(c.name)+verifiedBadge+'</div>'+
          (c.category_label ? '<div class="co-tagline">'+esc(c.category_label)+(c.category_group ? ' · '+esc(c.category_group) : '')+'</div>' : '')+
          '<div class="co-meta">'+
            (c.city ? '<span class="co-meta-item"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'+esc(c.city)+'</span>' : '')+
            '<span class="co-meta-item"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>'+(c.members_count||0)+' '+pluralRu(c.members_count||0,['сотрудник','сотрудника','сотрудников'])+'</span>'+
            '<span class="co-meta-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>с '+esc(fmtDateAbs(c.created_at))+'</span>'+
          '</div>'+
        '</div>'+
        '<div class="co-actions">'+
          (c.viewer_is_member ? '<a class="btn btn-primary" href="/my-company.html"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/></svg>Управление</a>' : '')+
        '</div>'+
      '</div>'+
    '</div>';

  const tabs = [
    { key:'about', label:'О компании' },
    { key:'pubs',  label:'Публикации' },
  ];
  const tabsHtml = '<div class="co-tabs">'+tabs.map(t=>'<button class="co-tab'+(currentTab===t.key?' active':'')+'" onclick="setTab(\''+t.key+'\')">'+esc(t.label)+'</button>').join('')+'</div>';

  document.getElementById('mainContent').innerHTML = heroHtml + tabsHtml + '<div id="tabContent"></div>';

  renderSidebar();
  renderTab();
}

function setTab(key){ currentTab=key; render(); }

async function renderTab(){
  const wrap = document.getElementById('tabContent');
  if (!wrap) return;
  if (currentTab === 'about') return renderAbout(wrap);
  if (currentTab === 'pubs') return renderPubs(wrap);
}

async function renderSidebar(){
  const c = company;
  const right = document.getElementById('rightArea');
  const sections = [];

  // 1. КОНТАКТЫ
  const contactRows = [];
  if (c.website) contactRows.push({
    icon:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
    val:'<a href="'+escAttr(c.website.startsWith('http')?c.website:'https://'+c.website)+'" target="_blank" rel="noopener noreferrer">'+esc(c.website.replace(/^https?:\/\//,''))+'</a>'
  });
  if (c.email) contactRows.push({
    icon:'<svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg>',
    val:'<a href="mailto:'+escAttr(c.email)+'">'+esc(c.email)+'</a>'
  });
  if (c.phone) contactRows.push({
    icon:'<svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
    val:'<a href="tel:'+escAttr(c.phone.replace(/[^\d+]/g,''))+'">'+esc(c.phone)+'</a>'
  });
  if (contactRows.length) {
    sections.push(
      '<div class="card">'+
        '<div class="block-title">Контакты</div>'+
        '<div class="sb-rows">'+contactRows.map(r=>'<div class="sb-row"><div class="sb-icon">'+r.icon+'</div><div class="sb-val">'+r.val+'</div></div>').join('')+'</div>'+
      '</div>'
    );
  }

  // Заглушка под блок "Связаться" — заполнится из members ниже
  sections.push('<div id="sbChatSlot"></div>');

  // 2. РЕКВИЗИТЫ
  const detailRows = [];
  if (c.inn) detailRows.push({ key:'ИНН', val:esc(c.inn) });
  const address = [c.region, c.city].filter(Boolean).join(', ');
  if (address) detailRows.push({ key:'Адрес', val:esc(address) });
  if (c.category_label) detailRows.push({ key:'Отрасль', val:esc(c.category_label) });
  if (detailRows.length) {
    sections.push(
      '<div class="card">'+
        '<div class="block-title">Реквизиты</div>'+
        '<div class="sb-kv">'+detailRows.map(r=>'<div class="sb-kv-row"><span class="sb-kv-k">'+r.key+'</span><span class="sb-kv-v">'+r.val+'</span></div>').join('')+'</div>'+
      '</div>'
    );
  }

  // 3. О КОМПАНИИ (статус)
  sections.push(
    '<div class="card">'+
      '<div class="block-title">О компании</div>'+
      '<div class="sb-kv">'+
        '<div class="sb-kv-row"><span class="sb-kv-k">Статус</span><span class="sb-kv-v">'+
          (c.is_verified
            ? '<span style="color:var(--g);font-weight:700;display:inline-flex;align-items:center;gap:4px"><svg style="width:11px;height:11px;fill:currentColor" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20z"/></svg>Подтверждена</span>'
            : 'На модерации')+
        '</span></div>'+
        '<div class="sb-kv-row"><span class="sb-kv-k">Создана</span><span class="sb-kv-v">'+esc(fmtDateAbs(c.created_at))+'</span></div>'+
        '<div class="sb-kv-row"><span class="sb-kv-k">Сотрудников</span><span class="sb-kv-v">'+(c.members_count||0)+'</span></div>'+
      '</div>'+
    '</div>'
  );

  // 4. КОМАНДА (компактно: до 6 аватарок + счётчик)
  // подгружаем асинхронно, рендерим в плейсхолдер
  sections.push(
    '<div class="card">'+
      '<div class="block-title">Команда</div>'+
      '<div id="sbTeam" style="font-size:11px;color:var(--gmt);font-style:italic">Загрузка…</div>'+
    '</div>'
  );

  right.innerHTML = sections.join('');

  // Подгружаем команду
  try {
    const r = await fetch(API+'/companies/'+encodeURIComponent(c.public_id)+'/members');
    const d = await r.json();
    const allMembers = d.members || [];
    // На публичной странице показываем только members с is_public !== false (по умолчанию true).
    // Owner-а показываем всегда.
    const members = allMembers.filter(m => m.role === 'owner' || m.is_public !== false);
    const teamWrap = document.getElementById('sbTeam');
    if (!teamWrap) return;
    if (!members.length) { teamWrap.textContent = 'Сотрудников пока нет'; return; }
    const visible = members.slice(0, 6);
    const extra = members.length - visible.length;
    teamWrap.style.fontStyle = 'normal';
    teamWrap.style.color = 'var(--t)';
    teamWrap.innerHTML =
      '<div class="sb-team">'+
        visible.map(m => {
          const profileHref = m.user_public_id ? '/profile_user.html?id='+encodeURIComponent(m.user_public_id) : '#';
          const av = m.user_avatar
            ? '<img src="'+escAttr(m.user_avatar)+'" alt="">'
            : esc(initials(m.user_name));
          const title = m.user_name + (m.position ? ' · ' + m.position : '');
          return '<a class="sb-team-av" href="'+escAttr(profileHref)+'" title="'+escAttr(title)+'" style="background:'+esc(stableColor(m.user_name))+'">'+av+'</a>';
        }).join('')+
        (extra > 0 ? '<div class="sb-team-more">+'+extra+'</div>' : '')+
      '</div>';

    // Блок "Связаться с компанией" — сотрудники с can_chat=true
    const chatSlot = document.getElementById('sbChatSlot');
    if (chatSlot) {
      const chatters = members.filter(m => m.can_chat === true && m.is_public !== false);
      if (chatters.length) {
        chatSlot.outerHTML =
          '<div class="card">'+
            '<div class="block-title">Связаться с компанией</div>'+
            '<div style="display:flex;flex-direction:column;gap:6px">'+
              chatters.map(m => {
                const profileHref = m.user_public_id ? '/chat.html?to='+encodeURIComponent(m.user_public_id) : '#';
                const av = m.user_avatar
                  ? '<img src="'+escAttr(m.user_avatar)+'" alt="" style="width:100%;height:100%;object-fit:cover">'
                  : esc(initials(m.user_name));
                return '<a href="'+escAttr(profileHref)+'" style="display:flex;align-items:center;gap:9px;padding:8px;border:1px solid var(--bdr);border-radius:var(--rm);background:var(--gp);text-decoration:none;color:inherit;transition:all .12s" onmouseover="this.style.borderColor=\'var(--gb)\';this.style.background=\'var(--gl)\'" onmouseout="this.style.borderColor=\'var(--bdr)\';this.style.background=\'var(--gp)\'">'+
                  '<div style="width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;flex-shrink:0;overflow:hidden;background:'+esc(stableColor(m.user_name))+'">'+av+'</div>'+
                  '<div style="flex:1;min-width:0">'+
                    '<div style="font-size:12px;font-weight:700;color:var(--t);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(m.user_name)+'</div>'+
                    (m.position ? '<div style="font-size:10px;color:var(--gmt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(m.position)+'</div>' : '')+
                  '</div>'+
                  '<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:var(--g);fill:none;stroke-width:2;flex-shrink:0"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'+
                '</a>';
              }).join('')+
            '</div>'+
          '</div>';
      } else {
        chatSlot.remove();
      }
    }
  } catch (err) {
    const teamWrap = document.getElementById('sbTeam');
    if (teamWrap) teamWrap.textContent = 'Ошибка загрузки команды';
  }
}

function renderAbout(wrap){
  const c = company;
  const tagsHtml = (c.tags && c.tags.length)
    ? '<div class="tag-list">'+c.tags.map(t=>'<span class="tag-chip">'+esc(t)+'</span>').join('')+'</div>'
    : '';
  wrap.innerHTML =
    '<div class="panel">'+
      '<h3><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/></svg>О компании</h3>'+
      (c.description
        ? '<div class="panel-text">'+esc(c.description)+'</div>'
        : '<div class="panel-text-empty">Описание не указано.</div>')+
      tagsHtml+
    '</div>';
}

async function renderPubs(wrap){
  wrap.innerHTML = '<div class="panel"><h3>Публикации</h3><div class="placeholder">Загрузка…</div></div>';
  try {
    const tk = localStorage.getItem('token');
    const authH = tk ? { Authorization: 'Bearer ' + tk } : {};
    const [jobsR, catR, feedR, topicsR] = await Promise.all([
      fetch(API+'/jobs?limit=100').then(r=>r.json()).catch(()=>({jobs:[]})),
      fetch(API+'/catalog?limit=100').then(r=>r.json()).catch(()=>({items:[]})),
      fetch(API+'/feed?type=news&limit=100', { headers: authH }).then(r=>r.ok?r.json():{posts:[]}).catch(()=>({posts:[]})),
      fetch(API+'/forum/topics?limit=100', { headers: authH }).then(r=>r.ok?r.json():{topics:[]}).catch(()=>({topics:[]})),
    ]);
    const cid = company.id;
    const items = [
      ...(jobsR.jobs || jobsR.items || []).filter(j => j.author_company_id === cid).map(j => ({ type:'job', kind:'Вакансия', title:j.title, href:'/job-detail.html?id='+encodeURIComponent(j.public_id), at:j.created_at })),
      ...(catR.items || []).filter(c => c.author_company_id === cid).map(c => ({ type:c.type==='product'?'product':'service', kind:c.type==='product'?'Товар':'Услуга', title:c.title, href:(c.type==='product'?'/product-detail.html?id=':'/service-detail.html?id=')+encodeURIComponent(c.public_id), at:c.created_at })),
      ...(feedR.posts || []).filter(p => p.author_company_id === cid).map(p => ({ type:'post', kind:'Пост', title:p.title || (p.content||'').substring(0,80), href:'/news-detail.html?id='+encodeURIComponent(p.public_id), at:p.created_at })),
      ...(topicsR.topics || []).filter(t => t.author_company_id === cid).map(t => ({ type:'forum', kind:'Форум', title:t.title, href:'/forum-topic.html?id='+encodeURIComponent(t.public_id), at:t.created_at })),
    ].sort((a,b)=>new Date(b.at)-new Date(a.at));

    const counts = {
      all: items.length,
      post: items.filter(i=>i.type==='post').length,
      job: items.filter(i=>i.type==='job').length,
      product: items.filter(i=>i.type==='product').length,
      service: items.filter(i=>i.type==='service').length,
      forum: items.filter(i=>i.type==='forum').length,
    };
    const filterDefs = [
      ['all','Все', counts.all],
      ['post','Посты', counts.post],
      ['job','Вакансии', counts.job],
      ['product','Товары', counts.product],
      ['service','Услуги', counts.service],
      ['forum','Форум', counts.forum],
    ];
    const activeFilter = window.__pubsFilter || 'all';
    const filterTabs = '<div class="pub-filters">' + filterDefs.map(([k,label,n]) =>
      '<button class="pub-filter'+(activeFilter===k?' active':'')+'" data-filter="'+k+'">'+esc(label)+' <span class="pub-filter-cnt">'+n+'</span></button>'
    ).join('') + '</div>';

    const filtered = activeFilter === 'all' ? items : items.filter(i => i.type === activeFilter);
    const rows = filtered.map(p =>
      '<a class="pub-card" href="'+escAttr(p.href)+'">'+
        '<span class="pub-type">'+esc(p.kind)+'</span>'+
        '<div class="pub-title">'+esc(p.title)+'</div>'+
        '<span class="pub-meta">'+esc(formatRel(p.at))+'</span>'+
      '</a>'
    ).join('');

    wrap.innerHTML =
      '<div class="panel">'+
        '<h3><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/></svg>Публикации ('+items.length+')</h3>'+
        filterTabs +
        (rows || '<div class="placeholder">Публикаций нет.</div>')+
      '</div>';

    wrap.querySelectorAll('.pub-filter').forEach(btn => {
      btn.addEventListener('click', () => {
        window.__pubsFilter = btn.dataset.filter;
        renderPubs(wrap);
      });
    });
  } catch (err) {
    wrap.innerHTML = '<div class="panel"><div class="placeholder">Ошибка загрузки</div></div>';
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(location.search);
  identifier = params.get('id');
  const inviteCode = params.get('invite');

  if (!identifier) {
    document.getElementById('mainContent').innerHTML = '<div class="placeholder">Не указан id компании. <a href="/companies.html" style="color:var(--g)">← К списку</a></div>';
    document.getElementById('crumbCurrent').textContent = 'Ошибка';
    return;
  }
  await loadProfile();
  await loadCompany();

  // Обработка приглашения
  if (inviteCode) {
    handleInvite(inviteCode);
  }
});

async function handleInvite(code){
  // Если не залогинен — редирект на login с возвратом сюда
  if (!tk()) {
    const next = encodeURIComponent(location.pathname + location.search);
    location.href = '/login.html?next=' + next;
    return;
  }
  // Если уже состоит — тихо убрать ?invite= из URL
  if (company && company.viewer_is_member) {
    cleanInviteParam();
    return;
  }
  // Иначе — показать баннер
  showInviteBanner(code);
}

function cleanInviteParam(){
  const u = new URL(location.href);
  u.searchParams.delete('invite');
  history.replaceState({}, '', u.toString());
}

function showInviteBanner(code){
  const c = company;
  const accent = c && c.accent_color ? c.accent_color : '#1E8A4C';
  const bn = document.createElement('div');
  bn.id = 'inviteBanner';
  bn.style.cssText = 'background:linear-gradient(135deg,'+accent+',#22A05A);color:#fff;border-radius:var(--rxl);padding:18px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:var(--shm);animation:fadeUp .25s ease both';
  bn.innerHTML =
    '<div style="flex:1;min-width:200px">'+
      '<div style="font-size:15px;font-weight:800">Вас пригласили в '+esc(c ? c.name : 'компанию')+'</div>'+
      '<div style="font-size:12px;opacity:.85;margin-top:3px">Принимая приглашение, вы становитесь сотрудником этой компании.</div>'+
    '</div>'+
    '<button class="btn" id="inviteRejectBtn" style="background:rgba(255,255,255,.15);color:#fff;border:1.5px solid rgba(255,255,255,.4)" onclick="rejectInvite()">Отклонить</button>'+
    '<button class="btn" id="inviteAcceptBtn" style="background:#fff;color:'+accent+'" onclick="acceptInvite('+JSON.stringify(code).replace(/"/g,'&quot;')+')"><svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2"><polyline points="20 6 9 17 4 12"/></svg>Принять</button>';
  // вставляем в начало main, перед хлебными крошками
  const main = document.querySelector('.main');
  main.insertBefore(bn, main.firstChild);
}

async function acceptInvite(code){
  const acceptBtn = document.getElementById('inviteAcceptBtn');
  const rejectBtn = document.getElementById('inviteRejectBtn');
  if (acceptBtn) { acceptBtn.disabled = true; acceptBtn.textContent = 'Принимаем…'; }
  if (rejectBtn) rejectBtn.disabled = true;
  try {
    const r = await fetch(API + '/invites/accept', {
      method: 'POST',
      headers: { ...authHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    const d = await r.json();
    if (!r.ok) {
      alert(d.error || 'Не удалось принять приглашение');
      if (acceptBtn) { acceptBtn.disabled = false; acceptBtn.textContent = 'Принять'; }
      if (rejectBtn) rejectBtn.disabled = false;
      return;
    }
    // Успех — убираем ?invite= и перезагружаем чтобы подтянуть новый статус
    cleanInviteParam();
    location.reload();
  } catch (err) {
    alert('Ошибка: ' + err.message);
    if (acceptBtn) { acceptBtn.disabled = false; acceptBtn.textContent = 'Принять'; }
    if (rejectBtn) rejectBtn.disabled = false;
  }
}

function rejectInvite(){
  cleanInviteParam();
  const bn = document.getElementById('inviteBanner');
  if (bn) bn.remove();
}
</script>
