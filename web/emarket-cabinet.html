<!DOCTYPE html>
<html lang="ru">
<head>
<script src="/assets/utils.js"></script>
<script src="/assets/dark-theme-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LASTOP GROUP — Кабинет продавца</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/shell-layout.css">
<script>document.documentElement.classList.add('lt-shell');</script>
<link rel="stylesheet" href="/assets/hover-lift.css">
<script>document.documentElement.classList.add('hl-on');</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#1E8A4C;--gm:#22A05A;--gl:#E8F5EE;--gp:#F0FAF4;--gmt:#5A8A6A;--gb:#C0DECA;
  --w:#FFF;--bg:#F2F5F3;--t:#1A2A22;--tm:#3A5245;--bdr:#DDE8E2;
  --red:#E04040;--r:8px;--rm:12px;--rl:18px;--rxl:24px;
  --sh:0 2px 12px rgba(30,138,76,.07);--shm:0 6px 24px rgba(30,138,76,.13)
}
html,body{height:100%;overflow:hidden;font-family:'Manrope',sans-serif;background:var(--bg);color:var(--t);font-size:14px}
.logo-cell{grid-area:logo;background:var(--w);border-radius:var(--rl);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;padding:0 14px;text-decoration:none;box-shadow:var(--sh);transition:box-shadow .2s}
.logo-cell img{height:38px;width:auto;max-width:100%;object-fit:contain;display:block}
.main{grid-area:main;overflow-y:auto;display:flex;flex-direction:column;gap:12px;min-height:0;padding-bottom:16px;scrollbar-width:none;-ms-overflow-style:none}
.main::-webkit-scrollbar{display:none}
.main>*{flex-shrink:0}
.right{grid-area:right;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:0;scrollbar-width:none;-ms-overflow-style:none}
.right::-webkit-scrollbar{display:none}

/* ── Шапка кабинета ── */
.cab-head{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:16px 18px;box-shadow:var(--sh);display:flex;align-items:center;gap:14px}
.cab-logo{width:52px;height:52px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;font-size:20px;font-weight:800;color:#fff;overflow:hidden;background:var(--g)}
.cab-logo img{width:100%;height:100%;object-fit:cover}
.cab-hi{flex:1;min-width:0}
.cab-name{font-size:18px;font-weight:800;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cab-sub{font-size:12px;color:var(--gmt);margin-top:2px}
.cab-shopsel{flex-shrink:0}
.cab-shopsel select{font-family:inherit;font-size:13px;font-weight:600;color:var(--t);background:var(--gp);border:1.5px solid var(--bdr);border-radius:var(--rm);padding:8px 12px;cursor:pointer;outline:none}
.cab-shopsel select:focus{border-color:var(--gm)}
.cab-openbtn{flex-shrink:0;font-family:inherit;font-size:12px;font-weight:700;color:var(--g);background:var(--gl);border:1px solid var(--gb);border-radius:var(--rm);padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.cab-openbtn:hover{background:var(--g);color:#fff;border-color:var(--g)}
.cab-openbtn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ── Вкладки ── */
.cab-tabs{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:6px;box-shadow:var(--sh);display:flex;gap:4px;flex-wrap:wrap}
.cab-tab{flex:1;min-width:120px;font-family:inherit;font-size:13px;font-weight:700;color:var(--gmt);background:transparent;border:none;border-radius:var(--rl);padding:10px 14px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:7px;position:relative}
.cab-tab svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cab-tab:hover{background:var(--gp);color:var(--g)}
.cab-tab.active{background:var(--g);color:#fff}
.cab-tab-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:800;line-height:1}
.cab-tab.active .cab-tab-badge{background:rgba(255,255,255,.28)}

/* ── Панель вкладки ── */
.cab-panel{display:none;flex-direction:column;gap:12px}
.cab-panel.active{display:flex}

/* ── Заявки: панель фильтров ── */
.leads-bar{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:12px 16px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.leads-title{font-size:15px;font-weight:800;color:var(--t);margin-right:auto;display:flex;align-items:center;gap:8px}
.leads-count{font-size:12px;font-weight:700;color:var(--gmt);background:var(--gp);border:1px solid var(--bdr);border-radius:99px;padding:3px 10px}
.leads-filter{display:flex;background:var(--gp);border:1px solid var(--bdr);border-radius:var(--rm);padding:3px;gap:2px}
.lf-btn{font-family:inherit;font-size:12px;font-weight:700;color:var(--gmt);background:transparent;border:none;border-radius:var(--r);padding:6px 14px;cursor:pointer;transition:all .15s}
.lf-btn.active{background:var(--w);color:var(--g);box-shadow:0 1px 4px rgba(30,138,76,.12)}

/* ── Карточка заявки ── */
.lead-card{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:16px 18px;box-shadow:var(--sh);transition:box-shadow .2s;position:relative}
.lead-card:hover{box-shadow:var(--shm)}
.lead-card.unread{border-left:4px solid var(--g)}
.lead-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;cursor:pointer}
.lead-av{width:42px;height:42px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;font-size:16px;font-weight:800;color:#fff}
.lead-meta{flex:1;min-width:0}
.lead-name{font-size:15px;font-weight:800;color:var(--t);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lead-newdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g);flex-shrink:0}
.lead-contact{font-size:13px;color:var(--g);font-weight:700;margin-top:3px;word-break:break-word}
.lead-contact a{color:inherit;text-decoration:none}
.lead-contact a:hover{text-decoration:underline}
.lead-time{font-size:11px;color:var(--gmt);flex-shrink:0;white-space:nowrap;margin-top:3px}
.lead-msg{font-size:13px;color:var(--tm);line-height:1.6;white-space:pre-wrap;word-break:break-word;background:var(--gp);border:1px solid var(--bdr);border-radius:var(--rm);padding:11px 13px;margin-bottom:12px}
.lead-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lead-st{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle}
.lead-st.st-new{background:var(--gl);color:var(--g)}
.lead-st.st-prog{background:#E6F1FB;color:#185FA5}
.lead-st.st-done{background:#E8F0DA;color:#3B6D11}
.lead-st.st-rej{background:#F1EFE8;color:#7A776E}
.lead-card.lcard-in_progress{border-left:4px solid #2479C8}
.lead-card.lcard-done{border-left:4px solid #3B6D11}
.lead-card.lcard-rejected{border-left:4px solid #C0BDB2}
.lead-stsel{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--bdr);border-radius:var(--rm);padding:0 8px 0 10px;background:var(--w);color:var(--gmt);height:33px}
.lead-stsel svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.lead-stsel select{border:none;background:transparent;font-family:inherit;font-size:12px;font-weight:700;color:var(--tm);cursor:pointer;outline:none;padding:6px 2px}
.lead-subject{display:flex;align-items:center;gap:8px;background:var(--gl);border:1px solid var(--gb);border-radius:var(--rm);padding:8px 12px;margin-bottom:10px;text-decoration:none;transition:background .15s}
.lead-subject:hover{background:#dcefe4}
.lead-subject svg{width:15px;height:15px;flex-shrink:0;fill:none;stroke:var(--g);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lead-subject-txt{font-size:12px;color:var(--g);min-width:0}
.lead-subject-txt b{color:var(--t);font-weight:700}
.lead-subject-arrow{margin-left:auto;flex-shrink:0;color:var(--gmt)}
.lead-expand{display:none;margin-top:10px;padding-top:12px;border-top:1px dashed var(--bdr)}
.lead-card.open .lead-expand{display:block}
.lead-detail-row{display:flex;gap:8px;font-size:12px;line-height:1.7}
.lead-detail-row .dl{color:var(--gmt);flex-shrink:0;min-width:96px}
.lead-detail-row .dv{color:var(--t);font-weight:600;word-break:break-word}
.lead-toggle{flex-shrink:0;width:30px;height:30px;border-radius:var(--r);border:1.5px solid var(--bdr);background:var(--w);color:var(--gmt);cursor:pointer;display:grid;place-items:center;transition:all .15s}
.lead-toggle:hover{background:var(--gp);color:var(--g);border-color:var(--gb)}
.lead-toggle svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.lead-card.open .lead-toggle svg{transform:rotate(180deg)}
.lead-btn{font-family:inherit;font-size:12px;font-weight:700;border-radius:var(--rm);padding:8px 16px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--bdr);background:var(--w);color:var(--tm);text-decoration:none}
.lead-btn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lead-btn:hover{background:var(--gp);color:var(--g);border-color:var(--gb)}
.lead-btn-pri{background:var(--g);color:#fff;border-color:var(--g)}
.lead-btn-pri:hover{background:var(--gm);color:#fff;border-color:var(--gm)}
.lead-registered{font-size:11px;color:var(--gmt);display:inline-flex;align-items:center;gap:5px;margin-left:auto}
.lead-registered svg{width:13px;height:13px;fill:none;stroke:var(--g);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ── Пустые/состояния ── */
.cab-empty{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:48px 24px;box-shadow:var(--sh);text-align:center}
.cab-empty svg{width:48px;height:48px;fill:none;stroke:var(--gb);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;margin-bottom:14px}
.cab-empty-t{font-size:16px;font-weight:800;color:var(--t);margin-bottom:6px}
.cab-empty-d{font-size:13px;color:var(--gmt);line-height:1.6;max-width:380px;margin:0 auto}
.cab-empty .lead-btn{margin-top:16px}

/* ── Скелетоны ── */
.sk-card{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:16px 18px;box-shadow:var(--sh)}
.sk{background:var(--bg);border-radius:var(--r);animation:skp 1.4s ease-in-out infinite}
@keyframes skp{0%,100%{opacity:1}50%{opacity:.45}}

/* ── Карточки заглушек других вкладок ── */
.cab-section{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:18px;box-shadow:var(--sh)}
.cab-section-h{font-size:15px;font-weight:800;color:var(--t);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.cab-section-h svg{width:17px;height:17px;fill:none;stroke:var(--g);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cab-section-d{font-size:13px;color:var(--gmt);line-height:1.6}
.pay-toggle{display:flex;gap:6px;background:var(--gp);border:1px solid var(--bdr);border-radius:var(--rm);padding:4px}
.pay-opt{flex:1;font-family:inherit;font-size:13px;font-weight:700;color:var(--gmt);background:transparent;border:none;border-radius:var(--r);padding:9px 12px;cursor:pointer;transition:all .15s}
.pay-opt.active{background:var(--w);color:var(--g);box-shadow:0 1px 4px rgba(30,138,76,.12)}
.se-media{display:flex;gap:8px;align-items:center}
.se-media-prev{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--bdr);flex-shrink:0}
.se-media-prev.se-cover{width:120px}
.se-media-prev img{width:100%;height:100%;object-fit:cover;display:block}
.se-media-prev button{position:absolute;top:2px;right:2px;width:18px;height:18px;border:none;border-radius:50%;background:rgba(20,30,24,.7);color:#fff;font-size:12px;line-height:1;cursor:pointer}
.se-media-add{width:64px;height:64px;border-radius:10px;border:1.5px dashed var(--gb);background:var(--gp);display:grid;place-items:center;cursor:pointer;color:var(--gmt);transition:all .15s;flex-shrink:0}
.se-media-add:hover{border-color:var(--g);color:var(--g);background:var(--gl)}
.se-media-add svg{width:20px;height:20px}

/* ── Аналитика ── */
.an-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.an-cell{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:16px 18px;box-shadow:var(--sh)}
.an-num{font-size:28px;font-weight:900;color:var(--g);line-height:1}
.an-lbl{font-size:12px;color:var(--gmt);font-weight:600;margin-top:6px}
.an-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.an-period{display:flex;gap:4px;background:var(--gp);border:1px solid var(--bdr);border-radius:var(--rm);padding:3px}
.an-pbtn{font-family:inherit;font-size:12px;font-weight:700;color:var(--gmt);background:transparent;border:none;border-radius:var(--r);padding:6px 12px;cursor:pointer;transition:all .15s}
.an-pbtn.active{background:var(--w);color:var(--g);box-shadow:0 1px 4px rgba(30,138,76,.12)}
.an-legend{display:flex;gap:16px;margin-bottom:10px}
.an-lg{font-size:12px;color:var(--gmt);font-weight:600;display:flex;align-items:center;gap:6px}
.an-lg::before{content:'';width:10px;height:10px;border-radius:3px;display:inline-block}
.an-lg-v::before{background:var(--g)}
.an-lg-l::before{background:#E89B27}
.an-chart-wrap{width:100%}
.an-svg{width:100%;height:140px;display:block}
.an-xlabels{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--gmt)}
.an-loading{text-align:center;color:var(--gmt);font-size:13px;padding:40px 0}
.an-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.an-bar-name{font-size:13px;color:var(--t);font-weight:600;width:38%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.an-bar-track{flex:1;height:8px;background:var(--gp);border-radius:99px;overflow:hidden}
.an-bar-fill{height:100%;background:var(--g);border-radius:99px;transition:width .4s}
.an-bar-val{font-size:12px;color:var(--gmt);font-weight:700;width:42px;text-align:right;flex-shrink:0}
.an-split{display:flex;height:14px;border-radius:99px;overflow:hidden;margin-bottom:12px;background:var(--gp)}
.an-src-rows{display:flex;flex-direction:column;gap:8px}
.an-src-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tm)}
.an-src-row b{margin-left:auto;color:var(--t);font-weight:700}
.an-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}

/* ── Листинги ── */
.lst-card{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:14px 16px;box-shadow:var(--sh);display:flex;align-items:center;gap:13px;transition:box-shadow .2s}
.lst-card:hover{box-shadow:var(--shm)}
.lst-thumb{width:54px;height:54px;border-radius:12px;flex-shrink:0;object-fit:cover;background:var(--gp);border:1px solid var(--bdr);display:grid;place-items:center;color:var(--gb)}
.lst-thumb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6}
.lst-info{flex:1;min-width:0}
.lst-kind{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:99px;margin-bottom:4px}
.lst-kind.product{background:var(--gl);color:var(--g)}
.lst-kind.service{background:#E6F1FB;color:#185FA5}
.lst-name{font-size:14px;font-weight:700;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst-price{font-size:13px;color:var(--gmt);font-weight:600;margin-top:2px}
.lst-views{font-size:11px;color:var(--gmt);flex-shrink:0;display:flex;align-items:center;gap:4px}
.lst-views svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.6}
.lst-card.is-hidden{opacity:.62}
.lst-badges{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.lst-kind{margin-bottom:0}
.lst-status{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:99px}
.lst-status.active{background:var(--gl);color:var(--g)}
.lst-status.hidden{background:#F1EFE8;color:#5F5E5A}
.lst-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.lst-iconbtn{width:34px;height:34px;border-radius:var(--rm);border:1.5px solid var(--bdr);background:var(--w);color:var(--gmt);cursor:pointer;display:grid;place-items:center;transition:all .15s}
.lst-iconbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lst-iconbtn:hover{background:var(--gp);color:var(--g);border-color:var(--gb)}
.lst-iconbtn.danger:hover{background:#FCEBEB;color:var(--red);border-color:#F0C2C2}

/* ── Модалка листинга ── */
.lm-bg{display:none;position:fixed;inset:0;z-index:1000;background:rgba(15,25,18,.5);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:18px}
.lm-box{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);box-shadow:0 24px 60px rgba(30,138,76,.2);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:22px;scrollbar-width:none}
.lm-box::-webkit-scrollbar{display:none}
.lm-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.lm-head-t{font-size:17px;font-weight:800;color:var(--t)}
.lm-x{width:30px;height:30px;flex-shrink:0;border:none;background:var(--gp);border-radius:var(--r);cursor:pointer;color:var(--gmt);font-size:18px;line-height:1}
.lm-label{display:block;font-size:12px;font-weight:700;color:var(--gmt);margin-bottom:6px}
.lm-row{margin-bottom:14px}
.lm-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lm-input,.lm-select,.lm-area{width:100%;border:1.5px solid var(--bdr);border-radius:var(--rm);padding:10px 12px;font-family:inherit;font-size:14px;color:var(--t);background:var(--gp);outline:none;transition:border-color .15s}
.lm-input:focus,.lm-select:focus,.lm-area:focus{border-color:var(--gm)}
.lm-area{resize:none;height:86px;line-height:1.5}
.lm-select{cursor:pointer}
.lm-photos{display:flex;flex-wrap:wrap;gap:8px}
.lm-photo{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--bdr);flex-shrink:0}
.lm-photo img{width:100%;height:100%;object-fit:cover;display:block}
.lm-photo button{position:absolute;top:2px;right:2px;width:18px;height:18px;border:none;border-radius:50%;background:rgba(20,30,24,.7);color:#fff;font-size:12px;line-height:1;cursor:pointer;display:grid;place-items:center}
.lm-photo-add{width:64px;height:64px;border-radius:10px;border:1.5px dashed var(--gb);background:var(--gp);display:grid;place-items:center;cursor:pointer;color:var(--gmt);transition:all .15s;flex-shrink:0}
.lm-photo-add:hover{border-color:var(--g);color:var(--g);background:var(--gl)}
.lm-photo-add svg{width:20px;height:20px}
.lm-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* ── Правый сайдбар ── */
.rs-card{background:var(--w);border:1px solid var(--bdr);border-radius:var(--rxl);padding:15px;box-shadow:var(--sh)}
.rs-h{font-size:11px;font-weight:800;color:var(--gmt);letter-spacing:.06em;text-transform:uppercase;margin-bottom:11px}
.rs-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bdr)}
.rs-row:last-child{border-bottom:none;padding-bottom:0}
.rs-row-l{font-size:12px;color:var(--gmt)}
.rs-row-v{font-size:14px;font-weight:800;color:var(--t)}
.rs-link{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--bdr);text-decoration:none;color:var(--tm);font-size:13px;font-weight:600;transition:color .15s}
.rs-link:last-child{border-bottom:none}
.rs-link:hover{color:var(--g)}
.rs-link svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

@media(max-width:560px){
  .cab-head{flex-wrap:wrap}
  .cab-shopsel,.cab-openbtn{width:100%}
  .cab-tab{min-width:0;padding:9px 8px;font-size:12px}
  .cab-tab span.tab-label{display:none}
  .cab-tab svg{width:18px;height:18px}
}
</style>
</head>
<body>
<link rel="stylesheet" href="/assets/dark-theme.css">
<div class="shell">

<a class="logo-cell" href="/"><img src="/assets/lastop-group-logo.svg" alt="LASTOP GROUP" onerror="this.style.display='none'"></a>
<header class="topbar"></header>
<nav class="nav"></nav>

<main class="main" id="cabMain">
  <!-- наполняется JS после загрузки магазина -->
  <div class="sk-card" id="cabBoot">
    <div style="display:flex;gap:13px;align-items:center">
      <div class="sk" style="width:52px;height:52px;border-radius:14px"></div>
      <div style="flex:1">
        <div class="sk" style="height:18px;width:45%;margin-bottom:8px"></div>
        <div class="sk" style="height:12px;width:30%"></div>
      </div>
    </div>
  </div>
</main>

<aside class="right" id="cabRight"></aside>

</div>

<div class="lm-bg" id="listingModalBg" onclick="if(event.target===this)closeListingModal()">
  <div class="lm-box">
    <div class="lm-head">
      <div class="lm-head-t" id="lmTitle">Новая позиция</div>
      <button class="lm-x" onclick="closeListingModal()">×</button>
    </div>
    <div class="lm-2col">
      <div class="lm-row">
        <label class="lm-label">Тип</label>
        <select class="lm-select" id="lmKind">
          <option value="product">Товар</option>
          <option value="service">Услуга</option>
        </select>
      </div>
      <div class="lm-row">
        <label class="lm-label">Статус</label>
        <select class="lm-select" id="lmStatus">
          <option value="active">Опубликован</option>
          <option value="hidden">Скрыт</option>
        </select>
      </div>
    </div>
    <div class="lm-row">
      <label class="lm-label">Название</label>
      <input class="lm-input" id="lmName" maxlength="200" placeholder="Например: Доставка сборных грузов">
    </div>
    <div class="lm-2col">
      <div class="lm-row">
        <label class="lm-label">Цена (пусто = договорная)</label>
        <input class="lm-input" id="lmPrice" inputmode="decimal" placeholder="—">
      </div>
      <div class="lm-row">
        <label class="lm-label">Валюта</label>
        <select class="lm-select" id="lmCurrency">
          <option value="RUB">₽ RUB</option>
          <option value="USD">$ USD</option>
          <option value="EUR">€ EUR</option>
        </select>
      </div>
    </div>
    <div class="lm-row">
      <label class="lm-label">Категория (необязательно)</label>
      <input class="lm-input" id="lmCategory" placeholder="Например: перевозки">
    </div>
    <div class="lm-row">
      <label class="lm-label">Описание</label>
      <textarea class="lm-area" id="lmDesc" placeholder="Опишите товар или услугу"></textarea>
    </div>
    <div class="lm-row">
      <label class="lm-label">Фотографии</label>
      <div class="lm-photos" id="lmPhotos"></div>
    </div>
    <div class="lm-foot">
      <button class="lead-btn" onclick="closeListingModal()">Отмена</button>
      <button class="lead-btn lead-btn-pri" id="lmSaveBtn" onclick="saveListing()">Создать</button>
    </div>
  </div>
</div>

<script>
const API='/api';

/* ── утилиты (как в соседних emarket-страницах) ── */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function letter(s){s=String(s||'').trim();return s?s[0].toUpperCase():'?';}
const AVC=['#5AB080','#3A90C0','#9060C0','#C07030','#1A8A6A','#B05090','#208090','#3B6D11','#633806','#185FA5'];
function avc(s){s=String(s||'');let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return AVC[h%AVC.length];}
function ago(ts){
  if(!ts)return'';
  const d=new Date(ts);if(isNaN(d))return'';
  const m=Math.max(1,Math.floor((Date.now()-d)/60000));
  if(m<60)return m+' мин назад';
  if(m<1440)return Math.floor(m/60)+' ч назад';
  if(m<10080)return Math.floor(m/1440)+' д назад';
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'short'});
}
function fmtDate(ts){const d=new Date(ts);if(isNaN(d))return'';return d.toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});}
function num(n){n=+n||0;return n>=1000?(n/1000).toFixed(1).replace(/\.0$/,'')+'к':String(n);}
function isEmail(s){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s||'').trim());}
function isPhone(s){return /^[\d\s()+\-]{6,}$/.test(String(s||'').trim());}

/* ── состояние ── */
let MY_SHOPS=[];
let SHOP=null;        // текущий магазин
let LEADS=[];         // загруженные заявки
let LEAD_FILTER='all';// all | unread
let LISTINGS=null;    // ленивая загрузка вкладки
let ACTIVE_TAB='leads';

/* ── boot ── */
window.addEventListener('DOMContentLoaded',init);

async function init(){
  // shopID из ?id=, иначе — из списка моих магазинов
  const qid=parseInt(new URLSearchParams(location.search).get('id'))||0;
  try{
    const rs=await lastopFetch(API+'/emarket/shops/my');
    const ds=await rs.json();
    MY_SHOPS=(ds&&ds.shops)||[];
  }catch(e){MY_SHOPS=[];}

  if(!MY_SHOPS.length){renderNoShop();return;}

  if(qid){
    SHOP=MY_SHOPS.find(s=>s.id===qid)||MY_SHOPS[0];
  }else{
    SHOP=MY_SHOPS[0];
  }
  if(qid && SHOP.id!==qid){
    // запрошенный id не наш — но магазины есть: показываем первый свой
  }
  renderShell();
  switchTab('leads');
}

/* ── нет магазина ── */
function renderNoShop(){
  document.getElementById('cabMain').innerHTML=
    '<div class="cab-empty">'
    +'<svg viewBox="0 0 24 24"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M9 22V12h6v10"/></svg>'
    +'<div class="cab-empty-t">У вас пока нет магазина</div>'
    +'<div class="cab-empty-d">Кабинет продавца открывается после создания витрины. Перейдите в E-market, чтобы открыть магазин от своего имени, компании или сообщества.</div>'
    +'<a class="lead-btn lead-btn-pri" href="/emarket.html">Перейти в E-market</a>'
    +'</div>';
  document.getElementById('cabRight').innerHTML='';
}

/* ── каркас: шапка + вкладки + панели ── */
function renderShell(){
  const main=document.getElementById('cabMain');
  const logoInner=SHOP.logo_url
    ? '<img src="'+esc(SHOP.logo_url)+'" alt="">'
    : letter(SHOP.name);
  const logoBg=SHOP.logo_url?'':('background:'+avc(SHOP.name));

  const shopSelector=MY_SHOPS.length>1
    ? '<div class="cab-shopsel"><select id="shopSel" onchange="onShopChange(this.value)">'
      +MY_SHOPS.map(s=>'<option value="'+s.id+'"'+(s.id===SHOP.id?' selected':'')+'>'+esc(s.name)+'</option>').join('')
      +'</select></div>'
    : '';

  main.innerHTML=
    '<div class="cab-head">'
      +'<div class="cab-logo" style="'+logoBg+'">'+logoInner+'</div>'
      +'<div class="cab-hi">'
        +'<div class="cab-name">'+esc(SHOP.name)+'</div>'
        +'<div class="cab-sub">Кабинет продавца'+(SHOP.status&&SHOP.status!=='active'?' · '+esc(SHOP.status):'')+'</div>'
      +'</div>'
      +shopSelector
      +'<a class="cab-openbtn" href="/shop/'+esc(SHOP.slug)+'"><svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Открыть магазин</a>'
    +'</div>'

    +'<div class="cab-tabs">'
      +'<button class="cab-tab active" id="tabBtn-leads" onclick="switchTab(\'leads\')"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13 1.05.36 2.07.68 3a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.97.32 1.98.55 3 .68A2 2 0 0 1 22 16.92z"/></svg><span class="tab-label">Заявки</span><span class="cab-tab-badge" id="leadsBadge" style="display:none">0</span></button>'
      +'<button class="cab-tab" id="tabBtn-listings" onclick="switchTab(\'listings\')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="tab-label">Листинги</span></button>'
      +'<button class="cab-tab" id="tabBtn-analytics" onclick="switchTab(\'analytics\')"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span class="tab-label">Аналитика</span></button>'
      +'<button class="cab-tab" id="tabBtn-settings" onclick="switchTab(\'settings\')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="tab-label">Настройки</span></button>'
    +'</div>'

    +'<div class="cab-panel active" id="panel-leads"></div>'
    +'<div class="cab-panel" id="panel-listings"></div>'
    +'<div class="cab-panel" id="panel-analytics"></div>'
    +'<div class="cab-panel" id="panel-settings"></div>';

  renderRight();
}

function onShopChange(id){
  const next=MY_SHOPS.find(s=>String(s.id)===String(id));
  if(!next)return;
  SHOP=next;
  LEADS=[];LISTINGS=null;
  history.replaceState(null,'','/emarket-cabinet.html?id='+SHOP.id);
  renderShell();
  switchTab(ACTIVE_TAB);
}

/* ── переключение вкладок ── */
function switchTab(tab){
  ACTIVE_TAB=tab;
  ['leads','listings','analytics','settings'].forEach(t=>{
    const btn=document.getElementById('tabBtn-'+t);
    const pan=document.getElementById('panel-'+t);
    if(btn)btn.classList.toggle('active',t===tab);
    if(pan)pan.classList.toggle('active',t===tab);
  });
  if(tab==='leads')loadLeads();
  else if(tab==='listings')loadListings();
  else if(tab==='analytics')renderAnalytics();
  else if(tab==='settings')renderSettings();
}

/* ════════════ ВКЛАДКА: ЗАЯВКИ ════════════ */
async function loadLeads(){
  const pan=document.getElementById('panel-leads');
  if(LEADS.length===0 && !pan.dataset.loaded){
    pan.innerHTML=leadsBarHTML()+skeletons(3);
  }
  try{
    const r=await lastopFetch(API+'/emarket/shops/'+SHOP.id+'/leads');
    if(!r.ok)throw new Error('http '+r.status);
    const d=await r.json();
    LEADS=(d&&d.leads)||[];
    pan.dataset.loaded='1';
    renderLeads();
  }catch(e){
    pan.innerHTML=leadsBarHTML()
      +'<div class="cab-empty"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
      +'<div class="cab-empty-t">Не удалось загрузить заявки</div>'
      +'<div class="cab-empty-d">Проверьте подключение и попробуйте обновить страницу.</div>'
      +'<button class="lead-btn lead-btn-pri" onclick="loadLeads()">Повторить</button></div>';
  }
}

function leadsBarHTML(){
  const total=LEADS.length;
  const unread=LEADS.filter(l=>!l.is_read).length;
  const cnt=s=>LEADS.filter(l=>(l.status||'new')===s).length;
  const f=(key,label,n)=>'<button class="lf-btn'+(LEAD_FILTER===key?' active':'')+'" onclick="setLeadFilter(\''+key+'\')">'+label+(n?' ('+n+')':'')+'</button>';
  return '<div class="leads-bar">'
    +'<div class="leads-title">Заявки'
      +(total?'<span class="leads-count">'+total+(unread?' · '+unread+' новых':'')+'</span>':'')
    +'</div>'
    +'<div class="leads-filter">'
      +f('all','Все',0)
      +f('unread','Непрочит.',unread)
      +f('new','Новые',cnt('new'))
      +f('in_progress','В работе',cnt('in_progress'))
      +f('done','Сделка',cnt('done'))
      +f('rejected','Отказ',cnt('rejected'))
    +'</div>'
    +(unread?'<button class="lead-btn" onclick="markAllRead()"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Прочитать все</button>':'')
  +'</div>';
}

function setLeadFilter(f){LEAD_FILTER=f;renderLeads();}

function leadMatchesFilter(l){
  if(LEAD_FILTER==='all')return true;
  if(LEAD_FILTER==='unread')return !l.is_read;
  return (l.status||'new')===LEAD_FILTER;
}

function renderLeads(){
  const pan=document.getElementById('panel-leads');
  updateLeadsBadge();
  let list=LEADS.filter(leadMatchesFilter);

  if(!list.length){
    const emptyMap={
      unread:{t:'Непрочитанных нет',d:'Все заявки просмотрены.'},
      new:{t:'Новых заявок нет',d:'Заявки со статусом «Новая» появятся здесь.'},
      in_progress:{t:'Нет заявок в работе',d:'Переведите заявку в статус «В работе», чтобы она появилась здесь.'},
      done:{t:'Нет завершённых сделок',d:'Заявки со статусом «Сделка» появятся здесь.'},
      rejected:{t:'Нет отклонённых',d:'Заявки со статусом «Отказ» появятся здесь.'},
      all:{t:'Заявок пока нет',d:'Когда клиенты заполнят форму обратной связи на странице вашего магазина, заявки появятся здесь.'}
    };
    const m=emptyMap[LEAD_FILTER]||emptyMap.all;
    pan.innerHTML=leadsBarHTML()
      +'<div class="cab-empty"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13 1.05.36 2.07.68 3a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.97.32 1.98.55 3 .68A2 2 0 0 1 22 16.92z"/></svg>'
      +'<div class="cab-empty-t">'+m.t+'</div><div class="cab-empty-d">'+m.d+'</div></div>';
    return;
  }
  pan.innerHTML=leadsBarHTML()+list.map(buildLeadCard).join('');
}

function buildLeadCard(l){
  const name=l.name||'Без имени';
  const contact=String(l.contact||'').trim();
  let contactHTML='';
  if(contact){
    if(isEmail(contact))contactHTML='<a href="mailto:'+esc(contact)+'">'+esc(contact)+'</a>';
    else if(isPhone(contact))contactHTML='<a href="tel:'+esc(contact.replace(/[^\d+]/g,''))+'">'+esc(contact)+'</a>';
    else contactHTML=esc(contact);
  }
  const registered=l.sender_public_id
    ? '<a class="lead-registered" href="/profile_user.html?id='+esc(l.sender_public_id)+'" title="Зарегистрированный пользователь"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'+esc(l.sender_name||'Профиль')+'</a>'
    : '';
  // кнопка «Ответить»: если есть зарегистрированный отправитель — в чат; иначе по email/тел
  let replyBtn='';
  if(l.sender_public_id){
    replyBtn='<button class="lead-btn lead-btn-pri" onclick="replyInChat(\''+esc(l.sender_public_id)+'\')"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Ответить в чате</button>';
  }else if(contact && isEmail(contact)){
    replyBtn='<a class="lead-btn lead-btn-pri" href="mailto:'+esc(contact)+'"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg>Написать письмо</a>';
  }else if(contact && isPhone(contact)){
    replyBtn='<a class="lead-btn lead-btn-pri" href="tel:'+esc(contact.replace(/[^\d+]/g,''))+'"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13 1.05.36 2.07.68 3a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.97.32 1.98.55 3 .68A2 2 0 0 1 22 16.92z"/></svg>Позвонить</a>';
  }
  const readBtn=l.is_read
    ? '<button class="lead-btn" onclick="toggleRead('+l.id+',false)"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>Не прочитано</button>'
    : '<button class="lead-btn" onclick="toggleRead('+l.id+',true)"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Прочитано</button>';

  // привязка к товару (subject_type=listing)
  let subjectHTML='';
  if(l.subject_type==='listing' && l.subject_title){
    const inner='<svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>'
      +'<div class="lead-subject-txt">Заявка по позиции: <b>'+esc(l.subject_title)+'</b></div>';
    subjectHTML=l.subject_id
      ? '<a class="lead-subject" href="/emarket-listing.html?id='+l.subject_id+'" onclick="event.stopPropagation()">'+inner
        +'<span class="lead-subject-arrow"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span></a>'
      : '<div class="lead-subject" style="cursor:default">'+inner+'</div>';
  }

  // деталка-разворот
  const senderStatus=l.sender_public_id
    ? '<a href="/profile_user.html?id='+esc(l.sender_public_id)+'" style="color:var(--g);font-weight:700;text-decoration:none" onclick="event.stopPropagation()">'+esc(l.sender_name||'Профиль')+'</a> (зарегистрирован)'
    : 'Гость (не зарегистрирован)';
  const subjLine=(l.subject_type==='listing'&&l.subject_title)?esc(l.subject_title):'Форма обратной связи магазина';
  const expandHTML='<div class="lead-expand">'
    +'<div class="lead-detail-row"><span class="dl">Получена</span><span class="dv">'+esc(fmtDate(l.created_at))+'</span></div>'
    +'<div class="lead-detail-row"><span class="dl">Отправитель</span><span class="dv">'+senderStatus+'</span></div>'
    +'<div class="lead-detail-row"><span class="dl">Источник</span><span class="dv">'+subjLine+'</span></div>'
  +'</div>';

  // статус воронки
  const st=l.status||'new';
  const stMap={new:{l:'Новая',c:'st-new'},in_progress:{l:'В работе',c:'st-prog'},done:{l:'Сделка',c:'st-done'},rejected:{l:'Отказ',c:'st-rej'}};
  const stInfo=stMap[st]||stMap.new;
  const statusChip='<span class="lead-st '+stInfo.c+'">'+stInfo.l+'</span>';
  const statusSelect='<div class="lead-stsel" onclick="event.stopPropagation()">'
    +'<svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'
    +'<select onchange="setLeadStatus('+l.id+',this.value)">'
      +['new','in_progress','done','rejected'].map(k=>'<option value="'+k+'"'+(k===st?' selected':'')+'>'+stMap[k].l+'</option>').join('')
    +'</select></div>';

  return '<div class="lead-card'+(l.is_read?'':' unread')+' lcard-'+st+'" id="lead-'+l.id+'">'
    +'<div class="lead-top" onclick="toggleLeadExpand('+l.id+')">'
      +'<div class="lead-av" style="background:'+avc(name)+'">'+letter(name)+'</div>'
      +'<div class="lead-meta">'
        +'<div class="lead-name">'+(l.is_read?'':'<span class="lead-newdot"></span>')+esc(name)+statusChip+'</div>'
        +(contactHTML?'<div class="lead-contact" onclick="event.stopPropagation()">'+contactHTML+'</div>':'')
      +'</div>'
      +'<div class="lead-time" title="'+esc(fmtDate(l.created_at))+'">'+esc(ago(l.created_at))+'</div>'
      +'<button class="lead-toggle" title="Подробнее" onclick="event.stopPropagation();toggleLeadExpand('+l.id+')"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button>'
    +'</div>'
    +subjectHTML
    +(l.message?'<div class="lead-msg">'+esc(l.message)+'</div>':'')
    +'<div class="lead-actions">'+replyBtn+statusSelect+readBtn+registered+'</div>'
    +expandHTML
  +'</div>';
}

function toggleLeadExpand(leadId){
  const el=document.getElementById('lead-'+leadId);
  if(el)el.classList.toggle('open');
}

async function setLeadStatus(leadId,status){
  const lead=LEADS.find(l=>l.id===leadId);
  if(!lead)return;
  const prev=lead.status||'new';
  if(prev===status)return;
  lead.status=status;
  // если статус сменили — заявка явно просмотрена
  if(!lead.is_read)lead.is_read=true;
  replaceLeadCard(lead);
  refreshLeadsBar();
  try{
    const r=await lastopFetch(API+'/emarket/shops/'+SHOP.id+'/leads/'+leadId+'/read',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({status:status,is_read:true})
    });
    if(!r.ok)throw 0;
  }catch(e){
    lead.status=prev;
    replaceLeadCard(lead);
    refreshLeadsBar();
    if(window.toast)toast('Не удалось изменить статус','info');
  }
}

function replyInChat(pid){location.href='/chat.html?user='+encodeURIComponent(pid);}

/* пометка прочитанным — точечное обновление узла, без пересборки списка */
async function toggleRead(leadId,read){
  const lead=LEADS.find(l=>l.id===leadId);
  if(!lead)return;
  lead.is_read=read;                 // оптимистично
  replaceLeadCard(lead);
  refreshLeadsBar();
  try{
    const r=await lastopFetch(API+'/emarket/shops/'+SHOP.id+'/leads/'+leadId+'/read',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({is_read:read})
    });
    if(!r.ok)throw new Error('http '+r.status);
  }catch(e){
    lead.is_read=!read;              // откат
    replaceLeadCard(lead);
    refreshLeadsBar();
    if(window.toast)toast('Не удалось обновить статус','info');
  }
}

async function markAllRead(){
  const unread=LEADS.filter(l=>!l.is_read);
  if(!unread.length)return;
  unread.forEach(l=>{l.is_read=true;replaceLeadCard(l);});
  refreshLeadsBar();
  for(const l of unread){
    try{
      await lastopFetch(API+'/emarket/shops/'+SHOP.id+'/leads/'+l.id+'/read',{
        method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_read:true})
      });
    }catch(e){/* тихо: UI уже обновлён, при ошибке статус подтянется при следующей загрузке */}
  }
}

function replaceLeadCard(lead){
  const el=document.getElementById('lead-'+lead.id);
  if(!el)return;
  // если активен фильтр «новые» и заявка стала прочитанной — убрать из списка
  if(LEAD_FILTER==='unread' && lead.is_read){el.remove();maybeEmptyAfterFilter();return;}
  const wasOpen=el.classList.contains('open');
  el.outerHTML=buildLeadCard(lead);
  if(wasOpen){const ne=document.getElementById('lead-'+lead.id);if(ne)ne.classList.add('open');}
}

function maybeEmptyAfterFilter(){
  const pan=document.getElementById('panel-leads');
  if(!pan.querySelector('.lead-card'))renderLeads();
}

function refreshLeadsBar(){
  const pan=document.getElementById('panel-leads');
  const bar=pan.querySelector('.leads-bar');
  if(bar)bar.outerHTML=leadsBarHTML();
  updateLeadsBadge();
}

function updateLeadsBadge(){
  const badge=document.getElementById('leadsBadge');
  if(!badge)return;
  const unread=LEADS.filter(l=>!l.is_read).length;
  if(unread){badge.textContent=unread;badge.style.display='';}
  else badge.style.display='none';
}

/* ════════════ ВКЛАДКА: ЛИСТИНГИ ════════════ */
async function loadListings(){
  const pan=document.getElementById('panel-listings');
  if(LISTINGS===null){
    pan.innerHTML=skeletons(3);
    try{
      const r=await lastopFetch(API+'/emarket/shop-listings?shop_id='+SHOP.id+'&mine=1');
      const d=await r.json();
      LISTINGS=(d&&d.listings)||[];
    }catch(e){LISTINGS=[];}
  }
  renderListings();
}

function renderListings(){
  const pan=document.getElementById('panel-listings');
  const head='<div class="leads-bar">'
    +'<div class="leads-title">Товары и услуги'+(LISTINGS.length?'<span class="leads-count">'+LISTINGS.length+'</span>':'')+'</div>'
    +'<button class="lead-btn lead-btn-pri" onclick="openListingModal(0)"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Добавить</button>'
  +'</div>';

  if(!LISTINGS.length){
    pan.innerHTML=head
      +'<div class="cab-empty"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>'
      +'<div class="cab-empty-t">Пока нет товаров и услуг</div>'
      +'<div class="cab-empty-d">Добавьте первый товар или услугу — они появятся на странице магазина и в ленте E-market.</div>'
      +'<button class="lead-btn lead-btn-pri" onclick="openListingModal(0)">+ Добавить товар или услугу</button></div>';
    return;
  }
  pan.innerHTML=head+LISTINGS.map(buildListingCard).join('');
}

function buildListingCard(it){
  const photos=Array.isArray(it.photos)?it.photos:[];
  const thumb=photos.length
    ? '<img class="lst-thumb" src="'+esc(photos[0])+'" alt="">'
    : '<div class="lst-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>';
  const kindLbl=it.kind==='service'?'Услуга':'Товар';
  const cur=it.currency==='USD'?'$':it.currency==='EUR'?'€':'₽';
  const price=(it.price!=null&&it.price!==0)?(Number(it.price).toLocaleString('ru-RU')+' '+cur):'Договорная';
  const hidden=it.status==='hidden';
  const statusBadge=hidden?'<span class="lst-status hidden">Скрыт</span>':'<span class="lst-status active">Опубликован</span>';
  return '<div class="lst-card'+(hidden?' is-hidden':'')+'" id="lst-'+it.id+'">'
    +thumb
    +'<div class="lst-info">'
      +'<div class="lst-badges"><span class="lst-kind '+(it.kind==='service'?'service':'product')+'">'+kindLbl+'</span>'+statusBadge+'</div>'
      +'<div class="lst-name">'+esc(it.title||'Без названия')+'</div>'
      +'<div class="lst-price">'+esc(price)+'</div>'
    +'</div>'
    +'<div class="lst-actions">'
      +'<button class="lst-iconbtn" title="Редактировать" onclick="openListingModal('+it.id+')"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>'
      +'<button class="lst-iconbtn" title="'+(hidden?'Опубликовать':'Скрыть')+'" onclick="toggleListingStatus('+it.id+')">'+(hidden
        ? '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
        : '<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>')+'</button>'
      +'<button class="lst-iconbtn danger" title="Удалить" onclick="deleteListing('+it.id+')"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>'
    +'</div>'
  +'</div>';
}

async function toggleListingStatus(id){
  const it=LISTINGS.find(x=>x.id===id);
  if(!it)return;
  const next=it.status==='hidden'?'active':'hidden';
  // PUT требует все поля — шлём текущие, меняем только status
  try{
    const r=await lastopFetch(API+'/emarket/listings/'+id,{
      method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        kind:it.kind,title:it.title,description:it.description||'',
        characteristics:Array.isArray(it.characteristics)?it.characteristics:[],
        category_key:it.category_key||'',
        price:(it.price!=null&&it.price!==0)?Number(it.price):null,
        currency:it.currency||'RUB',payment_method:it.payment_method||'',
        photos:Array.isArray(it.photos)?it.photos:[],
        status:next
      })
    });
    if(!r.ok)throw 0;
    it.status=next;
    const el=document.getElementById('lst-'+id);
    if(el)el.outerHTML=buildListingCard(it);
  }catch(e){if(window.toast)toast('Не удалось изменить статус','info');}
}

async function deleteListing(id){
  const it=LISTINGS.find(x=>x.id===id);
  if(!it)return;
  const ok=await lastopConfirm('Удалить «'+(it.title||'позицию')+'»? Это действие необратимо.');
  if(!ok)return;
  try{
    const r=await lastopFetch(API+'/emarket/listings/'+id,{method:'DELETE'});
    if(!r.ok)throw 0;
    LISTINGS=LISTINGS.filter(x=>x.id!==id);
    renderListings();
  }catch(e){if(window.toast)toast('Не удалось удалить','info');}
}

/* ── модалка создания/редактирования листинга ── */
let EDIT_LISTING_ID=0;
let MODAL_PHOTOS=[];

function openListingModal(id){
  EDIT_LISTING_ID=id;
  const it=id?LISTINGS.find(x=>x.id===id):null;
  MODAL_PHOTOS=(it&&Array.isArray(it.photos))?it.photos.slice():[];
  document.getElementById('lmTitle').textContent=id?'Редактировать позицию':'Новая позиция';
  document.getElementById('lmKind').value=(it&&it.kind)||'product';
  document.getElementById('lmName').value=(it&&it.title)||'';
  document.getElementById('lmPrice').value=(it&&it.price!=null&&it.price!==0)?it.price:'';
  document.getElementById('lmCurrency').value=(it&&it.currency)||'RUB';
  document.getElementById('lmCategory').value=(it&&it.category_key)||'';
  document.getElementById('lmDesc').value=(it&&it.description)||'';
  document.getElementById('lmStatus').value=(it&&it.status==='hidden')?'hidden':'active';
  renderModalPhotos();
  const btn=document.getElementById('lmSaveBtn');
  btn.disabled=false;btn.textContent=id?'Сохранить':'Создать';
  document.getElementById('listingModalBg').style.display='flex';
}
function closeListingModal(){document.getElementById('listingModalBg').style.display='none';}

function renderModalPhotos(){
  const box=document.getElementById('lmPhotos');
  box.innerHTML=MODAL_PHOTOS.map((p,i)=>'<div class="lm-photo"><img src="'+esc(p)+'" alt=""><button type="button" onclick="removeModalPhoto('+i+')">×</button></div>').join('')
    +'<label class="lm-photo-add"><input type="file" accept="image/*" style="display:none" onchange="uploadModalPhoto(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></label>';
}
function removeModalPhoto(i){MODAL_PHOTOS.splice(i,1);renderModalPhotos();}
async function uploadModalPhoto(input){
  const file=input.files&&input.files[0];
  if(!file)return;
  const fd=new FormData();fd.append('file',file);
  const lbl=input.closest('.lm-photo-add');
  if(lbl)lbl.style.opacity='.5';
  try{
    const r=await lastopFetch(API+'/upload',{method:'POST',body:fd});
    const d=await r.json();
    if(d&&d.url){MODAL_PHOTOS.push(d.url);renderModalPhotos();}
    else if(window.toast)toast('Не удалось загрузить фото','info');
  }catch(e){if(window.toast)toast('Не удалось загрузить фото','info');}
  if(lbl)lbl.style.opacity='';
  input.value='';
}

async function saveListing(){
  const title=document.getElementById('lmName').value.trim();
  if(title.length<2){if(window.toast)toast('Название от 2 символов','info');return;}
  const priceRaw=document.getElementById('lmPrice').value.trim();
  const price=priceRaw===''?null:Number(priceRaw.replace(',','.'));
  const body={
    kind:document.getElementById('lmKind').value,
    title:title,
    description:document.getElementById('lmDesc').value.trim(),
    category_key:document.getElementById('lmCategory').value.trim(),
    price:(price!=null&&!isNaN(price))?price:null,
    currency:document.getElementById('lmCurrency').value,
    payment_method:'',
    photos:MODAL_PHOTOS.slice(),
    status:document.getElementById('lmStatus').value
  };
  const btn=document.getElementById('lmSaveBtn');
  btn.disabled=true;btn.textContent='Сохранение…';
  try{
    let r;
    if(EDIT_LISTING_ID){
      r=await lastopFetch(API+'/emarket/listings/'+EDIT_LISTING_ID,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    }else{
      body.shop_id=SHOP.id;
      r=await lastopFetch(API+'/emarket/listings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    }
    if(!r.ok)throw 0;
    closeListingModal();
    LISTINGS=null;            // перезагрузить с сервера (получим актуальные id/views)
    await loadListings();
  }catch(e){
    btn.disabled=false;btn.textContent=EDIT_LISTING_ID?'Сохранить':'Создать';
    if(window.toast)toast('Не удалось сохранить','info');
  }
}

function anCell(n,l){return '<div class="an-cell"><div class="an-num">'+n+'</div><div class="an-lbl">'+esc(l)+'</div></div>';}

function setAnDays(d){AN_DAYS=d;updateAnPeriodBtns();loadAnalytics();}
function updateAnPeriodBtns(){
  document.querySelectorAll('.an-pbtn').forEach(b=>b.classList.toggle('active',+b.dataset.d===AN_DAYS));
}

async function loadAnalytics(){
  const chart=document.getElementById('anChart');
  if(chart)chart.innerHTML='<div class="an-loading">Загрузка…</div>';
  try{
    const r=await lastopFetch(API+'/emarket/shops/'+SHOP.id+'/analytics?days='+AN_DAYS);
    if(!r.ok)throw 0;
    const d=await r.json();
    renderAnChart(d.daily||[]);
    renderAnTop(d.top_listings||[]);
    renderAnSources(d.lead_sources||{form:0,listing:0});
  }catch(e){
    if(chart)chart.innerHTML='<div class="an-loading">Не удалось загрузить статистику</div>';
  }
}

function renderAnChart(daily){
  const box=document.getElementById('anChart');
  if(!box)return;
  if(!daily.length){box.innerHTML='<div class="an-loading">Нет данных за период</div>';return;}
  const maxV=Math.max(1,...daily.map(d=>Math.max(d.site_views||0,d.leads||0)));
  const W=Math.max(daily.length*1,1), H=140, pad=4;
  const n=daily.length;
  const slot=100/n;            // % ширины на день
  const bw=Math.max(slot*0.32,0.4);
  let bars='';
  daily.forEach((d,i)=>{
    const x=i*slot;
    const vh=((d.site_views||0)/maxV)*(H-pad);
    const lh=((d.leads||0)/maxV)*(H-pad);
    const cx1=x+slot*0.5-bw*0.6, cx2=x+slot*0.5+bw*0.1;
    const dt=new Date(d.date);
    const lbl=dt.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});
    const title=lbl+': '+(d.site_views||0)+' просм., '+(d.leads||0)+' заявок';
    bars+='<g><title>'+esc(title)+'</title>'
      +'<rect x="'+cx1.toFixed(2)+'%" y="'+(H-vh).toFixed(1)+'" width="'+bw.toFixed(2)+'%" height="'+vh.toFixed(1)+'" rx="1" fill="var(--g)"></rect>'
      +'<rect x="'+cx2.toFixed(2)+'%" y="'+(H-lh).toFixed(1)+'" width="'+bw.toFixed(2)+'%" height="'+lh.toFixed(1)+'" rx="1" fill="#E89B27"></rect>'
    +'</g>';
  });
  // подписи: первая, средняя, последняя дата
  const fmt=ts=>{const dt=new Date(ts);return dt.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});};
  const labels='<div class="an-xlabels"><span>'+fmt(daily[0].date)+'</span>'
    +(n>2?'<span>'+fmt(daily[Math.floor(n/2)].date)+'</span>':'')
    +'<span>'+fmt(daily[n-1].date)+'</span></div>';
  box.innerHTML='<svg viewBox="0 0 100 '+H+'" preserveAspectRatio="none" class="an-svg">'+bars+'</svg>'+labels;
}

function renderAnTop(items){
  const box=document.getElementById('anTop');
  if(!box)return;
  if(!items.length){box.innerHTML='<div class="an-loading" style="padding:8px 0">Пока нет просмотров товаров за период</div>';return;}
  const max=Math.max(1,...items.map(i=>i.views||0));
  box.innerHTML=items.map(i=>{
    const pct=Math.round(((i.views||0)/max)*100);
    return '<div class="an-bar-row">'
      +'<div class="an-bar-name">'+esc(i.title||'Товар #'+i.listing_id)+'</div>'
      +'<div class="an-bar-track"><div class="an-bar-fill" style="width:'+pct+'%"></div></div>'
      +'<div class="an-bar-val">'+num(i.views||0)+'</div>'
    +'</div>';
  }).join('');
}

function renderAnSources(src){
  const box=document.getElementById('anSources');
  if(!box)return;
  const form=src.form||0, listing=src.listing||0, total=form+listing;
  if(!total){box.innerHTML='<div class="an-loading" style="padding:8px 0">Пока нет заявок за период</div>';return;}
  const lp=Math.round(listing/total*100), fp=100-lp;
  const C_LISTING='var(--g)', C_FORM='#E89B27';
  box.innerHTML=
    '<div class="an-split">'
      +'<div style="width:'+lp+'%;background:'+C_LISTING+'"></div>'
      +'<div style="width:'+fp+'%;background:'+C_FORM+'"></div>'
    +'</div>'
    +'<div class="an-src-rows">'
      +'<div class="an-src-row"><span class="an-dot" style="background:'+C_LISTING+'"></span>Со страницы товара<b>'+listing+' ('+lp+'%)</b></div>'
      +'<div class="an-src-row"><span class="an-dot" style="background:'+C_FORM+'"></span>Через форму магазина<b>'+form+' ('+fp+'%)</b></div>'
    +'</div>';
}

// временное состояние медиа при редактировании магазина
let SE_LOGO=null, SE_COVER=null;
function uploadShopMedia(input,kind){
  const file=input.files&&input.files[0];
  if(!file)return;
  const fd=new FormData();fd.append('file',file);
  const addBtn=document.getElementById(kind==='logo'?'seLogoAdd':'seCoverAdd');
  if(addBtn)addBtn.style.opacity='.5';
  (async()=>{
    try{
      const r=await lastopFetch(API+'/upload',{method:'POST',body:fd});
      const d=await r.json();
      if(d&&d.url){
        if(kind==='logo')SE_LOGO=d.url; else SE_COVER=d.url;
        setShopMediaPreview(kind,d.url);
      }else if(window.toast)toast('Не удалось загрузить','info');
    }catch(e){if(window.toast)toast('Не удалось загрузить','info');}
    if(addBtn)addBtn.style.opacity='';
    input.value='';
  })();
}
function setShopMediaPreview(kind,url){
  const wrap=document.getElementById(kind==='logo'?'seLogoWrap':'seCoverWrap');
  const add=document.getElementById(kind==='logo'?'seLogoAdd':'seCoverAdd');
  if(!wrap)return;
  const old=wrap.querySelector('.se-media-prev');if(old)old.remove();
  const prev=document.createElement('div');
  prev.className='se-media-prev'+(kind==='cover'?' se-cover':'');
  prev.innerHTML='<img src="'+esc(url)+'" alt=""><button type="button" onclick="clearShopMedia(\''+kind+'\')">×</button>';
  wrap.insertBefore(prev,add);
  if(add)add.style.display='none';
}
function clearShopMedia(kind){
  if(kind==='logo')SE_LOGO=''; else SE_COVER='';
  const wrap=document.getElementById(kind==='logo'?'seLogoWrap':'seCoverWrap');
  const add=document.getElementById(kind==='logo'?'seLogoAdd':'seCoverAdd');
  if(wrap){const p=wrap.querySelector('.se-media-prev');if(p)p.remove();}
  if(add)add.style.display='';
}
async function saveShop(){
  const name=document.getElementById('seName').value.trim();
  if(name.length<2){if(window.toast)toast('Название от 2 символов','info');return;}
  const body={
    name:name,
    description:document.getElementById('seDesc').value.trim(),
    region:document.getElementById('seRegion').value.trim(),
    contact_phone:document.getElementById('sePhone').value.trim(),
    contact_email:document.getElementById('seEmail').value.trim(),
    contact_site:document.getElementById('seSite').value.trim(),
    logo_url:SE_LOGO!=null?SE_LOGO:(SHOP.logo_url||''),
    cover_url:SE_COVER!=null?SE_COVER:(SHOP.cover_url||'')
  };
  const btn=document.getElementById('seSaveBtn');
  btn.disabled=true;btn.textContent='Сохранение…';
  try{
    const r=await lastopFetch(API+'/emarket/shops/'+SHOP.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok)throw 0;
    // обновляем локальную модель и шапку
    Object.assign(SHOP,body);
    const idx=MY_SHOPS.findIndex(x=>x.id===SHOP.id);
    if(idx>=0)Object.assign(MY_SHOPS[idx],body);
    SE_LOGO=null;SE_COVER=null;
    updateCabHeader();
    btn.disabled=false;btn.textContent='Сохранено ✓';
    setTimeout(()=>{const b=document.getElementById('seSaveBtn');if(b)b.textContent='Сохранить изменения';},1800);
  }catch(e){
    btn.disabled=false;btn.textContent='Сохранить изменения';
    if(window.toast)toast('Не удалось сохранить','info');
  }
}
function updateCabHeader(){
  const nameEl=document.querySelector('.cab-name');
  if(nameEl)nameEl.textContent=SHOP.name;
  const logoEl=document.querySelector('.cab-logo');
  if(logoEl){
    if(SHOP.logo_url){logoEl.style.background='';logoEl.innerHTML='<img src="'+esc(SHOP.logo_url)+'" alt="">';}
    else{logoEl.style.background=avc(SHOP.name);logoEl.textContent=letter(SHOP.name);}
  }
}

let PAY_TYPE='none';
async function loadPayment(){
  try{
    const r=await lastopFetch(API+'/emarket/shops/'+SHOP.id+'/payment');
    const d=await r.json();
    PAY_TYPE=(d&&d.payment_type==='link')?'link':'none';
    const urlInput=document.getElementById('payUrl');
    if(urlInput)urlInput.value=(d&&d.payment_url)||'';
  }catch(e){PAY_TYPE='none';}
  applyPayType();
}
function setPayType(t){PAY_TYPE=t;applyPayType();}
function applyPayType(){
  const bNone=document.getElementById('payOptNone'),bLink=document.getElementById('payOptLink'),row=document.getElementById('payUrlRow');
  if(!bNone||!bLink||!row)return;
  bNone.classList.toggle('active',PAY_TYPE==='none');
  bLink.classList.toggle('active',PAY_TYPE==='link');
  row.style.display=PAY_TYPE==='link'?'block':'none';
}
async function savePayment(){
  const btn=document.getElementById('payeSaveBtn');
  const url=PAY_TYPE==='link'?((document.getElementById('payUrl')||{}).value||'').trim():'';
  if(PAY_TYPE==='link' && url && !/^https?:\/\//.test(url)){
    if(window.toast)toast('Ссылка должна начинаться с https://','info');
    return;
  }
  btn.disabled=true;btn.textContent='Сохранение…';
  try{
    const r=await lastopFetch(API+'/emarket/shops/'+SHOP.id+'/payment',{
      method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({payment_type:PAY_TYPE,payment_url:url})
    });
    if(!r.ok)throw 0;
    btn.disabled=false;btn.textContent='Сохранено ✓';
    setTimeout(()=>{const b=document.getElementById('payeSaveBtn');if(b)b.textContent='Сохранить';},1800);
  }catch(e){
    btn.disabled=false;btn.textContent='Сохранить';
    if(window.toast)toast('Не удалось сохранить','info');
  }
}

/* ── общий скелетон ── */
function skeletons(n){
  let h='';
  for(let i=0;i<n;i++){
    h+='<div class="sk-card">'
      +'<div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:10px">'
        +'<div class="sk" style="width:42px;height:42px;border-radius:12px"></div>'
        +'<div style="flex:1"><div class="sk" style="height:15px;width:40%;margin-bottom:7px"></div><div class="sk" style="height:12px;width:55%"></div></div>'
      +'</div>'
      +'<div class="sk" style="height:46px;width:100%;border-radius:12px"></div>'
    +'</div>';
  }
  return h;
}
